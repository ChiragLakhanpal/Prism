# FY2017 to FY2019, which neither awards dataset covers. Each Contract Award notice in the
# fixture whose Contract Signature Date falls in one of those fiscal years, read from the notice's
# text by hand on October 23, 2026. Every one has a signature date. The fiscal year runs July to
# June: OP00059544, signed September 27, 2016, is FY2017; OP00154314, signed June 18, 2019, is FY2019.
[counts.gap_years]
says = "The award notices that fill FY2017 to FY2019, by the fiscal year their contract was signed in."
