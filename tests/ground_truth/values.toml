# The retrieval loop's silver labels (ticket 32; the spec's "Evaluation"), read from the recorded documents
# by the builder on October 24, 2026, apart from Strata's code, with the page of each in the recorded
# .pages.txt. tests/test_retrieval_labels.py checks each quote on its page and that the weekly retrieval
# run finds the same counts.
#
# The ICR Review's "ICR para N" citations. The March 27, 2020 review and its May 4, 2023 re-issue (both
# report ICRR0021929) print the same twelve citations on the same pages, so the two versions give one set,
# not two. One citation names two paragraphs ("ICR para 11 and 43"), and one names a paragraph of another
# document after the ICR's ("ICR para 18 and Restructuring Paper para 8c"), whose ICR paragraph alone counts.
# The citation on page 13, "ICR para 72", breaks across two lines in the recorded text. Each cited paragraph
# is a numbered paragraph of the ICR's main text, outside its annexes, one passage each.
[silver_labels.icr_review_citations]
says = "The ICR Review cites the P130164 ICR 12 times, naming 13 of its paragraphs."
