# Comparable works packages for KE-NWWDA-541055-CW-RFB.
#
# Default criteria: category works, method Request for Bids, Kenya, first Invitation for Bids
# from July 1, 2019 (the start of the since-FY2020 awards dataset) to the plan's date. Market
# approach, review type and size band are left open by default, because a package still open
# has no review type in any record. So of the glossary's seven criteria, the default sets
# category, method, region (as the country) and period. Ticket 12's find_comparables must
# default the same way, or update this list in the same change.
#
# Each package's specific procurement notice (its first Invitation for Bids) joins its signed
# contract on the STEP reference: the notice's bid_reference_no equals the award's
# borrower_contract_reference_number. The fixture records every notice and award for P156634,
# so most comparables are from P156634. KE-TAVEVO-466579-GO-RFB is a works package by its
# notice's procurement group, though its reference says GO.
#
# Each package is signed, canceled or still open:
# - Signed (45). Most have a row in the awards dataset. KE-GAWASCO-54771-CW-RFB and
#   KE-GAWASCO-111742-CW-RFB have none, but each has a Contract Award notice that gives its
#   Contract Signature Date. Their entries name the award_notice and have no contract or
#   review_type.
# - Canceled (3). KE-KIMAWASCO-149448-CW-RFB, KE-KIMAWASCO-157517-CW-RFB and
#   KE-KIMAWASCO-377450-CW-RFB have no award row and no award notice. The agency's latest plan,
#   of March 19, 2025, marks each one Canceled (canceled_in, pdf_page and quote), and the notice
#   for KE-KIMAWASCO-149448-CW-RFB says so too (notice_says). By their titles, the works were
#   advertised again and signed as KE-KIMAWASCO-158691-CW-RFB (the ablution blocks) and
#   KE-KIMAWASCO-416959-CW-RFB (the sludge facilities). The blueprint's table of estimates keeps
#   "unsigned and canceled packages" as still open for procurement cycle time, so ticket 12 may
#   draw these hollow too. They are listed apart so that either count can be checked.
# - Still open (4). P156634 has none. The fixture adds every notice for the four Kenya works
#   packages under Request for Bids that were advertised by October 9, 2026 with bids due after
#   it, found with a notices search for Kenya, works and Request for Bids on October 23, 2026,
#   and every award row for their projects, P176758 and P170941. None of the four has an award
#   row, an award notice or a notice that mentions a cancellation. Bids were due after the plan's
#   date (bids_due), so none could have been signed by then.

[comparables]
says = "Kenya works packages under Request for Bids whose first Invitation for Bids is dated July 1, 2019 to October 9, 2026: 45 signed (43 in the awards dataset and two only in their award notices), three canceled and four still open."
notices = ["api/notices/P156634.json", "api/notices/kenya-works-open-on-2026-10-09.json"]
awards = ["api/awards/P156634.json", "api/awards/P176758-P170941.json"]
procurement_group = "CW"
procurement_method_code = "RFB"
country = "Kenya"
first_notice_from = 2019-07-01
first_notice_to = 2026-10-09
signed = 45
signed_only_in_award_notice = 2
canceled = 3
still_open = 4
narrower = "Add review type Prior. Review type comes from the award row, so a package with no award row has none and drops out: the three canceled, the four still open and the two signed only in their award notices."
narrower_review_type = "Prior"
narrower_count = 7
