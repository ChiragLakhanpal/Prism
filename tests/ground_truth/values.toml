# Ground truth for the fixture: every value the spec's Testing Decisions name, the plan rows
# the blueprint's Check a plan wireframe shows, the comparable works packages, and the awkward
# cases the lakehouse must handle on purpose.
#
# Each value is a literal copied once from its source, never computed by Strata's code. Each
# one says where it came from:
#   - a document: document (the recorded file, without .txt), document_type, project, date,
#     section and paragraph where there are any, and pdf_page (PDF pages count from 1);
#   - a record: record (the recorded API file) and at (the path to the field, where a
#     [key=value] step picks the one matching item).
# `quote` is the text as it appears there. tests/test_ground_truth_values.py checks that each
# quote is word for word on the stated page or in the stated field, ignoring only whitespace
# and line-end hyphenation. The fixture was recorded with `uv run python -m strata.fixture.record`
# on October 23, 2026.
#
# First listed: a value that says a plan is the first to list an activity names the activity
# (first_lists) and the same agency's previous version (not_in), which must not list it. Each
# previous version was found by fetching the text of every P156634 Procurement Plan dated
# between the two and reading its Executing Agency(ies) line.
#
# Plan dates: the published plans print each step as Planned and Actual columns, and the text
# loses the column of a blank cell. The column of each plan date below was read from the
# word's x position on the PDF page with `pdftotext -bbox`. On page 3 of the October 9, 2026
# plan the Signed Contract Planned column sits at x 720, its Actual column at x 743, and the
# Contract Completion Planned column at x 761.

