# The roles file the offline tests use: config/roles.toml's groups, with people made up for the tests
# (the 29 design brief, section 13). None of them is a real person. The emails use the reserved
# example domain, so no one is ever written to.
#
# - Asha Raman recommends lessons for South Asia and works on no project there.
# - Leela Iyer decides lessons for South Asia and works on P130164, the showcase project, so she can
#   never recommend or decide on a lesson from it.
# - Omar Haddad decides lessons for South Asia and works on no project there.
# - Wanjiru Kamau reviews lessons for Eastern and Southern Africa, the other region, which receives
#   South Asia's cross-checks. She works on P156634.
# Anyone else, such as ana.example@worldbank.org in the other tests, is not a lesson reviewer.

[groups.accredited_procurement_specialist]
workspace_group = "strata-accredited-procurement-specialists"
role = "accredited procurement specialist"
pages = ["lesson_review"]
acts = ["recommend", "cross_check"]

[groups.lead_procurement_specialist]
workspace_group = "strata-lead-procurement-specialists"
role = "lead procurement specialist"
pages = ["lesson_review"]
acts = ["recommend", "decide", "cross_check"]

