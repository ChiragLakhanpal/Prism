# The scripted cases: questions the scripted agent answers offline from recorded model outputs (spec,
# seam 3, and "Model outputs are recorded, not called, in the offline gate").
#
# Each case names a recording in recorded/<recording>.json: the Foundry agent's answers through the
# Responses API, in order, for the case's question, scope and as-of date. Several cases can share one
# recording. The recording command re-records every recording from the live agent and prints the
# difference, so a re-recording is reviewed in the diff:
#
#     uv run --script ops/agent/record.py --env-file .env
#
# A case can also plant what a model might get wrong, so the verifier's checks can be shown to work.
# Plants are applied when the case is replayed, never written into the recording, so they survive a
# re-recording:
#
#   [[cases.plant_rounds]]   a round of tool calls the agent asks for after its recorded rounds, before
#                            its answer. Each has calls, a list of {name, arguments}.
#   [[cases.plant_claims]]   a claim added to the end of the agent's answer, in the claims' own shape:
#                            sentence, kind, evidence_ids, numbers, dates and quote ({text, passage_id}).
#
# The tests in tests/test_answer_stream.py replay each case on the fixture database and say what it
# must show.

