# "Update the row" (ticket 39): the draft kind's writer rewrites one row of a draft from the current version of the
# lesson the row cites, and the verifier checks it, as the draft runtime does when a draft is written
# (strata.drafts.runtime.rewrite). The scripted writer replays these cases offline, in tests/lessons_page_story.py's
# story: Ana's suggested PPSD rows cite the rebidding lesson (lesson-e903b07ad1) at version 1, and a re-check changed
# its wording to version 2 on October 29, 2026.
#
# They sit apart from writers.toml because ops/agent/record.py --writers re-records a writer from a fresh draft request,
# and these start from a saved draft. The live recording is a workspace step (docs/workspace-catchup.md).

[[cases]]
id = "ppsd-row-update-cost-estimates"
says = """The writer rewrites the cost estimates row's Description of mitigation from version 2 of the rebidding lesson, \
citing that version and the passages it rests on, and the sentence passes the checks."""
question = "Rewrite the suggested PPSD row Cost estimates below market rates from version 2 of its lesson."
scope = "P156634"
as_of = 2026-10-30
recording = "ppsd-row-update-cost-estimates"

[[cases]]
id = "ppsd-row-update-nothing-passes"
says = """The writer's sentence cites version 1 of the lesson, which get_lessons did not return this turn, so the \
verifier removes it, nothing passes, and the row is left as it was."""
question = "Rewrite the suggested PPSD row Cost estimates below market rates from version 2 of its lesson."
scope = "P156634"
as_of = 2026-10-30
recording = "ppsd-row-update-cost-estimates"

