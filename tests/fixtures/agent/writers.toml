# The writer cases: drafts the scripted writer writes offline from recorded model outputs (spec, seam 3,
# and "Model outputs are recorded, not called, in the offline gate"), in the shape of cases.toml.
#
# Each case names a recording in recorded/<recording>.json, the writer agent's answer through the
# Responses API, and the request the draft runtime is given: the draft's kind and what it is written
# from. Several cases can share one recording. The recording command re-records every recording from
# the live writer and prints the difference:
#
#     uv run --script ops/agent/record.py --env-file .env --writers
#
# A case can also plant what a model might get wrong, applied when the case is replayed and never
# written into the recording, so it survives a re-recording:
#
#   [[cases.plant_notes]]   a note that takes the place of the recorded note on the same activity: its
#                           activity_reference_no, and either its claims, in the claims' own shape, or
#                           a refusal code.
#
# The tests in tests/test_drafts.py replay each case on the fixture database and say what it must show.

