# The writer cases: drafts the scripted writer writes offline from recorded model outputs (spec, seam 3,
# and "Model outputs are recorded, not called, in the offline gate"), in the shape of cases.toml.
#
# Each case names a recording in recorded/<recording>.json, the writer agent's answer through the
# Responses API, and the request the draft runtime is given: the draft's kind and what it is written
# from. Several cases can share one recording. The recording command re-records every recording from
# the live writer and prints the difference:
#
#     uv run --script ops/agent/record.py --env-file .env --writers
#
# A case can also plant what a model might get wrong, applied when the case is replayed and never
# written into the recording, so it survives a re-recording:
#
#   [[cases.plant_notes]]   a note that takes the place of the recorded note on the same activity: its
#                           activity_reference_no, and either its claims, in the claims' own shape, or
#                           a refusal code.
#
# The tests in tests/test_drafts.py replay each case on the fixture database and say what it must show.

[[cases]]
id = "review-notes-nwwda-2026-10-09"
says = """The writer writes one note on each of the three activities check_plan marked in the NWWDA plan of October 9, \
2026, each citing its own plan row, and every sentence passes the checks."""
question = "Write review notes on the Northern Water Works Development Agency's Procurement Plan of October 9, 2026 for P156634."
scope = "P156634"
as_of = 2026-10-23
recording = "review-notes-nwwda-2026-10-09"
request = { kind = "review_notes", project_id = "P156634", agency_id = "northern-water-works-development-agency", plan_date = "2026-10-09" }

[[cases]]
id = "review-notes-one-activity-fails"
says = """The note on KE-NWWDA-541062-CW-RFQ states an Estimated Amount the plan does not hold and a planned date a year \
late. The verifier removes both sentences, the draft is saved with the other two notes, and that activity has none."""
question = "Write review notes on the Northern Water Works Development Agency's Procurement Plan of October 9, 2026 for P156634."
scope = "P156634"
as_of = 2026-10-23
recording = "review-notes-nwwda-2026-10-09"
request = { kind = "review_notes", project_id = "P156634", agency_id = "northern-water-works-development-agency", plan_date = "2026-10-09" }

[[cases.plant_notes]]
activity_reference_no = "KE-NWWDA-541062-CW-RFQ"
claims = [
  { sentence = "The plan lists this activity at an Estimated Amount of 300,000.00.", kind = "record", evidence_ids = ["strata.silver.plan_rows:40132287/KE-NWWDA-541062-CW-RFQ"], numbers = ["300,000.00"], dates = [] },
  { sentence = "Its planned completion of June 30, 2027 has passed.", kind = "record", evidence_ids = ["strata.silver.plan_rows:40132287/KE-NWWDA-541062-CW-RFQ"], numbers = [], dates = ["June 30, 2027"] },
]

