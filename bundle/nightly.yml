# The nightly job: ten tasks in docs/PLAN.md section 11's order, one at a time.
#
# Each task runs src/strata/lakehouse/nightly_task.py on serverless compute, which calls
# strata.lakehouse.nightly with the task's own name, and records its run in strata.ops.pipeline_runs.
# fetch_by_watermark, bronze_to_gold and measure_data_readiness have their work (ticket 07); ticket 43
# gives the other seven theirs. The fetch reaches the World Bank's public APIs. The tasks form one chain,
# so the job never runs more than one task at a time, well inside the workspace's limit of five.
#
# The window, 03:00 to 05:30 in Washington, and the reasons for it are in bundle/README.md. The job
# stops at 05:30 at the latest (timeout_seconds), ninety minutes before fairshare's job starts at
# 06:00 in Chicago and two and a half hours before review hours start at 08:00.

resources:
  jobs:
    nightly:
      name: strata nightly
      description: Strata's nightly run. Each task records its run in strata.ops.pipeline_runs.
      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: America/New_York
        pause_status: ${var.nightly_pause_status}
      max_concurrent_runs: 1
      timeout_seconds: 9000
      environments:
        - environment_key: default
          spec:
            # Version 4 ships numpy 2 and pyarrow 18. Splink 5.0.0 needs pyarrow 18 or later, and on
            # version 2 (numpy 1.23) the pyarrow it pulls in cannot be imported, so every task failed
            # on the first live run (October 24, 2026).
            environment_version: "4"
            # bronze_to_gold matches supplier names with Splink, on DuckDB inside the task (ticket 19). The
            # pin is pyproject.toml's, and tests/test_suppliers.py keeps the two the same.
            dependencies: ["splink==5.0.0"]
      tasks:
        - task_key: fetch_by_watermark
          environment_key: default
          spark_python_task:
            python_file: ../src/strata/lakehouse/nightly_task.py
            parameters: [--task, "{{task.name}}", --run-id, "{{job.run_id}}", --src, "${workspace.file_path}/src"]

        - task_key: bronze_to_gold
          depends_on: [{task_key: fetch_by_watermark}]
          environment_key: default
          spark_python_task:
            python_file: ../src/strata/lakehouse/nightly_task.py
            parameters: [--task, "{{task.name}}", --run-id, "{{job.run_id}}", --src, "${workspace.file_path}/src"]

        - task_key: parse_and_embed
          depends_on: [{task_key: bronze_to_gold}]
          environment_key: default
          spark_python_task:
            python_file: ../src/strata/lakehouse/nightly_task.py
            parameters: [--task, "{{task.name}}", --run-id, "{{job.run_id}}", --src, "${workspace.file_path}/src"]

        - task_key: sync_index
          depends_on: [{task_key: parse_and_embed}]
          environment_key: default
          spark_python_task:
            python_file: ../src/strata/lakehouse/nightly_task.py
            parameters: [--task, "{{task.name}}", --run-id, "{{job.run_id}}", --src, "${workspace.file_path}/src"]

        - task_key: relink
          depends_on: [{task_key: sync_index}]
          environment_key: default
          spark_python_task:
            python_file: ../src/strata/lakehouse/nightly_task.py
            parameters: [--task, "{{task.name}}", --run-id, "{{job.run_id}}", --src, "${workspace.file_path}/src"]

        - task_key: propose_lessons
          depends_on: [{task_key: relink}]
          environment_key: default
          spark_python_task:
            python_file: ../src/strata/lakehouse/nightly_task.py
            parameters: [--task, "{{task.name}}", --run-id, "{{job.run_id}}", --src, "${workspace.file_path}/src"]

        - task_key: detect_disagreements
          depends_on: [{task_key: propose_lessons}]
          environment_key: default
          spark_python_task:
            python_file: ../src/strata/lakehouse/nightly_task.py
            parameters: [--task, "{{task.name}}", --run-id, "{{job.run_id}}", --src, "${workspace.file_path}/src"]

        - task_key: score
          depends_on: [{task_key: detect_disagreements}]
          environment_key: default
          spark_python_task:
            python_file: ../src/strata/lakehouse/nightly_task.py
            parameters: [--task, "{{task.name}}", --run-id, "{{job.run_id}}", --src, "${workspace.file_path}/src"]

        - task_key: measure_data_readiness
          depends_on: [{task_key: score}]
          environment_key: default
          spark_python_task:
            python_file: ../src/strata/lakehouse/nightly_task.py
            parameters: [--task, "{{task.name}}", --run-id, "{{job.run_id}}", --src, "${workspace.file_path}/src"]

        - task_key: refresh_drafts
          depends_on: [{task_key: measure_data_readiness}]
          environment_key: default
          spark_python_task:
            python_file: ../src/strata/lakehouse/nightly_task.py
            parameters: [--task, "{{task.name}}", --run-id, "{{job.run_id}}", --src, "${workspace.file_path}/src"]
