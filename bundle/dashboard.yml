# Prism's AI/BI dashboard, "Prism operations" (tickets 16 and 45; docs/PLAN.md section 9), and its test copy.
# src/strata/dashboard defines their three pages and tiles in code and writes dashboards/strata.lvdash.json and
# dashboards/strata_test.lvdash.json, which these resources deploy with the rest of the bundle, by the same one
# command (bundle/README.md). The test copy is where a new tile is tried before it reaches the dashboard people use
# (the 45 design brief, section 9.6). The display names are copy.dash.name and copy.dash.testName in
# web/src/copy.ts; tests/test_dashboard_pages.py checks that they match.
#
# Each viewer's own credentials run its queries (embed_credentials false), as the app runs each query as the viewer
# (ADR 0003). The deploy passes the SQL warehouse from the env file as the bundle variable warehouse_id.

resources:
  dashboards:
    strata_dashboard:
      display_name: Prism operations
      file_path: dashboards/strata.lvdash.json
      warehouse_id: ${var.warehouse_id}
      embed_credentials: false
    strata_dashboard_test:
      display_name: Prism operations (test)
      file_path: dashboards/strata_test.lvdash.json
      warehouse_id: ${var.warehouse_id}
      embed_credentials: false
