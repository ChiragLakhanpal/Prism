[project]
name = "strata"
version = "0.1.0"
description = "Procurement intelligence on World Bank open data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "duckdb>=1.1",
    "sqlglot>=30.24.0",
    "pyyaml>=6.0.3",
    "pytz>=2026.5",
    "opentelemetry-api>=1.45.1",
    "fpdf2==2.8.9",
    "splink==5.0.0",
    # XGBoost's CPU-only build on Linux: the full one pulls in a 305 MB GPU library there.
    "xgboost==3.4.1; sys_platform != 'linux'",
    "xgboost-cpu==3.4.1; sys_platform == 'linux'",
    "numpy>=2.3",
    "py3langid==0.3.0",
    "pillow==13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pypdf>=5",
    "pytest-xdist==3.8.0",
    "opentelemetry-sdk==1.45.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata"]

[tool.pytest.ini_options]
testpaths = ["tests", "ops/dayone/tests", "ops/wizard/tests", "ops/bundle/tests", "ops/app/tests", "ops/workspace/tests"]
addopts = "-q -p no:cacheprovider"
# A passing test's temporary folder is removed as soon as the test ends; a failed test's stays for a look. Most
# tests copy the 38 MB fixture database into their tmp_path, so a run that kept every folder held about 7 GB, and
# a run the gate stopped kept its folder locked for three days (ticket 73). To keep every folder for one run, add
# `-o tmp_path_retention_policy=all` to the command.
tmp_path_retention_policy = "failed"
