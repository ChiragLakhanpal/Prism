[project]
name = "strata"
version = "0.1.0"
description = "Procurement intelligence on World Bank open data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "duckdb>=1.1",
    "sqlglot>=30.24.0",
    "pyyaml>=6.0.3",
    "pytz>=2026.5",
    "opentelemetry-api>=1.45.1",
    "fpdf2==2.8.9",
    "splink==5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pypdf>=5",
    "pytest-xdist==3.8.0",
    "opentelemetry-sdk==1.45.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata"]

[tool.pytest.ini_options]
testpaths = ["tests", "ops/dayone/tests", "ops/wizard/tests", "ops/bundle/tests", "ops/app/tests"]
addopts = "-q -p no:cacheprovider"
