# The model file: the Azure OpenAI deployment that each role uses.
#
# This is the one place to swap a model (spec, "Ten single places", item 5). Change a role's
# deployment line and nothing else. There is no fallback model. strata.config.load_models()
# reads it, and every role below must be present.
#
# Source: docs/PLAN.md section 2. The four deployments live in wb-strata, in the resource group
# WorldBank-demo. The caps on each one are in ops/dayone/dayone.toml. The setup wizard and the
# day-one probes read the names and the embedding size from this file, so a swap here reaches them.

[roles.agent]
deployment = "gpt-5.4-mini"
purpose = "The agent: it answers questions and calls the tools."

[roles.draft]
deployment = "gpt-5.4"
purpose = "Drafting, hard questions and the judge that checks each sentence follows from its passages."

[roles.batch]
deployment = "gpt-5.4-nano"
purpose = "Bulk extraction on Global Batch, such as proposing lessons."

# The embedding role also names the vector size it asks for. The file is refused without it.
[roles.embed]
deployment = "text-embedding-3-large"
purpose = "Embeddings for the passage index."
dimensions = 1024

# The layout parser that reads table pages on the workspace (Route B, docs/PLAN.md section 5), such
# as the STEP tables of a Procurement Plan. Day-one test 3 (docs/day-one-results.md) decides it:
# ai_parse_document on the SQL warehouse when the test passes, Content Understanding's
# prebuilt-layout when it fails. The name must be one of the adapters in PARSERS in
# src/strata/reader/layout.py. strata.config.load_layout_parser() reads it.
#
# rejoin_split_words: a narrow table cell wraps a word where it meets the cell's edge ("Explor" then
# "atory"), and the reader keeps a space at each wrap, so such a word shows split. When this is true,
# the offline parser joins a wrap with no space when the line above reaches the cell's right edge and
# the next line starts with a lower-case letter. It is false until the user decides (ticket 18 parked
# it again; tickets 08 and 10 parked it first, decision 8), so plans show their words as the PDF does.
[layout]
parser = "ai_parse_document"
rejoin_split_words = false

# How search_passages ranks passages on the workspace (docs/PLAN.md section 5): the Delta Sync index
# over strata.gold.passage on Databricks AI Search, and the reranker AI Search runs over the best
# hits, reading each passage's header and text. strata.config.load_search() reads it.
[search]
index = "strata.gold.passage_index"
reranker = "databricks_reranker"
rerank_columns = ["header", "text"]

# The name-matching model for suppliers (ticket 19; docs/PLAN.md section 5). A STEP supplier ID
# decides first. A row with no ID is matched by name with Splink's Fellegi-Sunter model, on DuckDB
# inside the nightly task on both engines, against the suppliers with IDs and the other rows with no
# ID in its country. strata.config.load_supplier_matching() reads this table, and
# config/thresholds.toml's [supplier_matching] routes each pair by the probability it gives.
#
# judge_role  the role above whose deployment decides the pairs in the uncertain middle: draft, the
#             judge. No role is added for it.
# prior       how likely two rows from the same country are to be one supplier before their names are
#             compared
# Each comparison lists its levels, most alike first. m is how often two rows of one supplier fall in
# a level, u how often two rows of different suppliers do, and each column adds up to 1. The levels'
# rules are in src/strata/knowledge/suppliers/matching.py. Source: starting values for the owner to
# confirm, written so that only the same name with a project in common reaches the auto-merge
# threshold. The labeled pairs in strata.ops.supplier_pair_labels are what to estimate them from.
[supplier_matching]
judge_role = "draft"
prior = 0.001

# Names after normalizing legal forms, transliteration and punctuation.
[supplier_matching.name]
same_name = { m = 0.80, u = 0.0001 }
same_words = { m = 0.03, u = 0.00005 }
starts_the_other = { m = 0.07, u = 0.0003 }
nearly_the_same = { m = 0.05, u = 0.001 }
alike = { m = 0.03, u = 0.01 }
different = { m = 0.02, u = 0.98855 }

# Whether the two rows share a project.
[supplier_matching.projects]
shared = { m = 0.5, u = 0.02 }
none_shared = { m = 0.5, u = 0.98 }

# The time estimate's model (ticket 25; docs/PLAN.md section 7): XGBoost's survival model (accelerated
# failure time) on procurement cycle time, with conformal ranges. src/strata/estimates/ reads this
# table with strata.config.load_time_estimate().
#
# learner                 the model, by its name in LEARNERS in src/strata/estimates/time_estimate.py
# registered_model        its name in Unity Catalog, where the champion and challenger aliases live
# experiment              the MLflow experiment the backtests and the model card are logged to
# test_years              the rolling backtests: each year's model learns from packages advertised
#                         before January 1 and is tested on the packages advertised in that year
# calibration_every       every this-many-th training package, in the order they were advertised, sizes
#                         the ranges (the conformal step), and the model learns from the others
# governance_indicators   the CPIA and WGI scores the model reads, each as published on the day the
#                         package was advertised (strata.lakehouse.governance.score_as_of)
# range_checked           the features whose values the model must have seen: a package outside their
#                         training range gets no time estimate (outside_training)
# Source: the spec's "Estimates"; each value is a starting value for the owner to confirm.
[time_estimate]
learner = "xgboost_aft"
registered_model = "strata.gold.time_estimate"
experiment = "/Shared/strata/time_estimate"
test_years = [2021, 2022, 2023, 2024, 2025]
calibration_every = 4
governance_indicators = ["GOV_WGI_GE.EST", "IQ.CPA.IRAI.XQ"]
range_checked = ["estimated_amount_usd", "planned_days"]

# The settings of the learner above, under its name. seed and nthread = 1 make a fit repeat exactly.
[time_estimate.xgboost_aft]
max_depth = 3
eta = 0.05
num_boost_round = 300
min_child_weight = 5
aft_loss_distribution = "normal"
aft_loss_distribution_scale = 1.0
seed = 7
nthread = 1

# The what-if levers (ticket 26; docs/PLAN.md section 7): the parts of a procurement approach that the package
# workspace's "Compare with" can change, in its order, and section 4's approaches are made of. Review type is
# never a lever: it is computed from the whole package's estimated amount, so no lever can move a package under
# a review threshold. strata.config.load_what_if() reads this table.
#
# feature   the time estimate's feature the lever sets (src/strata/estimates/time_estimate.py, CATEGORICAL), or
#           empty text when the model reads no such feature. The model reads no number of lots: no record gives
#           a package's planned lots, and a package's contracts come after the time being estimated. So a lots
#           comparison counts and lights the comparable packages that went with it, and gives no time estimate.
# values    the values the nightly score task scores for every package, in STEP's words (Market Approach, and
#           Prequalification (Y/N) as Y or N). A comparable's own value comes from its records.
# Source: the spec's "Estimates" (market approach, prequalification and lotting); a starting list for the
# owner to confirm. Limited approaches are left out: a package under them has no specific procurement notice,
# so its procurement cycle time cannot be measured.
[what_if]
levers = ["market_approach", "lots", "prequalification"]

[what_if.market_approach]
feature = "market_approach"
values = ["Open - National", "Open - International"]

[what_if.lots]
feature = ""

[what_if.prequalification]
feature = "prequalification"
values = ["N", "Y"]
