# The model file: the Azure OpenAI deployment that each role uses.
#
# This is the one place to swap a model (spec, "Ten single places", item 5). Change a role's
# deployment line and nothing else. There is no fallback model. strata.config.load_models()
# reads it, and every role below must be present.
#
# Source: docs/PLAN.md section 2. The four deployments live in wb-strata, in the resource group
# WorldBank-demo. The caps on each one are in ops/dayone/dayone.toml. The setup wizard and the
# day-one probes read the names and the embedding size from this file, so a swap here reaches them.

[roles.agent]
deployment = "gpt-5.4-mini"
purpose = "The agent: it answers questions and calls the tools."

[roles.draft]
deployment = "gpt-5.4"
purpose = "Drafting, hard questions and the judge that checks each sentence follows from its passages."

[roles.batch]
deployment = "gpt-5.4-nano"
purpose = "Bulk extraction on Global Batch, such as proposing lessons."

# The embedding role also names the vector size it asks for. The file is refused without it.
[roles.embed]
deployment = "text-embedding-3-large"
purpose = "Embeddings for the passage index."
dimensions = 1024

# The layout parser that reads table pages on the workspace (Route B, docs/PLAN.md section 5), such
# as the STEP tables of a Procurement Plan. Day-one test 3 (docs/day-one-results.md) decides it:
# ai_parse_document on the SQL warehouse when the test passes, Content Understanding's
# prebuilt-layout when it fails. The name must be one of the adapters in PARSERS in
# src/strata/reader/layout.py. strata.config.load_layout_parser() reads it.
[layout]
parser = "ai_parse_document"

# How search_passages ranks passages on the workspace (docs/PLAN.md section 5): the Delta Sync index
# over strata.gold.passage on Databricks AI Search, and the reranker AI Search runs over the best
# hits, reading each passage's header and text. strata.config.load_search() reads it.
[search]
index = "strata.gold.passage_index"
reranker = "databricks_reranker"
rerank_columns = ["header", "text"]

# The name-matching model for suppliers (ticket 19; docs/PLAN.md section 5). A STEP supplier ID
# decides first. A row with no ID is matched by name with Splink's Fellegi-Sunter model, on DuckDB
# inside the nightly task on both engines, against the suppliers with IDs and the other rows with no
# ID in its country. strata.config.load_supplier_matching() reads this table, and
# config/thresholds.toml's [supplier_matching] routes each pair by the probability it gives.
#
# judge_role  the role above whose deployment decides the pairs in the uncertain middle: draft, the
#             judge. No role is added for it.
# prior       how likely two rows from the same country are to be one supplier before their names are
#             compared
# Each comparison lists its levels, most alike first. m is how often two rows of one supplier fall in
# a level, u how often two rows of different suppliers do, and each column adds up to 1. The levels'
# rules are in src/strata/knowledge/suppliers/matching.py. Source: starting values for the owner to
# confirm, written so that only the same name with a project in common clears the auto-merge
# threshold. The labeled pairs in strata.ops.supplier_pair_labels are what to estimate them from.
[supplier_matching]
judge_role = "draft"
prior = 0.001

# Names after normalizing legal forms, transliteration and punctuation.
[supplier_matching.name]
same_name = { m = 0.80, u = 0.0001 }
same_words = { m = 0.03, u = 0.00005 }
starts_the_other = { m = 0.07, u = 0.0003 }
nearly_the_same = { m = 0.05, u = 0.001 }
alike = { m = 0.03, u = 0.01 }
different = { m = 0.02, u = 0.98855 }

# Whether the two rows share a project.
[supplier_matching.projects]
shared = { m = 0.5, u = 0.02 }
none_shared = { m = 0.5, u = 0.98 }
