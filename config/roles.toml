# The roles file: who sees what Strata keeps for a team, and who reviews lessons (spec, "Ten single
# places": the roles file sits beside the registries). strata.config.load_roles() reads it. One server
# helper, src/strata/server/access.py, applies its teams to every read of a draft (and later of an upload
# or a package made from one), so there is one access rule (the 38 design brief, section 11). The lesson
# review (src/strata/knowledge/lessons/review.py) applies its groups and people to the Lessons pages.
# Later tickets add to it: query judges and passage reviewers (ticket 32), implementing agency teams
# (ticket 38), a [views] section (ticket 40), the reviewing panel's group (ticket 41), each team's
# working language (ticket 42) and an operators group (ticket 45).
#
# [teams.<key>], one team of World Bank staff that shares its drafts:
#   name     the team's name
#   groups   the workspace groups whose members are on the team. The server reads a viewer's groups
#            with their own token. A viewer in the groups of two teams is on the first one in this file.
#   agency   only for an implementing agency's team (ticket 38): the agency, as the projects API's records
#            name it, such as "Northern Water Works Development Agency". Its members are implementing
#            agency officers: they upload their agency's plans for the projects whose records name it, draft
#            planned dates and PPSD rows for it, and are not World Bank staff, whatever [staff] says.
#            Everything the team makes is Official Use Only and seen by no other team. No agency team is
#            named here until the owner names its workspace group (a parked decision, ticket 38);
#            tests/fixtures/roles.toml names two for the offline tests.
#   working_language
#            optional: the language its members get answers and drafts in until they choose one in the
#            view popover, as config/languages.toml codes it (fr, es or pt). Left out, it is English
#            (ticket 42). A link's ?lang= and a person's own choice come first.
#
# A viewer in none of these groups is on a team of their own. A draft keeps the team its author was on
# when it was saved. An author always sees their own drafts. A teammate sees the drafts saved while the
# author was on their team. Changing who shares drafts is one line here, or a change of group membership
# in the workspace, and it never hides anyone's own drafts from them.
#
# [groups.<key>], one reviewer group (ticket 29):
#   workspace_group  the group's name in the Databricks workspace. Its members get no write access to
#                    the review tables: the app writes every act as its own service principal and
#                    names the person in the row. The names below wait for the workspace
#                    (docs/workspace-catchup.md).
#   role             what its members are called on reviewer pages, such as "lead procurement specialist"
#   pages            the reviewer pages its members may open: lesson_review is Lessons > Waiting for review,
#                    passage_reports is Lessons > Passage reports, where passage reviewers decide whether a
#                    reported passage is ranked lower, and judging is Lessons > Judging, where query judges
#                    grade the passages pooled for each query of the labeled set (ticket 32). Opening
#                    passage_reports or judging is the act itself, so those groups list no acts.
#   acts             what its members may do there: recommend, decide or cross_check a lesson
#
# [[people]], one per person in any reviewer group:
#   email     the email the Databricks App forwards for them
#   name      their name, shown only on reviewer-only pages (the 29 design brief, section 4.1)
#   groups    the keys of the reviewer groups they belong to
#   regions   the regions whose lessons they review, written word for word as strata.gold.project.region
#             writes them, such as "South Asia" or "Eastern and Southern Africa". A query judge or a
#             passage reviewer who reviews no lessons may leave it empty.
#   projects  the projects they work on, by project ID. They never recommend or decide on a lesson
#             from one of these (recusal, docs/PLAN.md section 11).
#   user_id   optional: the user id the Databricks App forwards for them (X-Forwarded-User). The seed command
#             (python -m strata.seed_examples, ticket 41) sets the examples up under it for each person in the
#             reviewing panel's group, so a panel member needs one.
#
# Lesson governance (docs/PLAN.md section 11): an accredited procurement specialist recommends, and a
# lead procurement specialist decides, by delegation from the region's accredited practice manager.
# A lead may also recommend, and then a different lead decides. Either may cross-check another
# region's decisions when the quarterly job assigns them.
#
# The retrieval loop (ticket 32; docs/PLAN.md section 11, "Feedback"): each query of the labeled set gets two
# query judges, who grade its pooled passages each on their own. A passage reviewer decides whether a
# passage people reported is ranked lower for that kind of question, and never decides on reports they sent
# themselves. The search owner is one of the passage reviewers.
#
# The people are left out until the owner names them (a parked decision), so until then no one is a
# lesson reviewer, query judge or passage reviewer, and their pages stay hidden. tests/fixtures/roles.toml
# lists the made-up reviewers the offline tests use.

# [staff], the World Bank staff role (ticket 37):
#   groups   the workspace groups whose members are World Bank staff in Strata. Only they may open Following
#            and follow projects; the server refuses everyone else (403 not_staff). A viewer whose groups
#            could not be read is in none, so they see less, never more.
#
# Every workspace user defaults to the World Bank staff view (spec, "The app"), and every workspace user is in
# the workspace's built-in users group, so that group is the starting value. Ticket 38 narrows it when the
# implementing agency teams join the workspace (a parked decision, ticket 37).
[staff]
groups = ["users"]

[teams.kenya-water]
name = "Kenya water and sanitation"
groups = ["strata-team-kenya-water"]

[groups.accredited_procurement_specialist]
workspace_group = "strata-accredited-procurement-specialists"
role = "accredited procurement specialist"
pages = ["lesson_review"]
acts = ["recommend", "cross_check"]

[groups.lead_procurement_specialist]
workspace_group = "strata-lead-procurement-specialists"
role = "lead procurement specialist"
pages = ["lesson_review"]
acts = ["recommend", "decide", "cross_check"]

[groups.passage_reviewer]
workspace_group = "strata-passage-reviewers"
role = "passage reviewer"
pages = ["passage_reports"]
acts = []

[groups.query_judge]
workspace_group = "strata-query-judges"
role = "query judge"
pages = ["judging"]
acts = []

# The reviewing panel (ticket 41; the blueprint's "The first 60 seconds"): the people the seed command sets Home's
# examples up for (config/examples.toml names this group). Its members open no reviewer page. The panel is named
# when the owner names its people (a parked decision), each with their user_id.
[groups.reviewing_panel]
workspace_group = "strata-reviewing-panel"
role = "reviewing panel member"
pages = []
acts = []

# The estimates loop (ticket 44; docs/PLAN.md section 11): its owner is the model owner, co-signed by the lead. A
# challenger becomes the time estimate's champion only with a sign-off from a member of the model_owner group and
# one from a different person in the lead group (src/strata/estimates/promotion.py), beside its backtest win, its
# shadow-quarter win and its coverage for each edition. The model owner opens no reviewer page.
[groups.model_owner]
workspace_group = "strata-model-owners"
role = "model owner"
pages = []
acts = []

# [model_sign_off], the two groups whose members sign off a challenger:
#   model_owner  the group whose members are the model owner
#   lead         the group whose members co-sign as the lead
[model_sign_off]
model_owner = "model_owner"
lead = "lead_procurement_specialist"

# [views], the view switch (ticket 40; the blueprint's "Navigation and roles", its roles table; the 40 brief, 5.1).
# The one place each view's rules live. strata.config.load_views() reads it, src/strata/server/views.py applies it to
# every request, and GET /api/me sends the applied view to the screens, so no other file holds a view's rule.
#
# Three views: staff (World Bank staff), piu (an implementing agency officer; "piu" is only the address's value,
# docs/PLAN.md section 8, and no screen ever shows it) and public (a member of the public). A person sees their own
# view: an implementing agency officer (a member of a [teams] entry with an agency) sees piu, and everyone else staff.
# A person may preview a view whose capabilities their own view also has, apart from those private to a team, so World
# Bank staff preview piu and public, and an officer previews public. A preview can only take things away: it keeps a
# capability only where the previewed view and the person's own view both have it, never one private to a team, and
# never an act. A person is always still signed in as themselves.
#
#   preview_agency        the implementing agency the agency preview shows, as the projects API's records name it. It
#                         is one line, so changing which agency a preview shows is one edit.
#   preview_agency_short  its short name, which the banner writes after the full name, or "" for none
#
# [views.<view>], one per view:
#   tabs    the navy bar's tabs in that view, in order
#   hidden  the app's pages that view does not show, by their key in web/src/routes.ts. A hidden page keeps its address
#           and says why, and the server never sends what it holds.
#
# [views.capabilities], one line per capability: what a person may read or do.
#   kind     read (a page or a part of one), setting (a person's own choice, such as the language of answers, which a
#            preview keeps because you are still signed in as yourself), or an act: record (a choice, a follow, a
#            report or an opened source), check, export or draft
#   staff, piu, public
#            whether that view has it. "By role" in the roles table is true here: the route still checks the role
#            (a reviewer group, the World Bank staff role, the agency's team), as the sections above set.
#   private  true when it is private to a team or a person (drafts, uploads, personal sections). A preview never
#            keeps it, so the officer's own team's keys are left out when a preview is compared with the staff view.
#   reason   for an act, the copy key (a path into web/src/copy.ts) of the sentence a preview gives. The server's 403
#            names it, and the screen's held button shows its sentence, so both say the same.
#   quiet    for a record a preview leaves out without refusing: the server answers {"recorded": false}.
#
# [views.routes], one line per route that reads something a view may hide, and every route that writes: "METHOD path",
# as the server declares it, and the capability it needs. A route whose act depends on a path value, such as a draft's
# action, names that value under param and one capability per value. tests/test_views.py fails on a write route with no
# line here.
[views]
preview_agency = "Northern Water Works Development Agency"
preview_agency_short = "NWWDA"

[views.staff]
tabs = ["packages", "projects", "lessons", "drafts", "data"]
hidden = []

[views.piu]
tabs = ["packages", "projects", "lessons", "drafts", "data"]
hidden = ["following", "lessonsQueue", "lessonReview", "lessonsReports", "passageReport", "lessonsJudging",
          "judgingQuery"]

[views.public]
tabs = ["projects", "lessons", "data"]
hidden = ["packages", "package", "packageNew", "plannedPackage", "checkMyPlan", "uploadCheck", "drafts", "draft",
          "draftNew", "following", "lessonsQueue", "lessonReview", "lessonsReports", "passageReport", "lessonsJudging",
          "judgingQuery"]

[views.capabilities]
# Reads.
projects = { kind = "read", staff = true, piu = true, public = true }
contract_trail = { kind = "read", staff = true, piu = true, public = true }
lessons = { kind = "read", staff = true, piu = true, public = true }
data = { kind = "read", staff = true, piu = true, public = true }
ask = { kind = "read", staff = true, piu = true, public = true }
packages = { kind = "read", staff = true, piu = true, public = false }
following = { kind = "read", staff = true, piu = false, public = false }
signals_on_active_projects = { kind = "read", staff = true, piu = true, public = false }
time_estimates_on_active_projects = { kind = "read", staff = true, piu = true, public = false }
disagreements_on_active_projects = { kind = "read", staff = true, piu = true, public = false }
baseline = { kind = "read", staff = true, piu = true, public = false }
baseline_saver = { kind = "read", staff = true, piu = false, public = false }
drafts = { kind = "read", staff = true, piu = true, public = false, private = true }
uploads = { kind = "read", staff = false, piu = true, public = false, private = true }
personal_lessons = { kind = "read", staff = true, piu = true, public = false, private = true }
reviewer_pages = { kind = "read", staff = true, piu = false, public = false }
# Your agency's projects (the 40 brief, 3.8): an officer's own agency's, or the preview agency's in the staff preview. The route
# names the agency, so World Bank staff in their own view get none.
agency_projects = { kind = "read", staff = true, piu = true, public = false }
# A person's own settings.
save_language = { kind = "setting", staff = true, piu = true, public = true }
# Acts, each with the sentence a preview gives (the 40 brief, 6.7: the earlier briefs' words, kept as they wrote them).
record_opened = { kind = "record", staff = true, piu = true, public = false, reason = "evidence.preview", quiet = true }
keep_other_report = { kind = "record", staff = true, piu = true, public = false, reason = "disagreement.card.keep.preview", quiet = true }
report_passage = { kind = "record", staff = true, piu = true, public = false, reason = "feedback.preview" }
follow = { kind = "record", staff = true, piu = false, public = false, reason = "view.actPreview" }
save_baseline = { kind = "record", staff = true, piu = true, public = false, reason = "view.actPreview" }
plan_package = { kind = "record", staff = true, piu = true, public = false, reason = "packagesTab.previewOff" }
change_package = { kind = "record", staff = true, piu = true, public = false, reason = "packageWorkspace.preview" }
plan_date_choice = { kind = "record", staff = true, piu = true, public = false, reason = "stepDates.choice.preview" }
step_start = { kind = "record", staff = true, piu = true, public = false, reason = "stepDates.start.preview" }
risk_selection = { kind = "record", staff = true, piu = true, public = false, reason = "packageRisks.preview" }
review_lesson = { kind = "record", staff = true, piu = false, public = false, reason = "view.actPreview" }
review_passage_reports = { kind = "record", staff = true, piu = false, public = false, reason = "view.actPreview" }
judge_passages = { kind = "record", staff = true, piu = false, public = false, reason = "view.actPreview" }
review_suppliers = { kind = "record", staff = true, piu = false, public = false, reason = "view.actPreview" }
start_draft = { kind = "draft", staff = true, piu = true, public = false, reason = "packageWorkspace.ppsdAction.heldPreview" }
fill_draft = { kind = "draft", staff = true, piu = true, public = false, reason = "fill.preview" }
discard_draft = { kind = "draft", staff = true, piu = true, public = false, reason = "draft.bar.hold.preview" }
# A choice on a draft's row whose lesson changed (ticket 39): update, keep, remove, restore or revert. The 40 brief, 6.7.
lesson_choice = { kind = "draft", staff = true, piu = true, public = false, reason = "draft.bar.hold.preview" }
mark_checked = { kind = "check", staff = true, piu = true, public = false, reason = "draft.bar.hold.preview" }
upload_and_check = { kind = "check", staff = false, piu = true, public = false, private = true, reason = "upload.holdPreview" }
compare_criteria = { kind = "check", staff = true, piu = true, public = false, reason = "criteria.preview" }
export_draft = { kind = "export", staff = true, piu = true, public = false, reason = "draft.bar.hold.preview" }
# Removing Home's Start here strip, or showing it again (ticket 41): a choice about the signed-in reviewer's own examples,
# which no preview shows.
start_here = { kind = "record", staff = true, piu = false, public = false, reason = "home.start.preview" }

