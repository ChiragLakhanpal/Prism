# The language registry (ticket 42; CLAUDE.md rule 9): every language a source can be written in, and for
# the four working languages, everything Prism needs to write answers and drafts in them and to check
# what it wrote. strata.config.load_languages() reads it, and strata.languages holds the one number and
# date reader and writer that the verifier, the server and the drafts all use (CLAUDE.md rule 4).
#
# The screens stay in English: the copy file (web/src/copy.ts) is never translated. Only the writer's
# sentences follow the working language; sources keep their own words.
#
# [[language]]
#   code           the ISO 639-1 code a passage carries in strata.silver.passages.language, and the lang
#                  attribute the screens set
#   api_name       the Documents API's lang field for it, word for word ("French")
#   endonym        the language's own name, which the language choice shows beside the English name
#   direction      ltr, or rtl for a script written right to left (the screens add dir="rtl")
#   working        true for a working language: Prism writes answers and drafts in it. The others are
#                  languages a source can be written in.
#
# A working language other than English also has:
#   word_locale    the proofing language its runs carry in a Word file (w:lang)
#   number_locale  the CLDR locale its numbers and dates follow
#   decimal, group the decimal mark and the digit grouping mark of that locale; group_also lists the other
#                  marks a writer may use for grouping, which the verifier reads the same way
#   months         the months, January first, as the locale writes them in a long date
#   date_joiner    the word between the day, the month and the year in a long date ("de" in "29 de julio
#                  de 2021"), or "" when there is none
#   number_words   the numbers a writer may write as words, each with its value. The words for one are left
#                  out, because they are also the language's indefinite article ("un", "una", "um").
#   scale_words    the words that multiply what comes before them ("cent", "mille"), each with its value
#   times_words    number words that multiply a smaller number written just before them, as "vingts" does in
#                  "quatre-vingts" (80); alone, each is the number number_words gives it
#   joiners        the words that join number words into one number ("et" in "vingt et un")
#   joined_ones    the words for one, which count only after a joiner inside a number ("vingt et une", "treinta y
#                  uno", "vinte e um"); alone they are the article
#   never_write    the language's words for DESIGN.md section 7 rule 19 and GLOSSARY.md's Avoid terms.
#                  The writer's instructions forbid them, and the tests check the scripted answers and
#                  drafts against them.
#   terms          GLOSSARY.md's terms as a writer in the language uses them. STEP's field names and values,
#                  method names and STEP references stay in English, word for word, and are not listed.
#   reviewed_by, reviewed_on
#                  who checked never_write and terms, being a person who writes the language, and when.
#                  Empty until someone has: a builder drafted these lists, and no demo in the language should
#                  run before a person who writes it has reviewed them.

[[language]]
code = "en"
api_name = "English"
endonym = "English"
direction = "ltr"
working = true
word_locale = "en-US"
number_locale = "en"
decimal = "."
group = ","
months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October",
          "November", "December"]
date_joiner = ""

[[language]]
code = "fr"
api_name = "French"
endonym = "Français"
direction = "ltr"
working = true
word_locale = "fr-FR"
number_locale = "fr"
decimal = ","
group = " "
group_also = [" ", " "]
months = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre",
          "novembre", "décembre"]
date_joiner = ""
joiners = ["et"]
number_words = { "zéro" = 0, "deux" = 2, "trois" = 3, "quatre" = 4, "cinq" = 5, "six" = 6, "sept" = 7, "huit" = 8, "neuf" = 9, "dix" = 10, "onze" = 11, "douze" = 12, "treize" = 13, "quatorze" = 14, "quinze" = 15, "seize" = 16, "vingt" = 20, "vingts" = 20, "trente" = 30, "quarante" = 40, "cinquante" = 50, "soixante" = 60 }
scale_words = { "cent" = 100, "cents" = 100, "mille" = 1000, "million" = 1000000, "millions" = 1000000 }
