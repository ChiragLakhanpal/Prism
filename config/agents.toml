# The agent registry: each Foundry prompt agent Strata runs, and the guardrail it runs under.
#
# This is the one place an agent is defined (CLAUDE.md rule 9). Its rules are its instructions file, in
# src/strata/agent/instructions/, versioned with the code. The sync builds the agent's definition in
# Foundry from this entry, that file, the model file (config/models.toml) and the tool registry
# (config/tools.toml), and makes the Foundry agent match it:
#
#     uv run --script ops/agent/sync.py --env-file .env
#
# Run it after any change to an agent's instructions, its model, a tool or the guardrail. With --check it
# only reports the difference. strata.agent.definition.load_agent() reads this file.
#
# [agents.<key>]
#   name          the agent's name in the Foundry project
#   role          the role in config/models.toml whose deployment it runs on
#   instructions  its instructions file, in src/strata/agent/instructions/. The sync adds a section that
#                 lists the tool registry's tools, and fills in each value of config/thresholds.toml it
#                 names in braces, such as {agent.tool_rounds}.
#   guardrail     the key of its guardrail below
#   description   what it does, as Foundry's list of agents shows it
#   tools         the tool registry's tools it may call, by name. Leave it out to offer every tool. A
#                 writer that writes from facts the app hands it has tools = [] (fairshare's tool-less
#                 writer), and the sync gives it no tool section.
#
# [guardrails.<key>], the content filters and Prompt Shields the agent runs under, kept as an RAI policy
# on the Foundry resource (ops/dayone/dayone.toml names it, foundry_resource):
#   name             the policy's name
#   base_policy      the policy it starts from
#   severity         the lowest severity of hate, sexual, violence and self-harm content that is blocked,
#                    in the question and in the answer: Low, Medium or High
#   prompt_shields   true blocks a prompt attack in the question and an indirect attack in a tool's result.
#                    Passages that hold rule-like sentences must still pass (evals/shield_passages.toml).
#
# [foundry], the API versions the sync, the answer loop and the recording command call.

[agents.orchestrator]
name = "strata-orchestrator"
role = "agent"
instructions = "orchestrator.md"
guardrail = "strata"
description = "Answers a question about World Bank-financed procurement with claims cited to the rows and passages its tools return."

# The check-a-plan workflow's writer (ticket 35): one review note per activity that check_plan marked
# needs_a_look or watch, from the rows the app hands it. The draft runtime (src/strata/drafts) runs the
# verifier on what it writes before any draft is saved.
[agents.review_notes_writer]
name = "strata-review-notes-writer"
role = "draft"
instructions = "review_notes_writer.md"
guardrail = "strata"
description = "Writes one review note per marked activity in a borrower's Procurement Plan, citing the plan rows its check returned."
tools = []

# The plan-a-package workflow's reader (ticket 15): one structured call that reads a person's sentence, such
# as "rural roads, Kenya, about US$15 million", into the fields of the package form schema
# (config/package_form.toml) that the app hands it. It writes no sentence a person reads, so no verifier
# runs on it; the app checks each value against the schema and computes review type and market approach
# from config/thresholds.toml itself (src/strata/packages).
[agents.package_reader]
name = "strata-package-reader"
role = "draft"
instructions = "package_reader.md"
guardrail = "strata"
description = "Reads a sentence that describes a procurement package into the criteria of Strata's package form."
tools = []

# The review-proposed-lessons workflow's writer (ticket 29): a summary of each lesson review item's evidence and
# the current lessons it may repeat, from the passages and lessons the app hands it. The workflow
# (src/strata/knowledge/lessons/writer.py) runs the verifier on what it writes before any reviewer reads it.
[agents.lesson_review_writer]
name = "strata-lesson-review-writer"
role = "draft"
instructions = "lesson_review_writer.md"
guardrail = "strata"
description = "Summarizes the evidence for a proposed lesson and names the current lessons it may repeat, for lesson reviewers."
tools = []

[guardrails.strata]
name = "strata-guardrail"
base_policy = "Microsoft.DefaultV2"
severity = "Medium"
prompt_shields = true

[foundry]
api_version = "2025-11-15-preview"
rai_policy_api_version = "2024-10-01"
