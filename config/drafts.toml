# The draft-kind registry: each kind of draft Prism writes for a person to check, and what makes it
# differ from the others (CLAUDE.md rule 9; the 35 design brief, section 1). One draft page, one draft
# bar, one stepper, one Sources list and one set of files serve every kind. This file says, for each
# kind, which workflow writes it, what its page shows, which holds keep it from export and how its
# files are named. strata.config.load_draft_kinds() reads it, and the draft runtime
# (src/strata/drafts) and the draft routes (src/strata/server/drafts.py) use it.
#
# The words for a kind live in web/src/copy.ts, under the kind's key: copy.draft.kinds.<kind> holds its
# title, crumb, subtitle, browser tab title, bar lead sentences, lede, method sentence, columns, steps
# and its row on the Drafts tab, and copy.draft.files holds the words of the files. The server reads
# the files' words from src/strata/drafts/copy.json, which node web/lint/server-copy.ts --write
# writes from the copy file, and the lint lane fails when it is out of date.
#
# Adding a kind is one entry here, its workflow module, its words in the copy file and its benchmark
# question. Tickets 36 to 41 add their kinds and keys (row_label_sentence, rewrite_row) here. Home (ticket 41)
# needs no key: a kind's progress on Home is its row on the Drafts tab, and the words a lesson line on Home names a
# kind by are copy.home.server.line.cites.<kind> in the copy file, which tests/test_home.py checks for every kind.
#
# [kinds.<key>]
#   writer         the workflow module that writes it. It reads the facts the draft is written from as
#                  the viewer (read), builds the writer agent's message (message), and turns what the
#                  agent wrote and what the verifier kept into the draft to save (assemble). The draft
#                  runtime calls the agent and runs the verifier between them, so no kind can skip it.
#   agent          its writer agent in config/agents.toml. A kind with none is worked out by its module alone,
#                  with no model call (compose), and the runtime still runs the verifier on it (ticket 38).
#   word           the function that lays out its Word file, as module:function; its first heading is the
#                  file's title, which the evidence pack repeats. Only a kind exported to Word needs one.
#   export         the export button: word, which reads "Export to Word", or step_rows, which reads "Export STEP
#                  rows" and makes the STEP rows CSV the first function under csv writes (ticket 38)
#   csv            more CSV files its export makes, as module:function (ticket 38 adds STEP rows)
#   columns        the columns of its table on the page and in Word, in order
#   holds          the holds that can keep it from export, in the order the bar names them ([holds])
#   sources_list   whether the page lists its sources under the notes
#   removed_box    always, or when_removed to show the removed box only when a sentence was removed
#   not_checked    its own "Not checked" clauses, keys of copy.checkLine.notCheckedClauses, which follow
#                  the clauses of the checks that did not run and of the tools its writer read
#   files          the stem of its files' names, filled from the draft's subject
#   staff_only     true when only viewers with the World Bank staff role (config/roles.toml [staff]) may start
#                  one; others get 403 not_staff. Leave it out for false.
#   agency_only    true when only implementing agency officers (a team in config/roles.toml that names an agency)
#                  may start one, for their own agency; others get 403 not_agency_team. Every draft of the kind is
#                  Official Use Only. Leave it out for false (ticket 38).
#   row_label      the function that gives the values of the sentence naming one of its rows, as module:function
#                  (ticket 39): the Lessons page's "Used in" line names the row with copy.draft.kinds.<kind>.rowLabel,
#                  such as "Row {n}, {risk_label}." Leave it out for a kind whose rows cite no lesson.
#   rewrite_row    the function that rewrites one row from the current version of the lesson it cites, through the
#                  kind's writer agent and then the verifier, as module:function (ticket 39's "Update the row").
#                  Leave it out for a kind whose rows cite no lesson; "Update the row" is then not offered.
#
# [holds.<key>]
#   test           the function that says how many items the hold has left on a draft and where the first is,
#                  or None when it does not apply, as module:function (src/strata/drafts/holds.py)
#   copy           its hold line, the key under copy.draft.bar.hold (notChecked is each kind's own
#                  holdNotChecked). tests/test_drafts.py fails when a key has no line.
#   capability     what the refusal names when the hold stops an export (brief 40's capability kinds)

[kinds.review_notes]
writer = "strata.drafts.review_notes"
agent = "review_notes_writer"
word = "strata.drafts.review_notes:word"
export = "word"
csv = []
columns = ["activity", "note"]
holds = ["notChecked", "disagreements", "lessonRetiredWrong", "preview"]
sources_list = true
removed_box = "always"
not_checked = ["writer_review_notes"]
files = "review-notes-{project_id}-{agency_id}-{plan_date}"

# The write-the-mission-brief workflow (ticket 37): a task team leader's brief before a mission, started from a
# Following row. Five parts, in the ticket's order, each with cited sentences and a table of the records they
# rest on (project_records); its page and Word file show them as headed parts, not a two-column table.
[kinds.mission_brief]
writer = "strata.drafts.mission_brief"
agent = "mission_brief_writer"
word = "strata.drafts.mission_brief:word"
export = "word"
csv = []
columns = ["plans", "awards", "ratings", "disbursement", "closing"]
holds = ["notChecked", "disagreements", "lessonRetiredWrong", "preview"]
sources_list = true
removed_box = "always"
not_checked = ["writer_mission_brief"]
files = "mission-brief-{project_id}-{date}"
staff_only = true

# The suggest-PPSD-rows workflow (ticket 36): suggested risk rows for the borrower's PPSD, started from the package
# workspace's "Suggest {n} PPSD risk rows". Its columns are the template registry's (config/ppsd_templates.toml) in
# the form the person chose; this list names the Short Form's, the default. Prism writes the Risk Description and
# the Description of mitigation; only people set the owners and, in the Long Form, the ratings, which hold export.
# Ticket 38 registers the implementing agency's own variant, which changes only the words.
[kinds.ppsd_rows]
writer = "strata.drafts.ppsd_rows"
agent = "ppsd_rows_writer"
word = "strata.drafts.ppsd_rows:word"
export = "word"
csv = []
columns = ["risk_description", "mitigation", "risk_owner"]
holds = ["notChecked", "owners", "ratings", "disagreements", "lessonRetiredWrong", "preview"]
sources_list = true
removed_box = "always"
not_checked = ["writer_ppsd_rows"]
files = "ppsd-rows-{package_slug}-{created_date}"
staff_only = true
# Ticket 39: each row cites a lesson at a version in its mitigation, so a changed lesson can rewrite that row.
row_label = "strata.drafts.ppsd_rows:row_label"
rewrite_row = "strata.drafts.ppsd_rows:rewrite_row"

# The Project Paper summary (ticket 36): the procurement summary for the Project Paper, started from the "Drafts from
# this check" panel at the end of Check a plan. Three parts, in order: the plan check, the implementing agency's
# track record (agency_track_record) and the PPSD rows the team checked for the project's packages. It never rates
# the agency's procurement risk.
[kinds.project_paper]
writer = "strata.drafts.project_paper"
agent = "project_paper_writer"
word = "strata.drafts.project_paper:word"
export = "word"
csv = []
columns = ["plan", "record", "ppsd"]
holds = ["notChecked", "disagreements", "lessonRetiredWrong", "preview"]
sources_list = true
removed_box = "always"
not_checked = ["writer_project_paper"]
files = "project-paper-summary-{project_id}-{agency_id}-{plan_date}"
staff_only = true

# Planned dates (ticket 38): a planned date for every STEP step of every activity in an implementing agency's upload, or
# in its own agency's latest published plan, from the delay model. No model writes it (no agent): estimate_time dates
# each step and the verifier checks every date and count before it is saved. It exports STEP rows, a CSV in STEP's own
# columns (config/uploads.toml), instead of a Word file, and its sources are the lists of comparable packages behind each
# dated step, which the page does not list (sources_list false). Only an implementing agency officer starts one, and
# every one is Official Use Only.
[kinds.step_rows]
writer = "strata.drafts.step_rows"
export = "step_rows"
csv = ["strata.drafts.step_rows:step_rows_csv"]
columns = ["activity", "signed", "dated"]
holds = ["notChecked", "preview"]
sources_list = false
removed_box = "when_removed"
not_checked = ["writer_step_rows", "upload_dates"]
files = "step-rows-{project_id}-{agency_id}-{plan_date}"
agency_only = true

# Risk rows for an implementing agency's own PPSD (ticket 38): ticket 36's suggested PPSD rows, written by the agency's
# own writer with the same Short Form and Long Form rules and footnotes, in the officer's words ("Draft {n} PPSD risk
# rows", "Risk rows for your PPSD"). Only an officer starts one, and every one is Official Use Only.
[kinds.ppsd_rows_agency]
writer = "strata.drafts.ppsd_rows"
agent = "ppsd_rows_agency_writer"
word = "strata.drafts.ppsd_rows:word"
export = "word"
csv = []
columns = ["risk_description", "mitigation", "risk_owner"]
holds = ["notChecked", "owners", "ratings", "disagreements", "lessonRetiredWrong", "preview"]
sources_list = true
removed_box = "always"
not_checked = ["writer_ppsd_rows"]
files = "ppsd-rows-{package_slug}-{created_date}"
agency_only = true
# Ticket 39: its rows cite lessons at a version as ticket 36's do, so a lesson retired as wrong holds the export and
# the Lessons page names the row. It has no rewrite_row yet, so a changed lesson offers Keep, and a retired one Remove
# or Keep, until the agency's writer instructions learn to rewrite one row.
row_label = "strata.drafts.ppsd_rows:row_label"

[holds.notChecked]
test = "strata.drafts.holds:not_checked"
copy = "notChecked"
capability = "export"

[holds.preview]
test = "strata.drafts.holds:preview"
copy = "preview"
capability = "export"

# Ticket 36: every risk owner set, every Long Form rating set, and every warning disagreement given a choice.
[holds.owners]
test = "strata.drafts.holds:owners"
copy = "owners"
capability = "export"

[holds.ratings]
test = "strata.drafts.holds:ratings"
copy = "ratings"
capability = "export"

[holds.disagreements]
test = "strata.drafts.holds:disagreements"
copy = "disagreements"
capability = "export"

# Ticket 39: a row that cites a lesson a lead retired as wrong, until its author removes the row or keeps it with a
# reason. A change of wording or a retirement as out of date holds nothing; its notice on the row is the reminder.
# Every kind lists it, because any note can cite a lesson version: the Project Paper summary's PPSD part cites the
# lessons its checked rows cite. On a draft that cites no lesson it holds nothing.
[holds.lessonRetiredWrong]
test = "strata.drafts.holds:lesson_retired_wrong"
copy = "lessonRetiredWrong"
capability = "export"

# Whether a draft's page shows the disagreement cards check 6 attaches, so a warning card holds export until its
# author keeps one report with the card's keep action (ticket 23's, recorded in strata.ops.disagreement_choices with
# the draft's id). Set false, no card renders and the disagreements hold holds nothing (the 35 brief, 6.6). Only
# warning cards hold; an info card changes nothing.
[disagreements]
cards_on_drafts = true
