# The nightly job's quality checks: which tables each task checks when it finishes (ticket 43; the 45 brief,
# section 6, "Nightly runs and quality checks").
#
# This is the one place to add or change a check (CLAUDE.md rule 9). strata.config.load_quality_checks() reads
# it, and strata.lakehouse.quality runs the checks after each task of the job and keeps every result in
# strata.ops.quality_checks, passed or failed, for the dashboard's Governance page. A failed check never stops
# the job. tests/test_quality_checks.py checks that every task of the job checks at least one table and that
# every table named here is in the catalog.
#
# Each [[tables]] entry is one table a task writes:
#
#   task      the task's key in bundle/nightly.yml
#   table     the table, in three parts
#   key       optional: the columns that tell one row from another. The job counts the rows that miss each of
#             them (missing_key) and the rows that repeat a key (duplicates). A gold table built by a query in
#             src/strata/lakehouse/gold/ takes the key its query's "-- key:" line names, so leave key out for
#             it. A table that keeps every version of a record, as silver keeps every page, has no key.
#   contacts  optional: true for a table of notices, whose notice_text and bid_description the job searches for
#             an email address or a labelled phone number that ingestion missed (contacts_left)
#
# Every table also gets a row count check against the range in config/thresholds.toml [quality_checks] and a
# missing Disclosed date check (missing_public_from, ADR 0002).

[[tables]]
task = "fetch_by_watermark"
table = "strata.bronze.api_pages"
key = ["source", "page_hash"]

[[tables]]
task = "bronze_to_gold"
table = "strata.silver.notices"
