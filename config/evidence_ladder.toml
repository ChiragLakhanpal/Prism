# The evidence ladder: how Strata chooses the assertion it leans on when two disagree.
#
# This is the one place the ladder is defined (spec, "Ten single places", item 6). Both assertions
# are always kept and shown; the ladder only says which one Strata leans on and by which rule.
# strata.config.load_ladder() reads it, the nightly job's detect_disagreements task applies it to each
# disagreement it finds (src/strata/knowledge/assertions.py), and get_disagreements returns the rule
# that decided. A change here takes effect at the next run, with no code change.
#
# A disagreement is decided by the first rule below whose applies_to is the class of its attribute
# (see [attributes]), when that rule ranks the two sides apart. When it does not, the ties decide, in
# the order [ties] gives. Each rule's id is the key of its sentence in the screens' copy (brief 23's
# card.rule.outcome, card.rule.moment, card.rule.tieSpecific and card.rule.tieRecent), so a rule
# keeps its id when you reorder it.

# Outcome judgments (how a project went) lean on the source written later and more independently:
# IEG's ICR Review or PPAR, then the ICR, then the ISRs, then the PAD. Source: docs/PLAN.md section 5
# and the blueprint's "When reports disagree, both stay on screen". Every ISR ranks as an ISR; between
# two ISRs, the ties decide, and the more recent one is the last ISR.
[[rules]]
id = "outcome"
applies_to = "judgment"
tiers = ["ieg", "icr", "isr", "pad"]

# Assertions about a moment lean on the record made at that moment: a record (a contract, a notice, a
# plan row), or a report made within the period it describes, such as the PAD at appraisal or an ISR for
# its own period. A report that tells of an earlier moment is a later retelling.
[[rules]]
id = "moment"
applies_to = "moment"
at_the_moment = ["record"]

# When the rule ranks both sides the same: first the more specific source, then the more recent one
# (the later made_at). specificity lists the forms an assertion takes, most specific first; forms in
# one group are equally specific. A rating in its own field (an ISR's ratings table, an ICR Review's
# rating box, the IEG ratings dataset) is more specific than one told in running text. A record of the
# signed contract (the awards datasets, the award notice) is more specific about a signing date or an
# amount than the package's row in a Procurement Plan, which covers every lot of the package and whose
# Actual columns the borrower fills in later. This meaning of "more specific" is a decision parked for
# the owner (ticket 20).
[ties]
order = ["tieSpecific", "tieRecent"]
specificity = [["rating_field", "contract_record", "award_notice"], ["narrative", "plan_row"]]

# The evidence tiers: how independent and how retrospective a source is. There is one for each of brief
# 23's "written when" labels, whose words are in the screens' copy file (web/src/copy.ts,
# disagreement.written, keyed by the tier). A report's tier comes from its document type in the documents
# API; every record (a contract, a notice, a plan row) is in the record tier. The IEG ratings dataset
# repeats the ratings of IEG's own evaluations, so its rows are in the ieg tier.
[tiers.pad]  # written at appraisal
document_types = ["Project Appraisal Document"]

[tiers.isr]  # written during the project
document_types = ["Implementation Status and Results Report"]

[tiers.icr]  # written after the project closed
document_types = ["Implementation Completion and Results Report"]

[tiers.ieg]  # written by IEG after the project closed
document_types = ["Implementation Completion Report Review", "Project Performance Assessment Report"]

[tiers.record]  # recorded on its own date
document_types = []

# What an assertion can be about. Each attribute has:
#   kind    rating, date or amount
#   class   judgment (an outcome judgment, decided by the outcome rule) or moment (a claim about one
#           moment, decided by the moment rule)
#   scale   for a rating, its scale in [scales]
#   names   the field names that mean it, word for word, in the reports and records Strata reads
#
# Progress towards the PDO is classed a judgment of how the project went, so ISR 7 and the ICR's
# paragraph 78 are decided by the outcome rule, not the moment rule (a decision parked for the owner,
# ticket 20).
[attributes.pdo_progress]
kind = "rating"
class = "judgment"
scale = "six_point"
names = ["Progress towards achievement of PDO"]

[attributes.implementation_progress]
kind = "rating"
class = "judgment"
scale = "six_point"
names = ["Overall Implementation Progress (IP)"]

[attributes.overall_risk]
kind = "rating"
class = "moment"
scale = "risk"
names = ["Overall Risk Rating"]

[attributes.outcome]
kind = "rating"
class = "judgment"
scale = "six_point"
names = ["outcome", "Outcome Rating"]

[attributes.efficiency]
kind = "rating"
class = "judgment"
scale = "four_point"
names = ["Efficiency Rating"]

[attributes.bank_performance]
kind = "rating"
class = "judgment"
scale = "six_point"
names = ["bank_performance", "Overall Bank Performance Rating"]

[attributes.me_quality]
kind = "rating"
class = "judgment"
scale = "four_point"
names = ["me_quality", "M&E Quality Rating"]

[attributes.signed_on]
kind = "date"
class = "moment"
names = ["contract_signing_date", "Contract Signature Date", "Signed Contract"]

[attributes.signed_amount_usd]
kind = "amount"
class = "moment"
names = ["contract_amount_usd", "Actual Amount (US$)"]

# The rating scales, word for word. A rating on the satisfactory side and one on the unsatisfactory
# side cannot both be true, and neither can two different ratings of one scale. A narrative account
# (such as the ICR's paragraph 78) gives only a side. no_rating lists what a report writes where it
# gives no rating, such as the March 27, 2020 ICR Review's "Efficiency Rating ---".
[scales]
no_rating = ["---", "--", "-", "Not Rated", "Not Applicable", "N/A"]

[scales.six_point]
satisfactory = ["Highly Satisfactory", "Satisfactory", "Moderately Satisfactory"]
unsatisfactory = ["Moderately Unsatisfactory", "Unsatisfactory", "Highly Unsatisfactory"]

[scales.four_point]
satisfactory = ["High", "Substantial"]
unsatisfactory = ["Modest", "Negligible"]

[scales.risk]
values = ["Low", "Moderate", "Substantial", "High"]
