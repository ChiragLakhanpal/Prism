# The tool registry: every tool the agent, the pages and the workflows call.
#
# This is the one place a tool is defined (spec, "Ten single places", item 2). The agent's tool
# list is generated from this file (strata.tools.registry.agent_tools), every call goes through
# strata.tools.registry.call, and strata.config.load_tools() reads it. Adding a tool is one entry
# here plus its adapter function.
#
# Each [tools.<name>] table has:
#   description   what the tool does and returns, for the agent, in full sentences
#   adapter       the Python function that runs it, as module:function
#   benchmark     the id of its question in evals/benchmark.yaml. Changing a tool's contract means
#                 updating that question in the same change (CLAUDE.md rule 4).
#   sources       the source registry's keys (config/sources.toml) whose rows it reads
#
# [[tools.<name>.parameters]], one table per parameter: name, type (string, date, integer, number
# or boolean), required, and a description for the agent. Every tool takes an optional as_of
# date (ADR 0002): it then uses only what was public on or before that date. The page's own as-of
# date applies to every call too, and the earlier of the two wins.
#
# A description names a value of config/thresholds.toml in braces, such as {passages.results},
# rather than writing its number: the agent's tool list fills it in, so the prompt and the tool
# always use the same number (CLAUDE.md rule 4).
#
# [tools.<name>.result], the shape of what it returns. Every result has the same envelope: tool,
# as_of, view, rows, coverage (matched, used, and why the rest were not used) and abstention
# (empty, or the reason the tool gives no rows). The table says:
#   row            what one row is
#   row_fields     the fields every row carries, always with evidence_id, public_from and source
#   source_fields  the fields of each row's source line
#   fields         the tool's own fields beside the envelope
#   reasons        every code a reason in a row's marks, or in the coverage line's list of what was
#                  not used, may have. The screens' copy writes one sentence per code, so a code is
#                  renamed here, in the tool and in the copy together.
#   abstentions    every reason the tool may give for returning no rows, for the same reason
#
# [tools.<name>.readiness], for a tool that answers a kind of question people ask. The Data
# readiness page lists each such kind under "What you can ask" (ticket 16):
#   kind           its key in web/src/copy.ts's dataReadiness.kinds, which holds its words
#   ready_for      the measure whose count goes in its "Ready for" cell: the readiness row's id
#                  (config/sources.toml) and the measure's name
#   draws_on       the readiness rows whose gaps hold its answers back

[tools.check_plan]
description = """Checks every activity in one implementing agency's Procurement Plan for a project. It \
checks the latest version unless you name one by its date. The checks are fixed. A package with no signed \
contract, estimated at or above the amount in the result's thresholds or with no estimate, is checked for a \
planned completion date that has passed. \
A signed amount is compared with its estimate, and the result says how late the contract was signed, measured \
from the first published planned date. A package still pending close to the project's closing date is marked. \
Weak records get data notes. It returns one row per activity in STEP's columns, with its marks (needs_a_look, \
watch, data_note) and the values behind each reason. It reads only the plan's own record. It cannot see the \
prior-review queue, complaints, contract amendments or contract management reports."""
adapter = "strata.tools.check_plan:check_plan"
benchmark = "check-plan-nwwda-2026-10-09"
sources = ["documents", "projects"]

[tools.check_plan.readiness]
kind = "plan_check"
ready_for = { row = "plans", measure = "latest_activities_with_step_rows" }
draws_on = ["plans", "projects"]

[[tools.check_plan.parameters]]
name = "project_id"
type = "string"
required = true
description = "The project ID, P followed by six digits, such as P156634."

[[tools.check_plan.parameters]]
name = "implementing_agency"
type = "string"
required = true
description = """The implementing agency whose plan to check, as the plan's Executing Agency(ies) line \
names it, such as Northern Water Works Development Agency, or its agency_id from an earlier result."""

[[tools.check_plan.parameters]]
name = "plan_date"
type = "date"
required = false
description = "The version to check, by the plan's date. Leave it out to check the agency's latest version."

[[tools.check_plan.parameters]]
name = "as_of"
type = "date"
required = false
description = "Use only plan versions and project dates public on or before this date, and check as of it. Leave it out for today."

[tools.check_plan.result]
row = "One activity in the plan: its STEP fields as the plan gives them, its marks and the values behind each reason."
row_fields = ["evidence_id", "public_from", "source", "activity_reference_no", "section", "description",
              "review_type", "method", "market_approach", "estimated_amount_usd", "actual_amount_usd",
              "process_status", "signed_on", "planned_signing_on", "planned_signing_plan_date", "days_late",
              "planned_completion_on", "planned_completion_plan_date", "first_listing_confirmed",
              "actual_to_estimate", "marks"]
source_fields = ["document_type", "project_id", "implementing_agency", "plan_date", "document_id", "pdf_page"]
fields = ["plan", "project", "checks_run", "thresholds", "counts"]
reasons = ["completion_passed_no_contract", "pending_near_closing", "pending_on_closing_day", "pending_after_closing",
           "signed_late_over_estimate", "signed_over_estimate", "method_differs_from_reference", "actual_amount_zero",
           "no_planned_date", "no_estimate"]
abstentions = ["unknown_project", "no_plan_from_agency", "no_plan_as_of", "version_not_found", "version_not_public",
               "no_activities"]

[tools.search_passages]
description = """Searches the numbered passages of World Bank project documents (PADs, ISRs, ICRs and \
ICR Reviews) by words and by meaning, and returns the best passages first. A passage is one numbered \
paragraph, or a part of a long one, with its document, section, paragraph number and PDF page, so a \
citation can point to it. Filter by project, document type, country, sector or the date a document became \
public. A report re-issued under the same number replaces its earlier version, unless the as-of date comes \
before the re-issue. When Prompt Shields found a prompt attack in a passage as it was read in, the passage \
is left out, and the coverage line says how many. Quote a passage only word for word, from its text."""
adapter = "strata.tools.search_passages:search_passages"
benchmark = "search-passages-icr-rebidding"
sources = ["documents", "projects"]

[tools.search_passages.readiness]
kind = "document_search"
ready_for = { row = "reports", measure = "passages_embedded" }
draws_on = ["reports", "projects"]

[[tools.search_passages.parameters]]
name = "query"
type = "string"
required = true
description = "What to look for, in words, such as works estimates market rates rebidding."

[[tools.search_passages.parameters]]
name = "project_id"
type = "string"
required = false
description = "Only passages of this project, P followed by six digits, such as P130164."

[[tools.search_passages.parameters]]
name = "document_type"
type = "string"
required = false
description = """Only passages of this type of document: PAD, ISR, ICR or ICR Review, or the documents \
API's full name, such as Implementation Completion and Results Report."""

[[tools.search_passages.parameters]]
name = "country"
type = "string"
required = false
description = "Only passages of projects in this country, by its two-letter ISO code, such as KE or IN."

[[tools.search_passages.parameters]]
name = "sector"
type = "string"
required = false
description = "Only passages of projects in this sector of the pilot slice: water or transport."

[[tools.search_passages.parameters]]
name = "published_from"
type = "date"
required = false
description = "Only passages of documents that became public on or after this date."

[[tools.search_passages.parameters]]
name = "published_until"
type = "date"
required = false
description = "Only passages of documents that became public on or before this date."

[[tools.search_passages.parameters]]
name = "limit"
type = "integer"
required = false
description = "How many passages to return, from 1 to {passages.max_results}. Leave it out for {passages.results}."

[[tools.search_passages.parameters]]
name = "as_of"
type = "date"
required = false
description = """Use only documents public on or before this date, each in the version that was current \
then. Leave it out for today."""

[tools.search_passages.result]
row = "One passage, best first: its document, section, paragraph number, pages and text, with its place and score."
row_fields = ["evidence_id", "public_from", "source", "passage_id", "document_id", "document_type", "project_id",
              "version", "section_path", "paragraph", "paragraph_numbered", "part", "parts", "pdf_page",
              "last_pdf_page", "printed_page", "language", "parse_route", "header", "text", "rank", "score"]
source_fields = ["document_type", "project_id", "project_name", "document_id", "document_date", "report_number",
                 "version", "section_path", "paragraph", "paragraph_numbered", "pdf_page", "pdf_pages", "pdf_url"]
fields = ["query", "filters", "search"]
reasons = ["prompt_shields_hit", "not_screened", "ranked_below_limit"]
abstentions = ["no_match", "unknown_document_type", "unknown_sector"]
