# The tool registry: every tool the agent, the pages and the workflows call.
#
# This is the one place a tool is defined (spec, "Ten single places", item 2). The agent's tool
# list is generated from this file (strata.tools.registry.agent_tools), every call goes through
# strata.tools.registry.call, and strata.config.load_tools() reads it. Adding a tool is one entry
# here plus its adapter function.
#
# Each [tools.<name>] table has:
#   description   what the tool does and returns, for the agent, in full sentences
#   adapter       the Python function that runs it, as module:function
#   benchmark     the id of its question in evals/benchmark.yaml. Changing a tool's contract means
#                 updating that question in the same change (CLAUDE.md rule 4).
#   sources       the source registry's keys (config/sources.toml) whose rows it reads
#
# [[tools.<name>.parameters]], one table per parameter: name, type (string, date, integer, number
# or boolean), required, and a description for the agent. key = true marks an optional parameter that
# names the record a call is about, such as find_comparables' step_reference, so the summary's evidence
# id is keyed by it as it is by a required one. Every tool takes an optional as_of
# date (ADR 0002): it then uses only what was public on or before that date. The page's own as-of
# date applies to every call too, and the earlier of the two wins.
#
# A description names a value of config/thresholds.toml in braces, such as {passages.results},
# rather than writing its number: the agent's tool list fills it in, so the prompt and the tool
# always use the same number (CLAUDE.md rule 4).
#
# [tools.<name>.result], the shape of what it returns. Every result has the same envelope: tool,
# as_of, view, rows, coverage (matched, used, and why the rest were not used) and abstention
# (empty, or the reason the tool gives no rows). The table says:
#   row            what one row is
#   row_fields     the fields every row carries, always with evidence_id, public_from and source
#   source_fields  the fields of each row's source line
#   fields         the tool's own fields beside the envelope
#   reasons        every code a reason in a row's marks, or in the coverage line's list of what was
#                  not used, may have. The screens' copy writes one sentence per code, so a code is
#                  renamed here, in the tool and in the copy together.
#   abstentions    every reason the tool may give for returning no rows, for the same reason
#   abstentions_with_rows   the abstentions that still come with rows, such as find_comparables'
#                  too_few_comparables: no range, but every comparable. Any other abstention has none.
#   summary_fields the fields that hold derived figures the agent may state, such as a past range or a
#                  count. The registry returns them as one more citable record, the result's summary,
#                  with its own evidence id, so the verifier can back each figure (CLAUDE.md rule 1).
#   nested_rows    the row fields that hold records of their own, each with its own evidence_id and
#                  public_from, such as each side of a disagreement. The answer loop keeps each one as a
#                  citable record beside its row, so a claim can cite or quote it.
#   backs_advice   true when its rows are lessons or comparable packages, so a sentence of kind advice
#                  may rest on them (the verifier's check 5, ticket 24).
#   not_checked_when   when the check line's "Not checked" clause for this tool applies (web/src/copy.ts,
#                  checkLine.notCheckedClauses): "ran" (the default), or "cited" when it applies only once a
#                  sentence on screen cites the tool's evidence, as a lesson cited is not a lesson that fits.
#
# [tools.<name>.readiness], for a tool that answers a kind of question people ask. The Data
# readiness page lists each such kind under "What you can ask" (ticket 16):
#   kind           its key in web/src/copy.ts's dataReadiness.kinds, which holds its words
#   ready_for      the measure whose count goes in its "Ready for" cell: the readiness row's id
#                  (config/sources.toml), the measure's name and, when no column or check of that
#                  row shows the measure, counted_in, the table it counts, which its window names.
#                  Such a measure also needs its window's words in web/src/copy.ts's
#                  dataReadiness.measureWindows (web/tests/lint.spec.ts checks both).
#   draws_on       the readiness rows whose gaps hold its answers back

[tools.check_plan]
description = """Checks every activity in one implementing agency's Procurement Plan for a project. It \
checks the latest version unless you name one by its date. The checks are fixed. A package with no signed \
contract, estimated at or above the amount in the result's thresholds or with no estimate, is checked for a \
planned completion date that has passed. \
A signed amount is compared with its estimate, and the result says how late the contract was signed, measured \
from the first published planned date. A package still pending close to the project's closing date is marked. \
Weak records get data notes. It returns one row per activity in STEP's columns, with its marks (needs_a_look, \
watch, data_note) and the values behind each reason. How many activities the plan lists and how many carry each \
mark come back in the result's summary, which you cite for them. When World Bank staff saved one of the agency's versions \
as the baseline, the plan agreed at negotiations, the result names it, and each reason that states a delay also \
gives the delay from the baseline's planned date; the marks still come from the first published planned date. \
It reads only the plan's own record. It cannot see the \
prior-review queue, complaints, contract amendments or contract management reports."""
adapter = "strata.tools.check_plan:check_plan"
benchmark = "check-plan-nwwda-2026-10-09"
sources = ["documents", "projects"]

[tools.check_plan.readiness]
kind = "plan_check"
ready_for = { row = "plans", measure = "latest_activities_with_step_rows" }
draws_on = ["plans", "projects"]

[[tools.check_plan.parameters]]
name = "project_id"
type = "string"
required = true
description = "The project ID, P followed by six digits, such as P156634."

[[tools.check_plan.parameters]]
name = "implementing_agency"
type = "string"
required = true
description = """The implementing agency whose plan to check, as the plan's Executing Agency(ies) line \
names it, such as Northern Water Works Development Agency, or its agency_id from an earlier result."""

[[tools.check_plan.parameters]]
name = "plan_date"
type = "date"
required = false
description = "The version to check, by the plan's date. Leave it out to check the agency's latest version."

[[tools.check_plan.parameters]]
name = "as_of"
type = "date"
required = false
description = "Use only plan versions and project dates public on or before this date, and check as of it. Leave it out for today."

[tools.check_plan.result]
row = "One activity in the plan: its STEP fields as the plan gives them, its marks and the values behind each reason."
row_fields = ["evidence_id", "public_from", "source", "activity_reference_no", "section", "description",
              "review_type", "method", "market_approach", "estimated_amount_usd", "actual_amount_usd",
              "process_status", "signed_on", "planned_signing_on", "planned_signing_plan_date", "days_late",
              "planned_completion_on", "planned_completion_plan_date", "first_listing_confirmed",
              "actual_to_estimate", "marks"]
source_fields = ["document_type", "project_id", "implementing_agency", "plan_date", "document_id", "pdf_page"]
fields = ["plan", "project", "checks_run", "thresholds", "counts", "baseline"]
reasons = ["completion_passed_no_contract", "pending_near_closing", "pending_on_closing_day", "pending_after_closing",
           "signed_late_over_estimate", "signed_over_estimate", "method_differs_from_reference", "actual_amount_zero",
           "no_planned_date", "no_estimate"]
abstentions = ["unknown_project", "no_plan_from_agency", "no_plan_as_of", "version_not_found", "version_not_public",
               "no_activities"]
# The plan's counts (how many activities, how many need a look, are worth watching or carry a data note) are
# figures a Project Paper summary states (ticket 36), so they come back as one citable record, the summary.
summary_fields = ["counts"]

# project_signals (ticket 37): the fixed signals on a project that World Bank staff follow. The Following page
# and the mission brief writer read it, and ticket 41's Home reads the same result.
[tools.project_signals]
description = """Runs Strata's seven fixed checks on one active project's public records and says which found \
a reason to look. A signal is a reason to look, never a finding. The checks: an activity in an implementing \
agency's latest Procurement Plan passed its planned completion with no signed contract; a contract was signed \
at {plan_check.actual_to_estimate_ratio} times its estimate or more; a Direct Selection activity of \
US${signals.late_direct_min_usd} or more first appears in a plan published {signals.late_direct_months} months \
or less before the closing date, when the agency's previous plan does not list it; the loan history shows the \
closing date moved {signals.closing_moves_min} times or more; the latest ISR lists a restructuring of a level \
the result's thresholds name, dated in the last {signals.restructured_months} months; the latest ISR lowered \
the rating for progress towards the development objective or for overall implementation progress; and less \
than the share the result's thresholds name of the money committed and not canceled was disbursed, with \
{signals.disbursement_months} months or less left before closing. The plan checks read each agency's latest \
plan only when it is dated within {signals.plan_months} months of the as-of date. Each row is one check that \
fired, with how many activities, contracts, moves or ratings it fired on, the values its sentence states and \
the records it rests on, each with its own evidence id. The status is needs_a_look with \
{signals.look_min} signals or one strong signal, watch with fewer, no_signals when the checks that ran found \
nothing, and not_checked when none could run; the result says which checks could not run and why. Closed and \
pipeline projects are not checked. It never combines the checks into a score. Cite a record a signal rests \
on by its own evidence id. The status and the counts come back in the result's summary, which you cite for \
them. It cannot see the prior-review queue, complaints, contract amendments or contract management reports."""
adapter = "strata.tools.project_signals:project_signals"
benchmark = "project-signals-p156634"
sources = ["documents", "projects", "ida_credit_history", "ibrd_loan_history", "ida_credits", "ibrd_loans"]

[[tools.project_signals.parameters]]
name = "project_id"
type = "string"
required = true
description = "The project ID, P followed by six digits, such as P156634."

[[tools.project_signals.parameters]]
name = "as_of"
type = "date"
required = false
description = "Run the checks as they would have run on this date, on records public by then. Leave it out for today."

[tools.project_signals.result]
row = """One signal: the check that fired, whether it is strong, how many things it fired on, the values its \
sentence states and the records it rests on."""
row_fields = ["evidence_id", "public_from", "source", "check", "strong", "count", "values", "items"]
source_fields = ["source_key", "project_id", "document_id", "date", "evidence_id"]
fields = ["project", "status", "checks", "counts", "thresholds", "plans"]
reasons = ["no_plans", "no_recent_plans", "no_loan_history", "no_isr", "no_loans"]
abstentions = ["unknown_project", "not_active", "no_records"]
# The status and the counts are figures an answer may state ("it needs a look, with four signals").
summary_fields = ["status", "counts"]
# Each record a signal rests on (a plan row, a closing-date move, an ISR rating, a passage, a loan) is cited by
# its own evidence id, so an answer or a draft can cite the record and state its values.
nested_rows = ["items"]

# project_records (ticket 37): what the mission brief writer drafts from, part by part.
[tools.project_records]
description = """Returns the records a mission brief for one project is written from, in five parts: plans \
(each implementing agency's latest Procurement Plan, with how many activities it lists and how many need a look \
or are worth watching), awards (each contract signed after the latest ISR's date, with its supplier as the award \
record names it and the Estimated Amount of the latest plan that lists it), ratings (each ISR's ratings for \
progress towards the development objective and overall implementation progress), disbursement (each loan or \
credit's commitment, disbursed, undisbursed and canceled amounts in its newest snapshot) and closing (each month \
the loan history showed a new closing date, and each activity planned to finish after the closing date). Each \
row is one record with its part and its fields, cited by its own evidence id. The totals a sentence may state, \
such as how many contracts were signed and their total, the share of the money committed and not canceled that \
was disbursed, the days left before closing and how many times the closing date moved, come back in the result's \
summary, which you cite for them. A part with no records says why. It cannot see the prior-review queue, \
complaints, contract amendments or contract management reports."""
adapter = "strata.tools.project_records:project_records"
benchmark = "project-records-p156634"
sources = ["documents", "projects", "awards", "ida_credits", "ibrd_loans", "ida_credit_history", "ibrd_loan_history"]

[[tools.project_records.parameters]]
name = "project_id"
type = "string"
required = true
description = "The project ID, P followed by six digits, such as P156634."

[[tools.project_records.parameters]]
name = "as_of"
type = "date"
required = false
description = "Use only records public on or before this date. Leave it out for today."

[tools.project_records.result]
row = "One record behind a mission brief's part: its part, what it names and its fields by key."
row_fields = ["evidence_id", "public_from", "source", "part", "reference", "fields"]
source_fields = ["source_key", "document_type", "project_id", "document_date"]
fields = ["project", "isr", "parts", "unmatched_agencies", "totals"]
reasons = ["no_plans", "no_isr", "no_awards", "no_loans", "closed", "no_closing_date"]
abstentions = ["unknown_project"]
summary_fields = ["totals"]

# agency_track_record (ticket 36): how an implementing agency's past packages went against its plans, which the
# Project Paper summary writer states in counts.
[tools.agency_track_record]
description = """Says how one implementing agency's past packages went against its plans. It reads one version \
of the agency's Procurement Plan for a project, the latest unless you name one by its date, and for each \
activity compares the date its first published plan gave for signing the contract with the date the plan shows \
it signed. It counts the packages with both dates (n), how many were signed by the date first planned, how many \
were signed more than {agency_track_record.late_days} days after it, and how many are not signed although their \
date has passed. It gives the middle delay in days only from {agency_track_record.min_packages_for_middle} \
counted packages; with fewer it is null, and you give counts only. Signed means what the plan shows \
(signed_from); a package the plan shows unsigned while the awards dataset holds a signed contract comes back in \
differs_from_awards with that contract, so you say which source you counted and name the other. Each row is one \
activity, cited by its plan row's evidence id. The counts come back in the result's summary, which you cite for \
them. It never rates the agency or its procurement risk. It cannot see the prior-review queue, complaints, \
contract amendments or contract management reports."""
adapter = "strata.tools.agency_track_record:agency_track_record"
benchmark = "agency-track-record-nwwda-2026-10-09"
sources = ["documents", "projects", "awards"]

[[tools.agency_track_record.parameters]]
name = "project_id"
type = "string"
required = true
description = "The project ID, P followed by six digits, such as P156634."

[[tools.agency_track_record.parameters]]
name = "implementing_agency"
type = "string"
required = true
description = """The implementing agency, as its plan's Executing Agency(ies) line names it, such as Northern Water \
Works Development Agency, or its agency_id from an earlier result."""

[[tools.agency_track_record.parameters]]
name = "plan_date"
type = "date"
required = false
key = true
description = "The plan version whose activities to count, by its date. Leave it out for the agency's latest version."

[[tools.agency_track_record.parameters]]
name = "as_of"
type = "date"
required = false
description = "Use only plan versions and contracts public on or before this date. Leave it out for today."

[tools.agency_track_record.result]
row = """One activity in the agency's plan: its STEP reference, the date its first published plan gave for signing, \
the date the plan shows it signed, its delay, whether it counts as signed by that date, signed late, open past its \
date or not due yet, and any signing the awards dataset holds for it."""
row_fields = ["evidence_id", "public_from", "source", "step_reference", "description", "section", "method",
              "process_status", "first_planned_on", "first_planned_plan_date", "first_listing_confirmed", "signed_on",
              "delay_days", "state", "awards_signed_on", "awards_evidence_id"]
source_fields = ["document_type", "project_id", "implementing_agency", "plan_date", "document_id", "pdf_page"]
fields = ["agency", "plan", "signed_from", "differs_from_awards", "from_date", "to_date", "counts"]
reasons = ["not_signed", "no_planned_date"]
abstentions = ["unknown_project", "no_plan_from_agency", "no_plan_as_of", "version_not_found", "version_not_public",
               "no_activities"]
summary_fields = ["counts"]

[tools.search_passages]
description = """Searches the numbered passages of World Bank project documents (PADs, ISRs, ICRs, \
ICR Reviews, Project Papers and PPARs) and the scope and qualification text of procurement notices, by \
words and by meaning, and \
returns the best passages first. A passage is one numbered paragraph, or a part of a long one, with its \
document, section, paragraph number and PDF page, so a citation can point to it. Its kind says what it is: \
a paragraph (from the published text, or read by the layout parser from a scanned page), one row of a \
table with its cells, a table's summary, or a section of a notice's text with the notice's id. A table's \
summary is Strata's own words and never backs a number: cite the table's rows. Filter by project, \
document type, country, sector or the date a document became public. A report re-issued under the same \
number replaces its earlier version, unless the as-of date comes before the re-issue. When Prompt Shields \
found a prompt attack in a passage as it was read in, the passage is left out, and the coverage line says \
how many. Quote a passage only word for word, from its text."""
adapter = "strata.tools.search_passages:search_passages"
benchmark = "search-passages-icr-rebidding"
sources = ["documents", "projects"]

[tools.search_passages.readiness]
kind = "document_search"
ready_for = { row = "reports", measure = "passages_embedded", counted_in = "strata.gold.passage" }
draws_on = ["reports", "notice_text", "projects"]

[[tools.search_passages.parameters]]
name = "query"
type = "string"
required = true
description = "What to look for, in words, such as works estimates market rates rebidding."

[[tools.search_passages.parameters]]
name = "project_id"
type = "string"
required = false
description = "Only passages of this project, P followed by six digits, such as P130164."

[[tools.search_passages.parameters]]
name = "document_type"
type = "string"
required = false
description = """Only passages of this type of document: PAD, ISR, ICR, ICR Review, Project Paper or PPAR, \
or the documents API's full name, such as Implementation Completion and Results Report."""

[[tools.search_passages.parameters]]
name = "country"
type = "string"
required = false
description = "Only passages of projects in this country, by its two-letter ISO code, such as KE or IN."

[[tools.search_passages.parameters]]
name = "sector"
type = "string"
required = false
description = "Only passages of projects in this sector of the pilot slice: water or transport."

[[tools.search_passages.parameters]]
name = "published_from"
type = "date"
required = false
description = "Only passages of documents that became public on or after this date."

[[tools.search_passages.parameters]]
name = "published_until"
type = "date"
required = false
description = "Only passages of documents that became public on or before this date."

[[tools.search_passages.parameters]]
name = "limit"
type = "integer"
required = false
description = "How many passages to return, from 1 to {passages.max_results}. Leave it out for {passages.results}."

[[tools.search_passages.parameters]]
name = "as_of"
type = "date"
required = false
description = """Use only documents public on or before this date, each in the version that was current \
then. Leave it out for today."""

[tools.search_passages.result]
row = "One passage, best first: its document, section, paragraph number, pages and text, with its place and score."
row_fields = ["evidence_id", "public_from", "source", "passage_id", "document_id", "document_type", "project_id",
              "version", "section_path", "paragraph", "paragraph_numbered", "part", "parts", "pdf_page",
              "last_pdf_page", "printed_page", "language", "parse_route", "kind", "route", "scanned", "table_title",
              "table_row", "cells", "notice_id", "header", "text", "rank", "score"]
source_fields = ["document_type", "project_id", "project_name", "document_id", "document_date", "report_number",
                 "version", "section_path", "paragraph", "paragraph_numbered", "pdf_page", "pdf_pages", "pdf_url",
                 "doc_key", "notice_id", "notice_url"]
fields = ["query", "filters", "search", "ranked_lower"]
reasons = ["prompt_shields_hit", "not_screened", "ranked_below_limit"]
abstentions = ["no_match", "unknown_document_type", "unknown_sector"]

[tools.data_readiness_for]
description = """Says how fit each data source is to support answers, from Strata's data readiness \
measures: for each source, how many rows it holds and over how many fiscal years (coverage), how many \
link to projects, notices or STEP references (linked), how many pages were read without losing their \
paragraph numbers or table rows (read well), and when it was last fetched against how often it updates \
(fresh). It names the known gaps no dataset fills, such as the contract awards for fiscal 2017 to 2019, \
says which kinds of question each source is ready for and what holds them back, and ranks the fixes by \
how many projects each would add evidence to. Every number is the latest measure, as of the date. Name \
sources to see only the ones behind an answer. It gives no composite score."""
adapter = "strata.tools.data_readiness_for:data_readiness_for"
benchmark = "data-readiness-kenya-awards"
sources = ["awards", "awards_fy2001_2016", "ieg_ratings", "ida_credits", "ibrd_loans", "ida_credit_history",
           "ibrd_loan_history", "notices", "projects", "cpia", "wgi", "documents"]

[[tools.data_readiness_for.parameters]]
name = "sources"
type = "string"
required = false
description = """The source registry's keys of the sources to show, separated by commas, such as \
awards,notices. Leave it out for every source."""

[[tools.data_readiness_for.parameters]]
name = "from_tool"
type = "string"
required = false
description = """The tool whose coverage line named the sources, such as find_comparables, so the \
headline can say which answer they are behind. Leave it out when you name no sources."""

[[tools.data_readiness_for.parameters]]
name = "as_of"
type = "date"
required = false
description = "Use only measures taken on or before this date, and judge freshness as of it. Leave it out for today."

[tools.data_readiness_for.result]
row = """One measure behind the page: its latest count and denominator, or its date, for the source \
as a whole or summed over the projects it was measured for, with its share when it has enough rows: a \
whole percent, or about N in 10 for fewer rows, and whether a part rounds to an end of its scale."""
row_fields = ["evidence_id", "public_from", "source", "source_key", "measure", "kind", "subjects", "count",
              "denominator", "share_percent", "share_bound", "in_ten", "in_ten_exact", "as_of", "measured_on",
              "run_ids"]
source_fields = ["table", "source_key", "measure", "subjects", "measured_on", "counted_in"]
fields = ["filter", "sources", "kinds", "gaps", "fixes", "routes", "headline", "headline_abstention",
          "parse_failures", "measured", "stress_shelf"]
reasons = ["not_measured", "unknown_source"]
abstentions = ["no_measures", "before_first_measure", "unknown_sources"]

[tools.get_lessons]
description = """Returns the lessons in Strata's library: procurement lessons from Implementation Completion \
and Results Reports (ICRs), ICR Reviews and Project Performance Assessment Reports (PPARs), each quoted word \
for word with its page, that an accredited procurement specialist recommended and a different lead \
procurement specialist decided. Each lesson is at its current version, with its statement, its risk factors, \
stage and kind from fixed lists, the evidence ids of the passages its quotes are in, the edition of the \
procurement rules its project followed, and ieg_status: ieg_lesson when IEG wrote it, restated when IEG's \
review restated an ICR's lesson, not_restated when IEG's review is out and did not restate it, and awaiting \
when IEG has not reviewed the project yet. Lessons are ranked by fit to your query, then by the strength of \
their evidence, never by how often they were used; fit is the share of your query's words the lesson holds. \
Cite a lesson by its evidence id and its version, and quote only its quotes, word for word. Each quote is \
a passage with its own evidence id. Given comparable packages, it also counts the completion reports of \
their projects and how many of them raised each risk factor; those counts are in the result's summary, \
which you cite for them."""
adapter = "strata.tools.get_lessons:get_lessons"
benchmark = "get-lessons-cost-estimates"
sources = ["documents", "projects"]

[tools.get_lessons.readiness]
kind = "lessons"
ready_for = { row = "reports", measure = "lessons_verified", counted_in = "strata.silver.lesson_proposals" }
draws_on = ["reports", "projects"]

[[tools.get_lessons.parameters]]
name = "query"
type = "string"
required = false
description = "What the lessons should be about, in words, such as works estimates market rates rebidding. Leave it out to rank by evidence alone."

[[tools.get_lessons.parameters]]
name = "risk_factor"
type = "string"
required = false
description = "Only lessons tagged with this risk factor, by its key in the lesson lists, such as cost_estimates or permits_before_award."

[[tools.get_lessons.parameters]]
name = "stage"
type = "string"
required = false
description = "Only lessons about this stage of procurement, by its key, such as procurement_planning or contract_award."

[[tools.get_lessons.parameters]]
name = "limit"
type = "integer"
required = false
description = "How many lessons to return, from 1 to {lesson_review.get_lessons_max_results}. Leave it out for all of them, up to that many."

[[tools.get_lessons.parameters]]
name = "packages"
type = "string"
required = false
description = """Comparable packages, by STEP reference separated by commas, such as find_comparables matched \
for a package. With them, the result's reports count the completion reports (ICRs) of their projects that \
Strata read, say why the other projects have none, and count how many of those reports raised each risk \
factor, with the paragraph that raised it. Leave it out to count nothing."""

[[tools.get_lessons.parameters]]
name = "as_of"
type = "date"
required = false
description = """Use only lesson versions decided on or before this date, with evidence from documents public \
by then. Leave it out for today."""

