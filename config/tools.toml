[tools.compare_criteria]
description = """Compares a bidding document's qualification criteria, read into items such as similar \
experience or average annual turnover, with the comparable packages whose notices published theirs. It reads \
the scope and qualification text of each comparable's specific procurement notice, and never a package that \
was not signed by the as-of date, since that tender may still be open. Each row is one comparable whose \
