[tools.get_disagreements]
description = """Says where two sources disagree about a project or a package, and which one Strata leans on. \
An assertion is a dated claim a source made: a rating in an ISR, an ICR, an ICR Review, a PPAR, a PAD or the IEG \
ratings dataset, an account in a report of how the project was going at a named moment, or a contract's signing \
date or amount in the awards, an award notice or a Procurement Plan. A disagreement is two assertions about the same thing, for \
the same or an overlapping period, that cannot both be true. Each row gives both sides in the order they were \
written, each with its value or quote, its date, its evidence tier and its evidence id; the side Strata leans \
on and the id of the evidence ladder's rule that decided; and what you would \
treat as true if you kept the other side. Ratings of successive periods, such as one ISR after another, are \
a trajectory, not a disagreement, and come back under trajectories. A report re-issued under the same number \
replaces its earlier version, unless the as-of date comes before the re-issue. It also counts the assertions \
read from the project's reports that were left out because their quote was not word for word on the cited page. \
Cite a disagreement by its row's evidence id, and each side by the side's own evidence id: quote a side's words \
from its text. When Prompt Shields found a prompt attack in a side's passage as it was read in, or never screened \
it, the side comes without its text and its quote, and the coverage line says how many passages. The trajectories and the count of left-out assertions come back in the result's summary, which \
you cite for them. When an answer rests on one side of a disagreement, show both sides."""
adapter = "strata.tools.get_disagreements:get_disagreements"
benchmark = "get-disagreements-p130164"
sources = ["documents", "ieg_ratings", "awards", "awards_fy2001_2016", "notices"]

[[tools.get_disagreements.parameters]]
name = "subject_id"
type = "string"
required = true
description = """The project ID, P followed by six digits, such as P130164, for the disagreements about the \
project and its packages; or a package's STEP reference, such as KE-MOWASCO-307378-GO-RFB, for that package's."""

[[tools.get_disagreements.parameters]]
name = "attribute"
type = "string"
required = false
description = """Only disagreements and trajectories about this attribute, as the evidence ladder names it, such \
as pdo_progress for progress towards the PDO or signed_on for a contract's signing date. Leave it out for all \
of them."""

[[tools.get_disagreements.parameters]]
name = "as_of"
type = "date"
required = false
description = """Use only assertions whose sources were public on or before this date, each report in the \
version that was current then. Leave it out for today."""

[tools.get_disagreements.result]
row = """One disagreement: its subject, attribute and period, both sides in the order written, the side \
Strata leans on with the rule that decided, and what you would treat as true if you kept the other side."""
row_fields = ["evidence_id", "public_from", "source", "disagreement_id", "subject_kind", "subject_id", "project_id",
              "attribute", "attribute_kind", "period", "sides", "lean_assertion_id", "other_assertion_id", "rule_id",
              "if_you_keep"]
source_fields = ["table", "project_id", "subject_id", "evidence_ids"]
fields = ["subject", "trajectories", "rejected"]
# prompt_shields_hit and not_screened count passages, not disagreements: the sides whose passage's words the tool
# kept from the agent (strata.knowledge.shields), as search_passages counts the passages it leaves out.
reasons = ["replaced_by_later_version", "prompt_shields_hit", "not_screened"]
abstentions = ["unknown_subject", "unknown_attribute", "no_assertions"]
# The ratings of each trajectory, its runs and the count of left-out assertions are figures the agent may
# state, so they come back as one citable record too.
summary_fields = ["trajectories", "rejected"]
# Each side is the assertion as its source made it, under the evidence id of the passage or record it rests
# on, with the passage's text when it rests on one, so a claim can cite it or quote from it. A side whose passage
# Prompt Shields flagged or never screened has no text or quote, and its text_left_out names the reason.
nested_rows = ["sides"]

# The check-your-criteria tools (ticket 31): section 5 of the package workspace. Each takes the comparable
# packages find_comparables returned, by STEP reference, so the reference class is defined once (in
# find_comparables) and every count names it.

[tools.compare_cost_estimates]
description = """Compares the cost estimates of comparable packages with the amounts their contracts were \
signed for. A package's cost estimate is the Estimated Amount (US$) of the first version of its Procurement \
Plan that lists it with one, among the versions public on the as-of date: the cost estimate as first published, \
as delay is measured from the first published planned date. Its signed amount adds every contract it signed \
in the contract awards data, in US dollars, a joint venture's contract once. Each row is one comparable \
package with both amounts, with how far its signed amount was from its own cost estimate, in percent, \
positive above it, at one decimal up to 100 and none above. The result counts the packages signed above, \
below and at their cost estimates, and the lowest and highest cost estimate among them. Below \
{past_range.min_comparables} packages with both amounts it gives no quartiles and abstains, and still returns \
every package. The coverage line says how many comparables had no signed contract yet, no cost estimate in a \
Procurement Plan, or a signed amount only in a local currency. It also gives the package's own cost estimate: \
its plan row's Estimated Amount (US$), or the amount you give for a package that has no plan row. The counts, \
the band of cost estimates, the quartiles and the package's own cost estimate also come back in the result's \
summary, which you cite for them."""
adapter = "strata.tools.compare_cost_estimates:compare_cost_estimates"
benchmark = "compare-cost-estimates-ke-nwwda-541055"
sources = ["documents", "awards", "notices"]

[[tools.compare_cost_estimates.parameters]]
name = "comparables"
type = "string"
required = true
description = """The STEP references of the comparable packages, separated by commas, as find_comparables \
returned them."""

[[tools.compare_cost_estimates.parameters]]
name = "step_reference"
type = "string"
required = false
key = true
description = """The package's own STEP activity reference, such as KE-NWWDA-541055-CW-RFB, for its own cost \
estimate. Leave it out for a package that is not in a plan yet."""

[[tools.compare_cost_estimates.parameters]]
name = "estimate_usd"
