[tools.find_comparables]
description = """Finds the comparable packages for one package in a Procurement Plan, or for a package someone \
is planning that has no STEP row yet, and returns their past range: how long each took from its specific \
procurement notice to its signed contract. It reads notices and contract awards from every project, joined on \
the STEP reference, and picks comparables by stated criteria: method, category, market approach, review type, \
size band, region and period. Each criterion you leave out defaults from the package's plan row: its Method, its \
category and its project's country, with notices from {past_range.period_from} to the plan's date. With no \
step_reference, a criterion you leave out stays open, and notices run to the as-of date. Market approach, review type and size band stay open unless you \
give them, because a package still open has no review type or signed amount in any record. Write any to \
leave a criterion open. It returns one row per comparable, shortest first, with its days and months and \
whether it is still open, and a coverage line that says how many matching packages it could not use and why. \
Packages still open are kept as not signed yet (censored), so the range does not look shorter than it was. \
The past range is Kaplan-Meier: the months by which a quarter, half, three quarters and 8 in 10 of the \
comparables were signed. Below {past_range.min_comparables} comparables it gives no range and no share and \
abstains, and still returns every comparable. Above {past_range.quantile_dots_above} it also gives \
{past_range.quantile_dots} quantile dots, each an equal share of the curve, with the STEP references of the \
comparables it stands for, how many there are, how many are still open, and their shortest and longest months. \
The plan's own months, from its planned notice date to its planned \
signing date, come back with how many comparables were signed within them. The past range, the count signed \
within the plan's months, the numbers each "in 10" phrase states and the coverage counts also come back in the \
result's summary, which you cite for them. In it, frequencies.q80 holds the numbers "8 in 10" states. \
frequencies.plan says which words go with its numbers: fewer_than for "fewer than 1 in 10", about for "about N \
in 10" and more_than for "more than 9 in 10"."""
adapter = "strata.tools.find_comparables:find_comparables"
benchmark = "find-comparables-ke-nwwda-541055"
sources = ["notices", "awards", "documents", "projects"]

[[tools.find_comparables.parameters]]
name = "step_reference"
type = "string"
required = false
key = true
description = """The package's STEP activity reference, as its Procurement Plan writes it, such as \
KE-NWWDA-541055-CW-RFB. Leave it out for a package that is not in a plan yet, and give its criteria \
yourself."""

[[tools.find_comparables.parameters]]
name = "method"
type = "string"
required = false
description = """Only packages with this selection method, by the Procurement Regulations' name, such as \
Request for Bids. Leave it out for the package's own Method, or write any."""

[[tools.find_comparables.parameters]]
name = "category"
type = "string"
required = false
description = """Only packages in this procurement category: Works, Goods, Non-consulting Services or \
Consultant Services. Leave it out for the package's own category, or write any."""

[[tools.find_comparables.parameters]]
name = "market_approach"
type = "string"
required = false
description = "Only packages with this Market Approach, in STEP's words, such as Open - National. Leave it out to leave it open."

[[tools.find_comparables.parameters]]
name = "review_type"
type = "string"
required = false
description = "Only packages with this Review Type: Prior or Post. Leave it out to leave it open."

[[tools.find_comparables.parameters]]
name = "size_from_usd"
type = "number"
required = false
description = "Only packages whose signed contracts add up to at least this many US dollars. Leave it out to leave the size band open."

[[tools.find_comparables.parameters]]
name = "size_to_usd"
type = "number"
required = false
description = "Only packages whose signed contracts add up to at most this many US dollars. Leave it out to leave the size band open."

[[tools.find_comparables.parameters]]
name = "country"
type = "string"
required = false
description = """Only packages in this country, by its two-letter ISO code, such as KE. Leave it out for the \
package's own country, or write any."""

[[tools.find_comparables.parameters]]
name = "notice_from"
type = "date"
required = false
description = "Only packages whose specific procurement notice is dated on or after this date. Leave it out for {past_range.period_from}."

[[tools.find_comparables.parameters]]
name = "notice_to"
type = "date"
required = false
description = "Only packages whose specific procurement notice is dated on or before this date. Leave it out for the plan's date."

[[tools.find_comparables.parameters]]
name = "as_of"
type = "date"
required = false
description = """Use only notices, contracts and plan versions public on or before this date. A package signed \
after it comes back as still open. Leave it out for today."""

[tools.find_comparables.result]
row = """One comparable package: its notice, its signed contract or that it is still open, and its days and \
months from notice to signature, or so far."""
row_fields = ["evidence_id", "public_from", "source", "step_reference", "project_id", "country_code", "country_name",
              "notice_id", "notice_date", "signed_on", "still_open", "days", "months", "rank"]
source_fields = ["project_id", "notice_id", "contract_id", "award_notice_id", "signed_in"]
fields = ["package", "criteria", "counts", "past_range", "plan", "frequencies", "quantile_dots", "thresholds",
          "sources", "records_through"]
reasons = ["no_step_reference", "no_notice", "canceled", "signed_before_notice", "no_review_type",
           "no_market_approach", "no_amount"]
abstentions = ["unknown_package", "no_public_notice", "no_comparables", "none_measurable", "too_few_comparables"]
# An abstention listed here comes with rows: below the floor the tool gives no range, but still
# returns every comparable (the spec: "it returns every comparable and an abstention").
abstentions_with_rows = ["too_few_comparables"]
# The past range, the plan's count, the numbers its frequency phrases state ("8 in 10"), the counts and
# the coverage line are derived figures, so they come back as one citable record too (spec, "a derived
# figure the agent needs is returned as a column").
summary_fields = ["past_range", "plan", "frequencies", "counts", "coverage"]
# Its rows and summary are comparable packages, so advice may rest on them (the verifier's check 5, ticket 24).
backs_advice = true

[tools.estimate_time]
description = """Gives Strata's planned date for each STEP step of one package, from how its comparable packages \
went at each step: the steps STEP uses for the package's method family (goods, works and non-consulting services; \
consulting firms; or individual consultants), in STEP's order. For a package whose Procurement Plan gives planned \
dates, each step's date is the plan's date as first published plus how far comparable packages ran past their own \
first published dates at that step, because later plans can move them. For a package with no plan dates, each step \
counts from the one before, by how long that stretch took in comparable packages, starting from start_date, which \
the person gives; without it, it gives each step's days and no dates. Each step comes with two dates: the middle \
date, which half of the comparable packages ran later than, and the cautious date, the point by which a share of \
{time_estimate.step_cautious_share} of them had reached the step. It counts the comparable packages whose plans \
recorded the step and, for each date, how many ran later. Below {time_estimate.min_comparables} comparable packages \
for a step it gives that step no date and says why, and a later step that counts from it cannot be dated either. \
Below {time_estimate.min_comparables} comparable packages in all it gives no dates. It says which stage, up to the \
signed contract, ran longest in the most comparable packages, and the track record of the dates from the stored \
backtests. It never gives an actual date: it counts the steps STEP records actual dates for. The comparables are \
find_comparables' for the same criteria, which you give the same way. The dates, counts and track record come back \
in the result's summary, which you cite for them."""
adapter = "strata.tools.estimate_time:estimate_time"
benchmark = "estimate-time-ke-nwwda-541055"
sources = ["notices", "awards", "documents", "projects"]

