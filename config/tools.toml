is in, and, for each of your items it set, whether it asked for less than you, the same, more, or set it in \
other terms (such as more contracts of a smaller amount). Parts your items do not set are not compared. \
Amounts in another currency are not converted. Without items it counts the comparables whose criteria are \
public. The counts per item and the counts of packages also come back in the result's summary, which you \
cite for them. Quote a requirement only word for word, from its passage."""
