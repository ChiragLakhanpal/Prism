# The source registry: one entry per data source.
#
# This is the one place to add a data source (spec, "Ten single places", item 1): add one entry
# here and one silver transform. strata.config.load_sources() reads it and stops with a sentence
# when an entry is missing a key or has one it does not know.
#
# Each entry has these keys:
#
#   dataset_name      the dataset's name, word for word, for the attribution line
#   endpoint          where the source answers, with the query that every request shares
#   dataset_id        optional: the Finances One dataset id
#   resource_id       optional: the Finances One resource id
#   watermark_field   the field that says how new a record is. The search APIs sort by it, so a
#                     fetch stops at the first page older than what bronze already holds.
#   cadence           daily, weekly, monthly, quarterly, yearly or frozen
#   license           the license line for attribution
#   silver_transform  the module in src/strata/lakehouse/silver/ that types and cleans its pages,
#                     or, for a source its own reader fetches, the SQL file of its first transform
#   stratum           optional: What, How or Why (GLOSSARY.md)
#   known_gaps        optional: gaps the Data readiness page shows as Gap rows
#   limitations       optional: limits the Data readiness page shows as Partial
#
# The nightly job fetches a source page by page when its entry names these five keys. A source
# that its own reader fetches, such as documents (the plan reader), names none of them.
#
#   api               how pages are asked for: finances_one (top and skip) or search (rows and os,
#                     newest first by the watermark field)
#   records           the key that holds the records in each page
#   country_filter    the query text that limits a request to one country, with {iso2} or {name}
#   page_size         records per page
#   fixture_dataset   the [datasets] entry in data/fixture/sources.toml whose recorded files stand
#                     in for this source in the offline gate
#   ignore_keys       optional, for a source fetched page by page: keys left out of a page's
#                     content hash, such as the as_of_date that Finances One stamps on every row
#
# data/fixture/sources.toml is a different file: it lists the recorded copies of public pages that
# the offline gate reads in place of these endpoints.

# The countries whose records the nightly job fetches. P1 fetches Kenya. Adding a country is one
# entry; ticket 17 widens the fetch to every country.
[[countries]]
name = "Kenya"
iso2 = "KE"

[sources.awards]
dataset_name = "Contract Awards in Investment Project Financing (Since FY 2020)"
endpoint = "https://datacatalogapi.worldbank.org/dexapps/fone/api/apiservice?datasetId=DS00005&resourceId=RS00005&type=json"
dataset_id = "DS00005"
resource_id = "RS00005"
api = "finances_one"
records = "data"
country_filter = "filter=borrower_country_code%3D%27{iso2}%27"
page_size = 1000
watermark_field = "contract_signing_date"
ignore_keys = ["as_of_date"]
fixture_dataset = "awards"
cadence = "daily"
license = "CC BY 4.0"
silver_transform = "awards"
stratum = "What"
known_gaps = ["Awards for FY2017 to FY2019 are in neither awards dataset. Award notices fill most of the gap, in local currency."]
limitations = ["A joint venture appears as one row per member, with the contract amount split between them.", "INDIVIDUAL CONSULTANT stands for many people, each with their own supplier ID."]

[sources.notices]
dataset_name = "Procurement Notices"
endpoint = "https://search.worldbank.org/api/v2/procnotices?format=json"
api = "search"
records = "procnotices"
country_filter = "project_ctry_name={name}"
page_size = 500
watermark_field = "submission_date"
fixture_dataset = "notices"
cadence = "daily"
license = "CC BY 4.0"
silver_transform = "notices"
stratum = "What"
limitations = ["Notices give amounts in local currency.", "Contact names, addresses, emails, phone numbers and web addresses are removed when a page is fetched."]

[sources.projects]
dataset_name = "World Bank Projects & Operations"
endpoint = "https://search.worldbank.org/api/v3/projects?format=json&fl=*"
api = "search"
records = "projects"
country_filter = "countrycode_exact={iso2}"
page_size = 100
watermark_field = "proj_last_upd_date"
fixture_dataset = "projects"
cadence = "daily"
license = "CC BY 4.0"
silver_transform = "projects"
stratum = "What"
limitations = ["The projects API keeps only the latest ISR ratings."]

# Procurement Plan versions, and later every document of the slice, from the documents API. The
# plan reader (src/strata/lakehouse/plans.py) lists a project's documents here and fetches each
# plan's published text and PDF. Ticket 08 added it.
#
# The plan reader does not filter the list by disclosure_date yet: it fetches the whole list on each
# run, keeps it in bronze when it changed, and skips each plan whose document id bronze already
# holds. Its second silver transform is src/strata/lakehouse/sql/plans/plan_data_notes.sql, which
# runs after plan_step_delays.sql.
[sources.documents]
dataset_name = "Documents & Reports: Documents API"
endpoint = "https://search.worldbank.org/api/v3/wds"
watermark_field = "disclosure_date"
cadence = "daily"
license = "CC BY 4.0"
silver_transform = "src/strata/lakehouse/sql/plans/plan_step_delays.sql"
stratum = "How"
limitations = ["The published text scrambles Procurement Plan tables, so only some versions are read through the layout parser."]
