# The source registry: one entry per data source.
#
# This is the one place to add a data source (spec, "Ten single places", item 1): add one entry
# here and one silver transform. strata.config.load_sources() reads it and stops with a sentence
# when an entry is missing a key or has one it does not know.
#
# Each entry has these keys:
#
#   dataset_name      the dataset's name, word for word, for the attribution line
#   endpoint          where the source answers, with the query that every request shares
#   dataset_id        optional: the Finances One dataset id
#   resource_id       optional: the Finances One resource id
#   watermark_field   the field that says how new a record is. The search APIs sort by it, so a
#                     fetch stops at the first page older than what bronze already holds. For the
#                     Indicators API it is the page's lastupdated date.
#   cadence           daily, weekly, monthly, quarterly, yearly or frozen. The nightly job fetches
#                     a frozen source until a fetch task that finished holds its pages, and then
#                     stops asking for it.
#   license           the license line for attribution
#   silver_transform  the module in src/strata/lakehouse/silver/ that types and cleans its pages,
#                     or, for a source its own reader fetches, the SQL file of its first transform
#   stratum           optional: What, How or Why (GLOSSARY.md)
#   limitations       optional: what a person should know about the source, in full sentences
#   assertion_form    optional: the form of assertion each of its rows gives the evidence ladder
#                     (ticket 20). contract_record marks a dataset of signed contracts, whose signing
#                     dates and amounts become assertions about each package.
#
# What the Data readiness page and the Sources and licenses page show (ticket 16). Their words are
# read by people, so the gate's copy lint checks every text value in this file (web/lint/run.ts).
#
#   data_source, catalog_url, name_checked
#                     for a dataset, all three: the World Bank's [Data source] in the attribution
#                     line "The World Bank: [Dataset name]: [Data source]. License: CC BY 4.0.", the
#                     dataset's page in the World Bank's catalog, and the day dataset_name was
#                     checked against that page (docs/PLAN.md section 18). On October 23, 2026 each
#                     name matched its page word for word. Finances One lists "World Bank Group" as
#                     the source of its datasets; the awards and the notices name STEP as theirs, as
#                     DESIGN.md section 8's example does; CPIA comes through the World Development
#                     Indicators.
#   [[sources.<key>.readiness]]
#                     one row of the Sources table: id (unique in the file), label, noun (the
#                     source's records in the plural, for the gap sentences), optional stratum (the
#                     source's by default), covers (what the rows span, such as "since fiscal 2020")
#                     and schedule ("as published", for documents, which are never late). Then up to
#                     four columns, coverage, linked, read_well and fresh, each an inline table:
#                     measure (in strata.ops.data_readiness), counts (what the number counts, shown
#                     under it), noun (one counted thing, in the plural), counted_in (the table it
#                     counts), lack (for a share: what a row that falls short lacks) and, for
#                     coverage, years (the measure that counts its fiscal years), or, for a document
#                     collection, projects (the measure that counts the projects its documents belong
#                     to, shown as "documents for {projects} projects") and slice_read (the one that
#                     counts the pilot projects whose documents were read, out of the pilot projects,
#                     shown on its own line). counts_one and
#                     noun_one are their singular forms, for a count or a denominator of one. A
#                     STEP field name keeps a no-break space (\u00A0) where a narrow cell must not
#                     split it, as in Activity Reference\u00A0No. A
#                     paged source with no read_well shows "Published as a table", and a row with
#                     no fresh measure but a schedule shows the schedule. checks lists more
#                     measures whose shortfall holds answers back, in the same shape. routes lists a
#                     paged reader's reading routes, each with measure (the pages it read well),
#                     label (its name on the dashboard's chart of pages read well), noun and
#                     counted_in: the published text first, then the layout parser. A document row's
#                     Read well window splits its share into the two. published_as = "text" marks a
#                     row whose records arrive as text, such as notices' text, so its Read well cell
#                     says "Published as text". read_well_by_route = true marks a row whose Read well
#                     counts the same pages its routes do, so its window splits the share by route.
#   [[sources.<key>.known_gaps]]
#                     fiscal years no dataset publishes, shown as a Gap row under the source: id,
#                     label, noun, first_fiscal_year, last_fiscal_year and note
#   [[sources.<key>.declared]]
#                     a limit the source states about itself, which makes one cell Partial: column,
#                     note (shown under the number) and, when the source has two rows, row
#   [[sources.<key>.fixes]]
#                     what would close a gap: sentence (with {count}, {denominator} and {missing}
#                     from measure, and {fromYear} and {toYear} from the known gap it closes),
#                     measure, and projects, the measure that counts the projects the fix would add
#                     evidence to. Without projects, they are the measure's subjects (project IDs)
#                     that fall short. gap names the known gap a fix closes. noun is what measure
#                     counts, for its numbers' tooltips, when no column of the source shows it, and
#                     counted_in the table it counts. projects_counted_in is the table the projects
#                     measure counts, so each number's window names its table.
#   [[sources.<key>.collections]]
#                     for the documents source: each collection's name, publisher and origin, and language,
#                     the ISO 639-1 code of a name not written in English (config/languages.toml), which the
#                     page sets as the name's lang attribute (ticket 42)
#
# The nightly job fetches a source page by page when its entry names these keys. A source that its
# own reader fetches, such as documents (the plan reader), names none of them.
#
#   api               how pages are asked for: finances_one (top and skip), search (rows and os,
#                     newest first by the watermark field) or indicators (the Indicators API, by
#                     page and per_page, one indicator at a time)
#   records           the key that holds the records in each page. An indicators source needs none:
#                     the Indicators API sends each page as [about the page, records].
#   scope             every country (one series of pages with no country filter) or slice countries
#                     (the countries in config/slice.toml, each asked for on its own)
#   country_filter    for a source fetched for the slice countries: the query text that limits a
#                     request to one country, with {iso2}, {iso3} or {name}
#   indicators        for an indicators source: the indicator codes, each put where the endpoint
#                     says {indicator}
#   page_size         records per page
#   fixture_dataset   the [datasets] entry in data/fixture/sources.toml whose recorded files stand
#                     in for this source in the offline gate
#   ignore_keys       optional, for a source fetched page by page: keys left out of a page's
#                     content hash, such as the as_of_date that Finances One stamps on every row
#
# data/fixture/sources.toml is a different file: it lists the recorded copies of public pages that
# the offline gate reads in place of these endpoints.
#
# Structured data covers every country (docs/PLAN.md section 3, "Scope"). Only the monthly loan
# history follows the slice, so adding a country to config/slice.toml adds it there too.

# ── Contract awards ──────────────────────────────────────────────────────

[sources.awards]
dataset_name = "Contract Awards in Investment Project Financing (Since FY 2020)"
endpoint = "https://datacatalogapi.worldbank.org/dexapps/fone/api/apiservice?datasetId=DS00005&resourceId=RS00005&type=json"
dataset_id = "DS00005"
resource_id = "RS00005"
api = "finances_one"
records = "data"
scope = "every country"
page_size = 1000
watermark_field = "contract_signing_date"
ignore_keys = ["as_of_date"]
fixture_dataset = "awards"
assertion_form = "contract_record"
cadence = "daily"
license = "CC BY 4.0"
silver_transform = "awards"
stratum = "What"
limitations = ["A joint venture appears as one row per member, with the contract amount split between them.", "INDIVIDUAL CONSULTANT stands for many people, each with their own supplier ID."]

# What the Data readiness page and the Sources and licenses page show (ticket 16).
data_source = "Systematic Tracking of Exchanges in Procurement (STEP)"
catalog_url = "https://financesone.worldbank.org/contract-awards-in-investment-project-financing-(since-fy-2020)/DS00005"
name_checked = 2026-10-23

[[sources.awards.readiness]]
id = "awards"
label = "Contract awards"
noun = "contract awards since fiscal 2020"
covers = "since fiscal 2020"
coverage = { measure = "coverage_rows", counts = "award rows held", counts_one = "award row held", noun = "award rows", noun_one = "award row", counted_in = "strata.silver.awards", years = "coverage_years" }
linked = { measure = "linked_step_reference", counts = "contracts carry a STEP reference", counts_one = "contract carries a STEP reference", noun = "contracts", noun_one = "contract", lack = "a reference from Systematic Tracking of Exchanges in Procurement (STEP)", counted_in = "strata.gold.contract" }
fresh = { measure = "fresh_fetched", counts = "last fetched", noun = "fetches", counted_in = "strata.bronze.api_pages" }

[[sources.awards.known_gaps]]
id = "fy2017_2019"
label = "Contract awards"
noun = "contract awards"
first_fiscal_year = 2017
last_fiscal_year = 2019
note = "No World Bank dataset publishes contract awards for these years. Award notices cover most of them, in local currency."

[[sources.awards.fixes]]
