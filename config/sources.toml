# ── Documents ────────────────────────────────────────────────────────────

# Procurement Plan versions and every document of the slice, from the documents API. The plan reader
# (src/strata/lakehouse/plans.py) lists a project's documents here and fetches each plan's published
# text and PDF. Ticket 08 added it. The passage reader (src/strata/lakehouse/passages.py, tickets 11
# and 18) lists the same way and fetches the slice's reports of the types it has a template for
# (TEMPLATES in src/strata/reader/templates.py) with the plan reader's fetcher, and both send pages to the layout parser under one daily page cap.
#
# The nightly job's parse_and_embed task runs both readers (ticket 43). Each night it asks the documents
# API for each project's list, newest first, and keeps the list in bronze only when it changed. The
# watermark is the document itself: a document whose id bronze already holds is never fetched again,
# so only documents disclosed since the last run, or never fetched, reach the document host, and only
# their pages go to the layout parser and the embedder. The list is not asked by disclosure_date,
# because nobody has checked that the documents API filters on it (a follow-up for the workspace).
# Its second silver transform is src/strata/lakehouse/sql/plans/plan_data_notes.sql, which runs after
# plan_step_delays.sql.
[sources.documents]
dataset_name = "Documents & Reports: Documents API"
endpoint = "https://search.worldbank.org/api/v3/wds"
watermark_field = "disclosure_date"
# The seconds the job waits between two requests to documents.worldbank.org, which refused every request from
# one computer on October 25, 2026 after some hundreds of PDFs asked for back to back. Each answer is also kept in
# the bronze files volume, so no document is asked for twice. A value for the owner to confirm. The night's
# requests stop when its reading time, ingestion.document_host_minutes in config/thresholds.toml, is spent.
pause_seconds = 3
cadence = "daily"
license = "CC BY 4.0"
silver_transform = "src/strata/lakehouse/sql/plans/plan_step_delays.sql"
stratum = "How"
limitations = ["The published text scrambles Procurement Plan tables, so only some versions are read through the layout parser."]

# The documents source shows as three rows: the plan reader's Procurement Plans, the passage reader's
# reports, and the notices' text the passage reader reads (ticket 18). Each reader writes its own
# measures for each project (strata.ops.data_readiness).
# The plan measures count an activity once in each latest plan version that lists it, and one
# activity can sit in two agencies' latest plans, so their words say "activity entries".
[[sources.documents.readiness]]
id = "plans"
label = "Procurement Plans"
noun = "Procurement Plans"
stratum = "How"
schedule = "as published"
coverage = { measure = "plan_versions_read", counts = "plan versions read", counts_one = "plan version read", noun = "plan versions listed", noun_one = "plan version listed", counted_in = "strata.silver.plan_versions" }
linked = { measure = "step_rows_with_reference", counts = "plan rows in STEP's format with an Activity Reference\u00A0No.", counts_one = "plan row in STEP's format with an Activity Reference\u00A0No.", noun = "plan rows in STEP's format", noun_one = "plan row in STEP's format", lack = "an Activity Reference\u00A0No.", counted_in = "strata.silver.plan_rows" }
read_well = { measure = "latest_activities_with_step_rows", counts = "activity entries in the latest plan versions with rows in STEP's format", counts_one = "activity entry in the latest plan versions with rows in STEP's format", noun = "activity entries in the latest plan versions", noun_one = "activity entry in the latest plan versions", counted_in = "strata.silver.plan_rows" }
checks = [
  { measure = "latest_activities_with_confirmed_first_listing_read", counts = "activity entries in the latest plan versions whose confirmed first listing was read", noun = "activity entries in the latest plan versions", noun_one = "activity entry in the latest plan versions", lack = "a first listing I could confirm", counted_in = "strata.silver.plan_listings" },
]
routes = [
  { measure = "pages_read_route_a", label = "Plan pages, published text", noun = "plan pages with published text", counted_in = "strata.bronze.document_pages" },
  { measure = "pages_read_route_b", label = "Plan pages, layout parser", noun = "plan table pages", counted_in = "strata.bronze.layout_pages" },
]

# The passage reader's reports (tickets 11 and 18): the reports of each type TEMPLATES lists
# (src/strata/reader/templates.py) of the slice's projects and the projects the slice file names, read through either route. One row
# holds every type (a departure from the 18 brief's row per collection that design review r2 accepted;
# strata.ops.documents_read and the dashboard's tile 5 count them by type). Coverage counts the documents
# read and the projects they belong to, and on its own line the pilot projects read; Read well counts the
# pages read well across both routes, and its window splits them into the published text and the layout
# parser.
[[sources.documents.readiness]]
id = "reports"
label = "Project reports"
noun = "project reports"
stratum = "Why"
# What the row's documents are, on its own line under the projects it covers (ticket 58; the 18 design review, round 3,
# P2), in words that need no abbreviation spelled out.
covers = "appraisal, status and completion reports and reviews, Project Papers and Project Performance Assessment Reports"
schedule = "as published"
coverage = { measure = "documents_read", counts = "documents", counts_one = "document", noun = "documents", noun_one = "document", counted_in = "strata.silver.documents", projects = "documents_read_projects", slice_read = "slice_projects_read" }
linked = { measure = "passages_linked_to_project", counts = "passages with their project record", counts_one = "passage with its project record", noun = "passages", noun_one = "passage", lack = "a project record I hold", counted_in = "strata.gold.passage" }
read_well_by_route = true
read_well = { measure = "document_pages_read_well", counts = "pages read well", counts_one = "page read well", noun = "report pages", noun_one = "report page", counted_in = "strata.silver.document_page_routes" }
fresh = { measure = "documents_fresh", counts = "newest report", noun = "reports", counted_in = "strata.bronze.document_texts" }
checks = [
  # A check of what I found, so its gap says where I found none (not_found) rather than what the pages lack, and its
  # pages are named as a reader would, not "body pages" (ticket 58; the 18 critique, round 3).
  { measure = "document_pages_paragraph_numbering_found", counts = "pages of the reports' main text with their paragraph numbers found", counts_one = "page of a report's main text with its paragraph numbers found", noun = "pages of the reports' main text", noun_one = "page of a report's main text", not_found = "paragraph numbers", counted_in = "strata.silver.passages" },
]
routes = [
  { measure = "document_pages_read_route_a", label = "Report pages, published text", noun = "report pages of published text", counted_in = "strata.bronze.document_pages" },
  { measure = "document_pages_read_route_b", label = "Report pages, layout parser", noun = "report pages sent to the layout parser", counted_in = "strata.bronze.layout_pages" },
]

# Notices' scope and qualification text, which the passage reader reads into passages from
