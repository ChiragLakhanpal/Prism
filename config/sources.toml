# ── The search APIs: procurement notices and projects ────────────────────

[sources.notices]
dataset_name = "Procurement Notices"
endpoint = "https://search.worldbank.org/api/v2/procnotices?format=json"
api = "search"
records = "procnotices"
scope = "every country"
page_size = 500
watermark_field = "submission_date"
fixture_dataset = "notices"
cadence = "daily"
license = "CC BY 4.0"
silver_transform = "notices"
stratum = "What"
limitations = ["Notices give amounts in local currency.", "Contact names, addresses, emails, phone numbers and web addresses are removed when a page is fetched."]

# The projects API answers with every field unless asked for some, and the full record is many
# times larger, so the endpoint names the fields that silver reads. It sends project_abstract anyway.
[sources.projects]
dataset_name = "World Bank Projects & Operations"
endpoint = "https://search.worldbank.org/api/v3/projects?format=json&fl=id,project_name,countrycode,countryshortname,regionname,status,boardapprovaldate,closingdate,impagency,borrower,sectorcode,major_sector_name,major_sectors,curr_total_commitment,totalamt,public_disclosure_date,proj_last_upd_date,loan_transactions,isr_ratings"
api = "search"
records = "projects"
scope = "every country"
page_size = 100
watermark_field = "proj_last_upd_date"
fixture_dataset = "projects"
cadence = "daily"
license = "CC BY 4.0"
silver_transform = "projects"
stratum = "What"
limitations = ["The projects API keeps only the latest ISR ratings, and lists some of them twice. I keep each rating once."]

# ── Governance indicators: CPIA and WGI ──────────────────────────────────

# CPIA: every IQ.CPA code on the Indicators API (21 on October 23, 2026). CPIA covers IDA countries only.
[sources.cpia]
dataset_name = "World Development Indicators: Country Policy and Institutional Assessment"
endpoint = "https://api.worldbank.org/v2/country/all/indicator/{indicator}?format=json"
api = "indicators"
indicators = [
  "IQ.CPA.BREG.XQ", "IQ.CPA.DEBT.XQ", "IQ.CPA.ECON.XQ", "IQ.CPA.ENVR.XQ", "IQ.CPA.FINQ.XQ", "IQ.CPA.FINS.XQ",
  "IQ.CPA.FISP.XQ", "IQ.CPA.GNDR.XQ", "IQ.CPA.HRES.XQ", "IQ.CPA.IRAI.XQ", "IQ.CPA.MACR.XQ", "IQ.CPA.PADM.XQ",
  "IQ.CPA.PRES.XQ", "IQ.CPA.PROP.XQ", "IQ.CPA.PROT.XQ", "IQ.CPA.PUBS.XQ", "IQ.CPA.REVN.XQ", "IQ.CPA.SOCI.XQ",
  "IQ.CPA.STRC.XQ", "IQ.CPA.TRAD.XQ", "IQ.CPA.TRAN.XQ",
]
scope = "every country"
page_size = 1000
watermark_field = "lastupdated"
fixture_dataset = "cpia"
cadence = "yearly"
license = "CC BY 4.0"
silver_transform = "indicators"
stratum = "What"
limitations = ["CPIA scores exist for IDA countries only.", "When the API revises a score, I keep both versions, and a join on a past date uses the version public then.", "A score I fetch for the first time counts as public from the day the API last updated it, so I have no score for dates before that day."]

# WGI: the estimate of each of the six dimensions (source 3). The old GE.EST codes no longer work.
[sources.wgi]
dataset_name = "Worldwide Governance Indicators"
endpoint = "https://api.worldbank.org/v2/country/all/indicator/{indicator}?format=json&source=3"
api = "indicators"
indicators = ["GOV_WGI_CC.EST", "GOV_WGI_GE.EST", "GOV_WGI_PV.EST", "GOV_WGI_RL.EST", "GOV_WGI_RQ.EST", "GOV_WGI_VA.EST"]
scope = "every country"
page_size = 1000
watermark_field = "lastupdated"
fixture_dataset = "wgi"
cadence = "yearly"
license = "CC BY 4.0"
silver_transform = "indicators"
stratum = "What"
limitations = ["When the API revises a score, I keep both versions, and a join on a past date uses the version public then.", "A score I fetch for the first time counts as public from the day the API last updated it, so I have no score for dates before that day."]

# ── Documents ────────────────────────────────────────────────────────────

# Procurement Plan versions, and later every document of the slice, from the documents API. The
# plan reader (src/strata/lakehouse/plans.py) lists a project's documents here and fetches each
# plan's published text and PDF. Ticket 08 added it.
#
# The plan reader does not filter the list by disclosure_date yet: it fetches the whole list on each
# run, keeps it in bronze when it changed, and skips each plan whose document id bronze already
# holds. Its second silver transform is src/strata/lakehouse/sql/plans/plan_data_notes.sql, which
# runs after plan_step_delays.sql.
[sources.documents]
dataset_name = "Documents & Reports: Documents API"
endpoint = "https://search.worldbank.org/api/v3/wds"
watermark_field = "disclosure_date"
cadence = "daily"
license = "CC BY 4.0"
silver_transform = "src/strata/lakehouse/sql/plans/plan_step_delays.sql"
stratum = "How"
limitations = ["The published text scrambles Procurement Plan tables, so only some versions are read through the layout parser."]
