measure = "gap_years_contracts_in_local_currency"
projects = "gap_years_projects_in_local_currency"
noun = "contracts in local currency"
counted_in = "strata.gold.contract"
projects_counted_in = "strata.gold.contract"
sentence = "Convert the {count} contracts in award notices for fiscal {fromYear} to {toYear} from local currency to US dollars, so they can be compared with the awards datasets."

