# The upload and STEP row registry (ticket 38; CLAUDE.md rule 9): what an implementing agency's private upload
# of its Procurement Plan may be, the STEP columns Prism reads from it, and the columns of the STEP rows CSV a
# draft of planned dates exports. strata.config.load_uploads() reads it, and src/strata/reader/step_columns.py
# turns it into STEP's column names. Changing the layout Prism reads or writes is a change here.
#
# STEP's names are not written here. Each column is named by its key in src/strata/reader/step.py's COLUMNS,
# which holds STEP's descriptive columns word for word and in STEP's order, and each step comes from STEPS there
# and from the step-label registry (web/src/steps.ts), so every name is defined once (CLAUDE.md rule 4).
#
# The STEP export question (docs/PLAN.md section 18), settled on October 25, 2026:
#
# - Whether STEP exports a plan to Excel could not be confirmed. STEP's own help sits behind its sign-in, and a
#   web search of the World Bank's public pages found no description of an export. The Procurement Plan
#   template the World Bank publishes (the "Textual Part", September 2025) holds no table: its text says the plan
#   tables live in STEP. No Excel file from STEP is recorded, so no parsed sample exists.
# - So Prism reads the fallback: the columns of the plan tables STEP prints in every published Procurement Plan,
#   which src/strata/reader/step.py records word for word from the fixture's plans. A file may set them out as
#   the published plans do (a section title such as WORKS, a header row of column and step names, then a row of
#   Planned and Actual under each step), or in one header row that writes each step column as
#   "{step} (Planned)" or "{step} (Actual)", which is the layout the STEP rows CSV uses. Activity Reference
#   No. / Description may come as STEP's one column, or as its two halves, "Activity Reference No." and
#   "Description". Every sheet is read, and a sheet may hold several tables.
# - The French Procurement Plan template's column names are not recorded, so no French alias is listed. Adding
#   them is one list under [aliases], copied from a recorded template, never written from memory.
#
# [uploads]
#   accept          the file name endings a person may choose, which the file field offers
#   max_size_bytes  the largest file Prism reads
#   max_rows        the most activities one upload may list
#   max_unzipped_bytes  the most an Excel file may hold once unzipped; a larger one is refused as unreadable
#   max_columns     the last column Prism reads on a sheet; a cell further right is left unread, so a file cannot
#                   make every row as wide as Excel's 16,384 columns
#   format          which hint the upload page shows: step_export when a STEP export is confirmed, or
#                   published_tables when Prism reads the published tables' columns (the answer above)
#
# [columns.<key>], one per key of step.py's COLUMNS, in its order:
#   need     true when the reading stops without it. Activity Reference No. / Description is needed, or its
#            Description half, and so is Method, which picks the activity's steps.
#   csv      what the STEP rows CSV does with it: copied (the officer's value, unchanged), left (empty for people
#            and STEP: references, actual amounts, statuses and ratings), or split (Activity Reference No. /
#            Description, written as its two halves, the reference left empty and the Description copied, so a
#            row can be matched by its place in the file and its Description)
#
# [steps]
#   planned  what the CSV does with each step's Planned column: planned, filled with the checked choice's date
#   actual   and with each step's Actual column: left
#   one_row  the one-row header of a step column, with {step} and {head} (Planned or Actual, STEP's words)
#
# The CSV lists every step of every family, in step.py's STEPS order, so one file holds every section; a step
# outside an activity's family is left empty on its row. It has one header row, because a second row would
# break a paste into STEP's columns. Its dates are written as YYYY-MM-DD, as STEP's published tables print them.
#
# [aliases], more header names for a column, by its key or by activity_reference_no and description (the two
# halves). A header matches a name or an alias whatever its case, spaces and line breaks.

# [field_photos] (ticket 150), the photos a World Bank staff member adds to a project's Deep research tab, which only
# the uploader's team sees. strata.config.load_field_photos() reads it.
#   accept            the file name endings a person may choose; Prism keeps a JPEG or a PNG, whatever the name says
#   max_size_bytes    the largest photo Prism keeps
#   max_per_project   the most photos one team keeps for one project
#   max_caption       the longest caption, in characters
#   nearest_place_km  how far a photo's position may be from a project location and still be named after it
#   volume            where the files are kept on the workspace: a Unity Catalog volume, written as the app
#   folder            where they are kept on this computer: a folder beside the app state's DuckDB file
#   label, license    the source line a field photo carries in the brief

[uploads]
accept = [".xlsx", ".csv"]
max_size_bytes = 5_242_880
max_rows = 500
max_unzipped_bytes = 26_214_400
max_columns = 300
format = "published_tables"

[columns.activity]
need = true
csv = "split"

[columns.loan_credit_no]
csv = "copied"

[columns.component]
csv = "copied"

[columns.review_type]
csv = "copied"

[columns.method]
need = true
csv = "copied"

[columns.market_approach]
csv = "copied"

[columns.procurement_process]
csv = "copied"

[columns.prequalification]
csv = "copied"

# A risk rating the officer and the World Bank set together, so Prism never fills it.
[columns.high_sea_sh_risk]
csv = "left"

[columns.procurement_document_type]
csv = "copied"

[columns.contract_type]
csv = "copied"

[columns.estimated_amount_usd]
csv = "copied"

# STEP records the signed amount and the status as the process moves, so the CSV leaves both to STEP.
[columns.actual_amount_usd]
csv = "left"

[columns.process_status]
csv = "left"

[steps]
planned = "planned"
actual = "left"
one_row = "{step} ({head})"

[aliases]

[field_photos]
accept = [".jpg", ".jpeg", ".png"]
max_size_bytes = 10_485_760
max_per_project = 20
max_caption = 500
nearest_place_km = 25
volume = "/Volumes/strata/ops/field_photos"
folder = "field_photos"
label = "Field photos from World Bank staff"
license = "Official Use Only: taken by World Bank staff and visible to the uploader's team."
