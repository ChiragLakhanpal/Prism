# The item registry: the kinds of requirement section 5 of the package workspace compares, "Check your criteria"
# (ticket 31; the 31 brief, section 4.7).
#
# This is the one place an item kind is defined (CLAUDE.md rule 9). The criteria reader is told these keys, the
# app checks each item it reads against them, compare_criteria finds each item in comparable notices by its
# synonyms, rejected_bids groups each rejection reason under the first item whose synonyms it holds, and the
# screen names each item by its label. strata.config.load_criteria_items() reads it, and the gate's copy lint
# checks every label and phrase as it checks the copy file. Adding an item is one entry here.
#
# Each [[items]] table has:
#   key           a stable id, also the screen's in-page anchor (#rejected-{key})
#   label         its name on screen, in sentence case
#   phrase        the item inside a sentence, in lower case
#   is_criterion  true for a qualification requirement a bidding document sets; false for a kind that only
#                 groups rejection reasons
#   synonyms      the words notices and award notices use for it, matched whole and whatever their case.
#                 They are never shown on screen. A notice's requirement is a sentence that holds one.
#   parts         what a requirement of this kind can measure, each compared on its own: contracts (how many),
#                 amount (a minimum amount, in its currency), window_years (the years a contract must fall
#                 within, where more years asks for less) and years (a minimum number of years)
#
# The order matters twice: a reason goes to the first item whose synonyms it holds, so the more specific items
# come first, and groups with as many packages come in this order. "other" holds every reason no item names.
# The labels and phrases are the 31 brief's; synonyms were read from the fixture's notices and award notices
# (data/fixture/recorded/api/notices), such as "similar assignments" and "key experts".
#
# [requirements].cues: a notice sentence that holds an item's synonym sets a requirement only when it, or the
# heading of the notice section it sits in, also holds one of these words, so a scope sentence such as "supply
# and installation of equipment" is never read as a requirement. "qualified" is not a cue: every works notice
# invites "eligible and qualified bidders". Read from the same notices: their short-listing
# criteria and qualification text.

[requirements]
cues = ["qualification", "qualifications", "criteria", "at least", "minimum", "must have",
        "should have", "requirement", "requirements", "demonstrate", "demonstration", "has been involved"]

[[items]]
key = "similar_experience"
label = "Similar experience"
phrase = "similar experience"
is_criterion = true
synonyms = ["similar experience", "specific experience", "similar assignment", "similar assignments", "similar nature",
            "similar projects", "similar contracts", "similar works", "similar size", "similar contract"]
parts = ["contracts", "amount", "window_years"]

