# The thresholds file: every threshold a check, a signal or a computed value uses.
#
# This is the one place to change a threshold (spec, "Ten single places", item 3). Each ticket that
# needs a threshold adds it under its section, with a comment that names its source. Code reads a
# value with strata.config.load_thresholds().value("section.name"). A value that is missing here is
# an error that says where to add it, never a silent default.

# These are the ingestion caps. The layout parser (Route B) tries at most this many PDF pages a
# day, counted in UTC across every project, whether it reads the page or fails on it. A run that
# reaches the cap stops and records the first page it left for the next day in
# strata.ops.parse_runs. Source: the spec's "Platform, identity and limits" (a daily page cap in
# ingestion holds Azure and workspace spend). 500 is a starting value for the owner to confirm;
# ticket 18 sets it for the whole document slice.
[ingestion]
# The most pages the layout parser (Route B) may try in one day, in UTC, across every project and both
# readers, the plan reader and the passage reader (src/strata/lakehouse/plans.py, parse_pages). A page
# it tried counts whether it read it or not. Source: docs/PLAN.md section 5. Ticket 18 keeps 500 for
# the whole document slice, a value for the owner to confirm: at 500 a day, the slice's Route B pages
# take days to read the first time, and later runs parse only changed pages.
daily_page_cap = 500
# The most pages the layout parser reads of one document in one part. A longer document is read in
# parts of this many pages, every page keeping its number in the whole PDF. The live parser gets each
# page as a PDF of its own, so a part's pages go one at a time. Source: ticket 18 ("a document over
# 500 pages ... divided past the parser's limit"); a value for the owner to confirm.
parser_part_pages = 500
# The share of their words that the words read for a page, by the layout parser or from the published
# text, and the words of the PDF page with that number must share for the stress shelf to call its
# page number right (src/strata/lakehouse/stress_shelf.py, over_parser_limit). Half allows for the
# parser's reading order and for running heads. A value for the owner to confirm.
page_match_shared_words = 0.5
# The passage reader (src/strata/lakehouse/passages.py) reads at most this many documents whose
# published text Route A can read: the slice file's named projects first (the showcase, the demo plan
# and the stress shelf's), then the projects the slice criteria select, each project's ICR Reviews,
# ICRs, PADs and ISRs in that order, newest first. Ticket 11 read the first 20; ticket 18 raises it to
# cover the whole document slice: docs/PLAN.md section 3 plans 128 projects, and a project rarely has
# more than 40 such reports. A value for the owner to confirm.
passage_documents = 5000

# Structured data for every country stays under 0.5 GB (docs/PLAN.md section 3, "Scope"): every
# table but the documents' text, layout, passages and vectors, as strata.ops.table_sizes records
# each run.
structured_data_limit_bytes = 500_000_000

# Passages (docs/PLAN.md section 5). A paragraph over max_tokens tokens is divided at sentence ends,
# and each part is its own passage with the paragraph's number. Source: the spec's "Reading
# documents" ("Paragraphs over 500 tokens are divided at sentence ends").
[passages]
max_tokens = 500
# search_passages returns this many passages unless the call asks for another number, and never more
# than max_results. Source: the spec's retrieval evaluation reports precision at 10, and the agent
# gets at most three rounds of tool results. Starting values for the owner to confirm.
results = 10
max_results = 20
# search_passages asks the searcher for max_results times this many passages, so the passages it
# leaves out (a prompt attack, or no Prompt Shields result) can drop out and still leave enough.
# Source: none yet; a starting value for the owner to confirm.
search_depth = 2

# The answer loop (src/strata/agent/loop.py). The agent gets at most this many rounds of tool results
# for one question; a tool call it asks for after that is not run, and it answers from what it has.
# Source: the spec's "The agent and the answer contract" ("this repeats for at most three rounds").
[agent]
tool_rounds = 3

# The app (ticket 06). Every warehouse query the server runs as a viewer, the plan check's included,
# gives up after stamp_timeout_seconds. The data-freshness stamp then shows its error state, and the
# plan check answers 503. Source: the 06 design brief ("Error (timeout
# after 30 seconds, set in the app config, or a server error)"). Usage events wait at most
# usage_flush_seconds before the server writes them to strata.ops.usage_events in one insert, so a
# page never waits for the warehouse to log it; 10 is a starting value for the owner to confirm.
[app]
stamp_timeout_seconds = 30
usage_flush_seconds = 10

# App state (docs/PLAN.md section 18; docs/app-state.md). The Lakebase probe times a write and then
# a read of one row, ten times, in strata.ops through the SQL warehouse and in a Lakebase database.
# Lakebase wins only when strata.ops's middle time is over this budget and Lakebase's is within it.
# Source: one second is the limit for a person's flow of thought (Nielsen, "Response Times: The 3
# Important Limits", 1993); following a project or checking a draft must feel immediate.
[app_state]
round_trip_budget_ms = 1000

# Plan-check thresholds (ticket 09). check_plan (src/strata/tools/check_plan.py) reads them, returns
# the values it used, and the Check a plan screen fills its definition of each mark from them.
# Source: the ticket's fixed checks and the blueprint's Check a plan wireframe. Each value is a
# starting value for the owner to confirm.
[plan_check]
# Needs a look: an activity with no signed contract whose planned completion passed. The planned
# completion is the first published planned date of its Contract Completion step. Only activities
# estimated at this many US dollars or more get this mark, so the mark stays on the packages where
# a missed date matters most. A smaller activity still pending near closing gets Watch from
# days_before_closing. The wireframe marks the US$1,230,000.00 package and leaves the
# US$295,000.00 one, whose planned completion also passed, to the closing-date check.
completion_passed_min_estimated_usd = 1_000_000
# Watch: an activity with no signed contract that is still pending this many days or fewer before
# the project's closing date, or after it.
days_before_closing = 90
# Watch: a signed amount at least this many times its estimate, "far above the estimate". The
# reason also says how many days after its first published planned date the contract was signed.
# A late signing alone is not marked: most signings are late (about 22% of 656 works contracts in
# STEP were signed on their planned date, in the World Bank's procurement delay study,
# documents.worldbank.org, 099062824153516589), so a mark on each would hide the exceptions.
actual_to_estimate_ratio = 2.0

# The past range (ticket 12). find_comparables (src/strata/tools/find_comparables.py) reads these,
# returns the values it used, and the package workspace's range chart takes them from its result,
# so no screen writes one of these numbers itself.
[past_range]
# Below this many comparables, subgroups included, no tool returns a range or a share: it returns
# every comparable and says why. Source: the spec ("Below 20 comparables, subgroups included, no
# tool returns a range or a percentage") and DESIGN.md section 7, rules 6 and 15.
min_comparables = 20
# Above this many comparables the chart draws quantile_dots dots, each standing for an equal share
# of the packages, instead of one dot per package. Source: the spec and DESIGN.md section 6 ("Above
# about 60 comparables, the past range switches to 20 quantile dots").
quantile_dots_above = 60
quantile_dots = 20
# The default period starts here: the first day of the awards dataset since FY2020, which most
# signing dates come from. It ends on the plan's date. Source: tests/ground_truth/values.toml's
# default criteria for the comparables.
period_from = 2019-07-01
# The plan's months a reader can type or drag to, from 0.5 up to this. Source: the 12 design brief,
# a starting value for the owner to confirm.
max_plan_months = 60
# Whether a canceled package counts as still open (drawn hollow and kept in the range as not signed
# yet) or is left out and named in the coverage line. A canceled package is not open, and its
# months "so far" would run to the as-of date, so it is left out. Source: ticket 12's decision,
# parked for the owner to confirm; the blueprint's table of estimates keeps canceled packages as
# still open, and true here does the same.
canceled_as_still_open = false
# A package with this Method, or with a Market Approach that starts with one of these words, has no
# specific procurement notice, so its procurement cycle time cannot be measured. Source: the
# Procurement Regulations: a limited market approach and Direct Selection are not advertised.
no_notice_methods = ["Direct Selection"]
no_notice_market_approaches = ["Limited"]

# Signals on followed projects: late direct selection, closing-date moves, rating downgrades,
# disbursement lag, and the "Needs a look" rule of three signals or one strong one (ticket 37).
[signals]

# The review thresholds that compute review type (ticket 15).
[review]

# The market approach thresholds, per country (ticket 15).
[market_approach]

# The PPSD guidance's Table I thresholds, which decide when the Long Form applies (ticket 36).
[ppsd_table_i]

# When a data readiness measure counts as Partial or Gap (ticket 16; the 16 design brief, section 4).
# data_readiness_for (src/strata/tools/data_readiness_for.py) reads them, and the dashboard's Data
# readiness page uses the same values. Each is a starting value for the owner to confirm.
[data_readiness]
# Partial: a linked share, a read-well share, or the share of a readiness row's checks, under these.
linked_min_share = 0.9
read_well_min_share = 0.9
check_min_share = 0.9
# A share is written only from this many rows; below it, a cell shows the count alone ("6 of 12"),
# as DESIGN.md section 7, rules 6 and 15 say. web/src/lib/format.ts's FEWEST_FOR_A_FREQUENCY holds
# the same rule until ticket 12 reads it from here, and tests/test_data_readiness.py checks they agree.
fewest_for_a_share = 20
# From this many rows a share is a whole percent ("528 of 603, 88%"); from fewest_for_a_share up to
# it, "about N in 10" (DESIGN.md section 7, rule 15). The dashboard charts a share only from here.
# format.ts's FEWEST_FOR_A_PERCENTAGE holds the same value until ticket 12, and the test checks it.
fewest_for_a_percentage = 50
# Partial when late: a source's latest fetch is older than its schedule allows plus this many days.
# Daily data are on time when they are less than two days old.
late_grace_days = 1
# How many days each cadence in the source registry allows between fetches. A frozen source, and a
# readiness row whose schedule is "as published", are never late.
schedule_days = { daily = 1, weekly = 7, monthly = 31, quarterly = 92, yearly = 366 }

# Supplier matching: when a pair merges, goes to the model or goes to a person (ticket 19). A STEP
# supplier ID decides first; only a row with no ID is matched by name (docs/PLAN.md section 5). Each
# candidate pair gets Splink's match probability from the name-matching model in config/models.toml's
# [supplier_matching], and these values route it. strata.knowledge.suppliers.resolve reads them, and
# strata.knowledge.suppliers.quality and the labeling tool (src/strata/server/suppliers.py) read the
# precision target and the labeled-pair counts.
[supplier_matching]
# A pair below this probability is not kept as a candidate at all. Source: none yet; a starting
# value for the owner to confirm. It keeps the weak pairs a person may still label.
candidate_min_probability = 0.01
# A pair from this probability up to auto_merge_min_probability goes to the model, which decides
# merge or no merge. A pair below it is kept apart. Source: the spec's "a model adjudicates the
# uncertain middle"; 0.5 is where a match becomes likelier than not.
model_min_probability = 0.5
# A pair at or above this probability merges with no model and no person. Source: a starting value
# for the owner to confirm. With the model file's starting values, only the same name with a project
# in common reaches it. The labeled pairs decide it: strata.ops.supplier_match_quality reports the
# lowest value at which auto-merge precision on them stays at precision_target.
auto_merge_min_probability = 0.99
# The model's merge or no merge stands only when it is at least this sure. Below it, or when the
# model is not sure, the pair goes to a person. Source: a starting value for the owner to confirm.
model_confidence_min = 0.9
# The model is asked about at most this many new pairs in one nightly run, the likeliest first. The
# rest wait for a person (review_reason no_model) and are asked on a later night. It keeps the first
# live night inside the job's time limit and its cost. Source: a starting value for the owner to confirm.
model_pairs_per_run = 500
# Auto-merge precision should be at least this on the labeled pairs, and that many pairs should be
# labeled. Source: docs/PLAN.md section 5 ("auto-merge precision of at least 0.98 on 1,000 labeled
# pairs"). docs/STATUS.md decision 5, on labeling time, is still open.
precision_target = 0.98
labeled_pairs_target = 1000
# Below this many labeled auto-merged pairs, Strata reports counts only, with no precision and no
# interval. Source: DESIGN.md section 7, rules 6 and 15 (no percentage or range from fewer than 20 cases).
min_labeled_pairs_for_precision = 20
# The z value of the precision's 95% Wilson score interval. Source: the normal distribution's
# 97.5th percentile, 1.959964.
interval_z = 1.959964

# The score a contract and a passage need to be linked as "appeared together" (ticket 22).
[links]

# How the run tells two assertions apart (ticket 20, src/strata/knowledge/assertions.py).
[disagreements]
# Two signed amounts in US dollars disagree only when they differ by more than this share of the larger
# one. The awards dataset and a Procurement Plan can convert one contract's amount at two exchange
# rates, as for KE-KIMAWASCO-141042-CW-RFB (7,741,614.92 and 7,741,367.65, a gap of 0.003 percent),
# which is not two claims that cannot both be true. Source: ticket 20's review, round 2 (P2); 0.1
# percent is a value for the owner to confirm, and 0 compares amounts exactly.
amount_tolerance_share = 0.001
