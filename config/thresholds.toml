# The thresholds file: every threshold a check, a signal or a computed value uses.
#
# This is the one place to change a threshold (spec, "Ten single places", item 3). Each ticket that
# needs a threshold adds it under its section, with a comment that names its source. Code reads a
# value with strata.config.load_thresholds().value("section.name"). A value that is missing here is
# an error that says where to add it, never a silent default.

# These are the ingestion caps. The layout parser (Route B) tries at most this many PDF pages a
# day, counted in UTC across every project, whether it reads the page or fails on it. A run that
# reaches the cap stops and records the first page it left for the next day in
# strata.ops.parse_runs. Source: the spec's "Platform, identity and limits" (a daily page cap in
# ingestion holds Azure and workspace spend). 500 is a starting value for the owner to confirm;
# ticket 18 sets it for the whole document slice.
[ingestion]
# The most pages the layout parser (Route B) may try in one day, in UTC, across every project and both
# readers, the plan reader and the passage reader (src/strata/lakehouse/plans.py, parse_pages). A page
# it tried counts whether it read it or not. Source: docs/PLAN.md section 5. Ticket 18 keeps 500 for
# the whole document slice, a value for the owner to confirm: at 500 a day, the slice's Route B pages
# take days to read the first time, and later runs parse only changed pages.
daily_page_cap = 500
# A Procurement Plan's published text holds each Activity Reference No. as STEP wrote it, while the layout
# parser reads the page as an image and can misread a letter: on the workspace on October 26, 2026,
# ai_parse_document read KE-NWWDA-229129-CW-RFB on page 3 of the October 9, 2026 plan as -RFQ (ticket 78).
# A table row whose reference the text does not list takes the one reference the text lists and no other
# row read, when the two differ by at most this many characters (src/strata/reader/step.py, _settle). Two
# allows one or two misread letters. The reader never takes a reference that another row read, or one that
# is no closer than another, since one agency's references can differ in one digit
# (KE-NWWDA-541061-CW-RFQ and KE-NWWDA-541062-CW-RFQ). 0 turns it off. A value for the owner to confirm.
reference_misread_characters = 2
# The most pages the layout parser reads of one document in one part. A longer document is read in
# parts of this many pages, every page keeping its number in the whole PDF. The live parser gets each
# page as a PDF of its own, so a part's pages go one at a time. Source: ticket 18 ("a document over
# 500 pages ... divided past the parser's limit"); a value for the owner to confirm.
parser_part_pages = 500
# The share of their words that the words read for a page, by the layout parser or from the published
# text, and the words of the PDF page with that number must share for the stress shelf to call its
# page number right (src/strata/lakehouse/stress_shelf.py, over_parser_limit). Half allows for the
# parser's reading order and for running heads. A value for the owner to confirm.
page_match_shared_words = 0.5
# The passage reader (src/strata/lakehouse/passages.py) reads at most this many documents whose
# published text Route A can read: the slice file's named projects first (the showcase, the demo plan
# and the stress shelf's), then the projects the slice criteria select, each project's reports of each
# type in the order of TEMPLATES in src/strata/reader/templates.py, newest first. Ticket 11 read the first
# 20; ticket 18 raises it to cover the whole document slice: docs/PLAN.md section 3 plans 128 projects,
# and a project rarely has more than 40 such reports. A value for the owner to confirm.
passage_documents = 5000
# The minutes the nightly job's parse_and_embed task may spend reading from the World Bank's document host each
# night, from its first request (strata.lakehouse.readers.document_host). At 3 seconds a request
# (config/sources.toml, the documents source's pause_seconds) the first nights' backlog would outlast the job's
# 150 minutes and cancel every task after it, so the readers stop here, write a data readiness note and go on
# the next night. Source: the ticket 43 review (B3), which named 90 minutes as an example; 60 leaves the rest of
# the chain the time it took on the live runs. A value for the owner to confirm.
document_host_minutes = 60
# Of those minutes, the ones the nightly job's plan reader, which reads first, leaves for the passage reader after it
# (strata.lakehouse.readers.reading). On the paid workspace's first night, October 27, 2026 (run 564462742591748), the
# plan reader read P130164's plans in 12 minutes, then spent the other 48 fetching 163 of P156634's 240 Procurement
# Plans, and the passage reader never started, so strata.gold.passage held no row (ticket 86). The plan reader now
# stops once only these minutes are left, and the next night goes on from what bronze keeps; when it needs less, the
# passage reader gets the rest. ops/documents/run_live.py reads passages first and gives the plans what is left.
# Source: ticket 86, which splits ingestion.document_host_minutes between the readers (the choice ticket 72 parked);
# half is a value for the owner to confirm.
passage_reader_minutes = 30
# The bronze pages silver reads in one group (src/strata/lakehouse/silver/__init__.py, read). For each group it reads
# the pages, checks once which of them its tables hold already, and writes each table once, so a group costs a few
# statements where a page cost about four for each table. On the paid workspace's first nightly run, October 26,
# 2026 (run 686994790675456), page by page took about 6.3 seconds a page on the 2X-Small warehouse: bronze_to_gold
# ran 7,585 statements in its 150 minutes, read 1,231 of 1,460 pages and was cancelled before gold. The group's pages
# and rows are held in memory together, which bounds the size. Source: the ticket's example; a value for the owner
# to confirm.
silver_group_pages = 50
# The minutes silver may spend each night, from the start of bronze_to_gold. Once they are spent, silver finishes
# the group it is reading, records it, and stops; gold then runs on what silver holds, and the pages left wait for
# the next night, counted in strata.ops.data_readiness (measure silver_pages_waiting) and in the task's log. Source:
# the October 26, 2026 run above, where silver used the whole window and gold and the eight tasks after it never
# ran; 60 leaves the window's other 90 minutes to the fetch before it and the tasks after it. A value for the owner
# to confirm.
silver_minutes = 60

# Structured data for every country stays under 0.5 GB (docs/PLAN.md section 3, "Scope"): every
# table but the documents' text, layout, passages and vectors, as strata.ops.table_sizes records
# each run.
structured_data_limit_bytes = 500_000_000

# Passages (docs/PLAN.md section 5). A paragraph over max_tokens tokens is divided at sentence ends,
# and each part is its own passage with the paragraph's number. Source: the spec's "Reading
# documents" ("Paragraphs over 500 tokens are divided at sentence ends").
[passages]
max_tokens = 500
# search_passages returns this many passages unless the call asks for another number, and never more
# than max_results. Source: the spec's retrieval evaluation reports precision at 10, and the agent
# gets at most three rounds of tool results. Starting values for the owner to confirm.
results = 10
max_results = 20
# search_passages asks the searcher for max_results times this many passages, so the passages it
# leaves out (a prompt attack, or no Prompt Shields result) can drop out and still leave enough.
# Source: none yet; a starting value for the owner to confirm.
search_depth = 2

# Passages and questions in other languages (ticket 42; config/languages.toml). Each passage carries the language
# its document's record gives it; the passage reader checks a sample of them against a language detector that
# reads only the words (src/strata/knowledge/language.py), with sample_size passages shared equally between the
# languages the passages are written in, each at least min_sample_chars characters long so the detector has words
# enough to read. A question, or an upload's descriptions taken together, gets a lang attribute on screen only when
# the detector is at least min_confidence sure of its language. Source: the ticket's criterion ("a check of 50
# sampled passages") for sample_size; min_sample_chars and min_confidence are starting values for the owner to confirm.
[lang]
sample_size = 50
min_sample_chars = 200
min_confidence = 0.9

# The answer loop (src/strata/agent/loop.py). The agent gets at most this many rounds of tool results
# for one question; a tool call it asks for after that is not run, and it answers from what it has.
# Source: the spec's "The agent and the answer contract" ("this repeats for at most three rounds").
[agent]
tool_rounds = 3

# The app (ticket 06). Every warehouse query the server runs as a viewer, the plan check's included,
# gives up after stamp_timeout_seconds. The data-freshness stamp then shows its error state, and the
# plan check answers 503. Source: the 06 design brief ("Error (timeout
# after 30 seconds, set in the app config, or a server error)"). Usage events wait at most
# usage_flush_seconds before the server writes them to strata.ops.usage_events in one insert, so a
# page never waits for the warehouse to log it; 10 is a starting value for the owner to confirm.
[app]
stamp_timeout_seconds = 30
usage_flush_seconds = 10
# Lists that page or fold (ticket 21). All projects and a project's Packages show page_size rows a
# page, so each answer stays small on a slow link. A project's Procurement tab shows each agency's
# versions_shown newest plan versions, plus the baseline, before "Show all", and its Documents tab
# shows each type's documents_shown newest documents before "Show all". Source: the 21 design brief
# (sections 4.1, 6.1 and 8.1); starting values for the owner to confirm.
page_size = 20
versions_shown = 5
documents_shown = 5

# App state (docs/PLAN.md section 18; docs/app-state.md). The Lakebase probe times a write and then
# a read of one row, ten times, in strata.ops through the SQL warehouse and in a Lakebase database.
# Lakebase wins only when strata.ops's middle time is over this budget and Lakebase's is within it.
# Source: one second is the limit for a person's flow of thought (Nielsen, "Response Times: The 3
# Important Limits", 1993); following a project or checking a draft must feel immediate.
[app_state]
round_trip_budget_ms = 1000

# Plan-check thresholds (ticket 09). check_plan (src/strata/tools/check_plan.py) reads them, returns
# the values it used, and the Check a plan screen fills its definition of each mark from them.
# Source: the ticket's fixed checks and the blueprint's Check a plan wireframe. Each value is a
# starting value for the owner to confirm.
[plan_check]
# Needs a look: an activity with no signed contract whose planned completion passed. The planned
# completion is the first published planned date of its Contract Completion step. Only activities
# estimated at this many US dollars or more get this mark, so the mark stays on the packages where
# a missed date matters most. A smaller activity still pending near closing gets Watch from
# days_before_closing. The wireframe marks the US$1,230,000.00 package and leaves the
# US$295,000.00 one, whose planned completion also passed, to the closing-date check.
completion_passed_min_estimated_usd = 1_000_000
# Watch: an activity with no signed contract that is still pending this many days or fewer before
# the project's closing date, or after it.
days_before_closing = 90
# Watch: a signed amount at least this many times its estimate, "far above the estimate". The
# reason also says how many days after its first published planned date the contract was signed.
# A late signing alone is not marked: most signings are late (about 22% of 656 works contracts in
# STEP were signed on their planned date, in the World Bank's procurement delay study,
# documents.worldbank.org, 099062824153516589), so a mark on each would hide the exceptions.
actual_to_estimate_ratio = 2.0

# The past range (ticket 12). find_comparables (src/strata/tools/find_comparables.py) reads these,
# returns the values it used, and the package workspace's range chart takes them from its result,
# so no screen writes one of these numbers itself.
[past_range]
# Below this many comparables, subgroups included, no tool returns a range or a share: it returns
# every comparable and says why. Source: the spec ("Below 20 comparables, subgroups included, no
# tool returns a range or a percentage") and DESIGN.md section 7, rules 6 and 15.
min_comparables = 20
# Above this many comparables the chart draws quantile_dots dots, each standing for an equal share
# of the packages, instead of one dot per package. Source: the spec and DESIGN.md section 6 ("Above
# about 60 comparables, the past range switches to 20 quantile dots").
quantile_dots_above = 60
quantile_dots = 20
# The default period starts here: the first day of the awards dataset since FY2020, which most
# signing dates come from. It ends on the plan's date. Source: tests/ground_truth/values.toml's
# default criteria for the comparables.
period_from = 2019-07-01
# The plan's months a reader can type or drag to, from 0.5 up to this. Source: the 12 design brief,
# a starting value for the owner to confirm.
max_plan_months = 60
# Whether a canceled package counts as still open (drawn hollow and kept in the range as not signed
# yet) or is left out and named in the coverage line. A canceled package is not open, and its
# months "so far" would run to the as-of date, so it is left out. Source: ticket 12's decision,
# parked for the owner to confirm; the blueprint's table of estimates keeps canceled packages as
# still open, and true here does the same.
canceled_as_still_open = false
# A package with this Method, or with a Market Approach that starts with one of these words, has no
# specific procurement notice, so its procurement cycle time cannot be measured, and the contract trail
# never lists its notice as missing (ticket 22). Source: the Procurement Regulations: a limited or direct
# market approach and Direct Selection are not advertised.
no_notice_methods = ["Direct Selection"]
no_notice_market_approaches = ["Limited", "Direct"]

# The time estimate (ticket 25): Strata's own model of procurement cycle time, with ranges for the
# middle half and 8 in 10, and its backtests (src/strata/estimates/). The backtests and the model card
# read these, and ticket 26's estimate_time returns the values it used, so no screen writes one itself.
[time_estimate]
# Below this many comparables (find_comparables' count), the time estimate gives no range and says
# why. Source: docs/PLAN.md section 7 ("Strata abstains below 20 comparables, subgroups included"),
# DESIGN.md section 7, rules 6 and 15, and the 26 design brief, which names the key. It is the same
# rule as past_range.min_comparables, kept as its own key so the two can be told apart.
min_comparables = 20
# The planned date for each STEP step (ticket 27; strata.estimates.step_dates) abstains below min_comparables too,
# counting the comparable packages whose plans recorded the step. Its two choices are points of each step's
# Kaplan-Meier curve of delay (or, with no plan dates, of the days since the step before): the middle date, by
# which half of the comparables had reached the step ("half ran later"), and the cautious date, by which 8 in 10
# had ("2 in 10 ran later"). Source: the 27 design brief, sections 6.3 and 7.2, and the blueprint ("The cautious
# date by default"); the cautious share matches the time estimate's 8-in-10 point.
step_middle_share = 0.5
step_cautious_share = 0.8
# A start date a person types for a package with no plan dates may lie this many days before or after the as-of
# date, so a typing slip such as 2062 is caught. Source: the 27 design brief, section 7.2 ("The range comes from
# the config file"); a year back and five ahead are starting values for the owner to confirm.
step_start_days_before = 365
step_start_days_after = 1826
# A model sizes its ranges on at least this many packages it did not learn from (its calibration
# packages). With fewer, that model gives no range, and its test year says so. Source: DESIGN.md
# section 7, rules 6 and 15 (no range from fewer than 20 cases).
min_calibration_packages = 20
# The track record needs at least this many packages from the latest test year that the model had
# not seen. With fewer, it says so instead of giving counts. Source: the 26 design brief, section 7.6.
min_unseen_packages = 20
# In each test year, the share of unseen packages that finished inside the 8-in-10 range should fall
# from coverage_low to coverage_high. A year outside the band is written into the model card with its
# likely cause. Source: ticket 25's acceptance criteria (75 to 85 percent). Ticket 44's retrain watch
# and the 45 design brief's dashboard target lines read these two values, so the band is set once.
coverage_low = 0.75
coverage_high = 0.85
# For a test year short of the band, the model card names still-open packages as a likely cause when
# at least this share of the packages that sized the range were still open at the cutoff, and the
# stored middles do not already show that the year's packages took longer. Source: the ticket 25
# review, round 2 (a quarter: enough still-open packages to pull a range sized on the rest short); a
# starting value for the owner to confirm.
cause_still_open_share = 0.25
# The sentence under the chart on why the two lanes differ (ticket 26; strata.tools.estimate_time). The time
# estimate's middle and the past range's middle are "about the same" when they are less than this many months
# apart. Source: the 26 design brief, section 7.3 ("My estimate and the past range have about the same middle");
# half a month is one step of the plan line, a starting value for the owner to confirm.
same_middle_months = 0.5
# The package's size is named as why the lanes differ only when the model's own middle, with the package's
# estimated amount set to its comparable packages' middle signed amount, moves at least this share of the gap
# between the two middles. Source: the 26 design brief, section 6.6 ("A reason without counts is not
# returned"); "mainly because" needs at least half, a starting value for the owner to confirm.
reason_min_share = 0.5

# What-ifs (tickets 25 and 26): a range for the comparables that went with one option, such as
# prequalification or 3 lots.
[what_if]
# Below this many comparables that went with an option, that option gets no range. Source: the spec
# ("subgroups included") and the 26 design brief, section 6.4, which names the key.
min_subgroup = 20
# Section 4 lists at most this many procurement approaches, the most common first. Source: the 26 design
# brief, section 6.4 (at most three, against choice overload), and ticket 26's acceptance criteria.
max_approaches = 3

# Signals on followed projects (ticket 37): project_signals (src/strata/tools/project_signals.py) runs
# seven fixed checks on a project's public records and returns the values it used, and the Following page
# fills its column header, its definitions and each check's "What sets it off" sentence from them, so no
# screen writes one of these numbers itself. One signal is one check that fired: a check that fired on
# three activities is one signal with a count (the 37 design brief, section 2.1). Two checks reuse the plan
# check's own thresholds rather than a copy (CLAUDE.md rule 4): an activity past its planned completion
# with no signed contract is check_plan's completion_passed_no_contract reason, and an amount far above its
# estimate is its signed_over_estimate or signed_late_over_estimate reason, at
# [plan_check].actual_to_estimate_ratio. Source: the ticket, the blueprint's Following wireframe and
# "Signals, not scores"; each value is a starting value for the owner to confirm.
[signals]
# Needs a look: at least this many signals, or one strong one. Watch: at least one signal and fewer
# than this many, none strong. The Status column header names this number in words.
look_min = 3
# The checks that are strong whenever they fire, by key. None is, so far: a single check makes a
# project worth watching, and only many activities on one check make it strong (strong_from below).
strong = []
# The plan checks read each implementing agency's latest Procurement Plan only when it is dated within
# this many months before the as-of date. An agency whose latest plan is older has stopped publishing
# for this project, and its plan's dates have long passed, so the checks would only repeat old news.
# On the fixture, the Kilifi - Mariakani plan of March 19, 2025 and the Ministry of Water and
# Irrigation's plan of April 30, 2020 fall outside it (a parked decision, ticket 37).
plan_months = 12
# The three plan checks: an activity past its planned completion with no signed contract, a contract
# signed far above its estimate, and a direct-selection activity added late. A check that fired on
# strong_from activities or more is strong.
completion_passed_strong_from = 3
above_estimate_strong_from = 3
# A direct-selection activity is late when it is estimated at late_direct_min_usd or more, and the plan
# that first lists it was published late_direct_months or fewer months before the closing date, and the
# same agency's previous plan was read and does not list it. The last rule keeps out an activity that
# looks new only because its agency's earliest plan is the first one read (the 08 review, round 2: no
# first listing on the fixture is confirmed).
late_direct_methods = ["Direct Selection"]
late_direct_min_usd = 1_000_000
late_direct_months = 12
late_direct_strong_from = 3
# Closing date moved: the loan history shows the closing date moved at least this many times, counted
# per project, so two credits that move together count once.
closing_moves_min = 2
# Restructured: an ISR's restructuring history lists a restructuring of one of these levels approved in
# the last restructured_months months. Level 2 restructurings, which include closing-date extensions,
# are left out: the closing date check already counts those moves, and the rest are routine (a parked
# decision, ticket 37). No structured record holds restructurings, so the check reads the latest ISR.
restructured_levels = [1]
restructured_months = 12
# ISR rating lowered: the latest ISR rated progress towards the development objective or overall
# implementation progress lower than the ISR before it. The ratings from best to worst, as ISRs write
# them. Source: the ISR template's six-point scale.
isr_rating_scale = ["Highly Satisfactory", "Satisfactory", "Moderately Satisfactory", "Moderately Unsatisfactory",
                    "Unsatisfactory", "Highly Unsatisfactory"]
# Slow disbursement: less than this share of the money committed and not canceled was paid out (disbursed
# divided by disbursed plus undisbursed, so a credit committed in another currency is measured against
# itself), with disbursement_months or fewer months left before the closing date.
disbursement_max_share = 0.5
disbursement_months = 12
# The track record (the replay harness's signals_track_record scorer, strata.estimates.signals_track):
# the checks are replayed as they would have run on each of these dates, and a project counts as having
# later extended its closing date when the loan history shows it moved later within
# track_record_window_months after that date. Below track_record_min projects, a count stays a count
# and the page says it is too few to read as a rate (DESIGN.md section 7, rules 6 and 15).
track_record_dates = [2023-06-30, 2024-06-30, 2025-06-30]
track_record_window_months = 12
track_record_min = 20
# The night of the week, in UTC, on which the nightly job's score task replays the checks for the track record and
# compares the hazard model with them (strata.lakehouse.nightly; strata.lakehouse.schedule.weekly_due). The replay
# reads Strata as it was on the dates above, so its counts change only when a record newly fetched turns out public
# before one of them, and it reads every project with a loan history on each date, which is too long to repeat
# every night inside the job's window. A record never replayed is replayed the first night, and a replay whose
# night passed without it, because the night failed or the score task's minutes ran out first, runs the next
# night. Source: the ticket 43 review (B6), which made it weekly, and ticket 89, which named the day: on the paid
# workspace the score task filled the whole 150-minute window on October 27, 2026 (run 1086916576670871). Sunday is
# a starting value for the owner to confirm.
track_record_day = "Sunday"
# On each replay date, both replays read the cohort's projects this many at a time: one statement for the batch's
# project records and one for their loan histories (strata.estimates.signals_track.counted). Only a project still
# active on the date is then checked, once for both replays. Before, each replay checked every project of the cohort
# on each date, and a closed one alone cost two statements: on the paid workspace's cohort of about 1,050 projects,
# the track record's replay ran 104 minutes at about 57 statements a minute without finishing (ticket 37, step 5). A
# batch's rows are held in memory together, which bounds the size. Source: ticket 89; a starting value for the owner
# to confirm.
track_record_batch_projects = 500

# The review thresholds that compute review type (ticket 15). The package workspace computes a planned
# package's Review Type from its category and its whole estimated amount, never per lot, so dividing a
# package never changes it (strata.packages.compute). A package whose estimated amount is at or above its
# category's threshold goes to Prior review; below it, Post. The thresholds depend on the implementing
# agency's procurement risk rating, which Strata cannot know at concept stage, so it assumes risk_rating
# and says so beside the review type. The computed note quotes source as its source line, and as_of
# after it once the owner has checked the values against the World Bank's table and gives that table's
# date. Source: the blueprint's Package workspace wireframe ("works of US$10 million or more go to prior
# review"), which is the High risk threshold for works. The other values are starting values for the
# owner to confirm against the World Bank's current table, with the other ratings added beside High.
# Until then the source says so, and there is no as_of (a parked decision, ticket 15's review round 2).
[review]
risk_rating = "High"
source = "Strata's starting values from the blueprint, not yet checked against the World Bank's prior review thresholds"

[review.prior_from_usd.High]
Works = 10_000_000
Goods = 2_000_000
"Non-consulting Services" = 2_000_000
"Consultant Services" = 1_000_000

# The market approach thresholds, per country (ticket 15), by ISO code and category. A planned package
# whose estimated amount is at or above its country's threshold for its category gets Open -
# International; below it, Open - National. A country or category with no threshold here gets no computed
# market approach, and the chip asks the person for one. Source: the blueprint's Package workspace
# wireframe ("this country's plans send works of US$15 million or more to international bidding"), for
# Kenya's works; a starting value for the owner to confirm, with other countries and categories added
# beside it. As for [review], the source says the value is unchecked, and as_of waits for the check.
[market_approach]
source = "Strata's starting value from the blueprint, not yet checked against the World Bank's thresholds for Kenya"

[market_approach.international_from_usd.KE]
Works = 15_000_000

# The PPSD guidance's Table I thresholds, which decide when the Long Form applies (ticket 36). Source: Table I,
# "Thresholds for Use of the Long-Form PPSD Template as a Function of Procurement Risk", PPSD Long Form Detailed
# User Guidance, third edition, March 2025 (documents.worldbank.org report 203913), PDF page 18, recorded in
# data/fixture/recorded/documents/guidance/ppsd-long-form-guidance-2025-03-31 and quoted in
# tests/ground_truth/values.toml (ppsd-table-i-*). The table gives US$ millions; these are US dollars.
# tests/test_ppsd_templates.py checks every amount against the quotes.
#
# The threshold depends on the procurement risk rating the Borrower and the World Bank agree, which Strata
# cannot see. So the suggested PPSD rows offer the Long Form once a package's cost estimate reaches the threshold
# of offer_long_form_at, the lowest one, and the caption names that threshold. Short Form stays the default.
# The whole package's cost estimate is compared, never a lot's (src/strata/drafts/ppsd_rows.py, table_i).
[ppsd_table_i]
risk_levels = ["Low", "Moderate", "Substantial", "High"]
offer_long_form_at = "High"

# Which of Table I's rows a STEP procurement category reads.
[ppsd_table_i.row]
Works = "works"
Goods = "goods"
"Non-consulting Services" = "goods"
"Consultant Services" = "consultants"

# Works.
[ppsd_table_i.from_usd.works]
Low = 200_000_000
Moderate = 115_000_000
Substantial = 75_000_000
High = 50_000_000

# Goods, IT and non-consulting services.
[ppsd_table_i.from_usd.goods]
Low = 125_000_000
Moderate = 75_000_000
Substantial = 50_000_000
High = 30_000_000

# Consultant services.
[ppsd_table_i.from_usd.consultants]
Low = 40_000_000
Moderate = 30_000_000
Substantial = 20_000_000
High = 15_000_000

# When a data readiness measure counts as Partial or Gap (ticket 16; the 16 design brief, section 4).
# data_readiness_for (src/strata/tools/data_readiness_for.py) reads them, and the dashboard's Data
# readiness page uses the same values. Each is a starting value for the owner to confirm.
[data_readiness]
# Partial: a linked share, a read-well share, or the share of a readiness row's checks, under these.
linked_min_share = 0.9
read_well_min_share = 0.9
check_min_share = 0.9
# A share is written only from this many rows; below it, a cell shows the count alone ("6 of 12"),
# as DESIGN.md section 7, rules 6 and 15 say. web/src/lib/format.ts's FEWEST_FOR_A_FREQUENCY holds
# the same rule until ticket 12 reads it from here, and tests/test_data_readiness.py checks they agree.
fewest_for_a_share = 20
# From this many rows a share is a whole percent ("528 of 603, 88%"); from fewest_for_a_share up to
# it, "about N in 10" (DESIGN.md section 7, rule 15). The dashboard charts a share only from here.
# format.ts's FEWEST_FOR_A_PERCENTAGE holds the same value until ticket 12, and the test checks it.
fewest_for_a_percentage = 50
# Partial when late: a source's latest fetch is older than its schedule allows plus this many days.
# Daily data are on time when they are less than two days old.
late_grace_days = 1
# How many days each cadence in the source registry allows between fetches. A frozen source, and a
# readiness row whose schedule is "as published", are never late.
schedule_days = { daily = 1, weekly = 7, monthly = 31, quarterly = 92, yearly = 366 }

# Supplier matching: when a pair merges, goes to the model or goes to a person (ticket 19). A STEP
# supplier ID decides first; only a row with no ID is matched by name (docs/PLAN.md section 5). Each
# candidate pair gets Splink's match probability from the name-matching model in config/models.toml's
# [supplier_matching], and these values route it. strata.knowledge.suppliers.resolve reads them, and
# strata.knowledge.suppliers.quality and the labeling tool (src/strata/server/suppliers.py) read the
# precision target and the labeled-pair counts.
[supplier_matching]
# A pair below this probability is not kept as a candidate at all. Source: none yet; a starting
# value for the owner to confirm. It keeps the weak pairs a person may still label.
candidate_min_probability = 0.01
# A pair from this probability up to auto_merge_min_probability goes to the model, which decides
# merge or no merge. A pair below it is kept apart. Source: the spec's "a model adjudicates the
# uncertain middle"; 0.5 is where a match becomes likelier than not.
model_min_probability = 0.5
# A pair at or above this probability merges with no model and no person. Source: a starting value
# for the owner to confirm. With the model file's starting values, only the same name with a project
# in common reaches it. The labeled pairs decide it: strata.ops.supplier_match_quality reports the
# lowest value at which auto-merge precision on them stays at precision_target.
auto_merge_min_probability = 0.99
# The model's merge or no merge stands only when it is at least this sure. Below it, or when the
# model is not sure, the pair goes to a person. Source: a starting value for the owner to confirm.
model_confidence_min = 0.9
# The model is asked about at most this many new pairs in one nightly run, the likeliest first. The
# rest wait for a person (review_reason no_model) and are asked on a later night. It keeps the first
# live night inside the job's time limit, and keeps its cost down. Source: a starting value for the owner to
# confirm.
model_pairs_per_run = 500
# Auto-merge precision should be at least this on the labeled pairs, and that many pairs should be
# labeled. Source: docs/PLAN.md section 5 ("auto-merge precision of at least 0.98 on 1,000 labeled
# pairs"). docs/STATUS.md decision 5, on labeling time, is still open.
precision_target = 0.98
labeled_pairs_target = 1000
# Below this many labeled auto-merged pairs, Strata reports counts only, with no precision and no
# interval. Source: DESIGN.md section 7, rules 6 and 15 (no percentage or range from fewer than 20 cases).
min_labeled_pairs_for_precision = 20
# The z value of the precision's 95% Wilson score interval. Source: the normal distribution's
# 97.5th percentile, 1.959964.
interval_z = 1.959964

# The score a contract and a passage need to be linked as "appeared together" (ticket 22). The link scorer
# (src/strata/knowledge/links.py) pairs each contract with each numbered paragraph of its own project's
# reports and scores the pair on five parts, each worth at most the points below, rounded to two decimals:
# the same project; the same sector; how close the document's date is to the signing; how many of the words
# of the contract's description the paragraph shares; and what the paragraph mentions of the contract (its
# STEP reference or another reference, a place its description names, its description, or its procurement
# category, such as "works contracts"). It keeps a pair whose total reaches the threshold. Source: docs/PLAN.md
# section 5 names the five parts; the weights and the threshold are starting values for the owner to confirm,
# chosen on the fixture so that a paragraph has to share words or a mention with a contract, not only its
# project and its time, and so that ICR paragraph 54 stays linked to IN-RRSMP-7431-CW-RFB (the ticket's first
# criterion; its parts give 0.10 + 0.10 + 0.11 + 0.02 + 0.20 = 0.53). Changing a value here means checking
# the ticket's tests and the Evidence drawer's fixture sentence in the same change (CLAUDE.md rule 4).
[links]
threshold = 0.50
project_points = 0.10
sector_points = 0.10
# The time part falls in a straight line from time_points at the month of the signing to nothing at
# time_window_months apart, either way.
time_points = 0.20
time_window_months = 60
# The wording part is the share of the description's words the paragraph holds, times text_points, counting a
# description of fewer than text_min_words words as that many, so a two-word description is not a match.
text_points = 0.20
text_min_words = 6
# Each kind of mention the paragraph makes of the contract, added up to mentions_max.
mention_reference_points = 0.40
mention_place_points = 0.20
mention_name_points = 0.20
mention_category_points = 0.20
mentions_max = 0.40
# The words the scorer reads by, kept here so a change to them lands in one place (CLAUDE.md rule 9). A place a
# contract's description names is the capitalized words after "in" or "at", less a word that only says what kind of
# place it is ("in Bundi District" names Bundi). Source: the fixture's contract descriptions, read by the builder.
place_kinds = ["County", "District", "Dist", "Dist.", "Town", "City", "Region", "Province", "State", "Sub",
               "Municipality", "Village", "Division", "Office", "Offices"]
# Words that carry no meaning for the wording part, beside every word of fewer than three letters and every number.
# Source: the common English words in the fixture's contract descriptions.
stop_words = ["the", "and", "for", "with", "from", "that", "this", "which", "have", "has", "had", "were", "was",
              "are", "been", "into", "under", "over", "upon", "their", "its", "our", "not", "all", "any", "per", "one",
              "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "other", "each", "such", "than",
              "then", "also"]

# How a paragraph writes each procurement category, as gold.contract names it, as regular expressions matched
# whole-word and in any case: "works contracts" or "civil works" for Works. A category a paragraph mentions is a
# shared mention of the kind category. Source: the wording of the fixture's ICRs, PADs and ISRs.
[links.category_words]
Works = ['works?\s+contracts?', 'civil\s+works']
Goods = ['goods\s+contracts?', 'supply\s+contracts?']
"Consultant Services" = ['consultancy\s+(?:contracts?|services)', 'consult(?:ant|ing)\s+(?:contracts?|services)']
"Non-consulting Services" = ['non-consulting\s+services']

# A project's Connections tab (ticket 22): its one-hop neighbourhood shows at most this many nodes, the
# project included, and counts the rest by kind. Source: ADR 0004 and the blueprint's "a one-hop
# neighbourhood of at most about 20 nodes", past which a graph stops being readable.
[connections]
max_nodes = 20
# A document's node shows at most this many paragraph chips, the strongest links first, and says how many more
# paragraphs appeared together, so the diagram stays near the brief's 30 tab stops. Source: the 22 design brief,
# section 8.2 ("At most about 30 stops with the chips"); a starting value for the owner to confirm.
chips_per_document = 3
# The diagram draws one dashed curve for each package and document that appeared together. When it would draw more
# than this many, it draws at rest only the curves of the first package with links, and the rest when a package or
# a chip is pointed at or focused, with a caption that says so. Source: the 22 design review, round 1, F7 (P156634
# drew about a hundred crossing curves); a starting value for the owner to confirm.
lines_at_rest = 12
# "Why this source" lists at most this many other contracts a paragraph appeared together with, strongest first,
# then counts the rest. Source: the 22 design brief, section 4.2 (why.othersItem).
other_contracts_listed = 5

# The activity page's contract trail (ticket 22): the paragraphs that appeared together with an activity's
# contracts come grouped by report, oldest first, each report showing at most this many of its paragraphs in
# document order, with a button for the rest. Every report is on the page that way, so a report with many links
# does not push the others out of view. Source: the 22 critique, round 1 (Activity page, Hierarchy); a starting
# value for the owner to confirm.
[contract_trail]
paragraphs_per_report = 3

# How the run tells two assertions apart (ticket 20, src/strata/knowledge/assertions.py).
[disagreements]
# Two signed amounts in US dollars disagree only when they differ by more than this share of the larger
# one. The awards dataset and a Procurement Plan can convert one contract's amount at two exchange
# rates, as for KE-KIMAWASCO-141042-CW-RFB (7,741,614.92 and 7,741,367.65, a gap of 0.003 percent),
# which is not two claims that cannot both be true. Source: ticket 20's review, round 2 (P2); 0.1
# percent is a value for the owner to confirm, and 0 compares amounts exactly.
amount_tolerance_share = 0.001

# A project's timeline (ticket 23; src/strata/server/timeline.py). Above this many signed contracts, the What lane
# draws one mark per calendar year that signed two or more, labelled with its count, so a project with many
# contracts keeps a lane you can read; the table under the chart still lists every contract. Source: the 23
# design brief, section 4.10, which suggests 12; a value for the owner to confirm.
[timeline]
what_lane_group_above = 12

# The verifier's check 4 (ticket 24; src/strata/agent/judge.py and verifier.py). The judge reads at most
# judge_source_chars characters of each source a sentence cites, a passage's header and words or a record's
# fields, and the call gives up after judge_timeout_seconds, when every sentence it had to judge is removed.
# Source: starting values for the owner to confirm. A passage is one numbered paragraph, which rarely runs past
# 6,000 characters, and a chat completion over a few sentences answers well inside a minute.
[verifier]
judge_source_chars = 6000
judge_timeout_seconds = 60

# Lesson review (ticket 29; docs/PLAN.md section 11, "Lesson governance"). strata.knowledge.lessons reads
# them, and the review routes return the ones a screen states, so no number is typed in code.
[lesson_review]
# A proposed lesson, or a re-check, must be decided within this many business days of entering the
# queue, the recommendation and the decision together. Day 1 is the day it enters. Source: spec story
# 91 and docs/PLAN.md section 11 ("decided within 10 business days").
business_days = 10
# The World Bank holidays the clock skips, besides Saturdays and Sundays, as dates such as 2026-12-25.
# Source: none yet. The World Bank's holiday calendar could not be cited offline, so the list is empty
# until the owner gives it (a parked decision), and the clock skips weekends only.
holidays = []
# A cross-check is due this many business days after the quarterly job assigns it. Source: none; the
# same limit as a decision, a starting value for the owner to confirm.
cross_check_business_days = 10
# Each quarter, this share of the quarter's decisions goes to reviewers in another region to
# cross-check, at least one when there was any decision. Source: spec story 94 and docs/PLAN.md
# section 11 ("a quarterly 10% cross-check by another region").
cross_check_share = 0.1
# Waiting for review lists the decisions of the last this many days, with days from publication to
# decision, the knowledge loop's leading indicator. Source: the 29 design brief, section 5.3.
decided_window_days = 90
# Waiting for review says how many proposed lessons the quote check dropped in the last this many
# days. Source: the 29 design brief, section 5.3.
quote_check_window_days = 30
# The lesson review writer names at most this many current lessons a proposed lesson may repeat, and a
# lead can merge it only into one of them. Source: the 29 design brief, section 4.2.
likely_repeats_max = 3
# A reviewer's reason, and a lesson's statement, are at most this many characters. Source: the 29
# design brief, section 3.2 (brief 23's reason field and the lesson editor).
reason_max_chars = 500
statement_max_chars = 80
# get_lessons returns at most this many lessons, best first. Source: none; a starting value for the owner
# to confirm, as many lessons as one page of the library shows and more.
get_lessons_max_results = 20
# Lesson cards on one page of the library, and decisions on one page of the decided table. Source:
# DESIGN.md section 5 (eight cards to a group at most) and the 29 design brief, section 2.4.
library_page_size = 8
decided_page_size = 20
# While the writer's summary is still being written, the review page asks for it this often, for at
# most this long. Source: the 29 design brief, section 5.7.
summary_poll_seconds = 15
summary_poll_minutes = 10

# The Lessons page, which opens on what came in since the reader's last visit (ticket 39).
[lessons]
# A visit is a session on any Lessons page: a new one starts when the reader opens Lessons after this many minutes
# away, so a reload or a trip to a draft and back keeps the counts while they work through them. Source: the 39
# design brief, section 4.2; a starting value for the owner to confirm.
visit_gap_minutes = 30
# "New" shows at most this many lesson cards, then a caption that points to the library. Source: the 39 design
# brief, section 5.4 (DESIGN.md section 5: eight cards to a group at most).
new_cards_max = 8

# The package workspace's section 3, procurement risks and what helped (ticket 30). The risk-table
# builder (src/strata/packages/risks.py) reads them, and returns the one the section states.
[package_risks]
# The builder returns at most this many risks per package, in the order it ranked them. Source: the spec's
# hindsight test ("its top five risks per package") and the 30 design brief, section 5.1 (the Pareto
# principle: at most five risks).
max_rows = 5

# The implementing agency's track record (ticket 36): agency_track_record (src/strata/tools/agency_track_record.py)
# counts how the activities of one of the agency's plans went against the date their first published plan gave for
# signing, and the Project Paper summary states those counts. Both values come back in the tool's counts, so no
# screen or writer writes them itself.
[agency_track_record]
# A package signed more than this many days after its first published planned date counts as signed late. 0 is
# check_plan's own rule, which marks a signing late when its days_late is above zero ([plan_check] has no key for
# it); a starting value for the owner to confirm.
late_days = 0
# Below this many counted packages, the track record gives no middle delay, only counts. Source: the spec ("Below
# 20 comparables, subgroups included, no tool returns a range or a percentage") and DESIGN.md section 7, rules 6
# and 15; the 36 design brief, section 11 ("middle_delay_days (null under 20)").
min_packages_for_middle = 20

# The retrieval loop (ticket 32; docs/PLAN.md sections 10 and 11, "Feedback"): the labeled set, the
# judging tool, passage reports from the evidence drawer and how they become labels. strata.knowledge.retrieval
# and strata.estimates.retrieval read them, and the routes return the ones a screen states.
[retrieval]
# pilot: a passage reviewer decides every passage report. scale: a report group with enough agreeing
# reports and no dissent is ranked lower without a person, as the rules below say. Source: docs/PLAN.md
# section 11 ("In the pilot a person reviews every report"); the switch is the ticket's, off in the pilot.
mode = "pilot"
# At scale, at least this many different people must make the same report on a passage, for the same
# kind of question, with nobody dissenting, before it becomes a silver label. Source: docs/PLAN.md
# section 11 ("three agreeing users with no dissent make a silver label").
silver_min_agreeing = 3
# At scale, one in this many silver labels made without a person goes to a passage reviewer as an audit
# sample, at least one in a batch that made any. Source: docs/PLAN.md section 11 ("with a 10% audit").
audit_every = 10
# At scale, no one person's reports may be more than this share of a weekly batch's reports that count
# toward a silver label, and always at least one; their reports past it go to a person. Source:
# docs/PLAN.md section 11 ("no user supplies more than 10% of a batch").
max_user_share = 0.1
# A person's prior reliability in the Dawid and Skene weighting, before any reviewer has decided on their
# reports: as if they had agreed with prior_agreed of prior_reviews reviewer decisions. Source: none; a
# starting value for the owner to confirm (an even prior of one in two).
prior_agreed = 1
prior_reviews = 2
# Passage reports lists the decisions of the last this many days. Source: the 32 design brief, section 2.4,
# as brief 29's decided table.
decided_days = 90
# A reporter's reason, a reviewer's reason and a reopening's reason are at most this many characters.
# Source: the 32 design brief, section 4 (brief 23's Reason field, 500 characters).
reason_max_chars = 500
# Decisions on one page of the decided table, and queries on one page of Judging. Source: the 32 design
# brief, sections 2.4 and 2.6 (brief 21's Pagination, 20 a page).
page_size = 20
# Judging shows Cohen's kappa only once both judges have graded at least this many passages on queries
# they both finished. Source: the 32 design brief, section 4.4, after DESIGN.md section 7 rule 15 (no
# statistic on fewer than 20 cases).
min_pairs = 20
# Each notice query's pool: the best this many passages of each search setup the pool draws on
# (strata.knowledge.retrieval.judging.pool_setups()), public before the query's date. Source: the spec's
# retrieval evaluation, so the pool holds every passage recall at 20 can count.
pool_depth = 20
# The measures the replay harness reports for retrieval (spec, seam 5): precision at precision_k, recall
# at recall_k and nDCG at ndcg_k. Source: docs/PLAN.md section 10 ("recall at 20, precision at 10 and
# nDCG at 10").
precision_k = 10
recall_k = 20
ndcg_k = 10
# One query in this many, by a stable hash of its id, is held out of tuning, and the tuning gate compares a
# setup on those. Source: none; a starting value for the owner to confirm (a third of the labeled set).
held_out_every = 3
# The tuning gate blocks a setup that scores lower than the current one by more than this on any measure
# of any held-out query set. Source: spec story 102 ("loses nothing on the held-out set"), so zero.
tuning_tolerance = 0.0
# The dashboard shows a week's "Wrong passage" reports per 100 sources opened only when at least this
# many sources were opened that week, and a query set's measures only from this many queries. Source: the
# 45 design brief, tiles 22, 28 and 29, after DESIGN.md section 7 rule 15.
min_opened = 20
min_queries = 20

# Check your criteria (ticket 31): section 5 of the package workspace. The 20-comparable floor of the cost
# estimate is past_range.min_comparables, the one floor every range uses.
[criteria]
# The longest qualification criteria a person may paste, in characters, checked when they press "Compare the
# criteria" (the field never cuts a paste off). Source: the 31 design brief, section 4.3 (criteria.max_chars).
max_chars = 20000
# The field shows "{used} of {max_chars} characters" once fewer than this many characters are left. Source: the
# 31 design brief, section 4.3.
counter_left = 2000
# Your words for one item, as the criteria table quotes them, are shortened at a word end past this many
# characters. Source: the 31 design brief, section 4.4.
excerpt_max_chars = 200
# At most this many lessons in each group, "Cost estimates" and "Specifications", in get_lessons' order.
# Source: the 31 design brief, section 4.6 (criteria.lessons_per_group), well under DESIGN.md's eight cards.
lessons_per_group = 3
# The risk factors whose lessons the section shows, one group each in this order, from ticket 29's closed list
# (config/lessons.toml). Source: the 31 design brief, section 4.6 ("Cost estimates" and "Specifications").
lesson_factors = ["cost_estimates", "designs_and_specifications"]
# Each group of rejected bids shows this many rows before "Show {n} more". Source: the 31 design brief, section
# 6.7, the same default as brief 28's reasons list (rebidding.rows_per_group).
rows_per_group = 5

# Rebidding risk (ticket 28): how many comparable packages were advertised again, and the model's natural
# frequency beside it. The floor of comparables below which the model gives no "about N in 10" is
# past_range.min_comparables, the one floor every estimate uses, so it is not repeated here.
[rebidding]
# A package whose specific procurement notice had no award (no contract in the awards dataset and no Contract
# Award notice with a signature date) this many days after its bids were due counts as not awarded, one of the
# three sources that say a package was advertised again. Before then it may still be signed, so it is
# undecided. Source: the fixture's packages advertised since July 1, 2019: the longest time from bids due to a
# signed contract was 504 days (KE-MOWI-47509-CW-RFB, bids due November 5, 2019, signed March 23, 2021), so 548
# days (18 months) leaves room above it. A starting value for the owner to confirm against the full slice.
no_award_after_days = 548
# The reasons list shows this many packages in each group before "Show {n} more". Source: the 28 design brief,
# section 4.3 (rebidding.rows_per_group), the same default as the criteria section's rejected bids.
rows_per_group = 5
# A backtest's calibration error sorts each package's estimated chance into this many equal bins from 0 to 1,
# and averages, weighted by the packages in each bin, the gap between the bin's mean estimate and the share of
# its packages advertised again (expected calibration error). Source: the ten bins of the usual reliability
# diagram (Guo and others, 2017, "On Calibration of Modern Neural Networks"); a starting value to confirm.
calibration_bins = 10

# The hindsight test (ticket 34; docs/PLAN.md section 10): Strata frozen at each pilot project's approval date,
# its top risks per package against the risks the completion report later blamed. src/strata/estimates/hindsight.py
# reads these with the replay harness. How many risks each package shows is package_risks.max_rows above, and the
# coders' agreement is withheld below retrieval.min_pairs, the agreement floor ticket 32 set.
[hindsight]
# The main packages of each project's first Procurement Plan: this many, the largest by Estimated Amount (US$).
# Source: the spec's hindsight test ("the first plan's main packages (the three largest by estimated amount)").
main_packages = 3
# The baseline: a checklist of this many risk factors, the sector's commonest among the risks the other gate-set
# projects' completion reports blamed. Source: the spec ("a checklist of the sector's five commonest risks").
checklist_size = 5
# The interval around hindsight recall (Wilson's score interval). Source: the spec ("(95% interval)").
interval_level = 0.95
# The report gives the interval only from this many blamed risks. Source: DESIGN.md section 7, rule 15, and the
# 45 design brief, section 7.3 (the interval sentence only when blamed is 20 or more).
min_blamed_for_share = 20
# The pilot projects with an ICR that the test expects. A run that finds fewer reports how many it found. Source:
# docs/PLAN.md section 3 ("49 ICRs") and the spec's hindsight test ("the 49 slice projects with an ICR").
expected_projects = 49
# A challenger loses the paired comparison with the champion when it catches fewer of the same blamed risks and
# McNemar's exact test gives a p-value below this. Source: none; the usual 5 percent level, a starting value for
# the owner to confirm.
mcnemar_alpha = 0.05
# Each package's comparables, as of the approval date, start at this notice date: the first day of the contract
# awards dataset for FY2001 to 2016 (docs/PLAN.md section 3). past_range.period_from starts in 2019, which would
# leave no comparable for most approval dates. Source: docs/PLAN.md section 3.
notices_from = 2000-07-01

# The nightly job's quality checks (ticket 43; config/quality_checks.toml names the tables each task checks, and
# strata.lakehouse.quality runs them). Each checked table's row count must fall inside a range: the one
# row_counts gives it, or else row_count_min to row_count_max. Source: the fixture database the gate builds
# (the smallest counts: a table the job fills is never empty there) and the workspace's sixth nightly run of
# October 24, 2026 (docs/workspace-catchup.md, ticket 04 step 2: bronze_to_gold wrote 2,259,404 rows and gold
# held 99,557 notices), with room for the whole pilot slice (docs/PLAN.md section 3). Starting values for the
# owner to confirm once a few nights have run.
[quality_checks]
# A table with no range of its own may be empty, as the drafts' notices are before anyone writes a draft, and
# stays under ten million rows, twenty times the largest table the sixth run wrote.
row_count_min = 0
row_count_max = 10_000_000
# The tables the job fills every night, which must never be empty, and the ones that may pass ten million rows.
row_counts = { "strata.bronze.api_pages" = [1, 200_000], "strata.gold.country" = [1, 1_000], "strata.gold.project" = [1, 200_000], "strata.gold.notice" = [1, 5_000_000], "strata.gold.contract" = [1, 5_000_000], "strata.gold.package" = [1, 5_000_000], "strata.gold.edge" = [1, 50_000_000], "strata.ops.data_readiness" = [1, 50_000_000] }

# How long after the nightly checks last finished the freshness stamp and the stale alerts call Strata's data
# stale (ticket 43; briefs 06, 37 and 41). The job runs once a day, so a stamp older than a day and a half means
# a night was missed. Source: bundle/nightly.yml's daily schedule, with half a day's room for a late or rerun
# night; a starting value for the owner to confirm.
[nightly]
stale_after_hours = 36
# The workspace runs at most this many job tasks at once (docs/PLAN.md section 2, "Shared workspace limits":
# five concurrent job tasks, shared with fairshare). tests/test_nightly.py checks the job's tasks against it.
max_concurrent_tasks = 5
# The minutes the score task may spend each night, from its start (strata.lakehouse.nightly, _score). The task does
# its work in parts (nightly.SCORE_PARTS); once these minutes are spent it stops after the part it is in, records
# the parts it left in strata.ops.score_parts and ends, so measure_data_readiness and refresh_drafts run inside the
# job's window, and the next night runs the parts left first. A part is never cut in the middle. Source: ticket 89,
# after the score task alone ran for the job's whole 150 minutes on the paid workspace on October 27, 2026 (run
# 1086916576670871); 45 is the ticket's starting value for the owner to confirm against the first nights' minutes
# for each part in strata.ops.score_parts.
score_minutes = 45

# The benchmark file and the full gate (ticket 33; docs/PLAN.md section 10). src/strata/evals reads these.
[benchmark]
# evals/benchmark.yaml holds at least this many questions of each kind other than refusals (sql, documents and
# estimates); the must-refuse set holds one question per refusal key instead. Source: ticket 33's acceptance
# criteria ("at least ten questions of each other kind").
min_questions_per_kind = 10
# The full gate's targets: the share of each kind's questions that must pass, through the answer contract with the
# live agent. "all" counts every question of every kind. A run under a target fails and names the gap, as P2's exit
# criterion asks ("Benchmark targets are met, or each gap is written down"). Source: none in PLAN.md, the spec or
# the blueprint; starting values for the owner to confirm. A refusal that does not hold is never acceptable, so
# must_refuse is every question.
targets = { sql = 0.9, documents = 0.8, estimates = 0.8, must_refuse = 1.0, all = 0.85 }
# The share of the Genie space's benchmark questions whose rows must equal their ground truth. Source: none; a
# starting value for the owner to confirm.
genie_target = 0.8

# Genie (ticket 33): the client that asks the Genie space's conversation API as the viewer (src/strata/genie/client.py)
# and the ask_genie tool. Free Edition stops the SQL warehouse after 10 idle minutes, and Genie then waits in
# PENDING_WAREHOUSE far longer than a direct start, which takes about 8 seconds, so the client starts the warehouse
# first. Ticket 48's demo-ready check, "the first Genie call answers within a stated threshold", reads the same two
# waits. Source: fairshare's Genie client, which waited up to 90 seconds for the warehouse and 150 for Genie
# (ticket 33's notes; fairshare's docs/limits.md, which this build could not open). Starting values for the owner
# to confirm.
[genie]
# The longest the client waits for a stopped warehouse to reach RUNNING before it gives up.
warehouse_start_seconds = 90
# The longest the client waits for Genie's answer once it has asked, through every status before COMPLETED.
answer_seconds = 150
# How often the client looks again at the warehouse's state or the message's status.
poll_seconds = 2
# Genie answers too many questions in a minute with 429. The client waits this long the first time, twice as long
# each time after, never longer than backoff_max_seconds at once, all inside answer_seconds.
backoff_first_seconds = 2
backoff_max_seconds = 30
# ask_genie gives the agent at most this many rows; its coverage line counts the rest. Source: search_passages'
# limit of 20 is for passages an answer reads one by one; a table of counts by year or country rarely passes 100.
# A starting value for the owner to confirm.
max_rows = 100

# Foundry evaluations (ticket 33; config/evaluations.toml). src/strata/evals/foundry_evaluation.py reads these.
[foundry_evaluation]
# The share of scored answers that must meet Foundry's own pass threshold, per evaluator. Source: none; starting
# values for the owner to confirm.
targets = { groundedness = 0.8, relevance = 0.8, task_adherence = 0.8, tool_use = 0.8 }
# How often the run's status is read, and how long the full gate waits for Foundry to finish scoring. Source: none;
# fairshare's evaluation runs on 40 answers took minutes, not hours. Starting values for the owner to confirm.
poll_seconds = 10
wait_seconds = 1800

# The estimates loop (ticket 44; docs/PLAN.md section 11, "Three loops" and "Retraining"): the exposure log, the plan
# rows dated near a date Strata offered, the monthly watch that raises a retrain, the challenger's promotion and the
# hazard model in shadow. src/strata/estimates/watch.py, promotion.py and hazard.py read these. The coverage band,
# 75 to 85 percent, is time_estimate.coverage_low and coverage_high, set once for the backtest and this watch.
[estimates_loop]
# A plan row published after Strata showed a range for its package is dated within this many days of a date Strata
# offered when its planned signing date is this close to the middle or the 8-in-10 point offered, early or late.
# Source: docs/PLAN.md section 11 ("later plan rows within 14 days of Strata's value are marked as anchored") and
# the 45 design brief, section 7.2, tile 9.
anchored_within_days = 14
# Below this many cases a measure gives only its counts: no median, no rate and no coverage share, and no trigger
# fires on it. Source: the 45 design brief, decision 14 ("The 20-case rule now covers medians and rates per 100"),
# and DESIGN.md section 7, rules 6 and 15.
min_cases = 20
# Rolling coverage counts the packages that finished in this many months up to each watched month. Source: the 45
# design brief, section 7.4 ("Of the packages that finished in the last 12 months").
coverage_window_months = 12
# Coverage outside the band for this many watched months in a row raises a retrain. Source: docs/PLAN.md section 11
# ("interval coverage leaves 75-85% for two months").
coverage_outside_months = 2
# The time estimate's typical error trails the past range's when it is larger by more than this share, which raises
# a retrain. Source: docs/PLAN.md section 11 ("error trails the past range by more than 10%").
error_trail_share = 0.10
# The input mix drifts when a chi-square test of homogeneity between the mix the champion learned from and the
# packages advertised in the watched month gives a p-value below drift_alpha divided by the number of inputs tested
# (Bonferroni), for any input in drift_inputs (columns of strata.gold.package). Source: none in PLAN.md; the 1
# percent level and these three inputs are starting values for the model owner to confirm.
drift_alpha = 0.01
# A column not listed yet must also be added to INPUTS in src/strata/estimates/watch.py and to the SELECT in
# src/strata/estimates/sql/loop/input_mix.sql, which read only the columns named there.
drift_inputs = ["procurement_category", "procurement_method", "review_type"]
# A challenger scores in shadow beside the champion for this many months before it may be promoted, and the time
# estimate is retrained this often. Source: docs/PLAN.md section 11 ("retrained quarterly", "a quarter in shadow").
shadow_quarter_months = 3
retrain_every_months = 3
# The hazard model beats the fixed signals only when, picking as many projects as the signals did on each replay
# date, it caught more later closing-date extensions and McNemar's exact test on the discordant projects gives a
# p-value below this. It shares the signals' replay dates, follow-up window and track_record_min ([signals]).
# Source: none; the usual 5 percent level, as hindsight.mcnemar_alpha, a starting value for the owner to confirm.
hazard_beats_alpha = 0.05
# The discrete-time hazard model learns from one row per open project every hazard_period_months, from each
# project's loan history, whose follow-up window (signals.track_record_window_months) ended by the day it is trained
# on. Its logistic regression is shrunk toward no effect by hazard_ridge, so a small cohort cannot give it extreme
# weights. Source: none; quarterly rows and a ridge of 1 are starting values for the model owner to confirm.
hazard_period_months = 3
hazard_ridge = 1.0

# The demo-ready command (ticket 48; ops/demo/ready.py; docs/PLAN.md section 16, "The app stops 24 hours after a
# deploy" and "Genie stalls on a cold warehouse").
[demo_ready]
# The command restarts a running app only when its last start or deploy, as the Apps API reports it, is this many
# hours old or older (ticket 77). Source: the platform stops an app 24 hours after each start or deploy (docs/PLAN.md
# section 16), and a restart takes about eight and a half minutes (health_timeout_seconds below). With 12, a run on
# the morning of the demo restarts an app started the day before, and leaves running an app started that morning,
# which then has at least 12 hours left. A starting value for the owner to confirm.
restart_after_hours = 12
# How long the command waits for GET /api/health to answer, after it starts or restarts the app or finds it
# running. Source: the second session's run on October 26, 2026 (docs/workspace-catchup.md, ticket 48, steps 2 and
# 3) measured a restart: the App answered 200 at 09:39:47 UTC, 503 from 09:40:02, 502 from 09:42:40 and 200 again
# at 09:48:12, so it needs about eight and a half minutes, because the runtime installs ops/app/requirements.txt on
# every start. The first value, 300 seconds, failed both runs that day. 900 seconds, 15 minutes, leaves room for a
# slower start.
health_timeout_seconds = 900
# How often the command asks the health route again while it waits.
health_poll_seconds = 5
# After the command warms the warehouse and Genie, the next Genie call must answer within this many seconds.
# Source: [genie] above allows 90 seconds for a cold warehouse to start and 150 for Genie's answer; with the
# warehouse running only the answer remains, and a panel waits about a minute for a table of counts. A starting
# value for the owner to confirm.
genie_first_call_seconds = 60

# Home (ticket 41; src/strata/server/home.py). The briefing counts what changed in a window that ends on the data-through
# date, the freshness stamp's day, so the window and the records stay in step when a nightly run is late.
[home]
# The window: this many days, ending on the data-through date, counted by each plan's Disclosed date (public_from).
# The briefing writes it in words ("in the past seven days"). Source: the ticket's "One plan changed this week" and
# the 41 design brief, section 4.1, which settled the past seven days over the calendar week. On demo day the NWWDA
# plan of October 9, 2026 falls inside it only when the data-through date is October 15, 2026 or earlier (a parked
# decision for the owner).
window_days = 7
# "Worth knowing" shows this many lines and folds the rest behind "Show them"; "Waiting for you" lists this many drafts
# and then links to Drafts; the public Home lists this many closed projects. Source: DESIGN.md section 5, cards, at
# most eight per group.
lines_in_view = 8

# The daily cost pull (ticket 107; src/strata/lakehouse/costs.py, bundle/costs.yml). Azure's Cost Management query API
# answers 429, too many requests, when it throttles a subscription, as it did to the paid workspace's new subscription
# on October 27, 2026 (runs 679380286409718 and 404010923973841). The answer names the seconds to wait in its
# Retry-After header, or in its x-ms-ratelimit-microsoft.costmanagement-*-retry-after headers. The pull waits that
# long, kept between min_retry_seconds and max_retry_seconds, and tries again. When Azure still throttles the last
# try, the pull records the outcome throttled in strata.ops.cost_pulls and ends succeeded; the next day's pull tries
# again.
[costs]
# How many times one pull tries a throttled call again. The sign-in and every page of Azure's answer share them, so
# a pull whose calls are all throttled makes four tries in all. Source: the ticket.
retries = 3
# The wait when Azure's answer names none. Source: none; Azure's documentation says only to wait the time its headers
# name. A starting value for the owner to confirm.
retry_seconds = 60
# The shortest wait, whatever the headers say. Source: the ticket.
min_retry_seconds = 1
# The longest single wait. retries times this, the most one pull can wait in all, stays inside the job's
# timeout_seconds of 900 in bundle/costs.yml, so the job's clock never stops a pull that is waiting;
# tests/test_costs.py checks it.
max_retry_seconds = 240
