# The method-name registry (ticket 42; CLAUDE.md rules 4 and 9): the current Procurement Regulations' method
# names, as STEP writes them, and every other name a source writes for one. strata.config.load_method_names()
# reads it, and strata.lakehouse.clean holds the one mapping that the silver transforms (awards and notices),
# the plan reader (src/strata/reader/step.py) and the package form (src/strata/packages/form.py) all use.
#
# A source may write a method by a name from before the July 2016 Procurement Regulations (International
# Competitive Bidding, ICB), by the French plan template's names and codes (Appel d'Offres International, AOI),
# or by STEP's own French names (Appel d'offres). Strata accepts each one on input, stores the current name
# beside the words the source used, and writes the current name back. A name the registry does not list is
# kept as written and gets a Data note, never a guess.
#
# The copy file never holds these names: GLOSSARY.md lists the old ones as Avoid terms, so they reach a screen
# only as a source's words, echoed at run time.
#
# current      STEP's method names, word for word (src/strata/reader/step.py reads them as the Method column's
#              values)
#
# [[name]]     one other name or code a source writes for a method
#   written         the name or code as the source writes it. Matching ignores case, runs of spaces and whether
#                   an apostrophe is curly or straight.
#   language        the ISO 639-1 code of the language it is written in (config/languages.toml)
#   method          the current name it stands for, one of current
#   market_approach what the name also says about the market approach, in STEP's words, when it says anything
#   source, pdf_page
#                   where a recorded source writes it: a file under data/fixture/recorded and, for a document, its
#                   PDF page, which tests/ground_truth/values.toml quotes. An entry with no source was not read
#                   from a recorded source: checked = false says so, and a person who writes the language should
#                   check it against a plan before a demo relies on it.

current = [
  "Request for Bids", "Request for Quotations", "Request for Proposals", "Direct Selection",
  "Quality And Cost-Based Selection", "Quality Based Selection", "Fixed Budget Selection",
  "Least Cost Selection", "Consultant Qualification Selection", "Individual Consultant Selection",
]

