# The deck at /present (ticket 47; the 47 brief, sections 5 and 15): who presents it, and on what day, for the title
# slide. Fill both before the panel, then rebuild the deck's data with `uv run python -m strata.proposal deck`.
#
#   presenter_name     the presenter's name as the title slide shows it, or "" until it is known
#   presentation_date  the day of the panel, as 2026-10-30 in quotes, or "" until it is known
#
# The deck's addresses (the app, the dashboard, the repo, and the proposal that follows from the repo) are not set
# here: they come from config/urls.toml, the one place the proposal, the README and the deck read them.
# strata.config.load_deck() reads this file.

presenter_name = "Chirag Lakhanpal"
presentation_date = "2026-11-01"

# The deep research talk at /present/research (ticket 162): its presenters, in the order its title slide names them,
# and the day it is given, as "2026-11-07" in quotes, or "" until it is known. strata.config.load_deck_research()
# reads it; rebuild the deck's data after a change.
[research]
presenters = ["Chirag Lakhanpal", "Surya Yadav"]
presentation_date = ""

# The deck's password (the user's request of October 31, 2026). The App's server hands the deck's code, its data and
# the study guide's diagrams only to a browser that has given it, so the slides and the speaker notes stay with the
# presenter, even for people signed into the App. Only the password's PBKDF2-SHA256 digest and its salt are here,
# never the password. Delete this table and the deck opens without one.
[gate]
salt = "297d89ed78926d291670d47cd89b0627"
iterations = 100000
digest = "7e70d9e8656e1bf93911962bf9de0734a18c8e330b74c0160b39dc6d4465a687"
