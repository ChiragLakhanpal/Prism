# The Genie space, built from code (ticket 33; docs/PLAN.md section 12, "genie.py (the Genie space from code)").
#
# This is the one place the space is defined. ops/genie/deploy_space.py makes the workspace's space match it, and
# a second run reports no change: src/strata/genie/space.py gives every item an id made from a stable key, sorts
# every list by its id or identifier, and sends exactly one text instruction (fairshare's docs/limits.md, as
# ticket 33's notes give it). The deploy never changes a space whose title is not this one, because the workspace
# is shared with fairshare.
#
# The space reads the metric views in src/strata/lakehouse/metric_views/ and the gold tables listed here. Its
# trusted SQL is in src/strata/genie/trusted/, one file per question, and keeps MEASURE() there. Its benchmark
# questions are the questions in evals/benchmark.yaml that ask_genie answers, each with plain ground-truth SQL
# over the gold tables (tests/ground_truth), so the offline gate checks each expected answer on the fixture.
# Adding a benchmark question is one entry in evals/benchmark.yaml and its ground-truth SQL file.

[space]
title = "Strata: World Bank procurement records"
description = """Signed contracts and procurement packages on World Bank-financed projects, from Strata's \
gold tables. Ask in plain words, such as how many contracts a country signed in a fiscal year."""
# The space's one text instruction. Genie reads it with every question. Rules live here, never in a question.
instruction = """These are World Bank procurement records from Strata's gold tables. A contract is one signed \
contract, from the contract awards datasets or from a Contract Award notice. A package is one STEP reference: \
one procurement activity in a Procurement Plan. Fiscal years run from July 1 to June 30, so fiscal 2021 began on \
July 1, 2020. Amounts are in US dollars, with their cents. Use the measures of the metric views with MEASURE(). \
Return counts and amounts exactly as the measures give them: do not round them, scale them or turn them into \
shares. Never name a person: an individual consultant's supplier row has no name, and it stays that way."""
metric_views = ["strata.gold.contract_metrics", "strata.gold.package_metrics"]
tables = ["strata.gold.contract_supplier"]
sample_questions = [
  "How many contracts were signed in each fiscal year, and for how much in US dollars?",
  "How many of Kenya's goods packages were signed, canceled or still open, by procurement method?",
]

# Trusted SQL: a question and the SQL Genie should follow for it, in src/strata/genie/trusted/.
[[trusted]]
question = "How many contracts did India sign in the contract awards for fiscal 2001 to 2016, and how many of them carry a STEP reference?"
sql = "contracts_and_step_references.sql"

[[trusted]]
question = "How many contracts were signed in each fiscal year, and for how much in US dollars?"
sql = "contracts_by_fiscal_year.sql"

[[trusted]]
question = "How many of Kenya's goods packages were signed, canceled or still open, by procurement method?"
sql = "package_states.sql"

[[trusted]]
question = "Which suppliers signed a contract together, and what was each one's share in US dollars?"
sql = "joint_venture_members.sql"

[[trusted]]
question = "When was the contract for a STEP reference signed, and for how much in US dollars?"
sql = "contract_of_a_package.sql"
