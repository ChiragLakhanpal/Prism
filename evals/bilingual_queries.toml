# The bilingual query set, for retrieval across languages (ticket 42; spec story 49): English queries whose answers
# are in a French completion report, and French queries whose answers are in an English one. The weekly retrieval
# run builds it into the labeled set (strata.ops.retrieval_labels) as two evaluation sets of its own, and the
# retrieval evaluation (src/strata/estimates/retrieval.py) stores each set's recall at 20, precision at 10 and nDCG
# at 10 in strata.ops.evaluation_result under the set's name, as it does for the other evaluation sets.
#
# bilingual_en_fr   English queries over the French ICR of Haiti's Rebuilding Energy Infrastructure and Access
#                   Project (P127203, ICR4990, documents API id 33407968), the stress shelf's report in another
#                   language (config/slice.toml)
# bilingual_fr_en   French queries over the English ICR of the India Rajasthan Road Sector Modernization Project
#                   (P130164, documents API id 31525018), the reverse
#
# The builder wrote these queries on October 25, 2026, reading each labeled paragraph in its own language, as a
# specialist planning similar work would ask. The labels are a builder's, not two query judges': two people who
# read both languages should check them before the set's numbers go in the proposal (a parked decision).
#
# Offline, the fixture search reads hashed words, not meanings, so an English query rarely shares words with a
# French paragraph, and its recall at 20 shows only that the harness computes and stores the number: it is never a
# finding. The finding comes from text-embedding-3-large on AI Search: ops/retrieval/evaluate_live.py --env-file
# .env stores it.
#
# [[query]]
#   id          a short id of its own, which never changes
#   set         bilingual_en_fr or bilingual_fr_en
#   text        the query, in English for bilingual_en_fr and in French for bilingual_fr_en
#   project_id  the project the query is about, which its search keeps to
#   date        the query's date: the day after its report became public, the first day a search can find it
#   relevant    the passages that answer it, by passage id, each with its grade: 2 answers it, 1 partly

[[query]]
