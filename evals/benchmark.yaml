      Request for Bids is dated from October 10 to October 22, 2026: the same Kaplan-Meier quantiles in
      tests/ground_truth/values.toml ([past_range]), the same four still open and three canceled left out.
      With no plan row there is no plan, so nothing is counted within one. The summary's evidence id has no
