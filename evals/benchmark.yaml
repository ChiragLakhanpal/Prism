  - id: get-disagreements-p130164
    kind: documents
    tool: get_disagreements
    question: >-
      For P130164, did the reports disagree about how the project was progressing towards its
      development objective, and which one does Strata lean on?
    arguments:
      subject_id: P130164
      attribute: pdo_progress
      as_of: "2026-10-23"
    expected:
      disagreements:
        - [strata.gold.passage:26733307/v1/s4, strata.gold.passage:31525018/v1/78]
      leans_on: [strata.gold.passage:31525018/v1/78]
      rules: [outcome]
      # Each side is a record of its own, and a side that rests on a passage carries its words, so a claim
      # can quote paragraph 78 from it.
      quotable_sides: [strata.gold.passage:26733307/v1/s4, strata.gold.passage:31525018/v1/78]
      # The sides whose passage's words the tool kept from the agent, because Prompt Shields found a prompt
      # attack in it or never screened it, as search_passages leaves such passages out (ticket 64).
      left_out: []
      # The trajectory and the count of left-out assertions come back in the result's summary record,
      # which an answer cites by this evidence id.
      cited_as: ["strata.tools.get_disagreements:P130164@2026-10-23?attribute=pdo_progress"]
      trajectory_runs:
        - [Satisfactory, 1, 9]
        - [Moderately Satisfactory, 10, 11]
        - [Moderately Unsatisfactory, 12, 13]
      rejected: [1]
      # The disagreements about one fact are one group with its count (ticket 136): here one pair about one fact,
      # as [attribute, rule, count, anchor side, anchor document], and the summary's count of groups over
      # disagreements. A group is a star around the one report its pairs share, its anchor.
      groups:
        - [pdo_progress, outcome, 1, earlier, "26733307"]
      counts: [1, 1]
    # A disagreement shows both sides (the verifier's check 6), so the answer cites both.
    cites: [strata.gold.passage:26733307/v1/s4, strata.gold.passage:31525018/v1/78]
    ground_truth: tests/ground_truth/p130164_isr_7_against_icr_paragraph_78.sql
    source: >-
      The blueprint's "When reports disagree, both stay on screen" and the ticket: ISR 7 (August 26,
      2016) rated progress towards the PDO Satisfactory, three months after the mid-term review of May
      16, 2016, and the ICR's paragraph 78 (October 10, 2019, PDF page 27) says the review found part of
      the PDO compromised. Progress towards the PDO is an outcome judgment, so the evidence ladder leans
      on the ICR. The ISRs' ratings are a trajectory (tests/ground_truth/values.toml, isr-1-rating to
      isr-13-rating). The recording plants one rating whose quote is not on paragraph 45's page, which
      the run left out and counts. Prompt Shields screened both sides' passages and found no attack in
      either, so both keep their words and none is left out. ISR 7 and paragraph 78 are the only pair about
      progress towards the PDO in the fixture, so they are one group of one, anchored on the earlier report,
      ISR 7, since a pair shares each of its reports once and a tie goes to the earlier side.
  - id: get-lessons-cost-estimates
    kind: documents
    tool: get_lessons
    question: >-
      What lessons does Strata's library hold on works cost estimates and rebidding, did IEG's
      review of the completion report say the same, and how many completion reports of projects with
      a works package under Request for Bids like IN-RRSMP-7431-CW-RFB raised each risk?
    arguments:
      query: works contract estimates market rates rebidding
      packages: IN-RRSMP-7431-CW-RFB
      as_of: "2026-10-28"
    # The library holds lessons only after two people decide them, so the offline gate asks this
    # question once tests/lesson_scenario.py has had reviewers from tests/fixtures/roles.toml add the
