# The benchmark file: questions with their expected answers or citations (docs/PLAN.md section 10;
# spec, "Ten single places", item 9). It holds four kinds of question: sql (with ground-truth SQL),
# documents (with the citations the answer must carry, cites), estimates (with the range or the
# abstention expected) and refusals (the must-refuse set, one question per refusal key). It holds at
# least ten questions of each kind but refusals (config/thresholds.toml, [benchmark]), and
# src/strata/evals/benchmark.py says what it lacks.
#
# Each tool in the tool registry (config/tools.toml) names its question here by id, and changing a
# tool's contract means updating its question in the same change (CLAUDE.md rule 4); a test fails
# when a tool has none. The offline gate calls each tool question's tool with its arguments on the
# fixture database and checks the expected answer (tests/test_tools.py). The full gate
# (ops/evals/full_gate.py) asks every question here through /api/ask with the live agent and scores
# the answer (src/strata/evals/scoring.py), so a question added here runs in the next full gate with
# no other change. The questions ask_genie answers are also the Genie space's benchmark questions.
#
# Each question has: id, kind, tool (for a question a tool answers), the question as a person would
# ask it, the tool's arguments, the expected answer, the ground-truth SQL that checks the same
# answer, and where the expected answer comes from. A question may set as_of and scope, which the
# full gate asks it with; as_of: null asks it as of the day the full gate runs.

questions:
  - id: check-plan-nwwda-2026-10-09
    kind: sql
    tool: check_plan
    question: >-
      As of October 22, 2026, which activities in the Northern Water Works Development Agency's
      Procurement Plan of October 9, 2026 for P156634 need a look, which are worth watching, and
      which have data notes?
    arguments:
      project_id: P156634
      implementing_agency: Northern Water Works Development Agency
      plan_date: "2026-10-09"
      as_of: "2026-10-22"
    expected:
      needs_a_look: [KE-NWWDA-541055-CW-RFB]
      watch: [KE-NWWDA-229129-CW-RFB, KE-NWWDA-541062-CW-RFQ]
      data_note: [KE-NWWDA-199461-GO-RFB, KE-NWWDA-503455-CW-RFQ, KE-NWWDA-541061-CW-RFQ]
      unmarked: [KE-NWWDA-199471-GO-RFQ, KE-NWWDA-207796-CS-INDV, NWWDA-WSDP-03-2019-2020]
      # The activities with a signal (needs a look or watch), which the result's counts.signal counts
      # and "Draft review notes (3 rows)" drafts a note on (ticket 35).
      with_a_signal: [KE-NWWDA-229129-CW-RFB, KE-NWWDA-541055-CW-RFB, KE-NWWDA-541062-CW-RFQ]
      # The activities whose reasons also give the delay from a saved baseline (ticket 21). The fixture
      # holds no baseline, so none does; tests/test_project_hub.py saves the plan of July 21, 2025 as the
      # baseline, with KE-NWWDA-229129-CW-RFB's signing re-dated to August 1, 2021 in it, and checks that
      # the signing was then 155 days after its baseline date and still 186 after its first published one.
      baseline_delays: []
      # The plan's counts come back as one citable record, the summary, which a Project Paper summary cites for
      # them (ticket 36): the nine activities the plan lists, with the marks above.
      activities: [9]
      counts_cited_as: ["strata.tools.check_plan:P156634/Northern%20Water%20Works%20Development%20Agency@2026-10-22?plan_date=2026-10-09"]
      # Ticket 38: a row's place in an implementing agency's upload. A published plan's rows have none, and the
      # tool reads an upload only through the app's team rule (upload_id), which no benchmark call passes, so an
      # upload never reaches an answer; tests/test_uploads.py checks an upload of this plan by team.
      upload_positions: []
      # Ticket 41: each activity with a signal and its estimate in US$ millions to two decimals, which Home's briefing
      # line writes ("US$1.23 million of works"): values.toml plan-541055-estimated (US$1,230,000.00), and the
      # estimates of US$300,000.00 and US$295,000.00 the plan gives the two activities worth watching.
      estimated_millions: ["KE-NWWDA-229129-CW-RFB 0.3", "KE-NWWDA-541055-CW-RFB 1.23", "KE-NWWDA-541062-CW-RFQ 0.3"]
      # Ticket 131: the activities whose reference breaks STEP's grammar and stays as the plan gives it. Every
      # reference the fixture's plan reads is in STEP's grammar or an older form, so no row keeps one as read;
      # tests/test_plan_text_repair.py reads one such reference into a copy of the plan and checks the pages.
      reference_as_read: []
    ground_truth: tests/ground_truth/check_plan_nwwda_2026_10_09.sql
    source: >-
      The marks the blueprint's Check a plan wireframe gives the plan's eight activities
      (tests/ground_truth/values.toml, plan_row wireframe_mark), and the ninth activity the
      wireframe leaves out, with no mark (values.toml, plan.also_lists).

