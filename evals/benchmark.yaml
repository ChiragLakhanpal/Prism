      US$10 million. How many comparable packages of KE-CWSB-224323-CS-QCBS whose criteria are public asked for
      the same or less?
    comparables_of:
      step_reference: KE-CWSB-224323-CS-QCBS
      as_of: "2026-10-22"
    arguments:
      items: '[{"item_key": "similar_experience", "parts": {"contracts": 2, "amount": {"value": "10000000", "currency": "USD"}}}]'
      as_of: "2026-10-22"
    expected:
      public: [14, 17]
      similar_experience: [13, 13, 13]
      still_open: [KE-GAWASCO-202394-CS-QCBS, KE-WASREB-229126-CS-QCBS]
    # One counted comparable's requirement, in the notice text it was read from: KE-KWAWASCO-105286-CS-QCBS asked
    # for two projects of similar nature with no amount, the same or less (values.toml, criteria-OP00118816).
    cites: [strata.gold.passage:OP00118816/v1/s5]
    source: >-
      The specific procurement notices of the 17 comparables, recorded in
      data/fixture/recorded/api/notices/P156634.json. The 15 signed comparables' notices hold their short-listing
      criteria; 14 set at least one requirement, and 13 of them ask for "at least one (1) similar assignment" or
      "at least two (2) similar assignments" (or projects of similar nature) with no amount, so each asked for the
      same or less. The two still open are never compared. similar_experience gives stated, compared and
      same_or_less.

