# The benchmark file: questions with their expected answers or citations (docs/PLAN.md section 10;
# spec, "Ten single places", item 9). It holds four kinds of question: sql, documents, estimates and
# refusals. Ticket 33 adds the runner that asks each one through the live answer contract, and the
# other kinds.
#
# Each tool in the tool registry (config/tools.toml) names its question here by id, and changing a
# tool's contract means updating its question in the same change (CLAUDE.md rule 4). The offline
# gate calls each tool question's tool with its arguments on the fixture database and checks the
# expected answer (tests/test_tools.py).
#
# Each question has: id, kind, tool (for a question a tool answers), the question as a person would
# ask it, the tool's arguments, the expected answer, the ground-truth SQL that checks the same
# answer, and where the expected answer comes from.

questions:
  - id: check-plan-nwwda-2026-10-09
    kind: sql
    tool: check_plan
    question: >-
      As of October 22, 2026, which activities in the Northern Water Works Development Agency's
      Procurement Plan of October 9, 2026 for P156634 need a look, which are worth watching, and
      which have data notes?
    arguments:
      project_id: P156634
      implementing_agency: Northern Water Works Development Agency
      plan_date: "2026-10-09"
      as_of: "2026-10-22"
    expected:
      needs_a_look: [KE-NWWDA-541055-CW-RFB]
      watch: [KE-NWWDA-229129-CW-RFB, KE-NWWDA-541062-CW-RFQ]
      data_note: [KE-NWWDA-199461-GO-RFB, KE-NWWDA-503455-CW-RFQ, KE-NWWDA-541061-CW-RFQ]
      unmarked: [KE-NWWDA-199471-GO-RFQ, KE-NWWDA-207796-CS-INDV, NWWDA-WSDP-03-2019-2020]
      # The activities with a signal (needs a look or watch), which the result's counts.signal counts
      # and "Draft review notes (3 rows)" drafts a note on (ticket 35).
      with_a_signal: [KE-NWWDA-229129-CW-RFB, KE-NWWDA-541055-CW-RFB, KE-NWWDA-541062-CW-RFQ]
    ground_truth: tests/ground_truth/check_plan_nwwda_2026_10_09.sql
    source: >-
      The marks the blueprint's Check a plan wireframe gives the plan's eight activities
      (tests/ground_truth/values.toml, plan_row wireframe_mark), and the ninth activity the
      wireframe leaves out, with no mark (values.toml, plan.also_lists).

  - id: find-comparables-ke-nwwda-541055
    kind: estimates
    tool: find_comparables
    question: >-
      As of October 22, 2026, how long did packages like KE-NWWDA-541055-CW-RFB take from their
      notice to a signed contract, and how many were signed within the 1.5 months its plan allows?
    arguments:
      step_reference: KE-NWWDA-541055-CW-RFB
      as_of: "2026-10-22"
    expected:
      past_range_months: [3.3, 4.4, 7.9, 9.1]
      cited_as: ["strata.tools.find_comparables:KE-NWWDA-541055-CW-RFB@2026-10-22"]
      still_open: [KE-ICTA-571738-CW-RFB, KE-KAJIADO COUNTY-567787-CW-RFB, KE-MIGORI COUNTY-532367-CW-RFB,
                   KE-UASIN GISHU COUNTY-571338-CW-RFB]
      canceled_left_out: [KE-KIMAWASCO-149448-CW-RFB, KE-KIMAWASCO-157517-CW-RFB, KE-KIMAWASCO-377450-CW-RFB]
      signed_within_plan: [KE-WAJWASCO-356671-CW-RFB, KE-WAJWASCO-372776-CW-RFB]
      # The numbers "8 in 10 were signed within" and "2 of 49, fewer than 1 in 10" state, and the words
      # that go with the plan's.
      eight_in_ten: [8, 10]
      plan_in_ten: [1, 10]
      plan_in_ten_words: [fewer_than]
    ground_truth: tests/ground_truth/past_range_coverage_ke_works_rfb.sql
    source: >-
      The comparables and their Kaplan-Meier quantiles in tests/ground_truth/values.toml ([[comparable]]
      and [past_range]): the middle half, the middle and the 8-in-10 point in months, computed once
      with lifelines and checked with statsmodels, the four packages still open, the three canceled
      ones left out, and the two signed within the plan's 1.5 months, which round to fewer than 1 in
      10. The past range and the numbers its "in 10" phrases state, with the words that go with the
      plan's, come back in the result's summary record, which an answer cites by the evidence id in
      cited_as.

  # Ticket 15: the same tool for a package someone is planning from a sentence, which has no STEP row, so
  # the call gives its criteria itself and notices run to the as-of date.
  - id: find-comparables-planned-ke-works-rfb
    kind: estimates
    tool: find_comparables
    question: >-
      As of October 22, 2026, I am planning a works package under Request for Bids in Kenya that is not in
      a Procurement Plan yet. How long did comparable packages take from their notice to a signed contract?
    arguments:
      method: Request for Bids
      category: Works
      country: KE
      as_of: "2026-10-22"
    expected:
      past_range_months: [3.3, 4.4, 7.9, 9.1]
      cited_as: ["strata.tools.find_comparables:@2026-10-22?method=Request%20for%20Bids&category=Works&country=KE"]
      still_open: [KE-ICTA-571738-CW-RFB, KE-KAJIADO COUNTY-567787-CW-RFB, KE-MIGORI COUNTY-532367-CW-RFB,
                   KE-UASIN GISHU COUNTY-571338-CW-RFB]
      canceled_left_out: [KE-KIMAWASCO-149448-CW-RFB, KE-KIMAWASCO-157517-CW-RFB, KE-KIMAWASCO-377450-CW-RFB]
      eight_in_ten: [8, 10]
    ground_truth: tests/ground_truth/past_range_coverage_ke_works_rfb.sql
    source: >-
      The same 49 comparables as find-comparables-ke-nwwda-541055, since no Kenya works notice under
      Request for Bids is dated from October 10 to October 22, 2026: the same Kaplan-Meier quantiles in
      tests/ground_truth/values.toml ([past_range]), the same four still open and three canceled left out.
      With no plan row there is no plan, so nothing is counted within one. The summary's evidence id has no
      STEP reference before the as-of date, and the criteria the call gave after it.

  - id: search-passages-icr-rebidding
    kind: documents
    tool: search_passages
    question: >-
      In P130164, why did so many works contracts have to go through rebidding, and what does the
      completion report say about the estimates?
    arguments:
      query: works estimates market rates rebidding
      project_id: P130164
      as_of: "2026-10-23"
    expected:
      top_three_include: [strata.gold.passage:31525018/v1/54]
      left_out: []
    ground_truth: tests/ground_truth/icr_paragraph_54_passage.sql
    source: >-
      The ticket's query and its known answer: ICR P130164 paragraph 54, on PDF page 23, "108 of 328
      cases had to go through rebidding" (tests/ground_truth/values.toml, icr-para-54). No passage
      the query matches holds a prompt attack or lacks a Prompt Shields result, so none is left out.

  - id: search-passages-similar-experience
    kind: documents
    tool: search_passages
    question: >-
      Which procurement notices ask consultants for experience on similar work?
    arguments:
      query: similar experience
      as_of: "2026-10-23"
    expected:
      top_three_include: [strata.gold.passage:OP00118817/v1/s5, strata.gold.passage:OP00128730/v1/s6]
      left_out: []
    source: >-
      Ticket 18 indexed notices' scope and qualification text as passages. The two Requests for
      Expression of Interest in tests/ground_truth/values.toml ([stress_shelf.similar_experience]) ask
      for "experience on similar projects" and "experience with similar successful assignments", each
      in one section of its notice.

  - id: data-readiness-kenya-awards
    kind: sql
    tool: data_readiness_for
    question: >-
      As of October 23, 2026, how many of the contract awards since fiscal 2020 carry a STEP
      reference, and which fiscal years of contract awards does no World Bank dataset publish?
    arguments:
      sources: awards
      as_of: "2026-10-23"
    expected:
      linked_step_reference: [528, 603]
      known_gaps: [fy2017_2019]
    ground_truth: tests/ground_truth/kenya_step_reference_link_rate.sql
    source: >-
      Kenya's 603 contracts and the 528 of them that carry a STEP reference, counted from the recorded
      award files apart from Strata's code (tests/ground_truth/values.toml, counts.kenya). The fixture
      records awards for Kenya only, so the awards source's row for every country holds Kenya's. The
      gap is PLAN.md section 3's: neither awards dataset covers fiscal 2017 to 2019.

  - id: data-readiness-stress-shelf
    kind: sql
    tool: data_readiness_for
    question: >-
      As of October 23, 2026, how many rated risks did Strata recover from the risk annex of the
      P130164 Project Appraisal Document, and what did it count them against?
    arguments:
      as_of: "2026-10-23"
    expected:
      rated_risks_recovered: [8, null]
    source: >-
      Ticket 18's stress shelf (config/tools.toml, data_readiness_for's stress_shelf field). The annex's
      eight rated risks are quoted page by page in tests/ground_truth/values.toml
      ([stress_shelf.pad_risk_annex]), counted from the scan's text layer. config/slice.toml gives no
      hand count yet, so the outcome has no denominator to check against.

  - id: get-disagreements-p130164
    kind: documents
    tool: get_disagreements
    question: >-
      For P130164, did the reports disagree about how the project was progressing towards its
      development objective, and which one does Strata lean on?
    arguments:
      subject_id: P130164
      attribute: pdo_progress
      as_of: "2026-10-23"
    expected:
      disagreements:
        - [strata.gold.passage:26733307/v1/s4, strata.gold.passage:31525018/v1/78]
      leans_on: [strata.gold.passage:31525018/v1/78]
      rules: [outcome]
      # Each side is a record of its own, and a side that rests on a passage carries its words, so a claim
      # can quote paragraph 78 from it.
      quotable_sides: [strata.gold.passage:26733307/v1/s4, strata.gold.passage:31525018/v1/78]
      # The trajectory and the count of left-out assertions come back in the result's summary record,
      # which an answer cites by this evidence id.
      cited_as: ["strata.tools.get_disagreements:P130164@2026-10-23?attribute=pdo_progress"]
      trajectory_runs:
        - [Satisfactory, 1, 9]
        - [Moderately Satisfactory, 10, 11]
        - [Moderately Unsatisfactory, 12, 13]
      rejected: [1]
    ground_truth: tests/ground_truth/p130164_isr_7_against_icr_paragraph_78.sql
    source: >-
      The blueprint's "When reports disagree, both stay on screen" and the ticket: ISR 7 (August 26,
      2016) rated progress towards the PDO Satisfactory, three months after the mid-term review of May
      16, 2016, and the ICR's paragraph 78 (October 10, 2019, PDF page 27) says the review found part of
      the PDO compromised. Progress towards the PDO is an outcome judgment, so the evidence ladder leans
      on the ICR. The ISRs' ratings are a trajectory (tests/ground_truth/values.toml, isr-1-rating to
      isr-13-rating). The recording plants one rating whose quote is not on paragraph 45's page, which
      the run left out and counts.
