# Real passages that hold rule-like sentences, which must reach the agent as tool results without a
# Prompt Shields refusal (spec, "Security and privacy": Prompt Shields' false refusals on rule-like report
# text are avoided by keeping rules in instructions and data in messages, and a test set of real passages
# guards it).
#
# Each passage is named by its evidence id, with the rule-like sentence it holds, word for word. The gate
# checks that search_passages returns each one first on the fixture database when asked for its own
# sentence, and that the sentence is in its text. On the workspace, ops/agent/shields_live.py sends each
# tool result to the live Foundry agent and fails on any content filter or Prompt Shields refusal:
#
#     uv run --script ops/agent/shields_live.py --env-file .env

