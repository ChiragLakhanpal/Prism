# The fixture's sources. Every offline test reads the files recorded from these.
#
# Each [[source]] is one recorded copy of a public World Bank source:
#   file     where it is recorded, under data/fixture/recorded/. A document records two
#            files: <file>.txt (the published text) and <file>.pages.txt (the text of each
#            PDF page, one after each form feed).
#   kind     "json" for an API response, "document" for a document's text and pages.
#   dataset  the entry under [datasets] whose attribution and license line the file carries.
#   url, or text_url and pdf_url   where it is fetched from.
#   about    one sentence on what it is and why the fixture holds it.
#
# Each [datasets] entry has an attribution, the source and license line its files carry. An
# optional ignore_keys lists keys the recording command leaves out of its diff, such as the
# as_of_date that Finances One stamps on each row every day. It still saves them as received.
#
# To refresh the fixture, run `uv run python -m strata.fixture.record`, read the diff, then
# run it again with --write. To add a source, add an entry here and record it with --only.

recorded = "recorded"

# Size limits that keep the gate well under two minutes. tests/test_fixture.py checks them.
# A source that would break them is recorded as text, or narrowed, before it is added.
[limits]
file_mb = 5
total_mb = 25

[datasets.projects]
attribution = "The World Bank: World Bank Projects & Operations: Projects API (search.worldbank.org/api/v3/projects). License: CC BY 4.0."

[datasets.document_list]
attribution = "The World Bank: Documents & Reports: Documents API (search.worldbank.org/api/v3/wds). License: CC BY 4.0."

[datasets.documents]
attribution = "The World Bank: Documents & Reports (documents.worldbank.org). License: CC BY 4.0."

[datasets.notices]
attribution = "The World Bank: Procurement Notices: Systematic Tracking of Exchanges in Procurement (STEP), from search.worldbank.org/api/v2/procnotices. License: CC BY 4.0."

[datasets.awards]
attribution = "The World Bank: Contract Awards in Investment Project Financing (Since FY 2020): Systematic Tracking of Exchanges in Procurement (STEP), Finances One dataset DS00005. License: CC BY 4.0."
ignore_keys = ["as_of_date"]

[datasets.awards_fy2001_2016]
attribution = "The World Bank: Contract Awards in Investment Project Financing (FY 2001 to FY 2016, prior review only), Finances One dataset DS01004. License: CC BY 4.0."
ignore_keys = ["as_of_date"]

[datasets.ieg_ratings]
attribution = "The World Bank: IEG World Bank Project Performance Ratings, Finances One dataset DS00053. License: CC BY 4.0."
ignore_keys = ["as_of_date"]

[datasets.ida_credits]
attribution = "The World Bank: IDA Statement of Credits, Grants and Guarantees (latest), Finances One dataset DS00001. License: CC BY 4.0."

[datasets.ida_credit_history]
attribution = "The World Bank: IDA Statement of Credits, Grants and Guarantees (historical monthly), Finances One dataset DS00976. License: CC BY 4.0."

[datasets.cpia]
attribution = "The World Bank: World Development Indicators: Country Policy and Institutional Assessment (IQ.CPA codes), from api.worldbank.org/v2. License: CC BY 4.0."

[datasets.wgi]
attribution = "The World Bank: Worldwide Governance Indicators (GOV_WGI codes), from api.worldbank.org/v2. License: CC BY 4.0."

[datasets.ibrd_loans]
attribution = "The World Bank: IBRD Statement of Loans and Guarantees - Latest Available Snapshot, Finances One dataset DS00047. License: CC BY 4.0."

[datasets.ibrd_loan_history]
attribution = "The World Bank: IBRD Statement Of Loans and Guarantees - Historical Data, Finances One dataset DS00975. License: CC BY 4.0."

