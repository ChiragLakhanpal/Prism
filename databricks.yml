# Strata's Declarative Automation Bundle (the new name for Databricks Asset Bundles).
#
# It declares the strata catalog, its four schemas and the bronze files volume (bundle/catalog.yml),
# the nightly job (bundle/nightly.yml) and the AI/BI dashboard (bundle/dashboard.yml). Deploy it with the command in bundle/README.md, which
# also creates the tables and reports what changed. The bundle's notes, with both nightly
# schedules, are in bundle/README.md.

bundle:
  name: strata
  # A catalog can be a bundle resource only with the direct deployment engine, from CLI 0.287.0.
  engine: direct
  databricks_cli_version: ">= 0.287.0"

include:
  - bundle/*.yml

# The Python package, the config files and the bundle's own files go to the workspace. The job's
# tasks import the package and read config/ from there, and the readiness task reads databricks.yml
# and bundle/*.yml (strata.lakehouse.bundle.load) to know which schemas the catalog declares.
sync:
  paths:
    - src
    - config
    - bundle
    - databricks.yml

variables:
  readers:
    description: >-
      Who can read the catalog, so the app can run each query as the viewer (ADR 0003).
      "account users" is everyone who can sign in to the workspace.
    default: account users
  nightly_pause_status:
    description: UNPAUSED runs the nightly job on its schedule. PAUSED leaves only manual runs.
    default: UNPAUSED
  warehouse_id:
    description: >-
      The SQL warehouse the dashboard's queries run on. ops/bundle/deploy.py passes the env file's
      DATABRICKS_WAREHOUSE_ID.

targets:
  # The Free Edition workspace that Strata shares with fairshare. The deploy command passes the
  # host and the token from the main checkout's .env. There is no development mode: it would add
  # a prefix to the schema names, and Strata's SQL names them strata.bronze, strata.silver and so on.
  shared:
    default: true
