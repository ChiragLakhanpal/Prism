# The sources a pre-seeded deep research brief for P161305, the Horn of Africa Gateway Development Project (the
# Isiolo to Mandera road), cites, as the demo seed loads them (ops/research/seed.py, tickets 147 and 153). Researched
# by hand on November 5, 2026: every article below is a page read that day with Prism's named client
# (prism-research/0.1), recorded with ops/research/record.py's recorder under data/fixture/recorded/research/.
#
# Each [[cited]] is one numbered source with the items that stand for it, in the order a procurement specialist needs
# them: works stalling or moving, contractors paid or not, security incidents on the works, compensation disputes,
# procurement, the agency's own account, then the Bank's notices and records. An item names its registry source
# (config/research.toml) and either the key a reader gives it (the notices, the Inspection Panel, the Sentinel-2 grids)
# or an article's address (url). outlet, title and published are what the outlet prints; published is empty when the
# outlet prints no date or its page could not be read.
#
# Who refused the named client on November 5, 2026: Eastleigh Voice answered every article page with a bot check (403),
# so its two items keep only the headline, as for P156634. GDELT answered 429. transport.go.ke answered 503. KeNHA's
# news page lists its entries by script and its project page for the road holds only an embedded X feed, so KeNHA's
# side comes from the State Department for Roads (roads.go.ke), an implementing agency in the project record. The
# Northern Water Works Development Agency's news page (nwwda.go.ke/index.php/news-events) answered 200 but lists no
# entry about the road or its towns. The home pages of the Wajir and Mandera county sites list no notice about the
# road, and Isiolo's answered a page of 4 KB with no news.
#
# Left out on purpose: the World Bank's press release of March 27, 2026 on the additional financing and HoAGDP II
# (its text carries a media contact's email); the Auditor-General's report on the project for the year ended June 30,
# 2025 (issued February 24, 2026, Parliament of Kenya library item bf3574e2-e2da-4416-a179-811ca7f5f87d), whose
# catalog page renders by script and whose PDF is 30 MB, so the seed could read neither.
#
# The ISR passages: the fixture records no ISR of P161305 (only its Procurement Plan of September 24, 2026), so this
# file cites none. On the workspace the isr_narrative reader can give them once ticket 152's seed reads gold.passage.
#
# The sites: the fixture's Kenya projects file holds P161305's record without geo_locations, so the seed's project
# facts have no location there. The projects API's live record (recorded under isr_narrative) lists 35, most of them
# in Ethiopia, Somalia and Djibouti for the regional programme. These three are on the road, with the record's own
# geo_loc_id and coordinates (search.worldbank.org/api/v3/projects?id=P161305, read November 5, 2026): Kulamawe, on the
# Isiolo-Kulamawe-Modogashe section, 45 percent complete in November 2025 (Kenya News Agency); Habaswein, where the
# President promised on May 31, 2026 to revive the stalled Modogashe-Samatar section (Kenyans.co.ke); El Wak, where the Wajir-Tarbaj-Kotulo phase ends and the El Wak-Rhamu section begins, and
# where al-Shabaab raided the camp of Chinese road builders on December 16, 2025.

