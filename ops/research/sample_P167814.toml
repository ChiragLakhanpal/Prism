# The sources a pre-seeded deep research brief for P167814, the Second Kenya Informal Settlements Improvement Project
# (KISIP 2), cites, as the demo seed loads them (ops/research/seed.py, tickets 147 and 153). Researched by hand on
# November 5, 2026, in the shape of sample_P156634.toml.
#
# Each [[cited]] is one numbered source, with the items that stand for it, the most useful to a procurement specialist
# first. An item names its registry source (config/research.toml) and either the key a reader gives it (key, for the
# readers the seed runs: the notices, the Inspection Panel, the Sentinel-2 grids) or an article's address (url), whose
# page was recorded on November 5, 2026 with the named client (prism-research/0.1) under
# data/fixture/recorded/research/<source>/, in ops/research/record.py's naming and body. For an article, outlet, title
# and published are what the outlet prints; published is empty when the outlet prints no date. A county's own news
# page is an item under outlet_feeds with the county government as its outlet, so the brief can give the agency's side.
#
# What answered the named client that day: every page cited here answered 200 with its article. None answered 403 or
# a bot check. Left out, so no item stands on a page Prism could not read: Nairobi City County's own notice of its
# warnings to the KISIP contractors (nairobi.go.ke answered 500); The Brief's story on Bungoma (thebrief.co.ke could
# not be reached: its certificate names another host); The Star's story of December 3, 2025 on the Housing PS asking
# the EACC to investigate Nyamira and Kajiado, and The Standard's of May 21, 2026 on the Sh27.8 billion programme (both
# answered 200, but their pages hold no article text a reader can take, only other headlines); Meru County's page on
# the facilitation of people affected by road works (its paragraphs carry the county's contact details); and the State
# Department for Housing and Urban Development's site, which answered with its home page and no KISIP news.
#
# The fixture database holds no ISR passage for P167814, so this file cites none; on the workspace, ticket 152's seed
# reads the project's ISR passages and notices from the warehouse. The fixture holds no notice for P167814 either, so
# the notices cited by key below load only where the engine holds them.
#
# The project record (search.worldbank.org/api/v3/projects, fl=*, recorded under research/isr_narrative/) lists ten
# geo_locations, Kayole among them, so the Sentinel-2 grids below use its locations and this file needs no sites list.

