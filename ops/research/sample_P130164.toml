# The sources a deep research brief for P130164, the Rajasthan Road Sector Modernization Project (closed December 31,
# 2018), cites, as the demo seed loads them (ops/research/seed.py, tickets 147 and 153). Researched by hand on
# November 5, 2026: every article below is a page ops/research/record.py recorded that day with Prism's named client.
#
# The shape is sample_P156634.toml's. Each [[cited]] is one numbered source, with the items that stand for it. An item
# names its registry source (config/research.toml) and either the key a reader gives it (key, for the readers the seed
# runs: the ISR passages, the Inspection Panel, the Sentinel-2 grids) or an article's address (url). For an article,
# outlet, title and published are what the outlet prints; published is empty when the outlet prints no date, or when
# its page refused the named client so the date could not be read.
#
# The project is closed, so the outside items are the ground record since closing: the state of the rural roads and
# their upkeep (the Public Works Department's renewal and repair programmes), the road safety record (the CAG of India's
# performance audit of 2026, the High Court's road safety case, State Highway 14 between Alwar and Behror, the section
# the project chose for its Safe Corridor Demonstration and never procured, ICR Review 34056616, page 6), and the
# follow-on World Bank highway projects. The project had no PPP concession: its three components were rural
# connectivity, road sector modernization and road safety management (ISR 29794672, page 1), so no concession item is
# cited. No court judgment or Inspection Panel case names the project.
#
# Refusals and gaps on November 5, 2026, from this network with the named client:
# - Business Standard answered 403, so its item keeps only its outlet, headline and address, with no date.
# - NewsDrum answered a bot check page (its story is not cited).
# - Rajasthan Patrika's English page on SH-14 answered 200 on the first read and a bot check on the two reads after it;
#   the recording kept is the first read's page, made by the same recorder with the named client that evening.
# - The agency's own sites, pwd.rajasthan.gov.in, dipr.rajasthan.gov.in (the state's press releases) and
#   rsha.rajasthan.gov.in, did not answer within 30 seconds, so the agency's side comes from the outlets that carry
#   its statements (Construction World, Lokmat Times, ThePrint).
# - The CAG's report page (cag.gov.in/en/audit-report/details/126097) answered 404, so the report's executive summary
#   PDF stands for it; the PDF prints no date, and the seed keeps its title as its text.
# - NBM&CW's story on the CAG report gave only its sidebar's paragraphs, and the World Bank's own news pages print a
#   site-wide datePublished of 2026-03-26, so neither is cited: the seed would keep the wrong text or the wrong date.
# - The procurement notices reader reads the 180 days before the run, and the project's last notice is from 2018, so no
#   notice is cited by key.
#
# sites: the places the Sentinel-2 grids should centre on. The project record's only geo_location is the State of
# Rajasthan (26.58333, 73.833328), the state's centre, which the seed's grid uses today (item 1258899-2018-2025).
# Coordinates from OpenStreetMap's Nominatim gazetteer, read November 5, 2026:
# - Deeg, OSM node 1929484600: one end of the Deeg-Alwar-Behror section of State Highway 14 (ICR Review 34056616, p. 6).
# - Alwar, OSM way 22826580: the section's middle town.
# - Chittorgarh, OSM node 245727339: the district with the most project rural roads, 175 (ICR 31525018, Table 4.4, p. 42).

project = "P130164"
as_of = 2026-11-05
note = "The items were read on November 5, 2026, from the recordings of that day. The project closed on December 31, 2018, so the outside items say what the ground record holds since closing; the Rajasthan government's own sites did not answer this network."
