# The outside items the pre-seeded deep research brief for P145559 cites (ticket 153), researched by hand on
# November 5, 2026, in the shape of sample_P156634.toml. The seed (ops/research/seed.py) builds each item from its
# recording under data/fixture/recorded/research/<source>/, made with ops/research/record.py's own recorder and the
# named client, prism-research/0.1, never a browser's agent.
#
# The project: Coastal Region Water Security and Climate Resilience Project (P145559), Kenya, active, approved
# December 16, 2014, closing November 30, 2028, with its additional financing P176704 (approved December 7, 2021).
# Its works here are the Mwache multipurpose dam at Fulugani, Kasemeni ward, Kinango, Kwale County (contractor
# Sinohydro), the resettlement and compensation of the households in the dam area (the National Land Commission
# pays), and the livelihood restoration plan. The Mwache treatment plant and pipelines, financed by AFD and the EIB,
# are a related project, not this one.
#
# Outlets that refused the named client on November 5, 2026: Nation (nation.africa) and Eastleigh Voice answered 403
# with a bot check page, so their items keep the outlet's headline, URL and outlet only, and published is empty
# because the page could not be read. The Standard's page for "Sh25.5b Mwache dam hits 83pc completion amid
# funding, compensation concerns" (May 6, 2026) answered 200 with a subscription wall and no article text, so it is
# left out; KBC and the Kenya News Agency report the same committee visit.
#
# The agencies' own statements: the Coast Water Works Development Agency's news page (cwwda.go.ke/news) holds no
# entry on the Mwache dam (its newest entries are from early 2025); the Ministry of Water's site (water.go.ke) could
# not be reached by the named client (its certificate chain failed to verify); Kwale County's site (kwalecountygov.com)
# answered a search for Mwache with no results. The agency's side comes from the project's own site, kwscrp.org,
# whose posts the Mwache Dam Project Management Unit writes; those items name it as the outlet.
#
# Not cited: the Inspection Panel register names no case for P145559 or P176704 (read November 5, 2026). The
# lakehouse fixture holds no ISR passage of P145559, so there is no isr_narrative block of passages; on the workspace
# the brief reads them from strata.gold.passage (ticket 152). No post on Mastodon was recorded for this project.
#
# sites: the places whose Sentinel-2 grids matter, for the reader that takes sites (the seed today builds grids for
# the project record's own locations only, which are the two last entries here).
#   - Mwache dam area: no public gazetteer holds the dam axis (OpenStreetMap's Nominatim, Wikidata and the World
#     Bank's Resettlement Action Plan of 2019 give no coordinates for it). The RAP (documents1.worldbank.org,
#     527531559886407975, section 1) places the main dam at Fulugani village, Kasemeni Ward, Kinango Sub-County, so
#     the point is the centre of Kasemeni ward in OpenStreetMap (relation 16243525, read through Nominatim on
#     November 5, 2026). The ward spans about 30 km east to west, so check the grid shows the reservoir before
#     relying on it.
#   - Kwale and Mombasa: the project record's geo_locations 190106 and 186298 (projects API, read November 5, 2026).

