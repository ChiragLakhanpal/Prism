# The recorded register (ticket 162; .notes/deck3/brief.md, section 8): numbers the deep research talk at
# /present/research states that no query on the lakehouse measures, each counted by hand on a named day. It sits
# beside the results register on the model of rehearsals.toml, and its source kind is "Recorded".
# strata.proposal.register.load_recorded() reads it; `uv run python -m strata.proposal deck` writes each entry into the
# deck's data, and the number's window prints its day and how. Count again and change the day when a number moves.
#
# [recorded.<key>]
#   name         what it is, in plain words: the window's heading
#   noun         what it counts
#   form         count, ratio (n of d) or percent
#   value        the number, for a count or a percent
#   n, d         the parts, for a ratio
#   measured_on  the day it was recorded, as "2026-11-05", or the month, as "2026-03", when its source gives only that
#   how          how it was counted, in one sentence the window prints

[recorded.lines-prism]
name = "Python source lines in Prism"
noun = "lines"
form = "count"
value = 61653
measured_on = "2026-11-05"
how = "Python source lines under src, counted in the Strata repository."

