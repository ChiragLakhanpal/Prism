# The number check's allow list (ticket 46; the 46 brief, section 9.1): names fixed by definition that hold a number,
# each with the reason it needs no source. The check in src/strata/proposal/numbers.py removes these phrases, word
# for word, before it looks for numbers. Keep the list short: a count of something the change drill can change
# belongs in docs/proposal/settings.toml, filled from its registry, never here.

[[allow]]
phrase = "the three strata"
reason = "GLOSSARY.md defines the strata as What, How and Why: three by definition, not a count Prism measured."

[[allow]]
phrase = "three strata"
reason = "The same definition without its article, as the deck's slide 2 title and its first figure's name write it (ticket 47)."

[[allow]]
phrase = "two roads"
reason = "The page router has two routes by design, the World Bank's published text and the layout parser (GLOSSARY.md, Published text and Layout parser; docs/PLAN.md section 5)."

[[allow]]
phrase = "Two assertions about the same thing"
reason = "GLOSSARY.md defines a disagreement as two assertions about the same thing, for the same period, that cannot both be true."

[[allow]]
phrase = "Three loops, one dated store"
reason = "The name of the deck's loops figure (ticket 47), a drawing of the knowledge, retrieval and estimates loops. Adding a loop to config/kpis.toml means drawing the figure again, and the slide's own count is bound to the loop-count setting."

[[allow]]
phrase = "the four modules"
reason = "The assessment asks for four modules (docs/assessment.md, section 4)."

[[allow]]
phrase = "the four dimensions"
reason = "The assessment's rubric has four dimensions (docs/assessment.md, section 5)."

[[allow]]
phrase = "All four dimensions"
reason = "The rubric map's last row names the same four dimensions."

[[allow]]
phrase = "8-in-10"
reason = "The name of the range a time estimate gives, defined in GLOSSARY.md and DESIGN.md: the point by which 8 in 10 comparable packages were signed."

[[allow]]
phrase = "8 in 10"
reason = "The same definition, written out in a figure's reference line and alt text."

[[allow]]
phrase = "precision at 10"
reason = "The name of a retrieval measure, as the replay harness stores it and the dashboard names it."

[[allow]]
phrase = "recall at 20"
reason = "The name of a retrieval measure, as the replay harness stores it and the dashboard names it."

[[allow]]
phrase = "nDCG at 10"
reason = "The name of a retrieval measure, as the replay harness stores it and the dashboard names it."

[[allow]]
phrase = "per 100 sources opened"
reason = "The name of the retrieval loop's leading indicator, as ticket 32 named the measure."

[[allow]]
phrase = "about US$15 million"
reason = "The words a person types to plan a package from a sentence, the examples registry's sentence (config/examples.toml, packages.rural_roads_kenya), which the deck's package demo shows in its box: an input, not a number Prism measured. A new sentence there means a new line here, and the number check says so."
