# The change drill's rehearsal record (ticket 49): how long each drill in config/change_drills.toml took when it was
# rehearsed, measured on a throwaway branch with a timer. The steps of each drill are in docs/change-drill.md.
# strata.proposal.register.load_rehearsals() reads it, and the proposal's build writes each time into Module 4's
# change drill table, linked to its row in Annex 1, whose source kind is "Rehearsal". A drill with no rehearsal here
# reads "Not rehearsed yet". A time over the target, ten minutes (docs/proposal/settings.toml, drill-target), shows
# "Target: 10. Not met." and is never left out.
#
# [[rehearsals]], one per drill at most, in config/change_drills.toml's order:
#   change           the drill's change, word for word as config/change_drills.toml writes it
#   example          what the rehearsal changed, in one sentence
#   branch           the throwaway branch it ran on, made from the ticket branch and never merged: drill/<nn>-<slug>,
#                    or drill-49/<nn>-<slug> for ticket 49's own rehearsal
#   commit           the full hash of the commit the gate passed on that branch
#   started_at       when the timer started, right after the branch was made, with its offset from UTC
#   gate_started_at  the drill commit's own date, git log -1 --format=%aI <commit>. Git dates a commit before its
#                    pre-commit hook runs, so this is when the edits were done and the gate began
#   finished_at      when the commit the gate passed was made, the end of the drill
#   gate_seconds     the gate's own time in that commit, as its last line printed it
# The time is finished_at less started_at, in whole minutes rounded up, and its row in Annex 1 says how much of it
# was editing, gate_started_at less started_at. tests/test_proposal_registries.py checks that no rehearsal's commit,
# or a copy of its change, is on the branch being tested, the integration branch included.
#
# Ticket 49's builder ran the rehearsal on October 26, 2026, from its worktree, following docs/change-drill.md at
# the ticket branch's commit 0e00b75, one drill at a time so the gates did not share the processors. Each timer started
# right after its branch was made, except the first drill's, which started after its fixture page was recorded,
# as the runbook says. Each ended when the date was read after the commit the gate passed.
#
# Each drill was first worked through without a timer while its runbook entry was written. The timed run made the
# same change again from the runbook, so it measures making a known change and the gate's run, not working out a
# new one. Claude Code ran each drill, not a person.

