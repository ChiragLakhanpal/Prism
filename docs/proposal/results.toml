noun = "benchmark questions"
query = "dashboard:kpi_benchmark_passed"
meta = "evaluation_meta.sql"
params = { scorer = "benchmark" }
form = "ratio"
table = "strata.ops.evaluation_result"

[results.must-refuse]
name = "Must-refuse questions that Strata turned down, in the latest full gate"
module = 3
kind = "Benchmark run"
noun = "must-refuse questions"
query = "evaluation.sql"
params = { scorer = "benchmark", segment_kind = "kind", segment = "must_refuse", numerator = "passed", denominator = "questions" }
form = "ratio"
table = "strata.ops.evaluation_result"

[results.sentences-removed]
name = "Sentences the verifier removed from answers, out of the sentences the answers wrote, in the 90 days to the pull"
module = 3
kind = "Query"
noun = "sentences"
query = "dashboard:kpi_sentences_removed"
