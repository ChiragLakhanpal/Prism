form = "ratio"
table = "strata.ops.agent_runs"

[results.answers-held-back]
name = "Answers where Strata held back, out of the answers it gave, in the 90 days to the pull"
module = 3
kind = "Query"
noun = "answers"
query = "dashboard:kpi_answers_held_back"
meta = "agent_runs_meta.sql"
form = "ratio"
table = "strata.ops.agent_runs"

[results.groundedness]
name = "Answers that met Foundry's groundedness evaluator, out of the answers it scored"
module = 3
kind = "Evaluation result"
noun = "answers"
query = "evaluation.sql"
params = { scorer = "foundry_evaluation", segment_kind = "evaluator", segment = "groundedness", numerator = "met", denominator = "scored" }
form = "ratio"
table = "strata.ops.evaluation_result"

[results.disagreements]
name = "Disagreements found between two reports or records about the same thing"
module = 3
kind = "Query"
noun = "disagreements"
