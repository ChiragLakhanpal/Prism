params = { scorer = "hindsight_test", segment_kind = "release", segment = "", numerator = "shown", denominator = "blamed" }
form = "ratio"
table = "strata.ops.evaluation_result"
labels = "Labels: each blamed risk was coded from the completion report by two people and reconciled."

[results.hindsight-checklist]
name = "The same blamed risks that a checklist of each sector's commonest risks named"
