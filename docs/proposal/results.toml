kind = "Hindsight test"
noun = "blamed risks"
query = "evaluation.sql"
params = { scorer = "hindsight_test", segment_kind = "release", segment = "", numerator = "checklist_caught", denominator = "blamed" }
form = "ratio"
table = "strata.ops.evaluation_result"

[results.hindsight-interval]
