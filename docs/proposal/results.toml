# ── Module 2 ─────────────────────────────────────────────────────────────

[results.backtest-coverage]
name = "Test packages, 2021 to 2025, signed within the 8-in-10 point of the range Strata gave them"
module = 2
kind = "Backtest"
noun = "test packages"
query = "backtest_total.sql"
params = { scorer = "time_estimate_backtest" }
form = "ratio"
table = "strata.ops.evaluation_result"
target = "coverage-band"

[results.backtest-years]
name = "Test packages signed within the 8-in-10 point, by test year"
module = 2
kind = "Backtest"
noun = "test packages"
query = "backtest_years.sql"
params = { scorer = "time_estimate_backtest" }
form = "series"
table = "strata.ops.evaluation_result"

[results.hazard-caught]
name = "Projects that later extended their closing date that the early-warning model named first"
module = 2
kind = "Backtest"
noun = "projects"
query = "evaluation.sql"
params = { scorer = "hazard_vs_signals", segment_kind = "replay", segment = "hazard", numerator = "hazard_caught", denominator = "extended" }
form = "ratio"
table = "strata.ops.evaluation_result"

[results.signals-caught]
name = "The same projects that the fixed signals named first"
module = 2
kind = "Backtest"
noun = "projects"
query = "evaluation.sql"
params = { scorer = "hazard_vs_signals", segment_kind = "replay", segment = "hazard", numerator = "signals_caught", denominator = "extended" }
form = "ratio"
table = "strata.ops.evaluation_result"

[results.retrieval-precision]
name = "Precision at 10 on the ICR Review citation set, the newest run"
module = 2
kind = "Evaluation result"
noun = "precision at 10"
query = "dashboard:kpi_precision_recall"
row = { segment_kind = "query_set", query_set_key = "icr_review_citations" }
columns = { value = "precision_at_10", queries = "queries" }
meta = "evaluation_meta.sql"
params = { scorer = "retrieval_evaluation" }
form = "score"
table = "strata.ops.evaluation_result"
labels = 'Labels: {queries} queries that code built from ICR Reviews. Each "ICR para N" citation in an ICR Review is a query, and the paragraphs it names answer it. No person checks them.'

[results.retrieval-recall]
name = "Recall at 20 on the ICR Review citation set, the newest run"
module = 2
kind = "Evaluation result"
noun = "recall at 20"
query = "dashboard:kpi_precision_recall"
row = { segment_kind = "query_set", query_set_key = "icr_review_citations" }
columns = { value = "recall_at_20" }
meta = "evaluation_meta.sql"
params = { scorer = "retrieval_evaluation" }
form = "score"
table = "strata.ops.evaluation_result"

[results.retrieval-ndcg]
name = "nDCG at 10 on the ICR Review citation set, the newest run"
module = 2
kind = "Evaluation result"
noun = "nDCG at 10"
query = "dashboard:kpi_precision_recall"
row = { segment_kind = "query_set", query_set_key = "icr_review_citations" }
columns = { value = "ndcg_at_10" }
meta = "evaluation_meta.sql"
params = { scorer = "retrieval_evaluation" }
form = "score"
table = "strata.ops.evaluation_result"

