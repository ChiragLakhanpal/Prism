# The results register (ticket 46; the 46 brief, sections 9.3 and 20): every measured value the proposal cites,
# defined once, with the query that measures it. `python -m strata.proposal pull` runs each query through the engine
# adapter, on the workspace's warehouse or on a DuckDB file, into one dated snapshot; the build fills each {r:key} in
# docs/proposal/source.md from that snapshot and writes Annex 1 from this file, in the order of first citation.
#
# [results.<key>]
#   name     what the result counts, in plain words: Annex 1's Result column
#   module   the module whose part of Annex 1 lists it, 1 to 4 (the module that cites it first)
#   kind     the source kind, exactly one of: Evaluation result, Data readiness measure, Benchmark run, Backtest,
#            Hindsight test, Query
#   noun     what one counted thing is called, for the number's link title ("contract award rows")
#   query    the query that measures it: a file in src/strata/proposal/sql/, or dashboard:<dataset> for the dashboard's
#            own query (src/strata/dashboard/sql), such as dashboard:kpi_<id> for a KPI's defining query in
#            config/kpis.toml, so the proposal and the dashboard count a measure the same way (CLAUDE.md rule 4).
#            row picks one of its rows by column values (the first row when left out), and columns names the
#            columns that hold n, d and value (numerator, denominator and value when left out) and any others
#   meta     for a dashboard query, the file in src/strata/proposal/sql/ that says when and in which run it was
#            measured
#   params   the query's bound parameters; the pull adds today, date_from and date_to (the 90 days to today) and the
#            fewest cases for a share and a percentage from config/thresholds.toml
#   form     ratio ("{n} of {d}", and "about {k} in 10" where the query gives one), count, money (US dollars with
#            cents, as the dashboard's sentences write them),
#            score (two decimals), days, rate (per 100, one decimal), interval (low to high percent), series (one row
#            per label, drawn in a figure) or fact (words, such as a paragraph number, never a claim of size)
#   count_of n (the default) or d: which column a count shows
#   table    the table the value was read from, in code, for Annex 1's Source column
#   labels   how the labels the result rests on were made, by code or by people, and how many (docs/STATUS.md,
#            decision 5); a {column} in it is filled from that column of the measured row, so a count is never typed
#   target   the settings key (docs/proposal/settings.toml) of the target it is held to, if it has one

# ── Module 1 ─────────────────────────────────────────────────────────────

[results.award-rows-since-2020]
name = "Contract award rows held from the dataset since fiscal 2020, out of the rows it reported"
module = 1
kind = "Data readiness measure"
noun = "contract award rows"
query = "readiness.sql"
params = { source = "awards", measure = "coverage_rows" }
form = "count"
table = "strata.ops.data_readiness"

[results.award-rows-2001-2016]
name = "Contract award rows held from the dataset for fiscal 2001 to 2016"
module = 1
kind = "Data readiness measure"
noun = "contract award rows"
query = "readiness.sql"
params = { source = "awards_fy2001_2016", measure = "coverage_rows" }
form = "count"
table = "strata.ops.data_readiness"

[results.award-rows-by-year]
name = "Contract award rows per fiscal year, by the dataset or the award notices they came from"
module = 1
kind = "Data readiness measure"
noun = "contract award rows"
query = "dashboard:award_rows_by_year"
meta = "readiness_snapshot_meta.sql"
form = "series"
table = "strata.ops.readiness_snapshot"

[results.gap-contracts]
name = "Contracts built from award notices for fiscal 2017 to 2019, which neither awards dataset covers"
module = 1
kind = "Data readiness measure"
noun = "contracts"
query = "readiness.sql"
params = { source = "awards", measure = "gap_years_contracts_in_local_currency" }
form = "count"
count_of = "d"
table = "strata.ops.data_readiness"

[results.linked-notice]
name = "Contract award rows since fiscal 2020 whose STEP reference a procurement notice also carries"
module = 1
kind = "Data readiness measure"
noun = "contract award rows"
query = "readiness.sql"
params = { source = "awards", measure = "linked_notice" }
form = "ratio"
table = "strata.ops.data_readiness"

[results.supplier-ids]
name = "Awarded bidders whose award rows name them the same way and give the same STEP supplier ID"
module = 1
kind = "Data readiness measure"
noun = "awarded bidders"
query = "readiness.sql"
params = { source = "notices", measure = "awarded_bidder_id_same_name" }
form = "ratio"
table = "strata.ops.data_readiness"

[results.contacts-removed]
name = "Procurement notices that had contact details, which ingestion removed"
module = 1
kind = "Data readiness measure"
noun = "notices"
query = "readiness.sql"
params = { source = "notices", measure = "contact_details_removed" }
form = "ratio"
table = "strata.ops.data_readiness"

[results.contacts-left]
name = "Notices in which the latest nightly check found an email or phone number that ingestion missed"
module = 1
kind = "Query"
noun = "notices"
query = "dashboard:kpi_contacts_left"
meta = "quality_checks_meta.sql"
form = "ratio"
table = "strata.ops.quality_checks"

[results.passages-linked]
name = "Contract and paragraph pairs scored as appearing together"
module = 1
kind = "Query"
noun = "contract and paragraph pairs"
query = "appeared_together.sql"
form = "count"
table = "strata.gold.edge"

[results.trail]
name = "The completion report paragraph with the highest score for award notice OP00044090's contract"
