<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 864 268" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc" id="pipeline-root">
        <title id="pipeline-title">Where Strata runs</title>
        <desc id="pipeline-desc">World Bank open data flow through pipelines into the knowledge model and search in Databricks; the Strata agent in Microsoft Foundry picks tools, the app runs each tool as the viewer, and the verifier checks every sentence before the viewer reads the answer.</desc>
