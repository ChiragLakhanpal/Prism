<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 268" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ladder-title ladder-desc" id="ladder-root">
        <title id="ladder-title">Which report Strata leans on</title>
        <desc id="ladder-desc">For how a project turned out, Strata leans on the highest report that speaks to it: an independent review, then the completion report, the last status report and the appraisal document; for a fact about a moment, the record made at that moment wins.</desc>
        <defs>
      <style>#ladder-root { font-family: 'Open Sans', system-ui, sans-serif; color: #181f25; }
      #ladder-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#ladder-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="ladder-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5e71"/></marker>
<marker id="ladder-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0071bc"/></marker>
<marker id="ladder-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#01707e"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f7f9"/>
<rect x="24" y="24" width="196" height="44" rx="6" fill="#f5f7f9"/>
<rect x="24" y="24" width="196" height="44" rx="6" fill="#0071bc" stroke="#0071bc" stroke-width="1" fill-opacity="0.08"/>
<text x="122" y="43" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Independent review</text>
<text x="122" y="57" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">after closing</text>
<rect x="24" y="68" width="196" height="44" rx="6" fill="#f5f7f9"/>
<rect x="24" y="68" width="196" height="44" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="122" y="87" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Completion report</text>
<text x="122" y="101" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">after closing</text>
<rect x="24" y="112" width="196" height="44" rx="6" fill="#f5f7f9"/>
<rect x="24" y="112" width="196" height="44" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="122" y="131" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Last status report</text>
<text x="122" y="145" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">during the project</text>
<rect x="24" y="156" width="196" height="44" rx="6" fill="#f5f7f9"/>
<rect x="24" y="156" width="196" height="44" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="122" y="175" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Appraisal document</text>
<text x="122" y="189" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">before the project</text>
<text x="244" y="44" fill="#181f25" font-size="14" font-weight="400" font-family="'Open Sans', system-ui, sans-serif" font-style="italic" text-anchor="start">For how a project</text>
<text x="244" y="62" fill="#181f25" font-size="14" font-weight="400" font-family="'Open Sans', system-ui, sans-serif" font-style="italic" text-anchor="start">turned out, the</text>
<text x="244" y="80" fill="#181f25" font-size="14" font-weight="400" font-family="'Open Sans', system-ui, sans-serif" font-style="italic" text-anchor="start">highest report</text>
<text x="244" y="98" fill="#181f25" font-size="14" font-weight="400" font-family="'Open Sans', system-ui, sans-serif" font-style="italic" text-anchor="start">that speaks to it</text>
<text x="244" y="116" fill="#181f25" font-size="14" font-weight="400" font-family="'Open Sans', system-ui, sans-serif" font-style="italic" text-anchor="start">wins.</text>
<text x="24" y="226" fill="#181f25" font-size="14" font-weight="400" font-family="'Open Sans', system-ui, sans-serif" font-style="italic" text-anchor="start">For a fact about a moment, the record made</text>
<text x="24" y="244" fill="#181f25" font-size="14" font-weight="400" font-family="'Open Sans', system-ui, sans-serif" font-style="italic" text-anchor="start">at that moment wins.</text>
