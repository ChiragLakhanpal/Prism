<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 864 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reading-title reading-desc" data-motion-root="" data-motion-mode="none" data-step-count="6" id="reading-root">
        <title id="reading-title">How a document becomes numbered passages</title>
        <desc id="reading-desc">A page router sends clean pages to the text the World Bank publishes and scanned pages and tables to a layout parser, and both roads end in numbered passages, each with its paragraph number and page, which go into the hybrid search index.</desc>
        <defs>
      <style>#reading-root { font-family: 'Open Sans', system-ui, sans-serif; color: #181f25; }
      #reading-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#reading-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="reading-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5e71"/></marker>
<marker id="reading-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0071bc"/></marker>
<marker id="reading-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#01707e"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f7f9"/>
<g data-motion-item="" data-step="1" aria-label="A document arrives">
<path d="M 30 148 H 124 L 136 160 V 198 Q 136 204 130 204 H 30 Q 24 204 24 198 V 154 Q 24 148 30 148 Z" fill="#f5f7f9"/>
<path d="M 30 148 H 124 L 136 160 V 198 Q 136 204 130 204 H 30 Q 24 204 24 198 V 154 Q 24 148 30 148 Z" fill="#4b5e71" stroke="#586e84" stroke-width="1" stroke-linejoin="round" fill-opacity="0.1"/>
<path d="M 124 148 V 160 H 136" fill="none" stroke="#586e84" stroke-width="0.8"/>
<text x="80" y="169" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Document</text>
<text x="80" y="183" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">PAD, ISR, ICR or</text>
<text x="80" y="194" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">Procurement Plan</text>
</g>
<g data-motion-item="" data-step="2" aria-label="The page router checks each page">
<line x1="136" y1="176" x2="159" y2="176" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#reading-arrow)"/>
<polygon points="236 136, 312 176, 236 216, 160 176" fill="#f5f7f9"/>
<polygon points="236 136, 312 176, 236 216, 160 176" fill="#ffffff" stroke="#181f25" stroke-width="1" stroke-linejoin="round"/>
<text x="236" y="173" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Page router</text>
<text x="236" y="187" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">checks each page</text>
</g>
<g data-motion-item="" data-step="3" aria-label="Clean pages: the published text">
<path d="M 236 136 V 84 Q 236 76 244 76 H 339" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#reading-arrow)"/>
<rect x="262" y="58" width="68" height="13" rx="2" fill="#f5f7f9"/>
<text x="296" y="67" fill="#586e84" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Clean pages</text>
<rect x="340" y="50" width="152" height="52" rx="6" fill="#f5f7f9"/>
<rect x="340" y="50" width="152" height="52" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="416" y="74" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Published text</text>
<text x="416" y="88" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">the World Bank's own words</text>
</g>
<g data-motion-item="" data-step="4" aria-label="Scans and tables: the layout parser">
<path d="M 236 216 V 268 Q 236 276 244 276 H 339" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#reading-arrow)"/>
<rect x="256" y="258" width="80" height="13" rx="2" fill="#f5f7f9"/>
<text x="296" y="267" fill="#586e84" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Scans, tables</text>
<rect x="340" y="250" width="152" height="52" rx="6" fill="#f5f7f9"/>
<rect x="340" y="250" width="152" height="52" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="416" y="274" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Layout parser</text>
<text x="416" y="288" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">scans and tables</text>
</g>
<g data-motion-item="" data-step="5" aria-label="Numbered passages, each with its paragraph number and page">
<path d="M 492 76 H 504 Q 512 76 512 84 V 156 Q 512 164 520 164 H 531" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#reading-arrow)"/>
<path d="M 492 276 H 504 Q 512 276 512 268 V 196 Q 512 188 520 188 H 531" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#reading-arrow)"/>
<rect x="532" y="144" width="148" height="64" rx="6" fill="#f5f7f9"/>
<rect x="532" y="144" width="148" height="64" rx="6" fill="#0071bc" stroke="#0071bc" stroke-width="1" fill-opacity="0.08"/>
<text x="606" y="174" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Numbered passages</text>
<text x="606" y="188" fill="#0071bc" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">paragraph number and page</text>
<rect x="532" y="218" width="148" height="18" rx="9" fill="#ffffff" stroke="#181f25" stroke-width="0.8" stroke-opacity="0.3"/>
<text x="606" y="230.5" fill="#181f25" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">ICR paragraph 54, page 23</text>
</g>
<g data-motion-item="" data-step="6" aria-label="The hybrid search index">
<line x1="680" y1="176" x2="707" y2="176" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#reading-arrow)"/>
<rect x="708" y="148" width="132" height="56" rx="6" fill="#f5f7f9"/>
<rect x="708" y="148" width="132" height="56" rx="6" fill="#181f25" stroke="#4b5e71" stroke-width="1" fill-opacity="0.05"/>
<text x="774" y="174" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Hybrid search index</text>
<text x="774" y="188" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">keywords and meaning</text>
<text x="532" y="276" fill="#4b5e71" font-size="14" font-style="italic" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">A table's summary never backs a number.</text>
<text x="532" y="295" fill="#4b5e71" font-size="14" font-style="italic" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">Its rows do.</text>
</g>
      </svg>
