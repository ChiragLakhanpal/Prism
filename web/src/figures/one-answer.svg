<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 864 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="one-answer-title one-answer-desc" data-motion-root="" data-motion-mode="none" data-step-count="5" id="one-answer-root">
        <title id="one-answer-title">One question, three strata, one cited answer</title>
        <desc id="one-answer-desc">A question about a new package draws comparable packages from records, planned and actual dates from operational documents, and lessons from evaluations, and they meet in one answer whose every sentence names its source.</desc>
        <defs>
      <style>#one-answer-root { font-family: 'Open Sans', system-ui, sans-serif; color: #181f25; }
      #one-answer-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#one-answer-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="one-answer-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5e71"/></marker>
<marker id="one-answer-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0071bc"/></marker>
<marker id="one-answer-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#01707e"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f7f9"/>
<rect x="296" y="24" width="272" height="96" rx="6" fill="#586e84" fill-opacity="0.04"/>
<text x="312" y="42" fill="#586e84" font-size="10" font-weight="600" font-family="'Open Sans', system-ui, sans-serif">What happened</text>
<rect x="296" y="128" width="272" height="96" rx="6" fill="#586e84" fill-opacity="0.08"/>
<text x="312" y="146" fill="#586e84" font-size="10" font-weight="600" font-family="'Open Sans', system-ui, sans-serif">How it was done</text>
<rect x="296" y="232" width="272" height="96" rx="6" fill="#586e84" fill-opacity="0.13"/>
<text x="312" y="250" fill="#586e84" font-size="10" font-weight="600" font-family="'Open Sans', system-ui, sans-serif">Why it worked or not</text>
<g data-motion-item="" data-step="1" aria-label="The question: a new rural roads package in Kenya">
<rect x="24" y="148" width="240" height="64" rx="6" fill="#f5f7f9"/>
<rect x="24" y="148" width="240" height="64" rx="6" fill="#4b5e71" stroke="#586e84" stroke-width="1" fill-opacity="0.1"/>
<text x="144" y="177.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">A new rural roads package in Kenya</text>
<text x="144" y="191.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">a sentence typed into the box</text>
</g>
<g data-motion-item="" data-step="2" aria-label="Records give comparable packages and how long each took">
<path d="M264,164.0 H272 Q280,164.0 280,156.0 V84.0 Q280,76.0 288,76.0 H311" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#one-answer-arrow)"/>
<rect x="312" y="52" width="240" height="48" rx="6" fill="#f5f7f9"/>
<rect x="312" y="52" width="240" height="48" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="432" y="73.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Comparable packages</text>
<text x="432" y="87.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">how long each took</text>
</g>
<g data-motion-item="" data-step="3" aria-label="Operational documents give each step's planned and actual dates">
<path d="M264,180.0 H311" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#one-answer-arrow)"/>
<rect x="312" y="156" width="240" height="48" rx="6" fill="#f5f7f9"/>
<rect x="312" y="156" width="240" height="48" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="432" y="177.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Planned and actual dates</text>
<text x="432" y="191.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">for each STEP step</text>
</g>
<g data-motion-item="" data-step="4" aria-label="Evaluations give what went wrong and what helped">
<path d="M264,196.0 H272 Q280,196.0 280,204.0 V276.0 Q280,284.0 288,284.0 H311" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#one-answer-arrow)"/>
<rect x="312" y="260" width="240" height="48" rx="6" fill="#f5f7f9"/>
<rect x="312" y="260" width="240" height="48" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="432" y="281.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">What went wrong, and what helped</text>
<text x="432" y="295.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">quoted with paragraph and page</text>
</g>
<g data-motion-item="" data-step="5" aria-label="They meet in one answer, and every sentence names its source">
<path d="M552,76.0 H576 Q584,76.0 584,84.0 V156.0 Q584,164.0 592,164.0 H615" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#one-answer-arrow)"/>
<path d="M552,180.0 H615" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#one-answer-arrow)"/>
<path d="M552,284.0 H576 Q584,284.0 584,276.0 V204.0 Q584,196.0 592,196.0 H615" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#one-answer-arrow)"/>
<rect x="616" y="148" width="224" height="64" rx="6" fill="#f5f7f9"/>
<rect x="616" y="148" width="224" height="64" rx="6" fill="#0071bc" stroke="#0071bc" stroke-width="1.2" fill-opacity="0.08"/>
<text x="728" y="177.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">One answer</text>
<text x="728" y="191.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">every sentence names its source</text>
</g>
      </svg>
