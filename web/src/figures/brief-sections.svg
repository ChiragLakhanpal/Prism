      <style>#brief-sections-root { font-family: 'Open Sans', system-ui, sans-serif; color: #181f25; }
      #brief-sections-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#brief-sections-root .diagram-container { overflow-x: visible; }
}</style>
