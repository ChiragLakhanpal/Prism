        <title id="brief-sections-title">The sections of the brief</title>
        <desc id="brief-sections-desc">The brief's sections in order: the headline, the picture on the ground and the bottom line carry the message; developments, by site and what people are saying carry the evidence; the questions and what could not be seen say what to do and what is missing.</desc>
