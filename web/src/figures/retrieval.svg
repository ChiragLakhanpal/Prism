<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 864 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="retrieval-title retrieval-desc" data-motion-root="" data-motion-mode="none" data-step-count="6" id="retrieval-root">
        <title id="retrieval-title">What happens behind one answer</title>
        <desc id="retrieval-desc">The viewer asks, the app passes the question to the Strata agent, runs the tools it picks with the viewer's own permissions and keeps every row and passage, receives claims with their evidence IDs, has the verifier check every sentence, and shows the answer with what was removed.</desc>
