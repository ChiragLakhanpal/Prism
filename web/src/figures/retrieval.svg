      <style>#retrieval-root { font-family: 'Open Sans', system-ui, sans-serif; color: #181f25; }
      #retrieval-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#retrieval-root .diagram-container { overflow-x: visible; }
}</style>
