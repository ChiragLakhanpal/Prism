<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 864 268" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="retrieval-title retrieval-desc" id="retrieval-root">
        <title id="retrieval-title">How an answer is checked</title>
        <desc id="retrieval-desc">The viewer asks, the Strata agent chooses tools, the app runs them as the viewer, the data come back with their IDs, the agent writes claims with those IDs and may go back for more, and the verifier checks every sentence before the viewer reads the answer.</desc>
