<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 864 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="estimate-title estimate-desc" data-motion-root="" data-motion-mode="none" data-step-count="8" id="estimate-root">
            <title id="estimate-title">How a time estimate is made</title>
            <desc id="estimate-desc">Comparable packages come from exact-match SQL on the stated criteria. With too few, every package shows and no range is given. Otherwise the past range is a Kaplan-Meier curve that keeps packages still open in as not signed yet. The time estimate is an XGBoost survival model whose ranges are sized by conformal calibration on packages held out of training. Rolling backtests test it on years it had not seen, a challenger replaces the champion only after its gates, and each night the champion's scores go to strata.gold.time_estimate_score.</desc>
            <defs>
      <style>#estimate-root { font-family: 'Open Sans', system-ui, sans-serif; color: #181f25; }
      #estimate-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#estimate-root .diagram-container { overflow-x: visible; }
}</style>
    <marker id="estimate-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4b5e71"/></marker>
<marker id="estimate-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#0071bc"/></marker>
<marker id="estimate-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#01707e"/></marker>
            </defs>
            <rect width="100%" height="100%" fill="#f5f7f9"/>
    <g data-motion-item="" data-step="1" aria-label="Comparable packages: exact-match SQL on the stated criteria">
<rect x="16" y="24" width="184" height="92" rx="6" fill="#f5f7f9"/>
<rect x="16" y="24" width="184" height="92" rx="6" fill="#ffffff" stroke="#0071bc" stroke-width="1"/>
<rect x="16" y="24" width="184" height="92" rx="6" fill="#0071bc" fill-opacity="0.07"/>
<text x="26" y="42" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">Comparable packages</text>
<text x="26" y="56" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">exact-match SQL on the</text>
<text x="26" y="67" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">stated criteria, over</text>
<text x="26" y="78" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">gold.package, notice</text>
<text x="26" y="89" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">and contract</text>
</g>
<g data-motion-item="" data-step="2" aria-label="Are there enough comparable packages?">
<rect x="228" y="40" width="150" height="60" rx="6" fill="#f5f7f9"/>
<rect x="228" y="40" width="150" height="60" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="238" y="58" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">Enough of them?</text>
<text x="238" y="72" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">the floor is set in</text>
<text x="238" y="83" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">config/thresholds.toml</text>
<path d="M 201 70 L 227 70" fill="none" stroke="#0071bc" stroke-width="1.2" marker-end="url(#estimate-arrow-accent)"/>
</g>
<g data-motion-item="" data-step="2" aria-label="With too few, every package shows and no range is given">
<rect x="228" y="128" width="150" height="52" rx="6" fill="#f5f7f9"/>
<rect x="228" y="128" width="150" height="52" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="238" y="146" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">Too few</text>
<text x="238" y="160" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">every package shows,</text>
<text x="238" y="171" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">and no range is given</text>
<path d="M 303 101 L 303 127" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#estimate-arrow)"/>
</g>
<g data-motion-item="" data-step="3" aria-label="The past range: a Kaplan-Meier curve that keeps open packages in">
<rect x="404" y="24" width="222" height="92" rx="6" fill="#f5f7f9"/>
<rect x="404" y="24" width="222" height="92" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="414" y="42" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">The past range</text>
<text x="414" y="56" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">a Kaplan-Meier curve;</text>
<text x="414" y="67" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">packages still open</text>
<text x="414" y="78" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">stay in as not</text>
<text x="414" y="89" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">signed yet</text>
<path d="M 379 70 L 403 70" fill="none" stroke="#0071bc" stroke-width="1.2" marker-end="url(#estimate-arrow-accent)"/>
<line x1="556" y1="100" x2="616" y2="100" stroke="#586e84" stroke-width="1"/>
<path d="M 556 42 L 568 42 L 568 56 L 580 56 L 580 70 L 594 70 L 594 84 L 616 84" fill="none" stroke="#0071bc" stroke-width="1.2"/>
<circle cx="574" cy="56" r="2.5" fill="#ffffff" stroke="#0071bc" stroke-width="1"/>
<circle cx="604" cy="84" r="2.5" fill="#ffffff" stroke="#0071bc" stroke-width="1"/>
</g>
<g data-motion-item="" data-step="4" aria-label="The time estimate: an XGBoost survival model">
<rect x="16" y="208" width="150" height="96" rx="6" fill="#f5f7f9"/>
<rect x="16" y="208" width="150" height="96" rx="6" fill="#ffffff" stroke="#01707e" stroke-width="1"/>
<rect x="16" y="208" width="150" height="96" rx="6" fill="#01707e" fill-opacity="0.07"/>
<text x="26" y="226" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">The time estimate</text>
<text x="26" y="240" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">XGBoost survival, AFT;</text>
<text x="26" y="251" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">features known at</text>
<text x="26" y="262" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">the notice date; open</text>
<text x="26" y="273" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">packages censored</text>
<path d="M 60 117 L 60 207" fill="none" stroke="#01707e" stroke-width="1.2" marker-end="url(#estimate-arrow-link)"/>
</g>
<g data-motion-item="" data-step="5" aria-label="Conformal ranges, sized on packages held out of training">
<rect x="186" y="208" width="150" height="96" rx="6" fill="#f5f7f9"/>
<rect x="186" y="208" width="150" height="96" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="196" y="226" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">Conformal ranges</text>
<text x="196" y="240" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">a held-out share of</text>
<text x="196" y="251" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">packages sizes each</text>
<text x="196" y="262" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">range, so 8 in 10</text>
<text x="196" y="273" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">means 8 in 10</text>
<path d="M 167 256 L 185 256" fill="none" stroke="#01707e" stroke-width="1.2" marker-end="url(#estimate-arrow-link)"/>
</g>
<g data-motion-item="" data-step="6" aria-label="Rolling backtests on years the model had not seen">
<rect x="356" y="208" width="150" height="96" rx="6" fill="#f5f7f9"/>
<rect x="356" y="208" width="150" height="96" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="366" y="226" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">Rolling backtests</text>
<text x="366" y="240" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">frozen each January,</text>
<text x="366" y="251" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">tested on the next</text>
<text x="366" y="262" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">year's packages it</text>
<text x="366" y="273" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">had not seen</text>
<path d="M 337 256 L 355 256" fill="none" stroke="#01707e" stroke-width="1.2" marker-end="url(#estimate-arrow-link)"/>
</g>
<g data-motion-item="" data-step="7" aria-label="A challenger replaces the champion only after its gates">
<rect x="526" y="208" width="150" height="96" rx="6" fill="#f5f7f9"/>
<rect x="526" y="208" width="150" height="96" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="536" y="226" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">Champion, challenger</text>
<text x="536" y="240" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">wins its backtest and</text>
<text x="536" y="251" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">a quarter in shadow,</text>
<text x="536" y="262" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">holds every edition,</text>
<text x="536" y="273" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">then people sign off</text>
<path d="M 507 256 L 525 256" fill="none" stroke="#01707e" stroke-width="1.2" marker-end="url(#estimate-arrow-link)"/>
</g>
<g data-motion-item="" data-step="8" aria-label="Nightly scores in strata.gold.time_estimate_score">
<rect x="696" y="208" width="152" height="96" rx="6" fill="#f5f7f9"/>
<rect x="696" y="208" width="152" height="96" rx="6" fill="#ffffff" stroke="#0071bc" stroke-width="1"/>
<rect x="696" y="208" width="152" height="96" rx="6" fill="#0071bc" fill-opacity="0.07"/>
<text x="706" y="226" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">Nightly scores</text>
<text x="706" y="240" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">gold.time_estimate_</text>
<text x="706" y="251" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">score: every package</text>
<text x="706" y="262" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">and what-if, each</text>
<text x="706" y="273" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">night; the app reads it</text>
<path d="M 677 256 L 695 256" fill="none" stroke="#01707e" stroke-width="1.2" marker-end="url(#estimate-arrow-link)"/>
</g>
<g data-motion-item="" data-step="8" aria-label="The package page shows the past range and the time estimate, or why there is none">
<rect x="652" y="24" width="196" height="92" rx="6" fill="#f5f7f9"/>
<rect x="652" y="24" width="196" height="92" rx="6" fill="#ffffff" stroke="#0071bc" stroke-width="1"/>
<rect x="652" y="24" width="196" height="92" rx="6" fill="#0071bc" fill-opacity="0.07"/>
<text x="662" y="42" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">The package page</text>
<text x="662" y="56" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">the past range and</text>
<text x="662" y="67" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">the time estimate,</text>
<text x="662" y="78" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">or why there is none</text>
<path d="M 627 70 L 651 70" fill="none" stroke="#0071bc" stroke-width="1.2" marker-end="url(#estimate-arrow-accent)"/>
<path d="M 772 207 L 772 117" fill="none" stroke="#0071bc" stroke-width="1.2" marker-end="url(#estimate-arrow-accent)"/>
</g>
          </svg>
