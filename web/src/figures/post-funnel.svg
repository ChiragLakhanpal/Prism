<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 864 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="post-funnel-title post-funnel-desc" data-motion-root="" data-motion-mode="none" data-step-count="6" id="post-funnel-root">
        <title id="post-funnel-title">How a public post reaches the brief</title>
        <desc id="post-funnel-desc">The newest posts per tag pass a place-and-sector test, then the account rules designed for next, and what survives is quoted word for word as a voice; what each step sets aside is counted.</desc>
        <defs>
      <style>#post-funnel-root { font-family: 'Open Sans', system-ui, sans-serif; color: #181f25; }
      #post-funnel-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#post-funnel-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="post-funnel-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5e71"/></marker>
<marker id="post-funnel-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0071bc"/></marker>
<marker id="post-funnel-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#01707e"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f7f9"/>
<rect x="164" y="292" width="536" height="36" rx="6" fill="#181f25" stroke="#181f25" stroke-width="0.8" fill-opacity="0.03" stroke-opacity="0.3"/>
<text x="432" y="314" fill="#4b5e71" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Set aside and counted at every step</text>
<g data-motion-item="" data-step="1" aria-label="The newest posts per tag: the country, the sector word and each place">
<rect x="24" y="40" width="116" height="176" rx="6" fill="#f5f7f9"/>
<rect x="24" y="40" width="116" height="176" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="82" y="107" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">The newest</text>
<text x="82" y="122" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">posts per tag</text>
<text x="82" y="136" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">the country,</text>
<text x="82" y="147" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">the sector word,</text>
<text x="82" y="158" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">each place</text>
<rect x="24" y="224" width="40" height="14" rx="2" fill="#f5f7f9" stroke="#586e84" stroke-width="0.8"/>
<text x="44" y="234" fill="#586e84" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">built</text>
</g>
<g data-motion-item="" data-step="2" aria-label="Kept when it names a place or an agency with a sector word">
<line x1="140" y1="128" x2="163" y2="128" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#post-funnel-arrow)"/>
<line x1="222" y1="208" x2="222" y2="291" stroke="#4b5e71" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#post-funnel-arrow)"/>
<rect x="164" y="48" width="116" height="160" rx="6" fill="#f5f7f9"/>
<rect x="164" y="48" width="116" height="160" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="222" y="118" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Names a place</text>
<text x="222" y="133" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">or an agency</text>
<text x="222" y="147" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">with a sector word</text>
<rect x="164" y="216" width="40" height="14" rx="2" fill="#f5f7f9" stroke="#586e84" stroke-width="0.8"/>
<text x="184" y="226" fill="#586e84" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">built</text>
</g>
<g data-motion-item="" data-step="3" aria-label="Designed for next: the account is over a year old, with a history beyond one agency">
<line x1="280" y1="128" x2="303" y2="128" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#post-funnel-arrow)"/>
<line x1="362" y1="200" x2="362" y2="291" stroke="#4b5e71" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#post-funnel-arrow)"/>
<rect x="304" y="56" width="116" height="144" rx="6" fill="#f5f7f9"/>
<rect x="304" y="56" width="116" height="144" rx="6" fill="#181f25" stroke="#586e84" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02"/>
<text x="362" y="112.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">The account is</text>
<text x="362" y="127.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">over a year old</text>
<text x="362" y="141.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">with a history</text>
<text x="362" y="152.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">beyond one agency</text>
<rect x="304" y="208" width="40" height="14" rx="2" fill="#f5f7f9" stroke="#586e84" stroke-width="0.8" stroke-dasharray="2,2"/>
<text x="324" y="218" fill="#586e84" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">next</text>
</g>
<g data-motion-item="" data-step="4" aria-label="Designed for next: not a burst, identical words within hours count once">
<line x1="420" y1="128" x2="443" y2="128" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#post-funnel-arrow)"/>
<line x1="502" y1="192" x2="502" y2="291" stroke="#4b5e71" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#post-funnel-arrow)"/>
<rect x="444" y="64" width="116" height="128" rx="6" fill="#f5f7f9"/>
<rect x="444" y="64" width="116" height="128" rx="6" fill="#181f25" stroke="#586e84" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02"/>
<text x="502" y="114.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Not a burst</text>
<text x="502" y="128.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">identical words</text>
<text x="502" y="139.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">within hours</text>
<text x="502" y="150.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">count once</text>
<rect x="444" y="200" width="40" height="14" rx="2" fill="#f5f7f9" stroke="#586e84" stroke-width="0.8" stroke-dasharray="2,2"/>
<text x="464" y="210" fill="#586e84" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">next</text>
</g>
<g data-motion-item="" data-step="5" aria-label="Designed for next: a second independent account, or a higher rung, per claim">
<line x1="560" y1="128" x2="583" y2="128" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#post-funnel-arrow)"/>
<line x1="642" y1="184" x2="642" y2="291" stroke="#4b5e71" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#post-funnel-arrow)"/>
<rect x="584" y="72" width="116" height="112" rx="6" fill="#f5f7f9"/>
<rect x="584" y="72" width="116" height="112" rx="6" fill="#181f25" stroke="#586e84" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02"/>
<text x="642" y="105" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">A second</text>
<text x="642" y="120" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">independent</text>
<text x="642" y="135" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">account</text>
<text x="642" y="149" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">or a higher rung,</text>
<text x="642" y="160" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">per claim</text>
<rect x="584" y="192" width="40" height="14" rx="2" fill="#f5f7f9" stroke="#586e84" stroke-width="0.8" stroke-dasharray="2,2"/>
<text x="604" y="202" fill="#586e84" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">next</text>
</g>
<g data-motion-item="" data-step="6" aria-label="Quoted word for word, with a link, and a question for the agency">
<line x1="700" y1="128" x2="723" y2="128" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#post-funnel-arrow)"/>
<rect x="724" y="80" width="116" height="96" rx="6" fill="#f5f7f9"/>
<rect x="724" y="80" width="116" height="96" rx="6" fill="#0071bc" stroke="#0071bc" stroke-width="1.2" fill-opacity="0.08"/>
<text x="782" y="107" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Quoted word</text>
<text x="782" y="122" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">for word</text>
<text x="782" y="136" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">with a link;</text>
<text x="782" y="147" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">a question for</text>
<text x="782" y="158" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">the agency</text>
<rect x="724" y="184" width="40" height="14" rx="2" fill="#f5f7f9" stroke="#586e84" stroke-width="0.8"/>
<text x="744" y="194" fill="#586e84" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">built</text>
</g>
      </svg>
