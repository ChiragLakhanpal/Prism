<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evidence-ladder-title evidence-ladder-desc" data-motion-root="" data-motion-mode="none" data-step-count="5" id="evidence-ladder-root">
        <title id="evidence-ladder-title">The evidence ladder</title>
        <desc id="evidence-ladder-desc">Rungs from the floor up: the World Bank's own record as the floor, then public posts, satellite pictures, formal complaints and field photos from staff, each harder to fake and closer to the works than the one below.</desc>
        <defs>
      <style>#evidence-ladder-root { font-family: 'Open Sans', system-ui, sans-serif; color: #181f25; }
      #evidence-ladder-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#evidence-ladder-root .diagram-container { overflow-x: visible; }
}</style>
<marker id="evidence-ladder-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5e71"/></marker>
<marker id="evidence-ladder-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0071bc"/></marker>
<marker id="evidence-ladder-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#01707e"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f7f9"/>
<line x1="36" y1="24" x2="36" y2="284" stroke="#586e84" stroke-width="1.5"/>
<line x1="284" y1="24" x2="284" y2="284" stroke="#586e84" stroke-width="1.5"/>
<line x1="36" y1="54" x2="284" y2="54" stroke="#586e84" stroke-width="1.5"/>
<line x1="36" y1="118" x2="284" y2="118" stroke="#586e84" stroke-width="1.5"/>
<line x1="36" y1="182" x2="284" y2="182" stroke="#586e84" stroke-width="1.5"/>
<line x1="36" y1="246" x2="284" y2="246" stroke="#586e84" stroke-width="1.5"/>
<g data-motion-item="" data-step="1" aria-label="The floor: the World Bank's own record, the ISR narrative and the notices">
<rect x="24" y="284" width="272" height="44" rx="6" fill="#f5f7f9"/>
<rect x="24" y="284" width="272" height="44" rx="6" fill="#181f25" stroke="#4b5e71" stroke-width="1" fill-opacity="0.05"/>
<text x="160" y="303.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">The World Bank's own record</text>
<text x="160" y="317.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">ISR narrative and the notices</text>
</g>
<g data-motion-item="" data-step="2" aria-label="Public posts, quoted word for word, which can start a question">
<rect x="36" y="224" width="248" height="44" rx="6" fill="#f5f7f9"/>
<rect x="36" y="224" width="248" height="44" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="160" y="243.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Public posts</text>
<text x="160" y="257.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">quoted word for word; can start a question</text>
</g>
<g data-motion-item="" data-step="2" aria-label="Up the ladder, harder to fake and closer to the works">
<line x1="312" y1="280" x2="312" y2="37" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#evidence-ladder-arrow)"/>
<rect x="320" y="140" width="76" height="38" rx="2" fill="#f5f7f9"/>
<text x="324" y="152" fill="#586e84" font-size="8" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">harder to fake,</text>
<text x="324" y="163" fill="#586e84" font-size="8" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">closer to</text>
<text x="324" y="174" fill="#586e84" font-size="8" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">the works</text>
</g>
<g data-motion-item="" data-step="3" aria-label="Satellite pictures, shown and not read, third because of cost">
<rect x="36" y="160" width="248" height="44" rx="6" fill="#f5f7f9"/>
<rect x="36" y="160" width="248" height="44" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="160" y="179.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Satellite pictures</text>
<text x="160" y="193.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">shown, not read; third because of cost</text>
</g>
<g data-motion-item="" data-step="4" aria-label="Formal complaints, in the Inspection Panel's register">
<rect x="36" y="96" width="248" height="44" rx="6" fill="#f5f7f9"/>
<rect x="36" y="96" width="248" height="44" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="160" y="115.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Formal complaints</text>
<text x="160" y="129.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">the Inspection Panel's register</text>
</g>
<g data-motion-item="" data-step="5" aria-label="Field photos from staff, dated and placed by the camera, seen by the team only">
<rect x="36" y="32" width="248" height="44" rx="6" fill="#f5f7f9"/>
<rect x="36" y="32" width="248" height="44" rx="6" fill="#0071bc" stroke="#0071bc" stroke-width="1.2" fill-opacity="0.08"/>
<text x="160" y="51.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Field photos from staff</text>
<text x="160" y="65.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">the camera's date and place; the team only</text>
</g>
      </svg>
