<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 864 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="research-run-title research-run-desc" data-motion-root="" data-motion-mode="none" data-step-count="6" id="research-run-root">
        <title id="research-run-title">How a run works</title>
        <desc id="research-run-desc">A run reads the project's facts, then every source at once into one item shape, hands every item to one writer call with no tools, checks every sentence, and keeps the brief with its run.</desc>
        <defs>
      <style>#research-run-root { font-family: 'Open Sans', system-ui, sans-serif; color: #181f25; }
      #research-run-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#research-run-root .diagram-container { overflow-x: visible; }
}</style>
