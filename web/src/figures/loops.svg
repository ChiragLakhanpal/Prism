<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 864 268" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loops-title loops-desc" id="loops-root">
        <title id="loops-title">Three loops, one dated store</title>
        <desc id="loops-desc">The knowledge loop each week, the retrieval loop each month and the estimates loop each quarter each read from and write to one dated store that keeps every version, and plans made with the estimates come back as new signings, so each estimate shown is logged.</desc>
