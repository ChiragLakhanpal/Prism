<!DOCTYPE html>
<html lang="en">
<head>

  <title>How a public post reaches the brief</title>
  <!-- Prism deck figure, research talk: diagram-design, strata-wb profile, standard ramp, drawn 1:1 in its slot.
       F8, a flowchart that narrows left to right, with the set-aside lane below (type-flowchart.md).
       Font source: system. The app self-hosts Open Sans and Roboto Mono, so this file loads no web font.
       Each group marked data-motion-item is one press on the deck; everything else is structure. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Open Sans', system-ui, sans-serif; background: #f5f7f9; color: #181f25; min-height: 100vh; display: flex;
           align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: 'Open Sans', system-ui, sans-serif; font-size: 1.75rem; font-weight: 700; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 864px; max-width: 864px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1>How a public post reaches the brief</h1>

        <title id="post-funnel-title">How a public post reaches the brief</title>
        <desc id="post-funnel-desc">The newest posts per tag pass a place-and-sector test, then the account rules designed for next, and what survives is quoted word for word as a voice; what each step sets aside is counted.</desc>

<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#01707e"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f7f9"/>

<text x="82" y="147" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">the sector word,</text>

<text x="362" y="152.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">beyond one agency</text>

<text x="502" y="114.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Not a burst</text>

</g>

<line x1="560" y1="128" x2="583" y2="128" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#arrow)"/>

<text x="642" y="105" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">A second</text>
<text x="642" y="120" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">independent</text>
<text x="642" y="135" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">account</text>
<text x="642" y="149" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">or a higher rung,</text>
<text x="642" y="160" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">per claim</text>
<rect x="584" y="192" width="40" height="14" rx="2" fill="#f5f7f9" stroke="#586e84" stroke-width="0.8" stroke-dasharray="2,2"/>

<text x="782" y="122" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">for word</text>
