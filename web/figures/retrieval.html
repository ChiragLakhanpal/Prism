<!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>What happens behind one answer</title>
      <!-- Strata deck figure, second draft: diagram-design, strata-wb profile, standard ramp, drawn 1:1 in its slot.
           One question's path, after the study guide's question_sequence: the person, the Databricks App, the
       Foundry agent and Databricks' data, with the tool rounds, the rewrite, the verifier and the run log, in
       eight steps. Font source: system. The app self-hosts Open Sans and Roboto Mono, so this file loads no
           web font. -->
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Open Sans', system-ui, sans-serif; background: #f5f7f9; color: #181f25; min-height: 100vh; display: flex;
               align-items: center; justify-content: center; padding: 3rem 2rem; }
        .frame { max-width: 1200px; width: 100%; }
        .diagram-container { width: 100%; overflow-x: auto; }
        h1 { font-family: 'Open Sans', system-ui, sans-serif; font-size: 1.75rem; font-weight: 700; margin-bottom: 1.5rem; }
        svg { width: 100%; min-width: 864px; max-width: 864px; display: block; }
        @media print {
          .diagram-container { overflow-x: visible; }
          svg { min-width: 0; }
        }
      </style>
    </head>
    <body>
      <div class="frame">
        <h1>What happens behind one answer</h1>
        <div class="diagram-container">
          <svg viewBox="0 0 864 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="retrieval-title retrieval-desc" data-motion-root="" data-motion-mode="none" data-step-count="8">
            <title id="retrieval-title">What happens behind one answer</title>
            <desc id="retrieval-desc">The person asks in the app with POST /api/ask. The app sends the Foundry agent the question as data, and the agent asks for tools. The app runs each tool with the viewer's own token, and rows come back with evidence IDs. After a fixed number of rounds the agent answers in claims. A sentence that would fail goes back once, then the verifier runs every check and removes what it can't back. The app streams the answer and logs the run to strata.ops.</desc>
            <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4b5e71"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#0071bc"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#01707e"/></marker>
            </defs>
            <rect width="100%" height="100%" fill="#f5f7f9"/>
    <rect x="8" y="6" width="104" height="36" rx="6" fill="#f5f7f9"/>
<rect x="8" y="6" width="104" height="36" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="18" y="20" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">The person</text>
<text x="18" y="32" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">in the browser</text>
<line x1="60" y1="42" x2="60" y2="348" stroke="#586e84" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="216" y="6" width="168" height="36" rx="6" fill="#f5f7f9"/>
<rect x="216" y="6" width="168" height="36" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="226" y="20" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">Databricks App</text>
<text x="226" y="32" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">FastAPI and the verifier</text>
<line x1="300" y1="42" x2="300" y2="348" stroke="#586e84" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="456" y="6" width="168" height="36" rx="6" fill="#f5f7f9"/>
<rect x="456" y="6" width="168" height="36" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="466" y="20" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">Foundry agent</text>
<text x="466" y="32" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">a prompt agent</text>
<line x1="540" y1="42" x2="540" y2="348" stroke="#586e84" stroke-width="1" stroke-dasharray="3,3"/>
<rect x="704" y="6" width="152" height="36" rx="6" fill="#f5f7f9"/>
<rect x="704" y="6" width="152" height="36" rx="6" fill="#ffffff" stroke="#181f25" stroke-width="1"/>
<text x="714" y="20" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">Databricks data</text>
<text x="714" y="32" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">SQL, AI Search, Genie</text>
<line x1="780" y1="42" x2="780" y2="348" stroke="#586e84" stroke-width="1" stroke-dasharray="3,3"/>
<g data-motion-item="" data-step="1" aria-label="The person asks: POST /api/ask">
<path d="M 60 64 L 298 64" fill="none" stroke="#0071bc" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="84.5" y="48" width="191" height="13" rx="2" fill="#f5f7f9"/>
<text x="180" y="58" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">POST /api/ask: question, scope, as-of</text>
</g>
<g data-motion-item="" data-step="2" aria-label="The app sends the agent the question, as data">
<path d="M 300 90 L 538 90" fill="none" stroke="#0071bc" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="351.5" y="74" width="137" height="13" rx="2" fill="#f5f7f9"/>
<text x="420" y="84" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">the question, as data only</text>
</g>
<g data-motion-item="" data-step="3" aria-label="The agent asks for tools">
<path d="M 540 116 L 302 116" fill="none" stroke="#01707e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<rect x="327" y="100" width="186" height="13" rx="2" fill="#f5f7f9"/>
<text x="420" y="110" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">tool calls, such as find_comparables</text>
</g>
<g data-motion-item="" data-step="3" aria-label="The app runs each tool as the viewer">
<path d="M 300 142 L 778 142" fill="none" stroke="#0071bc" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="442" y="126" width="196" height="13" rx="2" fill="#f5f7f9"/>
<text x="540" y="136" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">each tool, with the viewer's own token</text>
</g>
<g data-motion-item="" data-step="4" aria-label="Rows come back, each with an evidence ID">
<path d="M 780 168 L 302 168" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="422" y="152" width="236" height="13" rx="2" fill="#f5f7f9"/>
<text x="540" y="162" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">rows, each with an evidence ID and public date</text>
</g>
<g data-motion-item="" data-step="4" aria-label="The results go back to the agent, for a fixed number of rounds">
<path d="M 300 194 L 538 194" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="314.5" y="178" width="211" height="13" rx="2" fill="#f5f7f9"/>
<text x="420" y="188" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">the results, for a fixed number of rounds</text>
</g>
<g data-motion-item="" data-step="5" aria-label="The agent answers in claims">
<path d="M 540 220 L 302 220" fill="none" stroke="#01707e" stroke-width="1.2" marker-end="url(#arrow-link)"/>
<rect x="307" y="204" width="226" height="13" rx="2" fill="#f5f7f9"/>
<text x="420" y="214" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">claims: sentence, IDs, numbers, dates, quote</text>
</g>
<g data-motion-item="" data-step="6" aria-label="A sentence that would fail goes back once">
<path d="M 302 246 L 538 246" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="314.5" y="230" width="211" height="13" rx="2" fill="#f5f7f9"/>
<text x="420" y="240" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">a sentence that would fail goes back once</text>
</g>
<g data-motion-item="" data-step="7" aria-label="The verifier runs every check">
<rect x="295" y="252" width="10" height="60" rx="2" fill="#0071bc" fill-opacity="0.18" stroke="#0071bc" stroke-width="1"/>
<rect x="96" y="252" width="194" height="60" rx="6" fill="#f5f7f9"/>
<rect x="96" y="252" width="194" height="60" rx="6" fill="#ffffff" stroke="#0071bc" stroke-width="1"/>
<rect x="96" y="252" width="194" height="60" rx="6" fill="#0071bc" fill-opacity="0.07"/>
<text x="106" y="270" fill="#181f25" font-size="11" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">The verifier</text>
<text x="106" y="284" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">numbers and dates, IDs, quotes,</text>
<text x="106" y="295" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">a model judge, advice, disagreements</text>
<text x="106" y="306" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">and it removes what it can't back</text>
</g>
<g data-motion-item="" data-step="8" aria-label="The app streams the answer">
<path d="M 294 336 L 62 336" fill="none" stroke="#0071bc" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
<rect x="74.5" y="320" width="211" height="13" rx="2" fill="#f5f7f9"/>
<text x="180" y="330" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">sentences, evidence, and what was removed</text>
</g>
<g data-motion-item="" data-step="8" aria-label="The app logs the run to strata.ops">
<path d="M 306 336 L 778 336" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="471.5" y="320" width="137" height="13" rx="2" fill="#f5f7f9"/>
<text x="540" y="330" fill="#4b5e71" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">the run log, to strata.ops</text>
</g>
          </svg>
        </div>
      </div>
    </body>
    </html>
