<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How a time estimate is made</title>
  <!-- Strata deck figure, second draft: diagram-design, strata-wb profile, standard ramp, drawn 1:1 in its slot.
       Font source: system. The app self-hosts Open Sans and Roboto Mono, so this file loads no web font.
       Each group marked data-motion-item is one press on the deck; everything else is structure. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Open Sans', system-ui, sans-serif; background: #f5f7f9; color: #181f25; min-height: 100vh; display: flex;
           align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: 'Open Sans', system-ui, sans-serif; font-size: 1.75rem; font-weight: 700; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 864px; max-width: 864px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1>How a time estimate is made</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 864 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="estimate-title estimate-desc" data-motion-root="" data-motion-mode="none" data-step-count="6">
        <title id="estimate-title">How a time estimate is made</title>
        <desc id="estimate-desc">Stated criteria choose comparable packages, and with too few Strata shows every package and gives no range; otherwise the past range counts packages still open, a survival model gives the time estimate with its track record, and the plan's date is read against both.</desc>
        <defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5e71"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0071bc"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#01707e"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f7f9"/>
<g data-motion-item="" data-step="1" aria-label="A package and its stated criteria: method, category, market approach, review type, size, region and period">
<rect x="24" y="24" width="588" height="44" rx="6" fill="#f5f7f9"/>
<rect x="24" y="24" width="588" height="44" rx="6" fill="rgba(75,94,113,0.1)" stroke="#586e84" stroke-width="1"/>
<text x="40" y="50" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">A package</text>
<rect x="116" y="36" width="52" height="20" rx="4" fill="#ffffff" stroke="#586e84" stroke-width="0.8"/>
<text x="142" y="49" fill="#181f25" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">method</text>
<rect x="176" y="36" width="60" height="20" rx="4" fill="#ffffff" stroke="#586e84" stroke-width="0.8"/>
<text x="206" y="49" fill="#181f25" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">category</text>
<rect x="244" y="36" width="100" height="20" rx="4" fill="#ffffff" stroke="#586e84" stroke-width="0.8"/>
<text x="294" y="49" fill="#181f25" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">market approach</text>
<rect x="352" y="36" width="76" height="20" rx="4" fill="#ffffff" stroke="#586e84" stroke-width="0.8"/>
<text x="390" y="49" fill="#181f25" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">review type</text>
<rect x="436" y="36" width="40" height="20" rx="4" fill="#ffffff" stroke="#586e84" stroke-width="0.8"/>
<text x="456" y="49" fill="#181f25" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">size</text>
<rect x="484" y="36" width="52" height="20" rx="4" fill="#ffffff" stroke="#586e84" stroke-width="0.8"/>
<text x="510" y="49" fill="#181f25" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">region</text>
<rect x="544" y="36" width="52" height="20" rx="4" fill="#ffffff" stroke="#586e84" stroke-width="0.8"/>
<text x="570" y="49" fill="#181f25" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">period</text>
</g>
<g data-motion-item="" data-step="2" aria-label="Comparable packages: past packages that match on those criteria">
<path d="M112,68 V155" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="24" y="156" width="176" height="48" rx="6" fill="#f5f7f9"/>
<rect x="24" y="156" width="176" height="48" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="112" y="184.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Comparable packages</text>
</g>
<g data-motion-item="" data-step="3" aria-label="Is the number of comparable packages enough?">
<path d="M200,180 H227" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#arrow)"/>
<polygon points="272,148 316,180 272,212 228,180" fill="#f5f7f9"/>
<polygon points="272,148 316,180 272,212 228,180" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="272" y="184" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Enough?</text>
</g>
<g data-motion-item="" data-step="3" aria-label="With too few, every package is shown and no range is given">
<path d="M272,212 V271" fill="none" stroke="#4b5e71" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<rect x="280" y="236" width="48" height="12" rx="2" fill="#f5f7f9"/>
<text x="284" y="245" fill="#586e84" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">Too few</text>
<rect x="160" y="272" width="224" height="48" rx="6" fill="#f5f7f9"/>
<rect x="160" y="272" width="224" height="48" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="272" y="300.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Every package shown, no range</text>
</g>
<g data-motion-item="" data-step="4" aria-label="Otherwise the past range counts packages still open">
<path d="M316,180 H360" fill="none" stroke="#4b5e71" stroke-width="1.2"/>
<circle cx="364" cy="180" r="4" fill="#4b5e71"/>
<rect x="318" y="160" width="40" height="12" rx="2" fill="#f5f7f9"/>
<text x="338" y="169" fill="#586e84" font-size="9" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Enough</text>
<path d="M364,176 V148.0 Q364,140.0 372,140.0 H395" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="396" y="112" width="216" height="56" rx="6" fill="#f5f7f9"/>
<rect x="396" y="112" width="216" height="56" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="504" y="131.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Past range</text>
<text x="504" y="145.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">packages still open</text>
<text x="504" y="157.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">are counted</text>
</g>
<g data-motion-item="" data-step="5" aria-label="A survival model gives the time estimate, with its track record from years it had not seen">
<path d="M364,184 V212.0 Q364,220.0 372,220.0 H395" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="396" y="192" width="216" height="56" rx="6" fill="#f5f7f9"/>
<rect x="396" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="504" y="211.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Time estimate</text>
<text x="504" y="225.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">a survival model, tested on</text>
<text x="504" y="237.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">years it had not seen</text>
</g>
<g data-motion-item="" data-step="6" aria-label="The plan's date is read against both: how many comparable packages were signed by then">
<path d="M612,140.0 H628 Q636,140.0 636,148.0 V160 Q636,168 644,168 H659" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M612,220.0 H628 Q636,220.0 636,212.0 V200 Q636,192 644,192 H659" fill="none" stroke="#4b5e71" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="660" y="148" width="180" height="64" rx="6" fill="#f5f7f9"/>
<rect x="660" y="148" width="180" height="64" rx="6" fill="rgba(0,113,188,0.08)" stroke="#0071bc" stroke-width="1.2"/>
<text x="750" y="171.5" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">The plan's date</text>
<text x="750" y="185.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">how many comparable packages</text>
<text x="750" y="197.5" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">were signed by then</text>
</g>
      </svg>
    </div>
  </div>
</body>
</html>
