<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The sections of the brief</title>
  <!-- Prism deck figure, the research talk: diagram-design, strata-wb profile, standard ramp, drawn 1:1 in its slot.
       F4, a row of the brief's sections under their group headings, in the order the brief prints them.
       Font source: system. The app self-hosts Open Sans and Roboto Mono, so this file loads no web font.
       Each group marked data-motion-item is one press on the deck; everything else is structure. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Open Sans', system-ui, sans-serif; background: #f5f7f9; color: #181f25; min-height: 100vh; display: flex;
           align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-family: 'Open Sans', system-ui, sans-serif; font-size: 1.75rem; font-weight: 700; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 864px; max-width: 864px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1>The sections of the brief</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 864 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="brief-sections-title brief-sections-desc" data-motion-root="" data-motion-mode="none" data-step-count="3">
        <title id="brief-sections-title">The sections of the brief</title>
        <desc id="brief-sections-desc">The brief's sections in order: the headline, the picture on the ground and the bottom line carry the message; developments, by site and what people are saying carry the evidence; the questions and what could not be seen say what to do and what is missing.</desc>
        <defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b5e71"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0071bc"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#01707e"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f7f9"/>
<line x1="24" y1="276" x2="838" y2="276" stroke="#586e84" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="24" y="256" width="164" height="12" rx="2" fill="#f5f7f9"/>
<text x="24" y="265" fill="#586e84" font-size="8" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="start">the order they appear in the brief</text>
<g data-motion-item="" data-step="1" aria-label="The message first: headline, the picture on the ground, bottom line for procurement">
<text x="24" y="96" fill="#181f25" font-size="14" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">The message, first</text>
<path d="M 24 118 V 112 H 324 V 118" fill="none" stroke="#586e84" stroke-width="1"/>
<rect x="24" y="128" width="84" height="112" rx="6" fill="#f5f7f9"/>
<rect x="24" y="128" width="84" height="112" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="66" y="160" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Headline</text>
<text x="66" y="178" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">one sentence</text>
<rect x="116" y="128" width="96" height="112" rx="6" fill="#f5f7f9"/>
<rect x="116" y="128" width="96" height="112" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="164" y="160" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">The picture</text>
<text x="164" y="174" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">on the ground</text>
<text x="164" y="192" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">short cited</text>
<text x="164" y="203" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">paragraphs</text>
<rect x="220" y="128" width="104" height="112" rx="6" fill="#f5f7f9"/>
<rect x="220" y="128" width="104" height="112" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="272" y="160" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Bottom line for</text>
<text x="272" y="174" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">procurement</text>
<text x="272" y="192" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">which contracts</text>
<text x="272" y="203" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">to check first</text>
</g>
<g data-motion-item="" data-step="2" aria-label="The evidence and the voices: developments newest first, by site, what people are saying">
<text x="340" y="96" fill="#181f25" font-size="14" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">The evidence and the voices</text>
<path d="M 340 118 V 112 H 636 V 118" fill="none" stroke="#586e84" stroke-width="1"/>
<rect x="340" y="128" width="104" height="112" rx="6" fill="#f5f7f9"/>
<rect x="340" y="128" width="104" height="112" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="392" y="160" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Developments,</text>
<text x="392" y="174" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">newest first</text>
<text x="392" y="192" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">dated groups</text>
<rect x="452" y="128" width="92" height="112" rx="6" fill="#f5f7f9"/>
<rect x="452" y="128" width="92" height="112" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="498" y="160" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">By site</text>
<text x="498" y="178" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">photos and</text>
<text x="498" y="189" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">satellite years</text>
<text x="498" y="200" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">side by side</text>
<rect x="552" y="128" width="84" height="112" rx="6" fill="#f5f7f9"/>
<rect x="552" y="128" width="84" height="112" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="594" y="160" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">What people</text>
<text x="594" y="174" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">are saying</text>
<text x="594" y="192" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">quotes word</text>
<text x="594" y="203" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">for word</text>
</g>
<g data-motion-item="" data-step="3" aria-label="What to do, and what is missing: questions for the agencies, what I could not see">
<text x="652" y="96" fill="#181f25" font-size="14" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">and what is missing</text>
<text x="652" y="78" fill="#181f25" font-size="14" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="start">What to do,</text>
<path d="M 652 118 V 112 H 840 V 118" fill="none" stroke="#586e84" stroke-width="1"/>
<rect x="652" y="128" width="92" height="112" rx="6" fill="#f5f7f9"/>
<rect x="652" y="128" width="92" height="112" rx="6" fill="#ffffff" stroke="#586e84" stroke-width="1"/>
<text x="698" y="160" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">Questions for</text>
<text x="698" y="174" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">the agencies</text>
<text x="698" y="192" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">each with a</text>
<text x="698" y="203" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">short lead</text>
<rect x="752" y="128" width="88" height="112" rx="6" fill="#f5f7f9"/>
<rect x="752" y="128" width="88" height="112" rx="6" fill="rgba(0,113,188,0.08)" stroke="#0071bc" stroke-width="1.2"/>
<text x="796" y="160" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">What I could</text>
<text x="796" y="174" fill="#181f25" font-size="12" font-weight="600" font-family="'Open Sans', system-ui, sans-serif" text-anchor="middle">not see</text>
<text x="796" y="192" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">the sources</text>
<text x="796" y="203" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">not reached,</text>
<text x="796" y="214" fill="#4b5e71" font-size="9" font-family="'Roboto Mono', ui-monospace, monospace" text-anchor="middle">and why</text>
</g>
      </svg>
    </div>
  </div>
</body>
</html>
