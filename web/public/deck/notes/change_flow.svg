<svg viewBox="0 0 900 215" role="img" aria-label="The path of a live change: find its one file, edit it, update the recorded answers and tests that state the old value, commit, and let the gate prove it; the workspace part runs only with the owner&#x27;s go-ahead." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="change_flow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="change_flow-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="change_flow-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="change_flow-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="change_flow-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="40" width="136" height="92" rx="8" class="d-box"/>
<text x="78.0" y="75.5" class="d-text b" text-anchor="middle">The panel asks</text>
<text x="78.0" y="90.5" class="d-text s" text-anchor="middle"><tspan x="78.0" dy="0">for example: add Nepal</tspan><tspan x="78.0" dy="14">to the pilot countries</tspan></text>
<path d="M146,86 L160,86" class="d-arrow" marker-end="url(#change_flow-a)"/>
<rect x="160" y="40" width="136" height="92" rx="8" class="d-box hi"/>
<text x="228.0" y="82.5" class="d-text b" text-anchor="middle">Find the one place</text>
<text x="228.0" y="97.5" class="d-text s" text-anchor="middle">config/slice.toml</text>
<path d="M296,86 L310,86" class="d-arrow" marker-end="url(#change_flow-a)"/>
<rect x="310" y="40" width="136" height="92" rx="8" class="d-box hi"/>
<text x="378.0" y="82.5" class="d-text b" text-anchor="middle">Edit it</text>
<text x="378.0" y="97.5" class="d-text s" text-anchor="middle">one entry</text>
<path d="M446,86 L460,86" class="d-arrow" marker-end="url(#change_flow-a)"/>
<rect x="460" y="40" width="136" height="92" rx="8" class="d-box"/>
<text x="528.0" y="68.5" class="d-text b" text-anchor="middle">Update what follows</text>
<text x="528.0" y="83.5" class="d-text s" text-anchor="middle"><tspan x="528.0" dy="0">re-record API answers;</tspan><tspan x="528.0" dy="14">fix tests that state</tspan><tspan x="528.0" dy="14">the old value</tspan></text>
<path d="M596,86 L610,86" class="d-arrow" marker-end="url(#change_flow-a)"/>
<rect x="610" y="40" width="136" height="92" rx="8" class="d-box"/>
<text x="678.0" y="75.5" class="d-text b" text-anchor="middle">Commit</text>
<text x="678.0" y="90.5" class="d-text s" text-anchor="middle"><tspan x="678.0" dy="0">the gate runs,</tspan><tspan x="678.0" dy="14">about 2 minutes</tspan></text>
<path d="M746,86 L760,86" class="d-arrow" marker-end="url(#change_flow-a)"/>
<rect x="760" y="40" width="136" height="92" rx="8" class="d-box green"/>
<text x="828.0" y="75.5" class="d-text b" text-anchor="middle">Green</text>
<text x="828.0" y="90.5" class="d-text s" text-anchor="middle"><tspan x="828.0" dy="0">the change is proven</tspan><tspan x="828.0" dy="14">offline</tspan></text>
<rect x="560" y="160" width="330" height="44" rx="8" class="d-box dash"/>
<text x="725.0" y="178.5" class="d-text b" text-anchor="middle">Workspace part, with the owner&#x27;s go-ahead</text>
<text x="725.0" y="193.5" class="d-text s" text-anchor="middle">agent sync, app deploy or bundle deploy</text>
<path d="M840,132 L840,160" class="d-arrow dash" marker-end="url(#change_flow-a)"/>
<text x="10" y="22" class="d-text gt" text-anchor="start">REHEARSED: 3 TO 4 MINUTES EACH ON KNOWN CHANGES. COLD: 5 MIN 50 S AND 8 MIN 17 S.</text>
</svg>