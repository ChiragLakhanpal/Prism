<svg viewBox="0 0 900 400" role="img" aria-label="An illustrative journey of one award through the layers: one page in bronze, one row per joint-venture member in silver, and in gold one contract with its amount counted once, linked to its members, its package and a report paragraph." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="record_journey-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="record_journey-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="record_journey-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="record_journey-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="record_journey-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<text x="10" y="20" class="d-text gt" text-anchor="start">ILLUSTRATIVE: A WORKS CONTRACT WON BY A TWO-MEMBER JOINT VENTURE</text>
<rect x="10" y="40" width="200" height="110" rx="8" class="d-box"/>
<text x="110.0" y="70.5" class="d-text b" text-anchor="middle">Finances One page</text>
<text x="110.0" y="85.5" class="d-text s" text-anchor="middle"><tspan x="110.0" dy="0">JSON, 1,000 records; this</tspan><tspan x="110.0" dy="14">contract is two records,</tspan><tspan x="110.0" dy="14">one per member, each with</tspan><tspan x="110.0" dy="14">its share of the amount</tspan></text>
<rect x="240" y="40" width="200" height="110" rx="8" class="d-box"/>
<text x="340.0" y="77.5" class="d-text b" text-anchor="middle">bronze.api_pages</text>
<text x="340.0" y="92.5" class="d-text s" text-anchor="middle"><tspan x="340.0" dy="0">1 row: the page as text,</tspan><tspan x="340.0" dy="14">its hash, fetch time,</tspan><tspan x="340.0" dy="14">public_from = fetch day</tspan></text>
<rect x="470" y="40" width="200" height="110" rx="8" class="d-box"/>
<text x="570.0" y="70.5" class="d-text b" text-anchor="middle">silver.awards</text>
<text x="570.0" y="85.5" class="d-text s" text-anchor="middle"><tspan x="570.0" dy="0">2 rows: member A and B;</tspan><tspan x="570.0" dy="14">typed dates and amounts;</tspan><tspan x="570.0" dy="14">STEP reference cleaned;</tspan><tspan x="570.0" dy="14">public_from = signing day</tspan></text>
<rect x="700" y="40" width="190" height="110" rx="8" class="d-box"/>
<text x="795.0" y="70.5" class="d-text b" text-anchor="middle">silver.awards_current</text>
<text x="795.0" y="85.5" class="d-text s" text-anchor="middle"><tspan x="795.0" dy="0">a view: the newest</tspan><tspan x="795.0" dy="14">page for each request,</tspan><tspan x="795.0" dy="14">so a share the source</tspan><tspan x="795.0" dy="14">took back is dropped</tspan></text>
<path d="M210,95 L240,95" class="d-arrow hi" marker-end="url(#record_journey-a-hi)"/>
<path d="M440,95 L470,95" class="d-arrow hi" marker-end="url(#record_journey-a-hi)"/>
<path d="M670,95 L700,95" class="d-arrow hi" marker-end="url(#record_journey-a-hi)"/>
<path d="M795,150 L795,185 L450,185 L450,210" class="d-arrow hi" marker-end="url(#record_journey-a-hi)"/>
<rect x="10" y="210" width="205" height="86" rx="8" class="d-box hi"/>
<text x="112.5" y="235.5" class="d-text b" text-anchor="middle">gold.contract</text>
<text x="112.5" y="250.5" class="d-text s" text-anchor="middle"><tspan x="112.5" dy="0">1 row: the amount is the</tspan><tspan x="112.5" dy="14">sum of the shares, counted</tspan><tspan x="112.5" dy="14">once; joint_venture = true</tspan></text>
<rect x="235" y="210" width="205" height="86" rx="8" class="d-box"/>
<text x="337.5" y="235.5" class="d-text b" text-anchor="middle">gold.contract_supplier</text>
<text x="337.5" y="250.5" class="d-text s" text-anchor="middle"><tspan x="337.5" dy="0">2 rows: each member,</tspan><tspan x="337.5" dy="14">linked to the joint</tspan><tspan x="337.5" dy="14">venture&#x27;s own id</tspan></text>
<rect x="460" y="210" width="205" height="86" rx="8" class="d-box"/>
<text x="562.5" y="235.5" class="d-text b" text-anchor="middle">gold.supplier</text>
<text x="562.5" y="250.5" class="d-text s" text-anchor="middle"><tspan x="562.5" dy="0">3 rows: member A, member B</tspan><tspan x="562.5" dy="14">and the joint venture,</tspan><tspan x="562.5" dy="14">named by its members</tspan></text>
<rect x="685" y="210" width="205" height="86" rx="8" class="d-box"/>
<text x="787.5" y="235.5" class="d-text b" text-anchor="middle">gold.package</text>
<text x="787.5" y="250.5" class="d-text s" text-anchor="middle"><tspan x="787.5" dy="0">1 row, keyed by the STEP</tspan><tspan x="787.5" dy="14">reference; joins notices,</tspan><tspan x="787.5" dy="14">the contract and plan rows</tspan></text>
<rect x="10" y="330" width="880" height="56" rx="8" class="d-box"/>
<text x="450.0" y="347.5" class="d-text b" text-anchor="middle">gold.edge</text>
<text x="450.0" y="362.5" class="d-text s" text-anchor="middle"><tspan x="450.0" dy="0">links the contract to its supplier, package and project, and, when the score passes 0.5, to a completion</tspan><tspan x="450.0" dy="14">report paragraph it &quot;appeared together&quot; with</tspan></text>
<path d="M112,296 L112,330" class="d-arrow" marker-end="url(#record_journey-a)"/>
<path d="M337,296 L337,330" class="d-arrow" marker-end="url(#record_journey-a)"/>
<path d="M562,296 L562,330" class="d-arrow" marker-end="url(#record_journey-a)"/>
<path d="M787,296 L787,330" class="d-arrow" marker-end="url(#record_journey-a)"/>
</svg>