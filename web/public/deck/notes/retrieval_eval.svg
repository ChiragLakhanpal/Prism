<svg viewBox="0 0 900 260" role="img" aria-label="How search quality is measured: labeled query sets, metrics computed only on documents public before each query&#x27;s date, and a tuning gate that refuses any change that loses on the held-out set." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="retrieval_eval-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="retrieval_eval-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="retrieval_eval-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="retrieval_eval-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="retrieval_eval-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="20" width="250" height="50" rx="8" class="d-box"/>
<text x="135.0" y="34.5" class="d-text b" text-anchor="middle">ICR Reviews&#x27; citations</text>
<text x="135.0" y="49.5" class="d-text s" text-anchor="middle"><tspan x="135.0" dy="0">&quot;(ICR para N)&quot; names the</tspan><tspan x="135.0" dy="14">right paragraph: silver labels</tspan></text>
<path d="M260,45 L300,45 L300,125 L330,125" class="d-arrow" marker-end="url(#retrieval_eval-a)"/>
<rect x="10" y="78" width="250" height="50" rx="8" class="d-box"/>
<text x="135.0" y="92.5" class="d-text b" text-anchor="middle">PADs&#x27; lessons sections</text>
<text x="135.0" y="107.5" class="d-text s" text-anchor="middle"><tspan x="135.0" dy="0">the section that answers</tspan><tspan x="135.0" dy="14">&quot;lessons reflected&quot;: silver</tspan></text>
<path d="M260,103 L300,103 L300,125 L330,125" class="d-arrow" marker-end="url(#retrieval_eval-a)"/>
<rect x="10" y="136" width="250" height="50" rx="8" class="d-box"/>
<text x="135.0" y="150.5" class="d-text b" text-anchor="middle">Notice queries</text>
<text x="135.0" y="165.5" class="d-text s" text-anchor="middle"><tspan x="135.0" dy="0">150 planned, 3 written;</tspan><tspan x="135.0" dy="14">two judges each, kappa</tspan></text>
<path d="M260,161 L300,161 L300,125 L330,125" class="d-arrow" marker-end="url(#retrieval_eval-a)"/>
<rect x="10" y="194" width="250" height="50" rx="8" class="d-box"/>
<text x="135.0" y="208.5" class="d-text b" text-anchor="middle">Bilingual sets</text>
<text x="135.0" y="223.5" class="d-text s" text-anchor="middle"><tspan x="135.0" dy="0">English to French and</tspan><tspan x="135.0" dy="14">French to English</tspan></text>
<path d="M260,219 L300,219 L300,125 L330,125" class="d-arrow" marker-end="url(#retrieval_eval-a)"/>
<rect x="330" y="75" width="250" height="100" rx="8" class="d-box hi"/>
<text x="455.0" y="100.5" class="d-text b" text-anchor="middle">Metrics</text>
<text x="455.0" y="115.5" class="d-text s" text-anchor="middle"><tspan x="455.0" dy="0">precision at 10, recall at 20,</tspan><tspan x="455.0" dy="14">nDCG at 10, using only</tspan><tspan x="455.0" dy="14">documents public before</tspan><tspan x="455.0" dy="14">each query&#x27;s date</tspan></text>
<rect x="620" y="75" width="270" height="100" rx="8" class="d-box green"/>
<text x="755.0" y="100.5" class="d-text b" text-anchor="middle">Tuning gate</text>
<text x="755.0" y="115.5" class="d-text s" text-anchor="middle"><tspan x="755.0" dy="0">a new search setup ships only</tspan><tspan x="755.0" dy="14">if it loses nothing on any</tspan><tspan x="755.0" dy="14">measure of the held-out set</tspan><tspan x="755.0" dy="14">(1 query in 3)</tspan></text>
<path d="M580,125 L620,125" class="d-arrow" marker-end="url(#retrieval_eval-a)"/>
<text x="330" y="214" class="d-text s" text-anchor="start">Live feedback never enters an evaluation set; only reviewed reports train anything.</text>
</svg>