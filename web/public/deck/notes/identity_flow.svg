<svg viewBox="0 0 900 320" role="img" aria-label="Two identities in the app: tools run with the viewer&#x27;s own forwarded token, so permissions and masks apply to them; the app&#x27;s own service principal writes only the app&#x27;s records, each naming the viewer it is for." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="identity_flow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="identity_flow-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="identity_flow-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="identity_flow-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="identity_flow-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="120" width="140" height="70" rx="8" class="d-box"/>
<text x="80.0" y="144.5" class="d-text b" text-anchor="middle">Viewer</text>
<text x="80.0" y="159.5" class="d-text s" text-anchor="middle"><tspan x="80.0" dy="0">signs in; Databricks</tspan><tspan x="80.0" dy="14">forwards their token</tspan></text>
<rect x="220" y="120" width="160" height="70" rx="8" class="d-box hi"/>
<text x="300.0" y="144.5" class="d-text b" text-anchor="middle">Strata app</text>
<text x="300.0" y="159.5" class="d-text s" text-anchor="middle"><tspan x="300.0" dy="0">builds a Viewer per</tspan><tspan x="300.0" dy="14">request; keeps none</tspan></text>
<path d="M150,155 L220,155" class="d-arrow hi" marker-end="url(#identity_flow-a-hi)"/>
<rect x="460" y="20" width="420" height="110" rx="8" class="d-box hi"/>
<text x="472" y="57.5" class="d-text b" text-anchor="start">As the viewer: every tool and read</text>
<text x="472" y="72.5" class="d-text s" text-anchor="start"><tspan x="472" dy="0">SQL warehouse, AI Search and Genie with the viewer&#x27;s token;</tspan><tspan x="472" dy="14">Unity Catalog grants and column masks apply; a request</tspan><tspan x="472" dy="14">with no token is refused, never run as someone else</tspan></text>
<rect x="460" y="170" width="420" height="130" rx="8" class="d-box violet"/>
<text x="472" y="210.5" class="d-text b" text-anchor="start">As the app&#x27;s own service principal: the app&#x27;s records</text>
<text x="472" y="225.5" class="d-text s" text-anchor="start"><tspan x="472" dy="0">usage events, agent runs, drafts and their states, lesson and</tspan><tspan x="472" dy="14">supplier decisions, passage reports, follows, Lakebase app state;</tspan><tspan x="472" dy="14">why: no viewer&#x27;s token can write another person&#x27;s row, and</tspan><tspan x="472" dy="14">the two-person rule holds because only the app writes reviews</tspan></text>
<path d="M380,140 L420,140 L420,75 L460,75" class="d-arrow hi" marker-end="url(#identity_flow-a-hi)"/>
<path d="M380,170 L420,170 L420,235 L460,235" class="d-arrow violet" marker-end="url(#identity_flow-a-violet)"/>
<rect x="220" y="230" width="160" height="70" rx="8" class="d-box violet"/>
<text x="300.0" y="247.5" class="d-text b" text-anchor="middle">Foundry agent</text>
<text x="300.0" y="262.5" class="d-text s" text-anchor="middle"><tspan x="300.0" dy="0">reached as the app&#x27;s</tspan><tspan x="300.0" dy="14">own Entra principal,</tspan><tspan x="300.0" dy="14">never as the viewer</tspan></text>
<path d="M300,190 L300,230" class="d-arrow violet" marker-end="url(#identity_flow-a-violet)"/>
</svg>