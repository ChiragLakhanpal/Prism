<svg viewBox="0 0 880 360" role="img" aria-label="Who does what: the borrower&#x27;s implementing agency plans and buys, the World Bank team supports and clears, IEG evaluates, and Prism reads what all three publish and drafts for people to check." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="roles-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="roles-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="roles-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="roles-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="roles-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="20" y="30" width="250" height="120" rx="8" class="d-box"/>
<text x="145.0" y="72.5" class="d-text b" text-anchor="middle">Borrower&#x27;s implementing agency</text>
<text x="145.0" y="87.5" class="d-text s" text-anchor="middle"><tspan x="145.0" dy="0">PIU, PMU or PCU</tspan><tspan x="145.0" dy="14">writes the PPSD and the Procurement Plan</tspan><tspan x="145.0" dy="14">runs the bidding, signs contracts</tspan></text>
<rect x="315" y="30" width="250" height="120" rx="8" class="d-box"/>
<text x="440.0" y="72.5" class="d-text b" text-anchor="middle">World Bank team</text>
<text x="440.0" y="87.5" class="d-text s" text-anchor="middle"><tspan x="440.0" dy="0">task team leader, procurement specialist</tspan><tspan x="440.0" dy="14">supports, reviews and clears the plan</tspan><tspan x="440.0" dy="14">writes the PAD, ISRs and the ICR</tspan></text>
<rect x="610" y="30" width="250" height="120" rx="8" class="d-box"/>
<text x="735.0" y="72.5" class="d-text b" text-anchor="middle">Independent Evaluation Group</text>
<text x="735.0" y="87.5" class="d-text s" text-anchor="middle"><tspan x="735.0" dy="0">reports to the Board, not to the team</tspan><tspan x="735.0" dy="14">writes ICR Reviews and PPARs</tspan><tspan x="735.0" dy="14">rates outcomes</tspan></text>
<path d="M270,62 L315,62" class="d-arrow" marker-end="url(#roles-a)"/>
<rect x="275.2" y="43.0" width="33.6" height="18" rx="3" class="d-label-bg"/>
<text x="292" y="54" class="d-text s lab" text-anchor="middle">plan</text>
<path d="M315,118 L270,118" class="d-arrow" marker-end="url(#roles-a)"/>
<rect x="269.3" y="125.0" width="45.4" height="18" rx="3" class="d-label-bg"/>
<text x="292" y="136" class="d-text s lab" text-anchor="middle">clears</text>
<path d="M565,90 L610,90" class="d-arrow" marker-end="url(#roles-a)"/>
<rect x="574.1" y="71.0" width="27.7" height="18" rx="3" class="d-label-bg"/>
<text x="588" y="82" class="d-text s lab" text-anchor="middle">ICR</text>
<rect x="250" y="250" width="380" height="86" rx="8" class="d-box hi"/>
<text x="440.0" y="275.5" class="d-text b" text-anchor="middle">Prism</text>
<text x="440.0" y="290.5" class="d-text s" text-anchor="middle"><tspan x="440.0" dy="0">reads what all three publish</tspan><tspan x="440.0" dy="14">drafts review notes, risk rows and dates</tspan><tspan x="440.0" dy="14">for people to check; decides nothing</tspan></text>
<path d="M145,150 L145,200 L320,200 L320,250" class="d-arrow dash" marker-end="url(#roles-a)"/>
<path d="M440,150 L440,200 L420,200 L420,250" class="d-arrow dash" marker-end="url(#roles-a)"/>
<path d="M735,150 L735,200 L600,200 L600,250" class="d-arrow dash" marker-end="url(#roles-a)"/>
<rect x="273.6" y="179.0" width="192.9" height="18" rx="3" class="d-label-bg"/>
<text x="370" y="190" class="d-text s lab" text-anchor="middle">published records and documents</text>
<path d="M250,293 L110,293 L110,150" class="d-arrow hi" marker-end="url(#roles-a-hi)"/>
<rect x="130.8" y="278.0" width="98.5" height="18" rx="3" class="d-label-bg"/>
<text x="180" y="289" class="d-text s lab" text-anchor="middle">drafts to check</text>
<path d="M510,250 L510,150" class="d-arrow hi" marker-end="url(#roles-a-hi)"/>
<rect x="514.0" y="221.0" width="98.5" height="18" rx="3" class="d-label-bg"/>
<text x="518" y="232" class="d-text s lab" text-anchor="start">drafts to check</text>
</svg>