<svg viewBox="0 0 900 330" role="img" aria-label="How the time estimate is built: features as of the day the package was advertised, an XGBoost survival model for the middle, split conformal calibration on held-out training packages for the range, and abstentions when the evidence is thin." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="time_estimate_flow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="time_estimate_flow-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="time_estimate_flow-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="time_estimate_flow-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="time_estimate_flow-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="40" width="195" height="130" rx="8" class="d-box hi"/>
<text x="107.5" y="73.0" class="d-text b" text-anchor="middle"><tspan x="107.5" dy="0">Features, as of the</tspan><tspan x="107.5" dy="15">advertising day</tspan></text>
<text x="107.5" y="103.0" class="d-text s" text-anchor="middle"><tspan x="107.5" dy="0">method, category, market</tspan><tspan x="107.5" dy="14">approach, review type,</tspan><tspan x="107.5" dy="14">amount, plan days, agency</tspan><tspan x="107.5" dy="14">history, region, CPIA, WGI</tspan></text>
<path d="M205,105 L238,105" class="d-arrow" marker-end="url(#time_estimate_flow-a)"/>
<rect x="238" y="40" width="195" height="130" rx="8" class="d-box violet"/>
<text x="335.5" y="80.5" class="d-text b" text-anchor="middle">XGBoost AFT</text>
<text x="335.5" y="95.5" class="d-text s" text-anchor="middle"><tspan x="335.5" dy="0">survival model; open</tspan><tspan x="335.5" dy="14">packages are censored,</tspan><tspan x="335.5" dy="14">not dropped; gives</tspan><tspan x="335.5" dy="14">the middle</tspan></text>
<path d="M433,105 L466,105" class="d-arrow" marker-end="url(#time_estimate_flow-a)"/>
<rect x="466" y="40" width="195" height="130" rx="8" class="d-box violet"/>
<text x="563.5" y="73.0" class="d-text b" text-anchor="middle"><tspan x="563.5" dy="0">Conformal</tspan><tspan x="563.5" dy="15">calibration</tspan></text>
<text x="563.5" y="103.0" class="d-text s" text-anchor="middle"><tspan x="563.5" dy="0">every 4th training</tspan><tspan x="563.5" dy="14">package held out; sizes</tspan><tspan x="563.5" dy="14">the range from its</tspan><tspan x="563.5" dy="14">residuals</tspan></text>
<path d="M661,105 L694,105" class="d-arrow" marker-end="url(#time_estimate_flow-a)"/>
<rect x="694" y="40" width="195" height="130" rx="8" class="d-box green"/>
<text x="791.5" y="87.5" class="d-text b" text-anchor="middle">Range</text>
<text x="791.5" y="102.5" class="d-text s" text-anchor="middle"><tspan x="791.5" dy="0">middle and the 8-in-10</tspan><tspan x="791.5" dy="14">point, with a track</tspan><tspan x="791.5" dy="14">record from backtests</tspan></text>
<rect x="10" y="210" width="880" height="100" rx="8" class="d-box warm"/>
<text x="24" y="242.5" class="d-text b" text-anchor="start">It says &quot;I&#x27;m not giving a time estimate&quot; when</text>
<text x="24" y="257.5" class="d-text s" text-anchor="start"><tspan x="24" dy="0">fewer than 20 comparable packages match, subgroups included; the package&#x27;s amount or planned duration is outside what the</tspan><tspan x="24" dy="14">model learned from; the question is as of a date before the first model; or no model passed its backtest. Every</tspan><tspan x="24" dy="14">estimate is scored nightly, with every what-if precomputed, so the chart answers in under 100 ms.</tspan></text>
</svg>