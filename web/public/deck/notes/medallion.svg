<svg viewBox="0 0 900 450" role="img" aria-label="The medallion layers: bronze keeps pages as received, silver types and reads them, gold holds one row per real thing with the links between them; ops logs what the system and people did; Lakebase holds fast app state." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="medallion-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="medallion-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="medallion-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="medallion-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="medallion-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="70" width="120" height="120" rx="8" class="d-box"/>
<text x="70.0" y="112.5" class="d-text b" text-anchor="middle">Sources</text>
<text x="70.0" y="127.5" class="d-text s" text-anchor="middle"><tspan x="70.0" dy="0">World Bank APIs</tspan><tspan x="70.0" dy="14">and the document</tspan><tspan x="70.0" dy="14">host</tspan></text>
<rect x="160" y="40" width="160" height="180" rx="8" class="d-box"/>
<text x="240.0" y="84.5" class="d-text b" text-anchor="middle">bronze</text>
<text x="240.0" y="99.5" class="d-text s" text-anchor="middle"><tspan x="240.0" dy="0">7 tables, 1 view</tspan><tspan x="240.0" dy="14">&#160;</tspan><tspan x="240.0" dy="14">pages and files as</tspan><tspan x="240.0" dy="14">received; contact</tspan><tspan x="240.0" dy="14">details removed;</tspan><tspan x="240.0" dy="14">kept once by hash;</tspan><tspan x="240.0" dy="14">never edited</tspan></text>
<rect x="340" y="40" width="160" height="180" rx="8" class="d-box"/>
<text x="420.0" y="84.5" class="d-text b" text-anchor="middle">silver</text>
<text x="420.0" y="99.5" class="d-text s" text-anchor="middle"><tspan x="420.0" dy="0">31 tables, 1 view</tspan><tspan x="420.0" dy="14">&#160;</tspan><tspan x="420.0" dy="14">typed, cleaned rows;</tspan><tspan x="420.0" dy="14">passages from</tspan><tspan x="420.0" dy="14">documents; STEP rows</tspan><tspan x="420.0" dy="14">from plans; rebuilt</tspan><tspan x="420.0" dy="14">from bronze</tspan></text>
<rect x="520" y="40" width="160" height="180" rx="8" class="d-box hi"/>
<text x="600.0" y="84.5" class="d-text b" text-anchor="middle">gold</text>
<text x="600.0" y="99.5" class="d-text s" text-anchor="middle"><tspan x="600.0" dy="0">19 tables, 2 metric views</tspan><tspan x="600.0" dy="14">&#160;</tspan><tspan x="600.0" dy="14">one row per real</tspan><tspan x="600.0" dy="14">thing; edges,</tspan><tspan x="600.0" dy="14">assertions, scores;</tspan><tspan x="600.0" dy="14">one SQL query per</tspan><tspan x="600.0" dy="14">table, synced</tspan></text>
<path d="M130,130 L160,130" class="d-arrow hi" marker-end="url(#medallion-a-hi)"/>
<path d="M320,130 L340,130" class="d-arrow hi" marker-end="url(#medallion-a-hi)"/>
<path d="M500,130 L520,130" class="d-arrow hi" marker-end="url(#medallion-a-hi)"/>
<rect x="705" y="40" width="185" height="50" rx="8" class="d-box"/>
<text x="797.5" y="61.5" class="d-text b" text-anchor="middle">App tools</text>
<text x="797.5" y="76.5" class="d-text s" text-anchor="middle">as the viewer</text>
<path d="M680,130 L692,130 L692,65 L705,65" class="d-arrow" marker-end="url(#medallion-a)"/>
<rect x="705" y="100" width="185" height="50" rx="8" class="d-box"/>
<text x="797.5" y="121.5" class="d-text b" text-anchor="middle">Genie</text>
<text x="797.5" y="136.5" class="d-text s" text-anchor="middle">metric views</text>
<path d="M680,130 L692,130 L692,125 L705,125" class="d-arrow" marker-end="url(#medallion-a)"/>
<rect x="705" y="160" width="185" height="50" rx="8" class="d-box"/>
<text x="797.5" y="181.5" class="d-text b" text-anchor="middle">AI Search</text>
<text x="797.5" y="196.5" class="d-text s" text-anchor="middle">gold.passage</text>
<path d="M680,130 L692,130 L692,185 L705,185" class="d-arrow" marker-end="url(#medallion-a)"/>
<rect x="160" y="270" width="520" height="110" rx="8" class="d-box warm"/>
<text x="420.0" y="307.5" class="d-text b" text-anchor="middle">ops: 80 tables, 2 views</text>
<text x="420.0" y="322.5" class="d-text s" text-anchor="middle"><tspan x="420.0" dy="0">the logbook: nightly runs and quality checks, answers and what the verifier removed,</tspan><tspan x="420.0" dy="14">drafts and their states, lesson and supplier decisions, search labels,</tspan><tspan x="420.0" dy="14">model states and promotions, costs, readiness measures</tspan></text>
<rect x="705" y="270" width="185" height="50" rx="8" class="d-box"/>
<text x="797.5" y="291.5" class="d-text b" text-anchor="middle">AI/BI dashboard</text>
<text x="797.5" y="306.5" class="d-text s" text-anchor="middle">reads ops and gold</text>
<path d="M680,300 L705,300" class="d-arrow" marker-end="url(#medallion-a)"/>
<rect x="705" y="340" width="185" height="70" rx="8" class="d-box violet"/>
<text x="797.5" y="364.5" class="d-text b" text-anchor="middle">Lakebase: 7 tables</text>
<text x="797.5" y="379.5" class="d-text s" text-anchor="middle"><tspan x="797.5" dy="0">planned packages and</tspan><tspan x="797.5" dy="14">clicks, read on every page</tspan></text>
<path d="M395,220 L395,270" class="d-arrow dash" marker-end="url(#medallion-a)"/>
<rect x="396.0" y="235.0" width="222.4" height="18" rx="3" class="d-label-bg"/>
<text x="400" y="246" class="d-text s lab" text-anchor="start">the job writes run logs and measures</text>
<text x="10" y="436" class="d-text s" text-anchor="start">Rule: bronze and silver are rebuilt from source and never edited by hand. Every table has a public_from date.</text>
</svg>