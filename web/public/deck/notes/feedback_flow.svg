<svg viewBox="0 0 900 290" role="img" aria-label="From a person&#x27;s report to a ranking change: a report is a candidate label, never production data; in the pilot a person decides every one; at scale only agreeing reports from several people become labels, with an audit sample." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="feedback_flow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="feedback_flow-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="feedback_flow-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="feedback_flow-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="feedback_flow-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="100" width="150" height="70" rx="8" class="d-box hi"/>
<text x="85.0" y="117.0" class="d-text b" text-anchor="middle"><tspan x="85.0" dy="0">&quot;Wrong passage&quot;</tspan><tspan x="85.0" dy="15">or &quot;Not useful&quot;</tspan></text>
<text x="85.0" y="147.0" class="d-text s" text-anchor="middle"><tspan x="85.0" dy="0">from the evidence</tspan><tspan x="85.0" dy="14">drawer</tspan></text>
<rect x="190" y="100" width="150" height="70" rx="8" class="d-box"/>
<text x="265.0" y="124.5" class="d-text b" text-anchor="middle">Candidate label</text>
<text x="265.0" y="139.5" class="d-text s" text-anchor="middle"><tspan x="265.0" dy="0">strata.ops;</tspan><tspan x="265.0" dy="14">never production</tspan></text>
<path d="M160,135 L190,135" class="d-arrow" marker-end="url(#feedback_flow-a)"/>
<rect x="400" y="30" width="230" height="80" rx="8" class="d-box green"/>
<text x="515.0" y="52.5" class="d-text b" text-anchor="middle">Pilot: a passage reviewer</text>
<text x="515.0" y="67.5" class="d-text s" text-anchor="middle"><tspan x="515.0" dy="0">decides each group, with a</tspan><tspan x="515.0" dy="14">reason; never on their</tspan><tspan x="515.0" dy="14">own report</tspan></text>
<rect x="400" y="160" width="230" height="100" rx="8" class="d-box violet"/>
<text x="515.0" y="185.5" class="d-text b" text-anchor="middle">At scale</text>
<text x="515.0" y="200.5" class="d-text s" text-anchor="middle"><tspan x="515.0" dy="0">3 people agree, no dissent;</tspan><tspan x="515.0" dy="14">Dawid and Skene weights;</tspan><tspan x="515.0" dy="14">1 in 10 audited; no person</tspan><tspan x="515.0" dy="14">over 10% of a batch</tspan></text>
<path d="M340,120 L370,120 L370,70 L400,70" class="d-arrow" marker-end="url(#feedback_flow-a)"/>
<path d="M340,150 L370,150 L370,210 L400,210" class="d-arrow" marker-end="url(#feedback_flow-a)"/>
<rect x="670" y="90" width="220" height="90" rx="8" class="d-box warm"/>
<text x="780.0" y="117.5" class="d-text b" text-anchor="middle">Rank it lower</text>
<text x="780.0" y="132.5" class="d-text s" text-anchor="middle"><tspan x="780.0" dy="0">for that kind of question</tspan><tspan x="780.0" dy="14">only; never hidden; first</tspan><tspan x="780.0" dy="14">when it is the only match</tspan></text>
<path d="M630,70 L650,70 L650,120 L670,120" class="d-arrow" marker-end="url(#feedback_flow-a)"/>
<path d="M630,210 L650,210 L650,150 L670,150" class="d-arrow" marker-end="url(#feedback_flow-a)"/>
</svg>