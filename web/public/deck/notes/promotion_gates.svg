<svg viewBox="0 0 900 240" role="img" aria-label="How a challenger model becomes champion: it must pass five gates in order; any refusal is recorded with its reasons, and only then does the Unity Catalog alias move." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="promotion_gates-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="promotion_gates-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="promotion_gates-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="promotion_gates-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="promotion_gates-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="70" width="110" height="70" rx="8" class="d-box hi"/>
<text x="65.0" y="94.5" class="d-text b" text-anchor="middle">Challenger</text>
<text x="65.0" y="109.5" class="d-text s" text-anchor="middle"><tspan x="65.0" dy="0">trained</tspan><tspan x="65.0" dy="14">quarterly</tspan></text>
<rect x="150" y="60" width="135" height="90" rx="8" class="d-box"/>
<text x="217.5" y="94.5" class="d-text b" text-anchor="middle">Backtest win</text>
<text x="217.5" y="109.5" class="d-text s" text-anchor="middle"><tspan x="217.5" dy="0">lower typical error;</tspan><tspan x="217.5" dy="14">coverage 75 to 85%</tspan></text>
<path d="M120,105 L150,105" class="d-arrow" marker-end="url(#promotion_gates-a)"/>
<rect x="300" y="60" width="135" height="90" rx="8" class="d-box"/>
<text x="367.5" y="94.5" class="d-text b" text-anchor="middle">Shadow quarter</text>
<text x="367.5" y="109.5" class="d-text s" text-anchor="middle"><tspan x="367.5" dy="0">3 months beside the</tspan><tspan x="367.5" dy="14">champion, and better</tspan></text>
<path d="M270,105 L300,105" class="d-arrow" marker-end="url(#promotion_gates-a)"/>
<rect x="450" y="60" width="135" height="90" rx="8" class="d-box"/>
<text x="517.5" y="94.5" class="d-text b" text-anchor="middle">Each edition</text>
<text x="517.5" y="109.5" class="d-text s" text-anchor="middle"><tspan x="517.5" dy="0">coverage holds for</tspan><tspan x="517.5" dy="14">each rules edition</tspan></text>
<path d="M420,105 L450,105" class="d-arrow" marker-end="url(#promotion_gates-a)"/>
<rect x="600" y="60" width="135" height="90" rx="8" class="d-box"/>
<text x="667.5" y="101.5" class="d-text b" text-anchor="middle">Model owner</text>
<text x="667.5" y="116.5" class="d-text s" text-anchor="middle">signs off</text>
<path d="M570,105 L600,105" class="d-arrow" marker-end="url(#promotion_gates-a)"/>
<rect x="750" y="60" width="135" height="90" rx="8" class="d-box"/>
<text x="817.5" y="101.5" class="d-text b" text-anchor="middle">A different lead</text>
<text x="817.5" y="116.5" class="d-text s" text-anchor="middle">signs off</text>
<path d="M720,105 L750,105" class="d-arrow" marker-end="url(#promotion_gates-a)"/>
<rect x="10" y="180" width="880" height="44" rx="8" class="d-box warm"/>
<text x="450.0" y="205.5" class="d-text b" text-anchor="middle">Refused: a row in strata.ops.model_promotions with every reason. Promoted: the champion alias moves.</text>
</svg>