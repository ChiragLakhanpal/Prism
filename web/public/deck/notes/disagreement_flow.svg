<svg viewBox="0 0 900 380" role="img" aria-label="How two assertions become a disagreement or a trajectory, and how the evidence ladder picks the side Strata leans on while both sides stay on screen." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="disagreement_flow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="disagreement_flow-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="disagreement_flow-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="disagreement_flow-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="disagreement_flow-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="40" width="170" height="70" rx="8" class="d-box hi"/>
<text x="95.0" y="64.5" class="d-text b" text-anchor="middle">Two assertions</text>
<text x="95.0" y="79.5" class="d-text s" text-anchor="middle"><tspan x="95.0" dy="0">same project or package,</tspan><tspan x="95.0" dy="14">same attribute</tspan></text>
<polygon points="290,25.0 375.0,75 290,125.0 205.0,75" class="d-box"/>
<text x="290" y="71.0" class="d-text b" text-anchor="middle"><tspan x="290" dy="0">Same or</tspan><tspan x="290" dy="15">overlapping period?</tspan></text>
<rect x="200" y="170" width="180" height="60" rx="8" class="d-box green"/>
<text x="290.0" y="189.5" class="d-text b" text-anchor="middle">Trajectory</text>
<text x="290.0" y="204.5" class="d-text s" text-anchor="middle"><tspan x="290.0" dy="0">a rating that changed</tspan><tspan x="290.0" dy="14">over time, not a conflict</tspan></text>
<path d="M180,75 L205,75" class="d-arrow" marker-end="url(#disagreement_flow-a)"/>
<path d="M290,125 L290,170" class="d-arrow green" marker-end="url(#disagreement_flow-a-green)"/>
<rect x="301.0" y="139.0" width="21.8" height="18" rx="3" class="d-label-bg"/>
<text x="305" y="150" class="d-text s lab" text-anchor="start">no</text>
<polygon points="500,25.0 585.0,75 500,125.0 415.0,75" class="d-box"/>
<text x="500" y="71.0" class="d-text b" text-anchor="middle"><tspan x="500" dy="0">Same report,</tspan><tspan x="500" dy="15">or a re-issue?</tspan></text>
<path d="M375,75 L415,75" class="d-arrow" marker-end="url(#disagreement_flow-a)"/>
<rect x="381.1" y="56.0" width="27.7" height="18" rx="3" class="d-label-bg"/>
<text x="395" y="67" class="d-text s lab" text-anchor="middle">yes</text>
<rect x="430" y="170" width="140" height="60" rx="8" class="d-box"/>
<text x="500.0" y="189.5" class="d-text b" text-anchor="middle">Not a conflict</text>
<text x="500.0" y="204.5" class="d-text s" text-anchor="middle"><tspan x="500.0" dy="0">the newer</tspan><tspan x="500.0" dy="14">version replaces</tspan></text>
<path d="M500,125 L500,170" class="d-arrow" marker-end="url(#disagreement_flow-a)"/>
<rect x="511.0" y="139.0" width="27.7" height="18" rx="3" class="d-label-bg"/>
<text x="515" y="150" class="d-text s lab" text-anchor="start">yes</text>
<polygon points="720,25.0 805.0,75 720,125.0 635.0,75" class="d-box"/>
<text x="720" y="71.0" class="d-text b" text-anchor="middle"><tspan x="720" dy="0">Can both</tspan><tspan x="720" dy="15">be true?</tspan></text>
<path d="M585,75 L635,75" class="d-arrow" marker-end="url(#disagreement_flow-a)"/>
<rect x="599.1" y="56.0" width="21.8" height="18" rx="3" class="d-label-bg"/>
<text x="610" y="67" class="d-text s lab" text-anchor="middle">no</text>
<rect x="760" y="160" width="130" height="60" rx="8" class="d-box"/>
<text x="825.0" y="179.5" class="d-text b" text-anchor="middle">Not a conflict</text>
<text x="825.0" y="194.5" class="d-text s" text-anchor="middle"><tspan x="825.0" dy="0">e.g. amounts within</tspan><tspan x="825.0" dy="14">0.1 percent</tspan></text>
<path d="M805,75 L825,75 L825,160" class="d-arrow" marker-end="url(#disagreement_flow-a)"/>
<rect x="836.0" y="109.0" width="27.7" height="18" rx="3" class="d-label-bg"/>
<text x="840" y="120" class="d-text s lab" text-anchor="start">yes</text>
<rect x="560" y="270" width="330" height="96" rx="8" class="d-box warm"/>
<text x="725.0" y="293.5" class="d-text b" text-anchor="middle">Disagreement</text>
<text x="725.0" y="308.5" class="d-text s" text-anchor="middle"><tspan x="725.0" dy="0">both sides kept and shown in date order;</tspan><tspan x="725.0" dy="14">the evidence ladder names the side Strata</tspan><tspan x="725.0" dy="14">leans on and the rule it used; keeping</tspan><tspan x="725.0" dy="14">the other side needs a reason</tspan></text>
<path d="M720,125 L720,270" class="d-arrow warm" marker-end="url(#disagreement_flow-a-warm)"/>
<rect x="731.0" y="189.0" width="21.8" height="18" rx="3" class="d-label-bg"/>
<text x="735" y="200" class="d-text s lab" text-anchor="start">no</text>
<rect x="10" y="270" width="500" height="96" rx="8" class="d-box"/>
<text x="24" y="300.5" class="d-text b" text-anchor="start">The evidence ladder, config/evidence_ladder.toml</text>
<text x="24" y="315.5" class="d-text s" text-anchor="start"><tspan x="24" dy="0">1. Outcome judgments: IEG review or PPAR, then ICR, then ISR, then PAD.</tspan><tspan x="24" dy="14">2. Facts about a moment: the record made at that moment.</tspan><tspan x="24" dy="14">3. Ties: the more specific source, then the more recent one.</tspan></text>
<path d="M510,318 L560,318" class="d-arrow" marker-end="url(#disagreement_flow-a)"/>
</svg>