<svg viewBox="0 0 900 300" role="img" aria-label="Four layers of proof, from every commit to every release: the offline gate, the full gate with the live agent, the hindsight test, and each learning loop&#x27;s own gate." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="eval_layers-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="eval_layers-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="eval_layers-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="eval_layers-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="eval_layers-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="40" width="205" height="50" rx="8" class="d-box hi"/>
<text x="112.5" y="61.5" class="d-text b" text-anchor="middle">Offline gate</text>
<text x="112.5" y="76.5" class="d-text s" text-anchor="middle">every commit</text>
<rect x="10" y="100" width="205" height="120" rx="8" class="d-box"/>
<text x="112.5" y="143.0" class="d-text s" text-anchor="middle"><tspan x="112.5" dy="0">SQL ground truth, 3,165</tspan><tspan x="112.5" dy="14">Python tests, screen tests,</tspan><tspan x="112.5" dy="14">scripted agent, planted</tspan><tspan x="112.5" dy="14">mistakes; 150 s, no network</tspan></text>
<path d="M215,65 L235,65" class="d-arrow" marker-end="url(#eval_layers-a)"/>
<rect x="235" y="40" width="205" height="50" rx="8" class="d-box violet"/>
<text x="337.5" y="61.5" class="d-text b" text-anchor="middle">Full gate</text>
<text x="337.5" y="76.5" class="d-text s" text-anchor="middle">before a release</text>
<rect x="235" y="100" width="205" height="120" rx="8" class="d-box"/>
<text x="337.5" y="136.0" class="d-text s" text-anchor="middle"><tspan x="337.5" dy="0">43 benchmark questions through</tspan><tspan x="337.5" dy="14">the live agent; Genie benchmark;</tspan><tspan x="337.5" dy="14">Foundry evaluations:</tspan><tspan x="337.5" dy="14">groundedness, relevance,</tspan><tspan x="337.5" dy="14">task adherence, tool use</tspan></text>
<path d="M440,65 L460,65" class="d-arrow" marker-end="url(#eval_layers-a)"/>
<rect x="460" y="40" width="205" height="50" rx="8" class="d-box green"/>
<text x="562.5" y="61.5" class="d-text b" text-anchor="middle">Hindsight test</text>
<text x="562.5" y="76.5" class="d-text s" text-anchor="middle">every release</text>
<rect x="460" y="100" width="205" height="120" rx="8" class="d-box"/>
<text x="562.5" y="143.0" class="d-text s" text-anchor="middle"><tspan x="562.5" dy="0">replay as of approval dates;</tspan><tspan x="562.5" dy="14">caught X of Y blamed risks;</tspan><tspan x="562.5" dy="14">must beat a checklist and</tspan><tspan x="562.5" dy="14">not lose to the champion</tspan></text>
<path d="M665,65 L685,65" class="d-arrow" marker-end="url(#eval_layers-a)"/>
<rect x="685" y="40" width="205" height="50" rx="8" class="d-box warm"/>
<text x="787.5" y="61.5" class="d-text b" text-anchor="middle">Loop gates</text>
<text x="787.5" y="76.5" class="d-text s" text-anchor="middle">each change</text>
<rect x="685" y="100" width="205" height="120" rx="8" class="d-box"/>
<text x="787.5" y="143.0" class="d-text s" text-anchor="middle"><tspan x="787.5" dy="0">quote on its page and two</tspan><tspan x="787.5" dy="14">people; no loss on held-out</tspan><tspan x="787.5" dy="14">search set; backtest win,</tspan><tspan x="787.5" dy="14">shadow quarter, sign-offs</tspan></text>
<text x="10" y="250" class="d-text s" text-anchor="start">Live status: the offline gate runs on every commit. The full gate and the hindsight test have not run live yet;</text>
<text x="10" y="268" class="d-text s" text-anchor="start">the must-refuse part of the benchmark held 6 of 11 live and 11 of 11 offline.</text>
</svg>