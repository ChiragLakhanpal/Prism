<svg viewBox="0 0 900 250" role="img" aria-label="One SQL text runs in three places through one engine adapter: on the SQL warehouse as the viewer, inside the nightly job&#x27;s Spark tasks, and on DuckDB in the offline gate after a dialect rewrite." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="sql_everywhere-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="sql_everywhere-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="sql_everywhere-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="sql_everywhere-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="sql_everywhere-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="80" width="210" height="90" rx="8" class="d-box hi"/>
<text x="115.0" y="107.5" class="d-text b" text-anchor="middle">One SQL file</text>
<text x="115.0" y="122.5" class="d-text s" text-anchor="middle"><tspan x="115.0" dy="0">Databricks SQL, three-part</tspan><tspan x="115.0" dy="14">names like strata.gold.contract,</tspan><tspan x="115.0" dy="14">values only as :parameters</tspan></text>
<rect x="270" y="80" width="170" height="90" rx="8" class="d-box"/>
<text x="355.0" y="114.5" class="d-text b" text-anchor="middle">engine.py</text>
<text x="355.0" y="129.5" class="d-text s" text-anchor="middle"><tspan x="355.0" dy="0">one adapter, three</tspan><tspan x="355.0" dy="14">engines, same results</tspan></text>
<path d="M220,125 L270,125" class="d-arrow hi" marker-end="url(#sql_everywhere-a-hi)"/>
<rect x="520" y="20" width="220" height="60" rx="8" class="d-box"/>
<text x="630.0" y="39.5" class="d-text b" text-anchor="middle">SQL warehouse</text>
<text x="630.0" y="54.5" class="d-text s" text-anchor="middle"><tspan x="630.0" dy="0">the app&#x27;s queries, with the</tspan><tspan x="630.0" dy="14">viewer&#x27;s own token</tspan></text>
<path d="M440,125 L480,125 L480,50 L520,50" class="d-arrow" marker-end="url(#sql_everywhere-a)"/>
<rect x="520" y="95" width="220" height="60" rx="8" class="d-box"/>
<text x="630.0" y="114.5" class="d-text b" text-anchor="middle">Spark, in job tasks</text>
<text x="630.0" y="129.5" class="d-text s" text-anchor="middle"><tspan x="630.0" dy="0">the nightly job, on</tspan><tspan x="630.0" dy="14">serverless compute</tspan></text>
<path d="M440,125 L480,125 L480,125 L520,125" class="d-arrow" marker-end="url(#sql_everywhere-a)"/>
<rect x="520" y="170" width="220" height="60" rx="8" class="d-box"/>
<text x="630.0" y="189.5" class="d-text b" text-anchor="middle">DuckDB, in the gate</text>
<text x="630.0" y="204.5" class="d-text s" text-anchor="middle"><tspan x="630.0" dy="0">after sqlglot rewrites the</tspan><tspan x="630.0" dy="14">dialect; fully offline</tspan></text>
<path d="M440,125 L480,125 L480,200 L520,200" class="d-arrow" marker-end="url(#sql_everywhere-a)"/>
<rect x="770" y="80" width="120" height="90" rx="8" class="d-box"/>
<text x="830.0" y="107.5" class="d-text b" text-anchor="middle">same-rows check</text>
<text x="830.0" y="122.5" class="d-text s" text-anchor="middle"><tspan x="830.0" dy="0">runs ground-truth</tspan><tspan x="830.0" dy="14">SQL on both</tspan><tspan x="830.0" dy="14">and compares</tspan></text>
<path d="M740,50 L830,50 L830,80" class="d-arrow dash" marker-end="url(#sql_everywhere-a)"/>
<path d="M740,200 L830,200 L830,170" class="d-arrow dash" marker-end="url(#sql_everywhere-a)"/>
</svg>