<svg viewBox="0 0 900 300" role="img" aria-label="Project early warning: seven fixed checks on public records each give a reason to look; their count sets the status, and the checks are never combined into a score." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="signals_status-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="signals_status-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="signals_status-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="signals_status-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="signals_status-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="20" width="210" height="64" rx="8" class="d-box"/>
<text x="115.0" y="48.0" class="d-text b" text-anchor="middle"><tspan x="115.0" dy="0">Planned completion passed,</tspan><tspan x="115.0" dy="15">no signed contract</tspan></text>
<rect x="232" y="20" width="210" height="64" rx="8" class="d-box"/>
<text x="337.0" y="48.0" class="d-text b" text-anchor="middle"><tspan x="337.0" dy="0">Signed at 2 times its</tspan><tspan x="337.0" dy="15">estimate or more</tspan></text>
<rect x="454" y="20" width="210" height="64" rx="8" class="d-box"/>
<text x="559.0" y="48.0" class="d-text b" text-anchor="middle"><tspan x="559.0" dy="0">Direct selection of US$1M+</tspan><tspan x="559.0" dy="15">first listed in the last year</tspan></text>
<rect x="676" y="20" width="210" height="64" rx="8" class="d-box"/>
<text x="781.0" y="48.0" class="d-text b" text-anchor="middle"><tspan x="781.0" dy="0">Closing date moved</tspan><tspan x="781.0" dy="15">2 or more times</tspan></text>
<rect x="10" y="100" width="210" height="64" rx="8" class="d-box"/>
<text x="115.0" y="128.0" class="d-text b" text-anchor="middle"><tspan x="115.0" dy="0">Level 1 restructuring</tspan><tspan x="115.0" dy="15">in the last 12 months</tspan></text>
<rect x="232" y="100" width="210" height="64" rx="8" class="d-box"/>
<text x="337.0" y="128.0" class="d-text b" text-anchor="middle"><tspan x="337.0" dy="0">Latest ISR rating</tspan><tspan x="337.0" dy="15">lower than the one before</tspan></text>
<rect x="454" y="100" width="210" height="64" rx="8" class="d-box"/>
<text x="559.0" y="128.0" class="d-text b" text-anchor="middle"><tspan x="559.0" dy="0">Under half disbursed with</tspan><tspan x="559.0" dy="15">12 months or less left</tspan></text>
<path d="M450,180 L450,205" class="d-arrow hi" marker-end="url(#signals_status-a-hi)"/>
<rect x="10" y="205" width="280" height="80" rx="8" class="d-box warm"/>
<text x="150.0" y="234.5" class="d-text b" text-anchor="middle">Needs a look</text>
<text x="150.0" y="249.5" class="d-text s" text-anchor="middle"><tspan x="150.0" dy="0">3 or more signals,</tspan><tspan x="150.0" dy="14">or one strong signal</tspan></text>
<rect x="310" y="205" width="280" height="80" rx="8" class="d-box"/>
<text x="450.0" y="234.5" class="d-text b" text-anchor="middle">Watch</text>
<text x="450.0" y="249.5" class="d-text s" text-anchor="middle"><tspan x="450.0" dy="0">at least one signal,</tspan><tspan x="450.0" dy="14">fewer than 3, none strong</tspan></text>
<rect x="610" y="205" width="280" height="80" rx="8" class="d-box green"/>
<text x="750.0" y="234.5" class="d-text b" text-anchor="middle">No signals</text>
<text x="750.0" y="249.5" class="d-text s" text-anchor="middle"><tspan x="750.0" dy="0">none of the seven checks</tspan><tspan x="750.0" dy="14">found anything</tspan></text>
</svg>