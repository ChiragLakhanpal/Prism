<svg viewBox="0 0 900 300" role="img" aria-label="The plan reader: list every published plan version cheaply from its text, find each activity&#x27;s first listing, send only chosen versions&#x27; table pages to the layout parser, and measure delay from the first published planned date." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="plan_reader-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="plan_reader-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="plan_reader-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="plan_reader-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="plan_reader-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="60" width="135" height="110" rx="8" class="d-box"/>
<text x="77.5" y="97.5" class="d-text b" text-anchor="middle">All plan versions</text>
<text x="77.5" y="112.5" class="d-text s" text-anchor="middle"><tspan x="77.5" dy="0">one series per</tspan><tspan x="77.5" dy="14">implementing agency,</tspan><tspan x="77.5" dy="14">from the text, cheaply</tspan></text>
<path d="M145,115 L160,115" class="d-arrow" marker-end="url(#plan_reader-a)"/>
<rect x="160" y="60" width="135" height="110" rx="8" class="d-box hi"/>
<text x="227.5" y="97.5" class="d-text b" text-anchor="middle">First listing</text>
<text x="227.5" y="112.5" class="d-text s" text-anchor="middle"><tspan x="227.5" dy="0">the earliest version</tspan><tspan x="227.5" dy="14">that lists each</tspan><tspan x="227.5" dy="14">activity reference</tspan></text>
<path d="M295,115 L310,115" class="d-arrow" marker-end="url(#plan_reader-a)"/>
<rect x="310" y="60" width="135" height="110" rx="8" class="d-box"/>
<text x="377.5" y="97.5" class="d-text b" text-anchor="middle">Choose versions</text>
<text x="377.5" y="112.5" class="d-text s" text-anchor="middle"><tspan x="377.5" dy="0">latest per agency, the</tspan><tspan x="377.5" dy="14">one before it, and each</tspan><tspan x="377.5" dy="14">first listing</tspan></text>
<path d="M445,115 L460,115" class="d-arrow" marker-end="url(#plan_reader-a)"/>
<rect x="460" y="60" width="135" height="110" rx="8" class="d-box warm"/>
<text x="527.5" y="97.5" class="d-text b" text-anchor="middle">Layout parser</text>
<text x="527.5" y="112.5" class="d-text s" text-anchor="middle"><tspan x="527.5" dy="0">their table pages only,</tspan><tspan x="527.5" dy="14">newest first, each</tspan><tspan x="527.5" dy="14">page once, capped</tspan></text>
<path d="M595,115 L610,115" class="d-arrow" marker-end="url(#plan_reader-a)"/>
<rect x="610" y="60" width="135" height="110" rx="8" class="d-box"/>
<text x="677.5" y="97.5" class="d-text b" text-anchor="middle">STEP rows</text>
<text x="677.5" y="112.5" class="d-text s" text-anchor="middle"><tspan x="677.5" dy="0">STEP&#x27;s columns, word</tspan><tspan x="677.5" dy="14">for word; planned and</tspan><tspan x="677.5" dy="14">actual date per step</tspan></text>
<path d="M745,115 L760,115" class="d-arrow" marker-end="url(#plan_reader-a)"/>
<rect x="760" y="60" width="135" height="110" rx="8" class="d-box hi"/>
<text x="827.5" y="97.5" class="d-text b" text-anchor="middle">Delay</text>
<text x="827.5" y="112.5" class="d-text s" text-anchor="middle"><tspan x="827.5" dy="0">actual date minus the</tspan><tspan x="827.5" dy="14">first published</tspan><tspan x="827.5" dy="14">planned date</tspan></text>
<text x="10" y="36" class="d-text gt" text-anchor="start">WHY: PLAN TEXT SCRAMBLES TABLES, AND PARSING EVERY VERSION WOULD COST TOO MUCH</text>
<rect x="10" y="200" width="880" height="80" rx="8" class="d-box"/>
<text x="450.0" y="229.5" class="d-text b" text-anchor="middle">Live, for the demo project P156634, on Free Edition</text>
<text x="450.0" y="244.5" class="d-text s" text-anchor="middle"><tspan x="450.0" dy="0">240 plan versions listed, 231 read; 672 of 672 text pages read; 689 of 695 table pages parsed over two days under the 500-page cap;</tspan><tspan x="450.0" dy="14">five versions were too long for the warehouse API (4.9 to 90.7 million characters) and were not kept</tspan></text>
</svg>