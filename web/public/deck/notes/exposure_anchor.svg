<svg viewBox="0 0 900 250" role="img" aria-label="Measuring Strata&#x27;s own influence: every range shown to staff is logged as an exposure, later plan rows dated within 14 days of an offered date count as anchored, and accuracy is reported separately for anchored and other rows." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="exposure_anchor-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="exposure_anchor-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="exposure_anchor-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="exposure_anchor-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="exposure_anchor-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="50" width="160" height="90" rx="8" class="d-box hi"/>
<text x="90.0" y="84.5" class="d-text b" text-anchor="middle">Strata shows a range</text>
<text x="90.0" y="99.5" class="d-text s" text-anchor="middle"><tspan x="90.0" dy="0">to World Bank staff,</tspan><tspan x="90.0" dy="14">for a STEP package</tspan></text>
<path d="M170,95 L190,95" class="d-arrow" marker-end="url(#exposure_anchor-a)"/>
<rect x="190" y="50" width="160" height="90" rx="8" class="d-box"/>
<text x="270.0" y="84.5" class="d-text b" text-anchor="middle">Exposure logged</text>
<text x="270.0" y="99.5" class="d-text s" text-anchor="middle"><tspan x="270.0" dy="0">the range, the dates</tspan><tspan x="270.0" dy="14">offered, the choice</tspan></text>
<path d="M350,95 L370,95" class="d-arrow" marker-end="url(#exposure_anchor-a)"/>
<rect x="370" y="50" width="160" height="90" rx="8" class="d-box"/>
<text x="450.0" y="84.5" class="d-text b" text-anchor="middle">A later plan row</text>
<text x="450.0" y="99.5" class="d-text s" text-anchor="middle"><tspan x="450.0" dy="0">published after</tspan><tspan x="450.0" dy="14">the exposure</tspan></text>
<path d="M530,95 L550,95" class="d-arrow" marker-end="url(#exposure_anchor-a)"/>
<rect x="550" y="50" width="160" height="90" rx="8" class="d-box warm"/>
<text x="630.0" y="91.0" class="d-text b" text-anchor="middle"><tspan x="630.0" dy="0">Within 14 days of</tspan><tspan x="630.0" dy="15">an offered date?</tspan></text>
<path d="M710,95 L730,95" class="d-arrow" marker-end="url(#exposure_anchor-a)"/>
<rect x="730" y="50" width="160" height="90" rx="8" class="d-box green"/>
<text x="810.0" y="84.5" class="d-text b" text-anchor="middle">Anchored</text>
<text x="810.0" y="99.5" class="d-text s" text-anchor="middle"><tspan x="810.0" dy="0">reported apart from</tspan><tspan x="810.0" dy="14">other rows</tspan></text>
<text x="10" y="180" class="d-text s" text-anchor="start">Why: plans made with Strata change the data Strata later learns from. Counting them apart stops Strata</text>
<text x="10" y="198" class="d-text s" text-anchor="start">from grading its own echo, and projects exposed to Strata stay out of the hindsight recall KPI.</text>
<text x="10" y="228" class="d-text s" text-anchor="start">Previews, abstentions, tests and batch jobs never write an exposure.</text>
</svg>