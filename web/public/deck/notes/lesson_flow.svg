<svg viewBox="0 0 900 330" role="img" aria-label="The knowledge loop for lessons: the batch model proposes from each completion report, a quote check rejects anything not word for word on its page, and two different people decide before a lesson reaches the library." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="lesson_flow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="lesson_flow-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="lesson_flow-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="lesson_flow-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="lesson_flow-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="50" width="160" height="90" rx="8" class="d-box"/>
<text x="90.0" y="84.0" class="d-text b" text-anchor="middle"><tspan x="90.0" dy="0">New ICR, ICR Review</tspan><tspan x="90.0" dy="15">or PPAR</tspan></text>
<text x="90.0" y="114.0" class="d-text s" text-anchor="middle">taken in nightly</text>
<path d="M170,95 L192,95" class="d-arrow" marker-end="url(#lesson_flow-a)"/>
<rect x="192" y="50" width="160" height="90" rx="8" class="d-box violet"/>
<text x="272.0" y="77.0" class="d-text b" text-anchor="middle"><tspan x="272.0" dy="0">Batch model</tspan><tspan x="272.0" dy="15">proposes</tspan></text>
<text x="272.0" y="107.0" class="d-text s" text-anchor="middle"><tspan x="272.0" dy="0">statement, risk factors,</tspan><tspan x="272.0" dy="14">stage, quote, page</tspan></text>
<path d="M352,95 L374,95" class="d-arrow" marker-end="url(#lesson_flow-a)"/>
<rect x="374" y="50" width="160" height="90" rx="8" class="d-box hi"/>
<text x="454.0" y="84.5" class="d-text b" text-anchor="middle">Quote check</text>
<text x="454.0" y="99.5" class="d-text s" text-anchor="middle"><tspan x="454.0" dy="0">word for word on the</tspan><tspan x="454.0" dy="14">cited page and passage?</tspan></text>
<path d="M534,95 L556,95" class="d-arrow" marker-end="url(#lesson_flow-a)"/>
<rect x="556" y="50" width="160" height="90" rx="8" class="d-box"/>
<text x="636.0" y="84.0" class="d-text b" text-anchor="middle"><tspan x="636.0" dy="0">Accredited specialist</tspan><tspan x="636.0" dy="15">recommends</tspan></text>
<text x="636.0" y="114.0" class="d-text s" text-anchor="middle">with a reason</text>
<path d="M716,95 L738,95" class="d-arrow" marker-end="url(#lesson_flow-a)"/>
<rect x="738" y="50" width="160" height="90" rx="8" class="d-box green"/>
<text x="818.0" y="77.0" class="d-text b" text-anchor="middle"><tspan x="818.0" dy="0">A different lead</tspan><tspan x="818.0" dy="15">decides</tspan></text>
<text x="818.0" y="107.0" class="d-text s" text-anchor="middle"><tspan x="818.0" dy="0">add, merge or reject;</tspan><tspan x="818.0" dy="14">within 10 business days</tspan></text>
<rect x="374" y="190" width="160" height="60" rx="8" class="d-box warm"/>
<text x="454.0" y="209.5" class="d-text b" text-anchor="middle">Rejected, kept</text>
<text x="454.0" y="224.5" class="d-text s" text-anchor="middle"><tspan x="454.0" dy="0">with its reason;</tspan><tspan x="454.0" dy="14">never repaired</tspan></text>
<path d="M454,140 L454,190" class="d-arrow warm" marker-end="url(#lesson_flow-a-warm)"/>
<rect x="466.0" y="159.0" width="21.8" height="18" rx="3" class="d-label-bg"/>
<text x="470" y="170" class="d-text s lab" text-anchor="start">no</text>
<rect x="738" y="190" width="152" height="60" rx="8" class="d-box green"/>
<text x="814.0" y="216.5" class="d-text b" text-anchor="middle">Library, version 1</text>
<text x="814.0" y="231.5" class="d-text s" text-anchor="middle">drafts cite a version</text>
<path d="M818,140 L818,190" class="d-arrow green" marker-end="url(#lesson_flow-a-green)"/>
<text x="10" y="290" class="d-text s" text-anchor="start">IEG&#x27;s restatement of the same ICR paragraph, such as &quot;(ICR para 54)&quot;, becomes a second, independent piece of evidence.</text>
<text x="10" y="310" class="d-text s" text-anchor="start">Nobody acts on their own project. A quarterly cross-check sends 10 percent of decisions to another region.</text>
<text x="10" y="28" class="d-text gt" text-anchor="start">STRATA PROPOSES; PEOPLE DECIDE</text>
</svg>