<svg viewBox="0 0 900 400" role="img" aria-label="The twelve sources in config/sources.toml, grouped by the API that serves them, with how each API is fetched incrementally and where its pages land." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="sources_map-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="sources_map-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="sources_map-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="sources_map-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="sources_map-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="20" y="20" width="185" height="44" rx="8" class="d-box hi"/>
<text x="112.5" y="38.5" class="d-text b" text-anchor="middle">Finances One</text>
<text x="112.5" y="53.5" class="d-text s" text-anchor="middle">7 sources</text>
<rect x="20" y="72" width="185" height="130" rx="12" class="d-group"/>
<text x="32" y="96" class="d-text s" text-anchor="start"><tspan x="32" dy="0">Awards since FY2020, daily</tspan><tspan x="32" dy="14">Awards FY2001 to 2016, frozen</tspan><tspan x="32" dy="14">IEG ratings</tspan><tspan x="32" dy="14">IDA credits, IBRD loans</tspan><tspan x="32" dy="14">IDA and IBRD monthly history,</tspan><tspan x="32" dy="14">pilot countries</tspan></text>
<rect x="20" y="214" width="185" height="86" rx="8" class="d-box"/>
<text x="30" y="232.5" class="d-text b" text-anchor="start">How it is fetched</text>
<text x="30" y="247.5" class="d-text s" text-anchor="start"><tspan x="30" dy="0">Cannot sort, so every</tspan><tspan x="30" dy="14">page is read each night;</tspan><tspan x="30" dy="14">a content hash keeps</tspan><tspan x="30" dy="14">only changed pages</tspan></text>
<path d="M112,300 L112,330" class="d-arrow hi" marker-end="url(#sources_map-a-hi)"/>
<rect x="245" y="20" width="185" height="44" rx="8" class="d-box hi"/>
<text x="337.5" y="38.5" class="d-text b" text-anchor="middle">Search APIs</text>
<text x="337.5" y="53.5" class="d-text s" text-anchor="middle">2 sources</text>
<rect x="245" y="72" width="185" height="130" rx="12" class="d-group"/>
<text x="257" y="96" class="d-text s" text-anchor="start"><tspan x="257" dy="0">Procurement notices,</tspan><tspan x="257" dy="14">per pilot country</tspan><tspan x="257" dy="14">Projects, every country</tspan></text>
<rect x="245" y="214" width="185" height="86" rx="8" class="d-box"/>
<text x="255" y="239.5" class="d-text b" text-anchor="start">How it is fetched</text>
<text x="255" y="254.5" class="d-text s" text-anchor="start"><tspan x="255" dy="0">Newest first; stop at</tspan><tspan x="255" dy="14">the watermark, the newest</tspan><tspan x="255" dy="14">date already held</tspan></text>
<path d="M337,300 L337,330" class="d-arrow hi" marker-end="url(#sources_map-a-hi)"/>
<rect x="470" y="20" width="185" height="44" rx="8" class="d-box hi"/>
<text x="562.5" y="38.5" class="d-text b" text-anchor="middle">Indicators API</text>
<text x="562.5" y="53.5" class="d-text s" text-anchor="middle">2 sources</text>
<rect x="470" y="72" width="185" height="130" rx="12" class="d-group"/>
<text x="482" y="96" class="d-text s" text-anchor="start"><tspan x="482" dy="0">CPIA, 21 codes, IDA only</tspan><tspan x="482" dy="14">WGI, 6 estimates</tspan></text>
<rect x="470" y="214" width="185" height="86" rx="8" class="d-box"/>
<text x="480" y="239.5" class="d-text b" text-anchor="start">How it is fetched</text>
<text x="480" y="254.5" class="d-text s" text-anchor="start"><tspan x="480" dy="0">Read in full; a changed</tspan><tspan x="480" dy="14">value becomes a new</tspan><tspan x="480" dy="14">version beside the old</tspan></text>
<path d="M562,300 L562,330" class="d-arrow hi" marker-end="url(#sources_map-a-hi)"/>
<rect x="695" y="20" width="185" height="44" rx="8" class="d-box hi"/>
<text x="787.5" y="38.5" class="d-text b" text-anchor="middle">Documents API</text>
<text x="787.5" y="53.5" class="d-text s" text-anchor="middle">1 source</text>
<rect x="695" y="72" width="185" height="130" rx="12" class="d-group"/>
<text x="707" y="96" class="d-text s" text-anchor="start"><tspan x="707" dy="0">PADs, ISRs, ICRs, ICR</tspan><tspan x="707" dy="14">Reviews, PPARs, Project</tspan><tspan x="707" dy="14">Papers, procurement plans</tspan></text>
<rect x="695" y="214" width="185" height="86" rx="8" class="d-box"/>
<text x="705" y="239.5" class="d-text b" text-anchor="start">How it is fetched</text>
<text x="705" y="254.5" class="d-text s" text-anchor="start"><tspan x="705" dy="0">The document id is the</tspan><tspan x="705" dy="14">watermark; 3 s between</tspan><tspan x="705" dy="14">fetches, 60 min a night</tspan></text>
<path d="M787,300 L787,330" class="d-arrow hi" marker-end="url(#sources_map-a-hi)"/>
<rect x="20" y="330" width="860" height="56" rx="8" class="d-box"/>
<text x="450.0" y="347.5" class="d-text b" text-anchor="middle">bronze</text>
<text x="450.0" y="362.5" class="d-text s" text-anchor="middle"><tspan x="450.0" dy="0">api_pages for API pages; document lists, texts, PDF pages and layout pages for documents;</tspan><tspan x="450.0" dy="14">contact details are removed before anything is kept</tspan></text>
</svg>