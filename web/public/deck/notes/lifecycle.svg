<svg viewBox="0 0 900 290" role="img" aria-label="A project&#x27;s life cycle on one time axis, with the document each stage leaves, colored by stratum, and the two moments Strata uses: Board approval for the hindsight test, and completion for lessons." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="lifecycle-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="lifecycle-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="lifecycle-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="lifecycle-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="lifecycle-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<line x1="30" y1="150" x2="870" y2="150" class="d-rule" stroke-width="2"/>
<circle cx="75" cy="150" r="7" class="d-box violet"/>
<rect x="27" y="74" width="96" height="52" rx="6" class="d-box violet"/>
<text x="75.0" y="103.5" class="d-text b" text-anchor="middle">PAD</text>
<line x1="75" y1="126" x2="75" y2="143" class="d-rule violet"/>
<text x="75" y="178" class="d-text s" text-anchor="middle"><tspan x="75" dy="0">design, risks,</tspan><tspan x="75" dy="14">procurement</tspan><tspan x="75" dy="14">arrangements</tspan></text>
<circle cx="175" cy="150" r="7" class="d-box hi"/>
<rect x="127" y="74" width="96" height="52" rx="6" class="d-box hi"/>
<text x="175.0" y="96.0" class="d-text b" text-anchor="middle"><tspan x="175.0" dy="0">Board</tspan><tspan x="175.0" dy="15">approval</tspan></text>
<line x1="175" y1="126" x2="175" y2="143" class="d-rule hi"/>
<circle cx="275" cy="150" r="7" class="d-box green"/>
<rect x="227" y="74" width="96" height="52" rx="6" class="d-box green"/>
<text x="275.0" y="96.0" class="d-text b" text-anchor="middle"><tspan x="275.0" dy="0">PPSD and</tspan><tspan x="275.0" dy="15">plan versions</tspan></text>
<line x1="275" y1="126" x2="275" y2="143" class="d-rule green"/>
<text x="275" y="178" class="d-text s" text-anchor="middle"><tspan x="275" dy="0">packages and</tspan><tspan x="275" dy="14">planned dates</tspan></text>
<circle cx="385" cy="150" r="7" class="d-box green"/>
<rect x="337" y="74" width="96" height="52" rx="6" class="d-box green"/>
<text x="385.0" y="103.5" class="d-text b" text-anchor="middle">Notices</text>
<line x1="385" y1="126" x2="385" y2="143" class="d-rule green"/>
<text x="385" y="178" class="d-text s" text-anchor="middle"><tspan x="385" dy="0">bids invited,</tspan><tspan x="385" dy="14">awards announced</tspan></text>
<circle cx="485" cy="150" r="7" class="d-box hi"/>
<rect x="437" y="74" width="96" height="52" rx="6" class="d-box hi"/>
<text x="485.0" y="103.5" class="d-text b" text-anchor="middle">Contracts</text>
<line x1="485" y1="126" x2="485" y2="143" class="d-rule hi"/>
<text x="485" y="178" class="d-text s" text-anchor="middle"><tspan x="485" dy="0">awards in</tspan><tspan x="485" dy="14">US dollars</tspan></text>
<circle cx="585" cy="150" r="7" class="d-box green"/>
<rect x="537" y="74" width="96" height="52" rx="6" class="d-box green"/>
<text x="585.0" y="103.5" class="d-text b" text-anchor="middle">ISRs</text>
<line x1="585" y1="126" x2="585" y2="143" class="d-rule green"/>
<text x="585" y="178" class="d-text s" text-anchor="middle"><tspan x="585" dy="0">ratings about</tspan><tspan x="585" dy="14">twice a year</tspan></text>
<circle cx="685" cy="150" r="7" class="d-box violet"/>
<rect x="637" y="74" width="96" height="52" rx="6" class="d-box violet"/>
<text x="685.0" y="103.5" class="d-text b" text-anchor="middle">ICR</text>
<line x1="685" y1="126" x2="685" y2="143" class="d-rule violet"/>
<text x="685" y="178" class="d-text s" text-anchor="middle"><tspan x="685" dy="0">results and</tspan><tspan x="685" dy="14">numbered lessons</tspan></text>
<circle cx="790" cy="150" r="7" class="d-box violet"/>
<rect x="742" y="74" width="96" height="52" rx="6" class="d-box violet"/>
<text x="790.0" y="96.0" class="d-text b" text-anchor="middle"><tspan x="790.0" dy="0">ICR Review,</tspan><tspan x="790.0" dy="15">PPAR</tspan></text>
<line x1="790" y1="126" x2="790" y2="143" class="d-rule violet"/>
<text x="790" y="178" class="d-text s" text-anchor="middle"><tspan x="790" dy="0">IEG&#x27;s</tspan><tspan x="790" dy="14">independent view</tspan></text>
<text x="30" y="140" class="d-text s" text-anchor="start">time</text>
<path d="M175,250 L175,228" class="d-arrow hi" marker-end="url(#lifecycle-a-hi)"/>
<text x="175" y="268" class="d-text s hi" text-anchor="middle">the hindsight test freezes Strata here</text>
<path d="M685,250 L685,228" class="d-arrow violet" marker-end="url(#lifecycle-a-violet)"/>
<text x="690" y="268" class="d-text s violet" text-anchor="middle">lessons are read from here</text>
<rect x="30" y="20" width="12" height="12" rx="3" class="d-fill hi"/>
<text x="48" y="30" class="d-text s" text-anchor="start">What</text>
<rect x="100" y="20" width="12" height="12" rx="3" class="d-fill green"/>
<text x="118" y="30" class="d-text s" text-anchor="start">How</text>
<rect x="165" y="20" width="12" height="12" rx="3" class="d-fill violet"/>
<text x="183" y="30" class="d-text s" text-anchor="start">Why</text>
</svg>