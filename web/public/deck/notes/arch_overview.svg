<text x="470.0" y="189.5" class="d-text b" text-anchor="middle">gold</text>
<text x="470.0" y="204.5" class="d-text s" text-anchor="middle">the knowledge model</text>
<rect x="375" y="226" width="190" height="46" rx="8" class="d-box"/>
<text x="470.0" y="245.5" class="d-text b" text-anchor="middle">ops</text>
