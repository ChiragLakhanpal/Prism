<svg viewBox="0 0 900 300" role="img" aria-label="The appeared-together score between a contract and a paragraph of its project&#x27;s reports: five capped parts that add up, kept at 0.5 or more, and shown to people as appeared together, never as a cause." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="link_score-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="link_score-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="link_score-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="link_score-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="link_score-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="40" width="150" height="100" rx="8" class="d-box"/>
<text x="85.0" y="79.5" class="d-text b" text-anchor="middle">Same project</text>
<text x="85.0" y="94.5" class="d-text s" text-anchor="middle"><tspan x="85.0" dy="0">0.10</tspan><tspan x="85.0" dy="14">every pair has it</tspan></text>
<rect x="175" y="40" width="150" height="100" rx="8" class="d-box"/>
<text x="250.0" y="72.5" class="d-text b" text-anchor="middle">Same sector</text>
<text x="250.0" y="87.5" class="d-text s" text-anchor="middle"><tspan x="250.0" dy="0">0.10</tspan><tspan x="250.0" dy="14">paragraph&#x27;s project</tspan><tspan x="250.0" dy="14">sector = contract&#x27;s</tspan></text>
<rect x="340" y="40" width="150" height="100" rx="8" class="d-box"/>
<text x="415.0" y="72.5" class="d-text b" text-anchor="middle">Close in time</text>
<text x="415.0" y="87.5" class="d-text s" text-anchor="middle"><tspan x="415.0" dy="0">up to 0.20</tspan><tspan x="415.0" dy="14">falls to 0 at 60</tspan><tspan x="415.0" dy="14">months apart</tspan></text>
<rect x="505" y="40" width="150" height="100" rx="8" class="d-box"/>
<text x="580.0" y="72.5" class="d-text b" text-anchor="middle">Shared words</text>
<text x="580.0" y="87.5" class="d-text s" text-anchor="middle"><tspan x="580.0" dy="0">up to 0.20</tspan><tspan x="580.0" dy="14">share of the contract</tspan><tspan x="580.0" dy="14">description&#x27;s words</tspan></text>
<rect x="670" y="40" width="150" height="100" rx="8" class="d-box"/>
<text x="745.0" y="72.5" class="d-text b" text-anchor="middle">Mentions</text>
<text x="745.0" y="87.5" class="d-text s" text-anchor="middle"><tspan x="745.0" dy="0">up to 0.40</tspan><tspan x="745.0" dy="14">reference, place,</tspan><tspan x="745.0" dy="14">name, category</tspan></text>
<line x1="85" y1="140" x2="85" y2="158" class="d-rule"/>
<line x1="250" y1="140" x2="250" y2="158" class="d-rule"/>
<line x1="415" y1="140" x2="415" y2="158" class="d-rule"/>
<line x1="580" y1="140" x2="580" y2="158" class="d-rule"/>
<line x1="745" y1="140" x2="745" y2="158" class="d-rule"/>
<line x1="85" y1="158" x2="745" y2="158" class="d-rule"/>
<path d="M410,158 L410,175" class="d-arrow hi" marker-end="url(#link_score-a-hi)"/>
<rect x="260" y="175" width="300" height="50" rx="8" class="d-box hi"/>
<text x="410.0" y="196.5" class="d-text b" text-anchor="middle">Total score, kept if ≥ 0.50</text>
<text x="410.0" y="211.5" class="d-text s" text-anchor="middle">becomes an appeared-together edge</text>
<rect x="600" y="170" width="290" height="110" rx="8" class="d-box warm"/>
<text x="612" y="200.5" class="d-text b" text-anchor="start">Showcase link: ICR ¶54</text>
<text x="612" y="215.5" class="d-text s" text-anchor="start"><tspan x="612" dy="0">and contract IN-RRSMP-7431-CW-RFB</tspan><tspan x="612" dy="14">0.10 + 0.10 + 0.11 + 0.02 + 0.20 = 0.53</tspan><tspan x="612" dy="14">weights chosen on the fixture so this</tspan><tspan x="612" dy="14">link stays; starting values to confirm</tspan></text>
<text x="10" y="250" class="d-text s" text-anchor="start"><tspan x="10" dy="0">Why never a cause: a score of shared words</tspan><tspan x="10" dy="14">and dates can show that two records sit</tspan><tspan x="10" dy="14">together, not that one led to the other.</tspan></text>
</svg>