<svg viewBox="0 0 900 300" role="img" aria-label="Anatomy of one passage: the citation unit. A short header is put in front of the text before embedding, and every passage keeps the fields a citation and an as-of filter need." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="passage_anatomy-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="passage_anatomy-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="passage_anatomy-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="passage_anatomy-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="passage_anatomy-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="30" width="520" height="60" rx="8" class="d-box hi"/>
<text x="24" y="56.5" class="d-text b" text-anchor="start">Header, added before embedding</text>
<text x="24" y="71.5" class="d-text s" text-anchor="start">ICR, P130164, India, roads, III.B, ¶54, p.23</text>
<rect x="10" y="100" width="520" height="90" rx="8" class="d-box"/>
<text x="24" y="127.5" class="d-text b" text-anchor="start">Text, word for word</text>
<text x="24" y="142.5" class="d-text s" text-anchor="start"><tspan x="24" dy="0">The paragraph&#x27;s own words, with spacing collapsed, so a quote</tspan><tspan x="24" dy="14">found in it is found on its page. Over 500 tokens, it splits at a</tspan><tspan x="24" dy="14">sentence end, and each part keeps the paragraph number.</tspan></text>
<rect x="10" y="200" width="520" height="86" rx="8" class="d-box"/>
<text x="24" y="225.5" class="d-text b" text-anchor="start">Fields kept with it</text>
<text x="24" y="240.5" class="d-text s" text-anchor="start"><tspan x="24" dy="0">project, document type, version, section path, paragraph number,</tspan><tspan x="24" dy="14">PDF page and printed page, language, route A or B, kind:</tspan><tspan x="24" dy="14">paragraph, table row or table summary, public_from</tspan></text>
<rect x="600" y="60" width="290" height="80" rx="8" class="d-box violet"/>
<text x="745.0" y="89.5" class="d-text b" text-anchor="middle">Vector: 1,024 numbers</text>
<text x="745.0" y="104.5" class="d-text s" text-anchor="middle"><tspan x="745.0" dy="0">from text-embedding-3-large;</tspan><tspan x="745.0" dy="14">embedded once per text and model</tspan></text>
<path d="M530,100 L600,100" class="d-arrow violet" marker-end="url(#passage_anatomy-a-violet)"/>
<rect x="545.2" y="81.0" width="39.5" height="18" rx="3" class="d-label-bg"/>
<text x="565" y="92" class="d-text s lab" text-anchor="middle">embed</text>
<rect x="600" y="170" width="290" height="100" rx="8" class="d-box"/>
<text x="745.0" y="195.5" class="d-text b" text-anchor="middle">Passage id</text>
<text x="745.0" y="210.5" class="d-text s" text-anchor="middle"><tspan x="745.0" dy="0">31525018/v1/54</tspan><tspan x="745.0" dy="14">document id / version / paragraph;</tspan><tspan x="745.0" dy="14">every citation and the evidence</tspan><tspan x="745.0" dy="14">drawer open it by this id</tspan></text>
<path d="M530,243 L565,243 L565,220 L600,220" class="d-arrow" marker-end="url(#passage_anatomy-a)"/>
</svg>