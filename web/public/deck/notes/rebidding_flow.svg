<svg viewBox="0 0 900 335" role="img" aria-label="Rebidding risk: three sources label whether a package was advertised again, two models compete on calibration, and a model&#x27;s &#x27;about k in 10&#x27; is shown only when it beat its baseline and the package has 20 or more comparables." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="rebidding_flow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="rebidding_flow-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="rebidding_flow-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="rebidding_flow-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="rebidding_flow-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="10" y="30" width="190" height="70" rx="8" class="d-box"/>
<text x="105.0" y="54.5" class="d-text b" text-anchor="middle">No award</text>
<text x="105.0" y="69.5" class="d-text s" text-anchor="middle"><tspan x="105.0" dy="0">548 days after bids</tspan><tspan x="105.0" dy="14">were due, no contract</tspan></text>
<path d="M200,65 L240,65 L240,155 L270,155" class="d-arrow" marker-end="url(#rebidding_flow-a)"/>
<rect x="10" y="120" width="190" height="70" rx="8" class="d-box"/>
<text x="105.0" y="144.5" class="d-text b" text-anchor="middle">Same reference</text>
<text x="105.0" y="159.5" class="d-text s" text-anchor="middle"><tspan x="105.0" dy="0">a later notice of the</tspan><tspan x="105.0" dy="14">same type, same STEP ref</tspan></text>
<path d="M200,155 L240,155 L240,155 L270,155" class="d-arrow" marker-end="url(#rebidding_flow-a)"/>
<rect x="10" y="210" width="190" height="70" rx="8" class="d-box"/>
<text x="105.0" y="234.5" class="d-text b" text-anchor="middle">Canceled plan row</text>
<text x="105.0" y="249.5" class="d-text s" text-anchor="middle"><tspan x="105.0" dy="0">newest plan says</tspan><tspan x="105.0" dy="14">Canceled, nothing signed</tspan></text>
<path d="M200,245 L240,245 L240,155 L270,155" class="d-arrow" marker-end="url(#rebidding_flow-a)"/>
<rect x="270" y="115" width="150" height="80" rx="8" class="d-box hi"/>
<text x="345.0" y="137.5" class="d-text b" text-anchor="middle">Label</text>
<text x="345.0" y="152.5" class="d-text s" text-anchor="middle"><tspan x="345.0" dy="0">advertised again,</tspan><tspan x="345.0" dy="14">not, or undecided</tspan><tspan x="345.0" dy="14">(left out)</tspan></text>
<rect x="460" y="40" width="190" height="70" rx="8" class="d-box violet"/>
<text x="555.0" y="64.5" class="d-text b" text-anchor="middle">Calibrated boosting</text>
<text x="555.0" y="79.5" class="d-text s" text-anchor="middle"><tspan x="555.0" dy="0">XGBoost, Platt scaling</tspan><tspan x="555.0" dy="14">on held-out packages</tspan></text>
<rect x="460" y="200" width="190" height="70" rx="8" class="d-box violet"/>
<text x="555.0" y="224.5" class="d-text b" text-anchor="middle">Logistic regression</text>
<text x="555.0" y="239.5" class="d-text s" text-anchor="middle"><tspan x="555.0" dy="0">L2-penalized,</tspan><tspan x="555.0" dy="14">fitted by Newton&#x27;s method</tspan></text>
<path d="M420,140 L440,140 L440,75 L460,75" class="d-arrow" marker-end="url(#rebidding_flow-a)"/>
<path d="M420,170 L440,170 L440,235 L460,235" class="d-arrow" marker-end="url(#rebidding_flow-a)"/>
<rect x="690" y="110" width="200" height="90" rx="8" class="d-box green"/>
<text x="790.0" y="130.5" class="d-text b" text-anchor="middle">Champion</text>
<text x="790.0" y="145.5" class="d-text s" text-anchor="middle"><tspan x="790.0" dy="0">the better calibrated</tspan><tspan x="790.0" dy="14">across test years;</tspan><tspan x="790.0" dy="14">both stay labeled</tspan><tspan x="790.0" dy="14">experimental</tspan></text>
<path d="M650,75 L670,75 L670,140 L690,140" class="d-arrow" marker-end="url(#rebidding_flow-a)"/>
<path d="M650,235 L670,235 L670,170 L690,170" class="d-arrow" marker-end="url(#rebidding_flow-a)"/>
<rect x="10" y="290" width="880" height="34" rx="8" class="d-box warm"/>
<text x="450.0" y="310.5" class="d-text b" text-anchor="middle">Shown as &quot;about k in 10&quot; only with 20 or more comparables and a champion that beat its baseline</text>
</svg>