<rect x="10" y="76" width="120" height="92" rx="8" class="d-box"/>
<text x="70.0" y="104.5" class="d-text b" text-anchor="middle">World Bank APIs</text>
<text x="70.0" y="119.5" class="d-text s" text-anchor="middle"><tspan x="70.0" dy="0">awards, notices,</tspan><tspan x="70.0" dy="14">projects, documents,</tspan><tspan x="70.0" dy="14">indicators</tspan></text>
<rect x="770" y="392" width="120" height="66" rx="8" class="d-box"/>
<text x="830.0" y="414.5" class="d-text b" text-anchor="middle">People</text>
<text x="830.0" y="429.5" class="d-text s" text-anchor="middle"><tspan x="830.0" dy="0">staff, agencies,</tspan><tspan x="830.0" dy="14">public; Entra sign-in</tspan></text>
