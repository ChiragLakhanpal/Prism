<text x="155" y="97" class="d-text s lab" text-anchor="middle">fetch</text>
<path d="M770,425 L510,425" class="d-arrow hi" marker-end="url(#platform_map-a-hi)"/>
<rect x="602.5" y="407.0" width="74.9" height="18" rx="3" class="d-label-bg"/>
<text x="640" y="418" class="d-text s lab" text-anchor="middle">use the app</text>
<path d="M510,410 L538,410 L538,105 L560,105" class="d-arrow violet" marker-end="url(#platform_map-a-violet)"/>
