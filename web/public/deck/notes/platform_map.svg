<rect x="434.0" y="373.0" width="45.4" height="18" rx="3" class="d-label-bg"/>
<text x="438" y="384" class="d-text s lab" text-anchor="start">clicks</text>
<rect x="545" y="48" width="190" height="258" rx="12" class="d-group violet"/>
<text x="557" y="66" class="d-text gt" text-anchor="start">Foundry: wb-strata</text>
<rect x="560" y="76" width="160" height="58" rx="8" class="d-box violet"/>
<text x="640.0" y="94.5" class="d-text b" text-anchor="middle">Foundry project</text>
<text x="640.0" y="109.5" class="d-text s" text-anchor="middle"><tspan x="640.0" dy="0">9 agents, instructions</tspan><tspan x="640.0" dy="14">from the repo</tspan></text>
<rect x="560" y="152" width="160" height="58" rx="8" class="d-box violet"/>
<text x="640.0" y="170.5" class="d-text b" text-anchor="middle">Azure OpenAI</text>
<text x="640.0" y="185.5" class="d-text s" text-anchor="middle"><tspan x="640.0" dy="0">4 deployments,</tspan><tspan x="640.0" dy="14">each with a cap</tspan></text>
<rect x="560" y="228" width="160" height="58" rx="8" class="d-box"/>
<text x="640.0" y="246.5" class="d-text b" text-anchor="middle">Guardrail</text>
<text x="640.0" y="261.5" class="d-text s" text-anchor="middle"><tspan x="640.0" dy="0">content filters,</tspan><tspan x="640.0" dy="14">Prompt Shields</tspan></text>
<rect x="560" y="330" width="160" height="50" rx="8" class="d-box"/>
<text x="640.0" y="351.5" class="d-text b" text-anchor="middle">Application Insights</text>
