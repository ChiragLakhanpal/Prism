<rect x="180" y="228" width="155" height="58" rx="8" class="d-box"/>
<text x="257.5" y="246.5" class="d-text b" text-anchor="middle">Genie space</text>
<text x="257.5" y="261.5" class="d-text s" text-anchor="middle"><tspan x="257.5" dy="0">metric views and</tspan><tspan x="257.5" dy="14">trusted SQL</tspan></text>
<rect x="355" y="228" width="155" height="58" rx="8" class="d-box"/>
<text x="432.5" y="246.5" class="d-text b" text-anchor="middle">AI/BI dashboard</text>
<text x="432.5" y="261.5" class="d-text s" text-anchor="middle"><tspan x="432.5" dy="0">Strata operations,</tspan><tspan x="432.5" dy="14">three pages</tspan></text>
<rect x="180" y="304" width="155" height="58" rx="8" class="d-box"/>
<text x="257.5" y="322.5" class="d-text b" text-anchor="middle">SQL warehouse</text>
<text x="257.5" y="337.5" class="d-text s" text-anchor="middle"><tspan x="257.5" dy="0">serverless, 2X-Small,</tspan><tspan x="257.5" dy="14">auto stop</tspan></text>
<rect x="355" y="304" width="155" height="58" rx="8" class="d-box"/>
<text x="432.5" y="322.5" class="d-text b" text-anchor="middle">Lakebase</text>
<text x="432.5" y="337.5" class="d-text s" text-anchor="middle"><tspan x="432.5" dy="0">Postgres for</tspan><tspan x="432.5" dy="14">app state</tspan></text>
<rect x="180" y="398" width="330" height="46" rx="8" class="d-box hi"/>
<text x="345.0" y="417.5" class="d-text b" text-anchor="middle">Databricks App: Strata</text>
<text x="345.0" y="432.5" class="d-text s" text-anchor="middle">FastAPI server and React web app</text>
<path d="M257,398 L257,362" class="d-arrow hi" marker-end="url(#platform_map-a-hi)"/>
<rect x="258.0" y="373.0" width="133.9" height="18" rx="3" class="d-label-bg"/>
