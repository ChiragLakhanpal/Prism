<svg viewBox="0 0 890 330" role="img" aria-label="Prism&#x27;s three layers of evidence, What, How and Why, and how one example links a contract, a plan row and a completion report paragraph." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="three_strata-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="three_strata-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="three_strata-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="three_strata-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="three_strata-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<text x="20" y="22" class="d-text gt" text-anchor="start">THE THREE STRATA</text>
<text x="650" y="22" class="d-text gt" text-anchor="start">ONE EXAMPLE, LINKED</text>
<rect x="20" y="40" width="440" height="80" rx="8" class="d-box hi"/>
<text x="240.0" y="69.5" class="d-text b" text-anchor="middle">What happened</text>
<text x="240.0" y="84.5" class="d-text s" text-anchor="middle"><tspan x="240.0" dy="0">records: contract awards, notices, projects,</tspan><tspan x="240.0" dy="14">loans and disbursements, governance scores</tspan></text>
<rect x="20" y="135" width="440" height="80" rx="8" class="d-box green"/>
<text x="240.0" y="164.5" class="d-text b" text-anchor="middle">How it was done</text>
<text x="240.0" y="179.5" class="d-text s" text-anchor="middle"><tspan x="240.0" dy="0">operational documents: procurement plans,</tspan><tspan x="240.0" dy="14">ISR supervision reports, procurement notices</tspan></text>
<rect x="20" y="230" width="440" height="80" rx="8" class="d-box violet"/>
<text x="240.0" y="259.5" class="d-text b" text-anchor="middle">Why it went well or badly</text>
<text x="240.0" y="274.5" class="d-text s" text-anchor="middle"><tspan x="240.0" dy="0">evaluations: PADs, ICR completion reports,</tspan><tspan x="240.0" dy="14">IEG&#x27;s ICR Reviews and PPARs</tspan></text>
<rect x="650" y="48" width="220" height="64" rx="8" class="d-box hi"/>
<text x="760.0" y="69.5" class="d-text b" text-anchor="middle">Contract award</text>
<text x="760.0" y="84.5" class="d-text s" text-anchor="middle"><tspan x="760.0" dy="0">supplier, US$ amount,</tspan><tspan x="760.0" dy="14">method, signing date</tspan></text>
<rect x="650" y="143" width="220" height="64" rx="8" class="d-box green"/>
<text x="760.0" y="164.5" class="d-text b" text-anchor="middle">Procurement plan row</text>
<text x="760.0" y="179.5" class="d-text s" text-anchor="middle"><tspan x="760.0" dy="0">KE-NWWDA-229129-CW-RFB</tspan><tspan x="760.0" dy="14">planned and actual dates</tspan></text>
<rect x="650" y="238" width="220" height="64" rx="8" class="d-box violet"/>
<text x="760.0" y="259.5" class="d-text b" text-anchor="middle">ICR paragraph 54, page 23</text>
<text x="760.0" y="274.5" class="d-text s" text-anchor="middle"><tspan x="760.0" dy="0">the rebidding lesson,</tspan><tspan x="760.0" dy="14">quoted word for word</tspan></text>
<path d="M760,114 L760,141" class="d-arrow" marker-end="url(#three_strata-a)" marker-start="url(#three_strata-a)"/>
<rect x="766.0" y="121.0" width="92.6" height="18" rx="3" class="d-label-bg"/>
<text x="770" y="132" class="d-text s lab" text-anchor="start">STEP reference</text>
<path d="M760,209 L760,236" class="d-arrow" marker-end="url(#three_strata-a)" marker-start="url(#three_strata-a)"/>
<rect x="766.0" y="216.0" width="69.0" height="18" rx="3" class="d-label-bg"/>
