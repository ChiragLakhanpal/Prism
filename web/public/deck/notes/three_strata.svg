<path d="M648,80 L620,80 L620,270 L648,270" class="d-arrow hi" marker-end="url(#three_strata-a-hi)" marker-start="url(#three_strata-a-hi)"/>
<rect x="511.6" y="139.0" width="104.4" height="60" rx="3" class="d-label-bg"/>
<text x="612" y="150" class="d-text s lab" text-anchor="end"><tspan x="612" dy="0">scored link:</tspan><tspan x="612" dy="14">project, sector,</tspan><tspan x="612" dy="14">time, text,</tspan><tspan x="612" dy="14">shared mentions</tspan></text>
</svg>