<rect x="680" y="330" width="200" height="90" rx="8" class="d-box hi"/>
<text x="780.0" y="350.5" class="d-text b" text-anchor="middle">Four hops</text>
<text x="780.0" y="365.5" class="d-text s" text-anchor="middle"><tspan x="780.0" dy="0">supplier → contract → project</tspan><tspan x="780.0" dy="14">→ document → ¶54</tspan><tspan x="780.0" dy="14">recursive SQL, at most 4 hops,</tspan><tspan x="780.0" dy="14">only edges public by the date</tspan></text>
</svg>