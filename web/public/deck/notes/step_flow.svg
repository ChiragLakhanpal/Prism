<svg viewBox="0 0 900 250" role="img" aria-label="The STEP steps of a goods or works package, the span Prism calls procurement cycle time, and how delay is measured at each step from the first published planned date." xmlns="http://www.w3.org/2000/svg"><style>svg{--bg: #fbfaf7;--fg: #1c1f24;--muted: #586070;--line: #d9dde4;--card: #ffffff;--code-bg: #eef1f5;--accent: #0a58a8;--accent-soft: #e6f0fa;--analogy: #6b46a8;--analogy-soft: #f2edf9;--example: #17714f;--example-soft: #e9f5ef;--say: #0a58a8;--say-soft: #e8f1fb;--watch: #9a4d00;--watch-soft: #fbf1e6;--where: #4d5563;--where-soft: #f1f2f4;--fig-hi: #0a58a8;--fig-hi-soft: #dfeaf7;--fig-warm: #9a4d00;--fig-warm-soft: #f8eadb;--fig-green: #17714f;--fig-green-soft: #dcefe6;--fig-violet: #6b46a8;--fig-violet-soft: #ece4f7;--fig-fill: #f6f7f9;color:var(--fg);font-family:'Open Sans',system-ui,sans-serif;background:#ffffff}.d-text { fill: currentColor; font-size: 12.5px; }.d-text.b { font-weight: 650; }.d-text.s { font-size: 11px; font-weight: 400; fill: var(--muted); }.d-text.gt { font-size: 11.5px; font-weight: 750;   fill: var(--muted); }.d-text.lab { fill: var(--muted); }.d-text.hi { fill: var(--fig-hi); }.d-text.warm { fill: var(--fig-warm); }.d-text.green { fill: var(--fig-green); }.d-text.violet { fill: var(--fig-violet); }.d-box { fill: var(--fig-fill); stroke: currentColor; stroke-width: 1.2; }.d-box.hi { fill: var(--fig-hi-soft); stroke: var(--fig-hi); }.d-box.warm { fill: var(--fig-warm-soft); stroke: var(--fig-warm); }.d-box.green { fill: var(--fig-green-soft); stroke: var(--fig-green); }.d-box.violet { fill: var(--fig-violet-soft); stroke: var(--fig-violet); }.d-box.dash { stroke-dasharray: 5 4; }.d-group { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; }.d-group.hi { stroke: var(--fig-hi); }.d-group.warm { stroke: var(--fig-warm); }.d-group.green { stroke: var(--fig-green); }.d-group.violet { stroke: var(--fig-violet); }.d-arrow { stroke: currentColor; stroke-width: 1.4; fill: none; }.d-arrow.hi { stroke: var(--fig-hi); stroke-width: 1.8; }.d-arrow.warm { stroke: var(--fig-warm); stroke-width: 1.8; }.d-arrow.green { stroke: var(--fig-green); stroke-width: 1.8; }.d-arrow.violet { stroke: var(--fig-violet); stroke-width: 1.8; }.d-arrow.dash { stroke-dasharray: 5 4; }.d-mk { fill: currentColor; }.d-mk.hi { fill: var(--fig-hi); }.d-mk.warm { fill: var(--fig-warm); }.d-mk.green { fill: var(--fig-green); }.d-mk.violet { fill: var(--fig-violet); }.d-rule { stroke: var(--muted); stroke-width: 1; }.d-rule.hi { stroke: var(--fig-hi); }.d-rule.warm { stroke: var(--fig-warm); }.d-rule.dash { stroke-dasharray: 4 4; }.d-fill { fill: var(--fig-fill); stroke: none; }.d-fill.hi { fill: var(--fig-hi); }.d-fill.warm { fill: var(--fig-warm); }.d-fill.green { fill: var(--fig-green); }.d-fill.violet { fill: var(--fig-violet); }.d-fill.soft-hi { fill: var(--fig-hi-soft); }.d-fill.soft-warm { fill: var(--fig-warm-soft); }.d-fill.soft-green { fill: var(--fig-green-soft); }.d-fill.line { fill: var(--line); }.d-label-bg { fill: var(--card); }</style>
<defs><marker id="step_flow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk"/></marker><marker id="step_flow-a-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk hi"/></marker><marker id="step_flow-a-warm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk warm"/></marker><marker id="step_flow-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk green"/></marker><marker id="step_flow-a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-mk violet"/></marker></defs>
<rect x="20" y="90" width="128" height="58" rx="8" class="d-box hi"/>
<text x="84.0" y="115.0" class="d-text b" text-anchor="middle"><tspan x="84.0" dy="0">Bid invitation</tspan><tspan x="84.0" dy="15">(SPN)</tspan></text>
<path d="M148,119 L168,119" class="d-arrow" marker-end="url(#step_flow-a)"/>
<rect x="168" y="90" width="128" height="58" rx="8" class="d-box"/>
<text x="232.0" y="115.0" class="d-text b" text-anchor="middle"><tspan x="232.0" dy="0">Bidding document</tspan><tspan x="232.0" dy="15">issued</tspan></text>
<path d="M296,119 L316,119" class="d-arrow" marker-end="url(#step_flow-a)"/>
<rect x="316" y="90" width="128" height="58" rx="8" class="d-box"/>
<text x="380.0" y="115.0" class="d-text b" text-anchor="middle"><tspan x="380.0" dy="0">Bid</tspan><tspan x="380.0" dy="15">opening</tspan></text>
<path d="M444,119 L464,119" class="d-arrow" marker-end="url(#step_flow-a)"/>
<rect x="464" y="90" width="128" height="58" rx="8" class="d-box"/>
<text x="528.0" y="115.0" class="d-text b" text-anchor="middle"><tspan x="528.0" dy="0">Bid evaluation</tspan><tspan x="528.0" dy="15">report</tspan></text>
<path d="M592,119 L612,119" class="d-arrow" marker-end="url(#step_flow-a)"/>
<rect x="612" y="90" width="128" height="58" rx="8" class="d-box hi"/>
<text x="676.0" y="115.0" class="d-text b" text-anchor="middle"><tspan x="676.0" dy="0">Contract</tspan><tspan x="676.0" dy="15">signed</tspan></text>
<path d="M740,119 L760,119" class="d-arrow" marker-end="url(#step_flow-a)"/>
<rect x="760" y="90" width="128" height="58" rx="8" class="d-box"/>
<text x="824.0" y="115.0" class="d-text b" text-anchor="middle"><tspan x="824.0" dy="0">Contract</tspan><tspan x="824.0" dy="15">completed</tspan></text>
<line x1="84" y1="60" x2="84" y2="84" class="d-rule hi"/>
<line x1="676" y1="60" x2="676" y2="84" class="d-rule hi"/>
<line x1="84" y1="60" x2="676" y2="60" class="d-rule hi" stroke-width="2"/>
<rect x="230.4" y="43.0" width="299.1" height="18" rx="3" class="d-label-bg"/>
<text x="380" y="54" class="d-text s lab" text-anchor="middle">procurement cycle time: notice to signed contract</text>
<line x1="300" y1="205" x2="480" y2="205" class="d-rule"/>
<circle cx="318" cy="205" r="5" class="d-box"/>
<circle cx="462" cy="205" r="5" class="d-box warm"/>
<path d="M326,186 L454,186" class="d-arrow warm" marker-end="url(#step_flow-a-warm)"/>
<rect x="370.2" y="161.0" width="39.5" height="18" rx="3" class="d-label-bg"/>
<text x="390" y="172" class="d-text s lab" text-anchor="middle">delay</text>
<text x="318" y="230" class="d-text s" text-anchor="middle"><tspan x="318" dy="0">first published</tspan><tspan x="318" dy="14">planned date</tspan></text>
<text x="462" y="230" class="d-text s" text-anchor="middle">actual date</text>
<text x="560" y="196" class="d-text s" text-anchor="start"><tspan x="560" dy="0">Delay is measured at every step, from the</tspan><tspan x="560" dy="14">date the plan first published, not from the</tspan><tspan x="560" dy="14">latest re-dated plan. The example shows</tspan><tspan x="560" dy="14">the bid opening step.</tspan></text>
</svg>